previews:
  generation: off

services:
  - type: web
    name: capital-intelligence-platform
    runtime: docker
    plan: standard
    region: oregon
    branch: main
    autoDeployTrigger: checksPass
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python run_render_service_workspace.py
    healthCheckPath: /_stcore/health
    disk:
      name: capital-intelligence-state
      mountPath: /app/database
      # Increased from sizeGB: 5 after governed cleanup exhausted safe capacity.
      sizeGB: 10
    envVars:
      - key: CAPITAL_INTELLIGENCE_ENVIRONMENT
        value: production
      - key: CAPITAL_INTELLIGENCE_DATA_DIR
        value: /app/database
      # Render enforces a hard 2 GB /tmp quota. Python backup creation,
      # encrypted-backup verification/restoration, provider temporaries, and
      # comprehensive evidence spooling can legitimately exceed that quota in
      # aggregate. Route disposable tempfile users to a non-authority workspace
      # on the governed 10 GB disk; the bootstrap creates and cleans only exact
      # disposable workspace patterns before importing the production service.
      - key: TMPDIR
        value: /app/database/runtime_transient
      # Paper-evidence spools remain cycle-local, compressed, disposable working
      # files rather than canonical state. Their own 4 GB ceiling and 1 GB
      # filesystem reserve remain fail-closed and do not reduce market coverage.
      - key: CAPITAL_INTELLIGENCE_EVIDENCE_SPOOL_DIR
        value: /app/database/runtime_transient/paper_evidence_spool
      - key: CAPITAL_INTELLIGENCE_EVIDENCE_SPOOL_MAX_MB
        value: "4096"
      - key: CAPITAL_INTELLIGENCE_EVIDENCE_SPOOL_RESERVE_MB
        value: "1024"
      - key: CAPITAL_INTELLIGENCE_LOG_LEVEL
        value: INFO
      - key: CAPITAL_INTELLIGENCE_JSON_LOGS
        value: "true"
      - key: CAPITAL_INTELLIGENCE_ENFORCE_HTTPS
        value: "true"
      - key: CAPITAL_INTELLIGENCE_AUTHENTICATION_REQUIRED
        value: "true"
      - key: CAPITAL_INTELLIGENCE_REQUIRE_ENCRYPTED_BACKUPS
        value: "true"
      - key: CAPITAL_INTELLIGENCE_REQUIRE_OPERATIONAL_SLOS
        value: "true"
      - key: CAPITAL_INTELLIGENCE_BACKUP_DIRECTORY
        value: /app/database/backups
      - key: CAPITAL_INTELLIGENCE_BACKUP_INTERVAL_HOURS
        value: "24"
      # The ten-gigabyte test disk preserves a bounded daily recovery point
      # while maintaining capacity for canonical evidence and lineage growth.
      - key: CAPITAL_INTELLIGENCE_BACKUP_RETENTION_DAYS
        value: "1"
      - key: CAPITAL_INTELLIGENCE_STORAGE_RESERVE_MB
        value: "1024"
      - key: CAPITAL_INTELLIGENCE_BACKUP_MINIMUM_ARCHIVES
        value: "1"
      - key: CAPITAL_INTELLIGENCE_READINESS_STARTUP_GRACE_SECONDS
        value: "900"
      - key: CAPITAL_INTELLIGENCE_READINESS_POLL_SECONDS
        value: "15"
      - key: CAPITAL_INTELLIGENCE_READINESS_FAILURE_THRESHOLD
        value: "3"
      - key: CAPITAL_INTELLIGENCE_BACKUP_ACTIVATION_AWARE
        value: "true"
      - key: CAPITAL_INTELLIGENCE_REQUIRE_JOURNAL
        value: "true"
      - key: CAPITAL_INTELLIGENCE_REQUIRE_LIVE_PROVIDER
        value: "true"
      # External provider calls no longer block Streamlit from opening the
      # Render health-check port. A noncritical background worker refreshes
      # the same governed validation report after startup and every hour.
      - key: CAPITAL_INTELLIGENCE_RUN_PROVIDER_VALIDATION_ON_STARTUP
        value: "false"
      - key: CAPITAL_INTELLIGENCE_PROVIDER_VALIDATION_BACKGROUND_ENABLED
        value: "true"
      - key: CAPITAL_INTELLIGENCE_PROVIDER_VALIDATION_BACKGROUND_INITIAL_DELAY_SECONDS
        value: "5"
      - key: CAPITAL_INTELLIGENCE_PROVIDER_VALIDATION_BACKGROUND_INTERVAL_SECONDS
        value: "3600"
      # During active troubleshooting, run one unique paper-only diagnostic CIO
      # pass for each deployed release. Only the calendar due check is bypassed;
      # all evidence and CIO gates remain active and fail closed.
      - key: CAPITAL_INTELLIGENCE_MANUAL_CIO_DIAGNOSTIC_ON_RELEASE
        value: "true"
      - key: CAPITAL_INTELLIGENCE_MANUAL_CIO_DIAGNOSTIC_TIMEOUT_SECONDS
        value: "1800"
      # Provider validation still runs and persists its failed checks, but a
      # transient or entitlement-specific provider issue must not take the
      # authenticated console offline. REQUIRE_LIVE_PROVIDER remains the
      # fail-closed boundary for CIO analysis and paper implementation.
      - key: CAPITAL_INTELLIGENCE_PROVIDER_VALIDATION_REQUIRED
        value: "false"
      - key: CAPITAL_INTELLIGENCE_PROVIDER_VALIDATION_MAX_AGE_HOURS
        value: "168"
      - key: CAPITAL_INTELLIGENCE_REQUIRE_CANONICAL_ENVIRONMENT
        value: "true"
      # Comprehensive discovery remains the canonical target. During the
      # explicit bond-source transition the bootstrap makes this expansion
      # optional, records degraded scope, and continues through the certified
      # listed-wrapper and broad U.S.-security CIO path.
      - key: CAPITAL_INTELLIGENCE_REQUIRE_COMPREHENSIVE_DISCOVERY
        value: "true"
      - key: CAPITAL_INTELLIGENCE_BOND_SOURCE_TRANSITION_MODE
        value: "true"
      - key: CAPITAL_INTELLIGENCE_PAPER_EXECUTION_MODE
        value: automatic
      - key: CAPITAL_INTELLIGENCE_PAPER_REPORT_TIMEZONE
        value: America/Los_Angeles
      - key: CAPITAL_INTELLIGENCE_PAPER_CONSTRUCTION_MAX_AGE_HOURS
        value: "24"
      - key: CAPITAL_INTELLIGENCE_AUTONOMOUS_PAPER_AUTHORIZATION_HOURS
        value: "24"
      - key: CAPITAL_INTELLIGENCE_SCHEDULER_TIMEZONE
        value: America/Los_Angeles
      # Four authoritative full CIO cycles distribute decision authority across
      # Asia/overnight, Europe/U.S. premarket, the U.S. session, and the U.S.
      # close. Fifteen-minute collection and material-event escalation continue
      # between these governed full-market cycles.
      - key: CAPITAL_INTELLIGENCE_SCHEDULER_HOUR
        value: "0"
      - key: CAPITAL_INTELLIGENCE_SCHEDULER_TIMES
        value: 00:00,06:00,10:00,13:15
      - key: CAPITAL_INTELLIGENCE_SCHEDULER_POLL_SECONDS
        value: "60"
      - key: CAPITAL_INTELLIGENCE_SCHEDULER_SCAN_SECONDS
        value: "300"
      - key: CAPITAL_INTELLIGENCE_SCHEDULER_EVENT_COOLDOWN_MINUTES
        value: "30"
      - key: CAPITAL_INTELLIGENCE_SCHEDULER_AFTER_CLOSE_TIME
        value: "13:15"
      - key: CAPITAL_INTELLIGENCE_SCHEDULER_BENCHMARK_MOVE_THRESHOLD
        value: "0.01"
      - key: CAPITAL_INTELLIGENCE_SCHEDULER_INSTRUMENT_MOVE_THRESHOLD
        value: "0.03"
      - key: CAPITAL_INTELLIGENCE_SCHEDULER_COMPANY_MOVE_THRESHOLD
        value: "0.05"
      - key: CAPITAL_INTELLIGENCE_PUBLIC_LIVE_COLLECTION_ENABLED
        value: "true"
      - key: CAPITAL_INTELLIGENCE_PUBLIC_LIVE_COLLECTION_INTERVAL_SECONDS
        value: "900"
      - key: CAPITAL_INTELLIGENCE_EODHD_BINDINGS
        value: config/eodhd_instrument_bindings.all_markets.json
      - key: CAPITAL_INTELLIGENCE_DATABENTO_INSTRUMENT_BINDINGS
        value: config/databento_instrument_bindings.all_markets.json
      - key: CAPITAL_INTELLIGENCE_CRYPTO_VENUE_BINDINGS
        value: config/crypto_venue_bindings.all_markets.json
      - key: CAPITAL_INTELLIGENCE_CANONICAL_PORTFOLIO_CODE
        value: COMPOUNDING
      - key: APCA_API_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: APCA_DATA_BASE_URL
        value: https://data.alpaca.markets
      - key: APCA_DATA_FEED
        value: iex
      - key: SEC_USER_AGENT
        value: Capital Intelligence Platform levonmendall2369@gmail.com
      - key: CAPITAL_INTELLIGENCE_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: CAPITAL_INTELLIGENCE_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: APCA_API_KEY_ID
        sync: false
      - key: APCA_API_SECRET_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: CAPITAL_INTELLIGENCE_EODHD_API_TOKEN
        sync: false
      - key: CAPITAL_INTELLIGENCE_DATABENTO_API_KEY
        sync: false
      - key: OPENFIGI_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: EIA_API_KEY
        sync: false
      - key: NASA_FIRMS_MAP_KEY
        sync: false
      - key: BEA_API_KEY
        sync: false
      - key: CENSUS_API_KEY
        sync: false
      - key: USDA_NASS_API_KEY
        sync: false
