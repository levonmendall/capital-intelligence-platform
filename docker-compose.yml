services:
  api:
    build:
      context: .
      target: runtime
    image: capital-intelligence:${CAPITAL_INTELLIGENCE_RELEASE:-local}
    command: ["python", "capital_intelligence_cli.py", "run", "api"]
    env_file: ${CAPITAL_INTELLIGENCE_ENV_FILE:-deploy/staging.env}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - capital_data:/app/database
      - capital_backups:/app/backups
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  scheduler:
    image: capital-intelligence:${CAPITAL_INTELLIGENCE_RELEASE:-local}
    build:
      context: .
      target: runtime
    command: ["python", "capital_intelligence_cli.py", "run", "operator"]
    env_file: ${CAPITAL_INTELLIGENCE_ENV_FILE:-deploy/staging.env}
    volumes:
      - capital_data:/app/database
      - capital_backups:/app/backups
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import os; from pathlib import Path; from operations import OperationalSettings, WorkerHeartbeatStore, component_heartbeat_path; s=OperationalSettings.from_env(); p=component_heartbeat_path(Path(os.getenv('CAPITAL_INTELLIGENCE_DATA_DIR','database')), 'cio-paper-operator'); ok,_,_=WorkerHeartbeatStore(p).health(maximum_age_seconds=s.worker_max_age_seconds); raise SystemExit(0 if ok else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      api:
        condition: service_healthy

  web:
    image: capital-intelligence:${CAPITAL_INTELLIGENCE_RELEASE:-local}
    build:
      context: .
      target: runtime
    command: ["python", "capital_intelligence_cli.py", "run", "ui"]
    env_file: ${CAPITAL_INTELLIGENCE_ENV_FILE:-deploy/staging.env}
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - capital_data:/app/database
      - capital_backups:/app/backups
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /home/capital/.streamlit:size=16m,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy

  backup:
    image: capital-intelligence:${CAPITAL_INTELLIGENCE_RELEASE:-local}
    build:
      context: .
      target: runtime
    command: ["python", "capital_intelligence_cli.py", "run", "backup"]
    env_file: ${CAPITAL_INTELLIGENCE_ENV_FILE:-deploy/staging.env}
    volumes:
      - capital_data:/app/database:ro
      - capital_backups:/app/backups
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "run_backup.py", "--healthcheck"]
      interval: 5m
      timeout: 30s
      retries: 3
      start_period: 2m
    depends_on:
      api:
        condition: service_healthy

  backfill:
    image: capital-intelligence:${CAPITAL_INTELLIGENCE_RELEASE:-local}
    build:
      context: .
      target: runtime
    command: ["python", "capital_intelligence_cli.py", "run", "backfill"]
    env_file: ${CAPITAL_INTELLIGENCE_ENV_FILE:-deploy/staging.env}
    volumes:
      - capital_data:/app/database
      - capital_backups:/app/backups
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  capital_data:
  capital_backups:
