name: Collect Public Live Information

on:
  workflow_dispatch:

  schedule:
    - cron: "17 * * * *"

  push:
    branches:
      - main
    paths:
      - "providers/public_live_information.py"
      - "providers/public_live_information_runtime.py"
      - "providers/public_live_information_extended.py"
      - "config/public_live_information_sources.json"
      - "schemas/public_live_information_sources.schema.json"
      - "run_public_live_information.py"
      - ".github/workflows/public-live-information.yml"

permissions:
  contents: read

concurrency:
  group: public-live-information
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONPATH: ${{ github.workspace }}
      SEC_USER_AGENT: Capital Intelligence Platform https://github.com/levonmendall/capital-intelligence-platform-
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      NASA_FIRMS_MAP_KEY: ${{ secrets.NASA_FIRMS_MAP_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked runtime dependencies
        run: pip install --require-hashes -r requirements.lock

      - name: Collect required public live sources
        id: required
        shell: bash
        run: |
          set +e
          python run_public_live_information.py \
            --required-only \
            --compact \
            --output database/public-live-information-report.json \
            --records-output database/public-live-information-records.json \
            > reports-public-live-required.json
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Collect optional public live sources
        id: optional
        shell: bash
        run: |
          set +e
          python run_public_live_information.py \
            --compact \
            --output reports/public-live-information-full.json \
            --records-output reports/public-live-information-records-full.json \
            > reports-public-live-full.json
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload credential-safe live coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-live-information
          path: |
            database/public-live-information-report.json
            database/public-live-information-records.json
            reports/public-live-information-full.json
            reports/public-live-information-records-full.json
            reports-public-live-required.json
            reports-public-live-full.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish public baseline status
        if: always()
        shell: bash
        run: |
          code="${{ steps.required.outputs.exit_code }}"
          case "$code" in
            0)
              echo "### Public live-information baseline: available" >> "$GITHUB_STEP_SUMMARY"
              echo "All required public sources responded successfully." >> "$GITHUB_STEP_SUMMARY"
              ;;
            2|3)
              echo "::warning title=Public live-information baseline degraded::One or more public sources were temporarily unavailable. Exact failures remain in the uploaded credential-safe evidence. The listed-wrapper paper operator remains available, while any decision that depends on missing evidence continues to fail closed."
              echo "### Public live-information baseline: degraded" >> "$GITHUB_STEP_SUMMARY"
              echo "Collector exit code: $code" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "This is supplemental event-intelligence coverage, not the Alpaca/IEX paper-market execution feed. The outage is preserved as a warning and does not mark the application or paper launch as failed." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error title=Public live-information collector failed::The collector itself did not complete correctly (exit code ${code:-missing})."
              exit 1
              ;;
          esac
