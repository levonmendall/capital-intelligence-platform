name: Materialize Governed Paper Evidence

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: materialize-governed-paper-evidence
  cancel-in-progress: false

jobs:
  materialize:
    if: github.head_ref == 'agent/complete-paper-evidence-publishers'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out evidence branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/complete-paper-evidence-publishers
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt

      - name: Apply governed evidence changes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tools/materialize_governed_paper_evidence.py")
          source = path.read_text(encoding="utf-8")
          source = source.replace(
              '    if source.count(old) != 1:\n        raise RuntimeError(f"expected one match in {path}, found {source.count(old)}")',
              '    if source.count(old) < 1:\n        raise RuntimeError(f"expected a match in {path}, found {source.count(old)}")',
              1,
          )
          path.write_text(source, encoding="utf-8")
          PY
          python tools/materialize_governed_paper_evidence.py
          python tools/materialize_governed_paper_evidence_tests.py

      - name: Remove temporary materializers
        run: |
          rm tools/materialize_governed_paper_evidence.py
          rm tools/materialize_governed_paper_evidence_tests.py
          rm .github/workflows/materialize-governed-paper-evidence.yml

      - name: Validate focused evidence contracts
        run: |
          python -m compileall -q application providers production_paper_evidence.py production_context_publication_runtime.py production_context_publication_governed.py
          pytest -q tests/test_alpaca_historical_bars.py tests/test_production_context_publication_runtime.py

      - name: Commit materialized evidence publishers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Publish governed candidate and holding evidence"
          git push origin HEAD:agent/complete-paper-evidence-publishers
