          Path("MARKET_PARTICIPATION_AUTHORITY.md").write_text('''# Canonical Market Participation Authority

The platform keeps three scopes separate:

1. **Observed** — a market or instrument may be discovered, monitored, explained, and recorded in screening lineage.
2. **Decision certified** — an exact instrument may enter the six-specialist and CIO decision path only when the market registry supplies explicit candidate authority.
3. **Paper allocatable** — an exact instrument may receive a nonzero paper target only when it is explicitly listed as allocatable.

The machine authority is `config/market_coverage_registry.v1.json`.

## Current production scope

The 15 named U.S.-listed pilot instruments are observed, decision certified, and paper allocatable. They provide governed exposure to U.S. equities, international equities, government bonds, investment-grade and high-yield credit, short Treasuries, commodities, gold, foreign exchange, crypto, real estate, managed futures, option strategies, volatility, and market-neutral alternatives.

Broad individual U.S. stocks, direct international equities, direct fixed income, direct commodities and futures, spot FX, spot crypto, direct alternatives, and individual options/volatility instruments remain observed but are not decision certified or paper allocatable.

Discovery or provider availability alone cannot promote an instrument. Publication, runtime requalification, construction, and paper authority are filtered to the exact registry-listed set. Any missing registry instrument, publication mismatch, malformed state, or unregistered candidate fails closed or remains intelligence-only.

No strategy, return threshold, evidence threshold, cash hurdle, specialist authority, CIO authority, construction limit, paper-only boundary, or real-money permission is changed by this contract.
''', encoding="utf-8")

