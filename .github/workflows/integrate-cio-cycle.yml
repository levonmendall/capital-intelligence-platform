name: Integrate CIO cycle corrections

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  merge:
    if: github.head_ref == 'integration/cio-cycle-decision-integrity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/cio-cycle-decision-integrity
          fetch-depth: 0
      - name: Merge and resolve governance overlaps
        run: |
          git config user.name "capital-intelligence-bot"
          git config user.email "capital-intelligence-bot@users.noreply.github.com"
          git fetch origin fix/cio-cycle-decision-integrity
          git merge --no-ff --no-commit origin/fix/cio-cycle-decision-integrity || true
          rm -f cio-integration-conflicts.txt
          python - <<'PY'
          from pathlib import Path

          def replace_single_conflict(path: str, resolution: str) -> None:
              source = Path(path)
              lines = source.read_text(encoding="utf-8").splitlines(keepends=True)
              starts = [i for i, line in enumerate(lines) if line.startswith("<<<<<<< ")]
              separators = [i for i, line in enumerate(lines) if line.startswith("=======")]
              ends = [i for i, line in enumerate(lines) if line.startswith(">>>>>>> ")]
              if not (len(starts) == len(separators) == len(ends) == 1):
                  raise SystemExit(
                      f"expected exactly one conflict in {path}; "
                      f"found starts={starts}, separators={separators}, ends={ends}"
                  )
              start, separator, end = starts[0], separators[0], ends[0]
              if not start < separator < end:
                  raise SystemExit(f"invalid conflict marker order in {path}")
              replacement = resolution.splitlines(keepends=True)
              source.write_text(
                  "".join(lines[:start] + replacement + lines[end + 1 :]),
                  encoding="utf-8",
              )

          replace_single_conflict(
              "application/cio_cycle.py",
              (
                  "        cycle_disposition = self.cycle_disposition_authority.decide(\n"
                  "            queue,\n"
                  "            as_of=portfolio.as_of,\n"
                  "        )\n"
              ),
          )
          replace_single_conflict(
              "application/production_context_contract.py",
              (
                  "from opportunity.snapshot import (\n"
                  "    DECISION_SNAPSHOT_KIND,\n"
                  "    build_opportunity_snapshot,\n"
                  "    load_opportunity_snapshot,\n"
                  ")\n"
                  "from operations.active_paper_universe import (\n"
                  "    load_active_paper_universe_for_publication,\n"
                  ")\n"
              ),
          )

          publication_path = Path("production_context_publication_governed.py")
          publication = publication_path.read_text(encoding="utf-8")
          import_anchor = (
              "from governance.bounded_pilot_scope import "
              "BoundedPilotCapabilityAuthority\n"
          )
          market_import = (
              import_anchor
              + "from governance.market_participation import "
              "CanonicalMarketParticipationAuthority\n"
          )
          if "from governance.market_participation import" not in publication:
              if publication.count(import_anchor) != 1:
                  raise SystemExit("bounded-pilot import anchor changed")
              publication = publication.replace(import_anchor, market_import, 1)
          old_authority = (
              "    capability_authority = "
              "BoundedPilotCapabilityAuthority.from_universe(universe)\n"
          )
          new_authority = (
              "    decision_authority_universe = (\n"
              "        CanonicalMarketParticipationAuthority.load()\n"
              "        .decision_authority_universe(universe)\n"
              "    )\n"
              "    capability_authority = "
              "BoundedPilotCapabilityAuthority.from_universe(\n"
              "        decision_authority_universe\n"
              "    )\n"
          )
          if old_authority in publication:
              publication = publication.replace(old_authority, new_authority, 1)
          elif new_authority not in publication:
              raise SystemExit("publication authority anchor changed")
          publication_path.write_text(publication, encoding="utf-8")

          Path("governance/market_participation.py").write_text('''"""Canonical separation of observed, CIO-reviewable, and paper-allocatable markets.

The market coverage registry is the authority. Discovery, provider availability,
or candidate construction can never promote an instrument into committee review
or paper allocation by themselves.
"""

from __future__ import annotations

import os
from dataclasses import dataclass, replace
from enum import Enum
from pathlib import Path
from typing import Iterable

from cio.models import CandidateAssetClass
from governance.coverage_certification import (
    MarketCoverage,
    MarketCoverageRegistry,
    load_market_coverage,
)

DEFAULT_MARKET_COVERAGE_PATH = Path(
    os.getenv(
        "CAPITAL_INTELLIGENCE_MARKET_COVERAGE_REGISTRY",
        "config/market_coverage_registry.v1.json",
    )
).expanduser()


class MarketParticipationStage(str, Enum):
    OBSERVED = "observed"
    DECISION_CERTIFIED = "decision_certified"
    PAPER_ALLOCATABLE = "paper_allocatable"


@dataclass(frozen=True, slots=True)
class MarketParticipationAssessment:
    instrument_identifier: str
    market: str
    monitored: bool
    decision_certified: bool
    paper_allocatable: bool
    certification_identifier: str | None
    limitations: tuple[str, ...]
    registry_identifier: str

    @property
    def highest_stage(self) -> MarketParticipationStage | None:
        if self.paper_allocatable:
            return MarketParticipationStage.PAPER_ALLOCATABLE
        if self.decision_certified:
            return MarketParticipationStage.DECISION_CERTIFIED
        if self.monitored:
            return MarketParticipationStage.OBSERVED
        return None


_MARKET_BY_ASSET_CLASS = {
    CandidateAssetClass.US_EQUITY: "direct_us_equities",
    CandidateAssetClass.US_ETF: "direct_us_equities",
    CandidateAssetClass.INTERNATIONAL_EQUITY: "direct_international_equities",
    CandidateAssetClass.FIXED_INCOME: "direct_fixed_income_credit",
    CandidateAssetClass.CASH_EQUIVALENT: "direct_fixed_income_credit",
    CandidateAssetClass.COMMODITY: "direct_commodities_futures",
    CandidateAssetClass.FUTURE: "direct_commodities_futures",
    CandidateAssetClass.FX: "direct_spot_fx",
    CandidateAssetClass.CRYPTO: "direct_spot_crypto",
    CandidateAssetClass.REAL_ESTATE: "direct_real_estate_alternatives",
    CandidateAssetClass.ALTERNATIVE: "direct_real_estate_alternatives",
    CandidateAssetClass.OPTION: "direct_options_volatility",
    CandidateAssetClass.VOLATILITY: "direct_options_volatility",
}


class CanonicalMarketParticipationAuthority:
    """Apply the registry without inferring certification from discovery."""

    def __init__(self, registry: MarketCoverageRegistry) -> None:
        if not isinstance(registry, MarketCoverageRegistry):
            raise TypeError("registry must be a MarketCoverageRegistry")
        self.registry = registry
        self._by_market = {item.market: item for item in registry.markets}
        self._allocatable_market_by_instrument = {
            identifier: item
            for item in registry.markets
            for identifier in item.allocatable_instrument_identifiers
        }

    @classmethod
    def load(
        cls,
        path: str | Path = DEFAULT_MARKET_COVERAGE_PATH,
    ) -> "CanonicalMarketParticipationAuthority":
        return cls(load_market_coverage(path))

    @property
    def allocatable_instrument_identifiers(self) -> frozenset[str]:
        return frozenset(self._allocatable_market_by_instrument)

    def _entry_for_asset_class(
        self,
        asset_class: CandidateAssetClass | None,
    ) -> MarketCoverage | None:
        if asset_class is None:
            return None
        market = _MARKET_BY_ASSET_CLASS.get(asset_class)
        return None if market is None else self._by_market.get(market)

    def assess(
        self,
        *,
        instrument_identifier: str,
        asset_class: CandidateAssetClass | None = None,
    ) -> MarketParticipationAssessment:
        identifier = str(instrument_identifier).strip()
        if not identifier:
            raise ValueError("instrument_identifier cannot be empty")
        exact = self._allocatable_market_by_instrument.get(identifier)
        if exact is not None:
            return MarketParticipationAssessment(
                instrument_identifier=identifier,
                market=exact.market,
                monitored=exact.monitored,
                decision_certified=True,
                paper_allocatable=True,
                certification_identifier=exact.decision_certification_identifier,
                limitations=exact.limitations,
                registry_identifier=self.registry.identifier,
            )
        entry = self._entry_for_asset_class(asset_class)
        if entry is None:
            return MarketParticipationAssessment(
                instrument_identifier=identifier,
                market="unclassified",
                monitored=False,
                decision_certified=False,
                paper_allocatable=False,
                certification_identifier=None,
                limitations=(
                    "The instrument is outside the classified monitored market registry.",
                ),
                registry_identifier=self.registry.identifier,
            )
        return MarketParticipationAssessment(
            instrument_identifier=identifier,
            market=entry.market,
            monitored=entry.monitored,
            decision_certified=False,
            paper_allocatable=False,
            certification_identifier=None,
            limitations=entry.limitations,
            registry_identifier=self.registry.identifier,
        )

    def filter_paper_allocatable(
        self,
        instruments: Iterable[object],
    ) -> tuple[object, ...]:
        selected = tuple(
            item
            for item in instruments
            if str(getattr(item, "instrument_identifier", "")).strip()
            in self.allocatable_instrument_identifiers
        )
        identifiers = tuple(
            str(getattr(item, "instrument_identifier", "")).strip()
            for item in selected
        )
        if len(identifiers) != len(set(identifiers)):
            raise ValueError(
                "paper-allocatable authority contains duplicate instruments"
            )
        return selected

    def require_complete_allocatable_set(
        self,
        instruments: Iterable[object],
    ) -> None:
        available = {
            str(getattr(item, "instrument_identifier", "")).strip()
            for item in instruments
        }
        missing = sorted(self.allocatable_instrument_identifiers - available)
        if missing:
            raise ValueError(
                "the certified paper-allocatable instrument set is incomplete: "
                + ", ".join(missing)
            )

    def decision_authority_universe(self, universe):
        self.require_complete_allocatable_set(universe.instruments)
        instruments = self.filter_paper_allocatable(universe.instruments)
        if not instruments:
            raise ValueError(
                "the market registry contains no paper-allocatable instruments"
            )
        return replace(
            universe,
            instruments=tuple(instruments),
            limitations=tuple(
                dict.fromkeys(
                    (
                        *universe.limitations,
                        "Committee, CIO, construction, and paper authority is limited to exact instruments listed as paper allocatable in the canonical market-coverage registry.",
                        "Observed direct-market instruments remain intelligence-only until separately decision-certified and paper-approved.",
                    )
                )
            ),
        )


__all__ = [
    "CanonicalMarketParticipationAuthority",
    "DEFAULT_MARKET_COVERAGE_PATH",
    "MarketParticipationAssessment",
    "MarketParticipationStage",
]
