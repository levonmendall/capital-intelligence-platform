          Path("tests/test_market_participation_authority.py").write_text('''from __future__ import annotations

from pathlib import Path
from types import SimpleNamespace

from cio import CandidateAssetClass, RecommendationUniversePolicy
from cio.models import CandidateInstrument
from governance.bounded_pilot_scope import BoundedPilotCapabilityAuthority
from governance.market_participation import CanonicalMarketParticipationAuthority
from operations.free_paper_pilot import load_free_paper_pilot_universe


def test_registry_separates_observed_from_allocatable_markets() -> None:
    authority = CanonicalMarketParticipationAuthority.load()
    vti = authority.assess(
        instrument_identifier="instrument:us-etf:vti",
        asset_class=CandidateAssetClass.US_ETF,
    )
    stock = authority.assess(
        instrument_identifier="instrument:us-equity:aapl",
        asset_class=CandidateAssetClass.US_EQUITY,
    )
    crypto = authority.assess(
        instrument_identifier="instrument:crypto:btc-usd",
        asset_class=CandidateAssetClass.CRYPTO,
    )
    assert vti.monitored and vti.decision_certified and vti.paper_allocatable
    assert stock.monitored and not stock.decision_certified
    assert not stock.paper_allocatable
    assert crypto.monitored and not crypto.decision_certified
    assert not crypto.paper_allocatable


def test_registry_allocatable_set_matches_fixed_pilot() -> None:
    authority = CanonicalMarketParticipationAuthority.load()
    universe = load_free_paper_pilot_universe()
    filtered = authority.decision_authority_universe(universe)
    assert len(filtered.instruments) == 15
    assert {item.instrument_identifier for item in filtered.instruments} == (
        authority.allocatable_instrument_identifiers
    )


def test_direct_market_candidate_remains_intelligence_only() -> None:
    universe = load_free_paper_pilot_universe()
    policy = RecommendationUniversePolicy(
        asset_class_authority=BoundedPilotCapabilityAuthority.from_universe(universe)
    )
    instrument = CandidateInstrument(
        instrument_id="instrument:crypto:btc-usd",
        symbol="BTC-USD",
        name="Bitcoin spot",
        asset_class=CandidateAssetClass.CRYPTO,
        venue="CRYPTO",
        country_code="US",
        currency="USD",
        instrument_type="spot",
        average_daily_dollar_volume=1_000_000_000.0,
        data_age_hours=0.01,
        analytical_coverage=1.0,
        leverage_multiplier=1.0,
    )
    assessment = policy.evaluate(
        instrument,
        as_of=universe.instruments[0].profile(
            universe_identifier=universe.identifier
        ).approved_at,
    )
    assert not assessment.direct_recommendation_allowed
    assert any("intelligence-only" in reason for reason in assessment.reasons)


def test_publication_uses_registry_filtered_authority() -> None:
    source = Path("production_context_publication_governed.py").read_text(
        encoding="utf-8"
    )
    assert "CanonicalMarketParticipationAuthority.load()" in source
    assert ".decision_authority_universe(universe)" in source
    assert (
        "BoundedPilotCapabilityAuthority.from_universe(universe)"
        not in source
    )


def test_runtime_authority_filters_unregistered_candidate(monkeypatch) -> None:
    import application.production_context_executor as executor_module

    candidate = SimpleNamespace(
        instrument=SimpleNamespace(
            instrument_id="instrument:crypto:btc-usd",
            symbol="BTC-USD",
            asset_class=CandidateAssetClass.CRYPTO,
            economic_exposure_class=CandidateAssetClass.CRYPTO,
            venue="CRYPTO",
            country_code="US",
            instrument_type="spot",
        )
    )
    monkeypatch.setattr(
        executor_module,
        "candidate_from_payload",
        lambda _payload: candidate,
    )
    context = SimpleNamespace(
        screening_cycle_identifier="screening:test",
        eligible_universe_publication_identifier="eligible:test",
    )
    fake = SimpleNamespace(
        context_provider=SimpleNamespace(load_context=lambda **_kwargs: context),
        screening_store=SimpleNamespace(
            publication=lambda _identifier: SimpleNamespace(
                candidate_payloads=({"candidate": "btc"},)
            )
        ),
    )
    authority_universe = executor_module._candidate_authority_universe(
        fake,
        as_of=load_free_paper_pilot_universe().instruments[0].profile(
            universe_identifier=load_free_paper_pilot_universe().identifier
        ).approved_at,
    )
    identifiers = {
        item.instrument_identifier for item in authority_universe.instruments
    }
    assert "instrument:crypto:btc-usd" not in identifiers
    assert len(identifiers) == 15
