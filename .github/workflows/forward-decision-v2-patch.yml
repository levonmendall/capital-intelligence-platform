name: Apply Forward Decision Intelligence v2 production integration

on:
  push:
    branches:
      - agent/forward-decision-intelligence-v2
    paths:
      - .github/workflows/forward-decision-v2-patch.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/forward-decision-intelligence-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply production patch
        run: python .github/forward_decision_v2_patch.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile changed modules
        run: python -m py_compile intelligence/forward.py intelligence/forward_decision.py intelligence/predictive_market.py intelligence/predictive_scenario_merge.py application/production_context_runtime.py
      - name: Run focused and canonical regressions
        run: python -m pytest -q tests/test_forward_decision_intelligence_v2.py tests/test_predictive_forward_decision_context.py tests/test_forward_intelligence.py tests/test_forward_intelligence_integration.py tests/test_canonical_cio_cycle.py tests/test_canonical_production_context_adapter.py
      - name: Commit production integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intelligence/forward_decision.py intelligence/predictive_market.py intelligence/predictive_scenario_merge.py tests/test_predictive_forward_decision_context.py
          git diff --cached --check
          git commit -m "Wire Forward Decision Intelligence v2 into production evidence"
          git push origin HEAD:agent/forward-decision-intelligence-v2
