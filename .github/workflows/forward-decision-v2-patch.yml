name: Validate Forward Decision Intelligence v2

on:
  push:
    branches:
      - agent/forward-decision-intelligence-v2
    paths:
      - .github/workflows/forward-decision-v2-patch.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile changed modules
        run: python -m py_compile intelligence/forward.py intelligence/forward_decision.py application/production_context_runtime.py
      - name: Forward decision focused tests
        run: python -m pytest -q tests/test_forward_decision_intelligence_v2.py tests/test_forward_intelligence.py tests/test_forward_intelligence_integration.py
      - name: Canonical CIO and production-context regressions
        run: python -m pytest -q tests/test_canonical_cio_cycle.py tests/test_canonical_production_context_adapter.py
