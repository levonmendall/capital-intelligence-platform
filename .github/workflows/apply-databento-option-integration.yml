name: Apply Databento OPRA Integration

on:
  pull_request:
    branches:
      - main
    paths:
      - tools/apply_databento_option_integration.py
      - .github/workflows/apply-databento-option-integration.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/prove-pr264-live-providers-now'
    runs-on: ubuntu-latest
    steps:
      - name: Check out writable branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/prove-pr264-live-providers-now
          fetch-depth: 0
      - name: Apply integration and publish source commit
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_databento_option_integration.py
          python -m py_compile \
            providers/databento_options.py \
            operations/provider_validation.py \
            operations/comprehensive_market_discovery.py
          git config user.name "capital-intelligence-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Use authenticated Databento OPRA option evidence"
          git push origin HEAD:agent/prove-pr264-live-providers-now
