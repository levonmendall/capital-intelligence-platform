name: Validate Capability Operating Runtime

on:
  pull_request:
    branches: [main]
    paths:
      - "operations/capability_operating_evidence.py"
      - "operations/capability_operating_retry_refresh.py"
      - "operations/capability_operating_universe.py"
      - "operations/capability_scoped_discovery.py"
      - "operations/capability_scoped_render_bootstrap.py"
      - "operations/capability_scoped_release_diagnostic.py"
      - "operations/qualified_paper_evidence.py"
      - "operations/stage_isolated_evidence_pipeline.py"
      - "production_context_publication_runtime.py"
      - "run_bounded_capability_operating_evidence.py"
      - "run_bounded_continuous_evidence_plane.py"
      - "run_bounded_manual_cio_diagnostic.py"
      - "run_capability_operating_evidence.py"
      - "run_render_service_workspace.py"
      - "run_stage_isolated_evidence_pipeline.py"
      - "run_stage_isolated_evidence_stage.py"
      - "tests/test_capability_operating_evidence.py"
      - "tests/test_capability_operating_retry_refresh.py"
      - "tests/test_capability_scoped_release_diagnostic.py"
      - "tests/test_capability_scoped_runtime_v2.py"
      - "tests/test_qualified_paper_evidence.py"
      - "tests/test_reclaimable_memory_guard.py"
      - "tests/test_stage_isolated_evidence_pipeline.py"
      - ".github/workflows/capability-operating-runtime.yml"
  push:
    branches: [main]
    paths:
      - "operations/capability_operating_evidence.py"
      - "operations/capability_operating_retry_refresh.py"
      - "operations/capability_operating_universe.py"
      - "operations/capability_scoped_discovery.py"
      - "operations/capability_scoped_render_bootstrap.py"
      - "operations/capability_scoped_release_diagnostic.py"
      - "operations/qualified_paper_evidence.py"
      - "operations/stage_isolated_evidence_pipeline.py"
      - "production_context_publication_runtime.py"
      - "run_bounded_capability_operating_evidence.py"
      - "run_bounded_continuous_evidence_plane.py"
      - "run_bounded_manual_cio_diagnostic.py"
      - "run_capability_operating_evidence.py"
      - "run_render_service_workspace.py"
      - "run_stage_isolated_evidence_pipeline.py"
      - "run_stage_isolated_evidence_stage.py"
      - "tests/test_capability_operating_evidence.py"
      - "tests/test_capability_operating_retry_refresh.py"
      - "tests/test_capability_scoped_release_diagnostic.py"
      - "tests/test_capability_scoped_runtime_v2.py"
      - "tests/test_qualified_paper_evidence.py"
      - "tests/test_reclaimable_memory_guard.py"
      - "tests/test_stage_isolated_evidence_pipeline.py"
      - ".github/workflows/capability-operating-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capability-operating-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONPATH: ${{ github.workspace }}
      CAPITAL_INTELLIGENCE_DAILY_STAGE_BINDINGS: ${{ github.workspace }}/deploy/canonical-daily-stage-bindings.validation.json
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked runtime dependencies
        run: pip install --require-hashes -r requirements.lock

      - name: Install development dependencies
        run: pip install -r requirements-dev.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run capability operating runtime regressions
        run: >-
          pytest -q
          tests/test_qualified_paper_evidence.py
          tests/test_capability_scoped_runtime_v2.py
          tests/test_capability_operating_evidence.py
          tests/test_capability_operating_retry_refresh.py
          tests/test_capability_scoped_release_diagnostic.py
          tests/test_reclaimable_memory_guard.py
          tests/test_stage_isolated_evidence_pipeline.py

      - name: Run deterministic release validation
        run: timeout --signal=TERM 12m python run_release_validation.py --report reports/capability-operating-release-validation.json

      - name: Publish capability operating validation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capability-operating-validation-results
          path: |
            reports/capability-operating-release-validation.json
            reports/runtime-connectivity-audit.json
            reports/golden-end-to-end-gate.json
            reports/event-quality-benchmark.json
            reports/information-gap-audit.json
            reports/pytest-results.xml
          if-no-files-found: ignore
          retention-days: 14