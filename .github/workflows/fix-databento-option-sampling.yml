name: Fix Databento Option Sampling

on:
  pull_request:
    branches:
      - main
    paths:
      - tools/fix_databento_option_sampling.py
      - .github/workflows/fix-databento-option-sampling.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'agent/prove-pr264-live-providers-now'
    runs-on: ubuntu-latest
    steps:
      - name: Check out writable branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/prove-pr264-live-providers-now
          fetch-depth: 0
      - name: Apply and publish correction
        shell: bash
        run: |
          set -euo pipefail
          python tools/fix_databento_option_sampling.py
          python -m py_compile providers/databento_options.py
          git config user.name "capital-intelligence-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Sample priced OPRA contracts across the chain"
          git push origin HEAD:agent/prove-pr264-live-providers-now
