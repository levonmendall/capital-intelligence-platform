name: Materialize weekend runtime availability

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'agent/weekend-market-availability'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply runtime availability correction
        run: python .github/scripts/apply_weekend_runtime_availability.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Compile affected runtime
        run: |
          python -m py_compile \
            operations/free_paper_pilot.py \
            operations/comprehensive_market_discovery.py \
            operations/equity_discovery.py \
            production_paper_evidence.py \
            production_context_publication_governed.py \
            tests/test_weekend_discovery_schedule.py

      - name: Run schedule and discovery regressions
        run: |
          python -m pytest -q \
            tests/test_comprehensive_market_discovery.py \
            tests/test_weekend_discovery_schedule.py

      - name: Run deterministic release validation
        run: python scripts/validate_release.py

      - name: Commit validated runtime correction
        shell: bash
        run: |
          rm \
            .github/scripts/apply_weekend_runtime_availability.py \
            .github/workflows/materialize-weekend-runtime-availability.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            operations/free_paper_pilot.py \
            operations/comprehensive_market_discovery.py \
            operations/equity_discovery.py \
            production_paper_evidence.py \
            production_context_publication_governed.py \
            tests/test_weekend_discovery_schedule.py \
            .github/scripts/apply_weekend_runtime_availability.py \
            .github/workflows/materialize-weekend-runtime-availability.yml
          git commit -m "Restrict weekend evaluation to 24/7 markets"
          git push origin HEAD:agent/weekend-market-availability
