name: Paper Readiness Provider Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * 1-5"

permissions:
  contents: read

concurrency:
  group: paper-readiness-provider-smoke
  cancel-in-progress: false

jobs:
  provider-smoke:
    if: github.event_name == 'workflow_dispatch' || vars.PAPER_READINESS_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: paper-readiness

    env:
      PYTHONPATH: ${{ github.workspace }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
      CAPITAL_INTELLIGENCE_EODHD_API_TOKEN: ${{ secrets.CAPITAL_INTELLIGENCE_EODHD_API_TOKEN }}
      EODHD_BINDINGS_JSON: ${{ secrets.CAPITAL_INTELLIGENCE_EODHD_BINDINGS_JSON }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked runtime dependencies
        run: pip install --require-hashes -r requirements.lock

      - name: Materialize optional EODHD binding secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${EODHD_BINDINGS_JSON:-}" ]]; then
            umask 077
            mkdir -p "$RUNNER_TEMP/paper-readiness"
            printf '%s' "$EODHD_BINDINGS_JSON" > "$RUNNER_TEMP/paper-readiness/eodhd-bindings.json"
            echo "CAPITAL_INTELLIGENCE_EODHD_BINDINGS=$RUNNER_TEMP/paper-readiness/eodhd-bindings.json" >> "$GITHUB_ENV"
          fi

      - name: Probe official and licensed provider access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          arguments=(--require-fred --output reports/provider-smoke.json)
          if [[ "${{ vars.PAPER_READINESS_REQUIRE_EODHD }}" == "true" ]]; then
            arguments+=(--require-eodhd)
          fi
          python run_provider_smoke.py "${arguments[@]}"

      - name: Capture fail-closed all-markets readiness
        continue-on-error: true
        run: python run_data_readiness.py --output reports/all-markets-data-readiness.json

      - name: Publish provider readiness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: paper-readiness-provider-smoke-${{ github.run_id }}
          path: |
            reports/provider-smoke.json
            reports/all-markets-data-readiness.json
          if-no-files-found: warn
          retention-days: 30
