name: Fix PR276 Company Lineage

on:
  push:
    branches:
      - main
    paths:
      - .pr276-controller-trigger-v2

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/verify-pr264-live-and-ci
          fetch-depth: 0
      - name: Apply correction to PR branch
        shell: bash
        run: |
          set -euo pipefail
          python tools/fix_pr264_company_lineage.py
          python -m py_compile production_paper_evidence.py
          git config user.name "capital-intelligence-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Correct PR264 company-equity evidence lineage"
          git push origin HEAD:agent/verify-pr264-live-and-ci
      - name: Remove controller from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          rm -f .github/workflows/fix-pr276-controller.yml .pr276-controller-trigger .pr276-controller-trigger-v2
          git add -A
          git commit -m "Remove PR276 correction controller"
          git push origin HEAD:main
