name: Materialize Phase 6 Risk Intelligence

on:
  push:
    branches:
      - feature/committee-cio-v2-phase6-risk-intelligence
    paths:
      - .github/workflows/materialize-phase6-risk-intelligence.yml
      - scripts/materialize_phase6_risk_intelligence.py
      - portfolio/risk_intelligence.py
      - tests/test_risk_intelligence.py
      - tests/test_risk_intelligence_cycle.py
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-phase6-risk-intelligence
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out phase branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: feature/committee-cio-v2-phase6-risk-intelligence
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply reviewed Phase 6 integration
        run: python scripts/materialize_phase6_risk_intelligence.py

      - name: Install locked runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt

      - name: Run candidate joint and canonical risk regressions
        run: >-
          pytest -q
          tests/test_risk_intelligence.py
          tests/test_risk_intelligence_cycle.py
          tests/test_canonical_cio_cycle.py
          tests/test_cio_persistence.py

      - name: Publish final source and remove temporary materializer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add application/cio_cycle.py cio/persistence.py portfolio/risk_intelligence.py
          git add tests/test_risk_intelligence.py tests/test_risk_intelligence_cycle.py tests/test_canonical_cio_cycle.py
          git rm scripts/materialize_phase6_risk_intelligence.py
          git rm .github/workflows/materialize-phase6-risk-intelligence.yml
          git commit -m "Integrate candidate tail liquidity thesis and joint risk intelligence"
          git push origin HEAD:feature/committee-cio-v2-phase6-risk-intelligence
