name: Remove Invalid Databento stype_out

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/remove-invalid-databento-stype-out.yml
      - tools/remove_invalid_databento_stype_out.py

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'agent/prove-pr264-live-providers-now'
    runs-on: ubuntu-latest
    steps:
      - name: Check out writable branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/prove-pr264-live-providers-now
          fetch-depth: 0
      - name: Remove unsupported OPRA output symbology
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/remove_invalid_databento_stype_out.py
          python3 -m py_compile providers/databento_options.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove unsupported Databento OPRA output symbology"
          git push origin HEAD:agent/prove-pr264-live-providers-now
