name: Materialize Clean Phase 5 Forward Intelligence

on:
  push:
    branches:
      - feature/committee-cio-v2-phase5-forward-intelligence-clean
    paths:
      - .github/workflows/materialize-phase5-clean.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out clean branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: feature/committee-cio-v2-phase5-forward-intelligence-clean
          fetch-depth: 0

      - name: Copy reviewed final Phase 5 source
        run: |
          git fetch origin feature/committee-cio-v2-phase5-forward-intelligence
          git checkout origin/feature/committee-cio-v2-phase5-forward-intelligence -- \
            intelligence/forward.py \
            intelligence/__init__.py \
            committee/specialists.py \
            application/cio_cycle.py \
            application/production_context.py \
            tests/test_forward_intelligence.py \
            tests/test_forward_intelligence_integration.py

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt

      - name: Run forward-intelligence and canonical regressions
        run: >-
          pytest -q
          tests/test_forward_intelligence.py
          tests/test_forward_intelligence_integration.py
          tests/test_canonical_cio_cycle.py
          tests/test_canonical_production_context_adapter.py

      - name: Publish clean Phase 5 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intelligence/forward.py intelligence/__init__.py committee/specialists.py application/cio_cycle.py application/production_context.py
          git add tests/test_forward_intelligence.py tests/test_forward_intelligence_integration.py
          git rm .github/workflows/materialize-phase5-clean.yml
          git commit -m "Integrate governed forward business macro theme and currency intelligence"
          git push origin HEAD:feature/committee-cio-v2-phase5-forward-intelligence-clean
