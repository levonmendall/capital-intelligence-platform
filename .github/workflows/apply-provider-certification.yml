name: Apply provider certification framework

on:
  pull_request:
    paths:
      - .github/workflows/apply-provider-certification.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out patch staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/export-provider-certification
          persist-credentials: true

      - name: Reconstruct and verify validated patch
        run: |
          cat .github/patches/provider-certification-{00..05}.b64 \
            | base64 --decode \
            > /tmp/provider-certification.patch.gz
          echo '58277b8700e3d1b8d52e14031ccdcfdbe03c409304bb56b44d321d80cfd89627  /tmp/provider-certification.patch.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/provider-certification.patch.gz > /tmp/provider-certification.patch
          echo '45fc944be1cd6a506903bb08de1883a078919f739798dc821ea987cbb214aa38  /tmp/provider-certification.patch' | sha256sum --check

      - name: Check out product branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/provider-certification-framework
          persist-credentials: true

      - name: Apply exact provider certification patch
        run: patch -p2 --forward --batch < /tmp/provider-certification.patch

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt
          python -m pip check
          python scripts/verify_requirements_lock.py

      - name: Validate exact updated branch
        run: |
          python -m compileall -q .
          python initialize.py
          python run_intelligence.py
          python run_regime.py
          pytest -q

      - name: Commit validated provider certification authority
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            DATA_SOURCES.md \
            README.md \
            ROADMAP.md \
            data/__init__.py \
            data/security_master_certification.py \
            data/security_master_ingestion.py \
            docs/PROVIDER_CERTIFICATION.md \
            docs/SECURITY_MASTER_OPERATIONS.md \
            docs/examples/security_master_provider_manifest.example.json \
            docs/examples/security_master_provider_suite.example.json \
            operations/slo.py \
            run_provider_certification.py \
            run_security_master.py \
            schemas/security_master_provider_certification_suite.schema.json \
            schemas/security_master_provider_manifest.schema.json \
            tests/test_run_provider_certification.py \
            tests/test_security_master_ingestion.py \
            tests/test_security_master_provider_certification.py
          git commit -m 'Add security-master provider certification authority'
          git push origin HEAD:agent/provider-certification-framework