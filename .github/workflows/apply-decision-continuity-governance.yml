name: Apply decision continuity governance upgrade

on:
  push:
    branches:
      - agent/decision-continuity-governance-upgrade
    paths:
      - ".decision-upgrade/**"
      - ".github/workflows/apply-decision-continuity-governance.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/decision-continuity-governance-upgrade
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply fail-closed migrations
        run: |
          python .decision-upgrade/phase0.py
          python .decision-upgrade/phase1.py
          python .decision-upgrade/phase2.py
          python .decision-upgrade/phase3.py
          python .decision-upgrade/phase4.py

      - name: Verify source integrity
        run: |
          git diff --check
          python -m compileall -q application cio committee evaluation opportunity portfolio thesis tests
          python - <<'PY'
          from pathlib import Path
          forbidden = ("<<<<<<<", "=======", ">>>>>>>")
          for path in Path(".").rglob("*.py"):
              text = path.read_text()
              if any(marker in text for marker in forbidden):
                  raise SystemExit(f"merge marker found in {path}")
          PY

      - name: Install locked runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt
          python -m pip check

      - name: Run focused decision validation
        run: |
          pytest -q \
            tests/test_decision_continuity_governance.py \
            tests/test_decision_process_upgrade.py \
            tests/test_cio_persistence.py \
            tests/test_portfolio_construction_engine.py \
            tests/test_point_in_time_evaluation.py \
            tests/test_canonical_cio_cycle.py \
            tests/test_production_cio.py \
            tests/test_production_context.py

      - name: Remove migration transport
        run: |
          rm -rf .decision-upgrade
          rm -f .github/workflows/apply-decision-continuity-governance.yml
          git diff --check

      - name: Commit clean production upgrade
        run: |
          git config user.name "capital-intelligence-governance-bot"
          git config user.email "capital-intelligence-governance-bot@users.noreply.github.com"
          git add -A
          git commit -m "Complete decision continuity and governance controls"
          git push origin HEAD:agent/decision-continuity-governance-upgrade

# Triggered after draft PR creation so the clean head receives normal validation.
