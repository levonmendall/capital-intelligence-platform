name: Apply daily briefing presentation update

on:
  push:
    branches:
      - agent/daily-briefs-below-hero

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/daily-briefs-below-hero
          fetch-depth: 0
      - name: Apply source update
        run: python tools/apply_daily_briefing_update.py
      - name: Run focused tests
        run: python -m pytest tests/test_educational_market_briefing.py -q
      - name: Remove temporary updater
        run: |
          rm tools/apply_daily_briefing_update.py
          rm .github/workflows/apply-daily-briefing-update.yml
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py educational_market_briefing_ui.py tests/test_educational_market_briefing.py tools/apply_daily_briefing_update.py .github/workflows/apply-daily-briefing-update.yml
          git commit -m "Position daily investment briefs below hero"
          git push origin HEAD:agent/daily-briefs-below-hero
