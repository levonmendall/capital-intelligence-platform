name: Integrate CIO corrections and validate Docker

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate-and-validate:
    if: github.head_ref == 'agent/harden-cio-operations-risk-sizing'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out correction branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/harden-cio-operations-risk-sizing
          fetch-depth: 0

      - name: Determine whether integration is required
        id: transfer
        shell: bash
        run: |
          if [[ -d .automation ]]; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Recreate and resolve three-way integration
        if: steps.transfer.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/apply-cio-corrections.yml /tmp/integration-workflow.yml
          cp .github/workflows/validate.yml /tmp/validate-workflow.yml

          cat .automation/corrections.patch.part* > /tmp/corrections.patch.gz.b64
          test "$(wc -c < /tmp/corrections.patch.gz.b64)" -eq 61792
          echo 'fed53220bd01c40d47c6f1462d111fab2980fe5fc4162e60f870b99462b4025b  /tmp/corrections.patch.gz.b64' | sha256sum --check
          base64 --decode /tmp/corrections.patch.gz.b64 > /tmp/corrections.patch.gz
          echo '43ce27c6f24c45acf8e047d70f22792c4cb983329d1ffd501156457388933244  /tmp/corrections.patch.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/corrections.patch.gz > /tmp/corrections.patch
          echo 'f5ac9adf4da7124fb10817b0b3abf594fe7d63722ad27b6d6016b1917e131862  /tmp/corrections.patch' | sha256sum --check

          git config merge.conflictstyle merge
          set +e
          git apply --3way --whitespace=nowarn /tmp/corrections.patch
          three_way_status=$?
          set -e
          test "${three_way_status}" -ne 0

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          test "${#conflicts[@]}" -gt 0
          for path in "${conflicts[@]}"; do
            sed -i -E \
              -e 's/^<<<<<<< .*/<<<<<<< current-main/' \
              -e 's/^>>>>>>> .*/>>>>>>> correction-set/' \
              "$path"
          done

          cat .automation/manual-reconciliation.part* > /tmp/manual-reconciliation.patch.gz.b64
          test "$(wc -c < /tmp/manual-reconciliation.patch.gz.b64)" -eq 42072
          echo '0a16e356adb0248c41e9a22f0f3c1d5f6cd9a4cffb84f65205f1b275b32b2a60  /tmp/manual-reconciliation.patch.gz.b64' | sha256sum --check
          base64 --decode /tmp/manual-reconciliation.patch.gz.b64 > /tmp/manual-reconciliation.patch.gz
          echo '050a2b4a9f9d962fec6eb848db0c7e602aaa17d8356ec2eeb71d0cf905c29781  /tmp/manual-reconciliation.patch.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/manual-reconciliation.patch.gz > /tmp/manual-reconciliation.patch
          test "$(wc -c < /tmp/manual-reconciliation.patch)" -eq 129806
          echo '92aec0c0b5973ee964533ec30cbe238846531fd2ff996acdd0f1d0e1515feb4e  /tmp/manual-reconciliation.patch' | sha256sum --check
          git apply --check /tmp/manual-reconciliation.patch
          git apply --whitespace=nowarn /tmp/manual-reconciliation.patch

          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          if grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' \
              --exclude-dir=.git --exclude='*.patch*' .; then
            echo 'Unresolved merge markers remain.' >&2
            exit 1
          fi

          cp /tmp/integration-workflow.yml .github/workflows/apply-cio-corrections.yml
          cp /tmp/validate-workflow.yml .github/workflows/validate.yml
          rm -rf .automation
          git add -A

      - name: Set up Python
        if: steps.transfer.outputs.needed == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install locked dependencies
        if: steps.transfer.outputs.needed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt
          python -m pip check

      - name: Verify Docker CLI
        if: steps.transfer.outputs.needed == 'true'
        run: |
          docker version
          docker compose version

      - name: Run complete release validation
        if: steps.transfer.outputs.needed == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
          CAPITAL_INTELLIGENCE_ENVIRONMENT: test
        run: |
          python scripts/verify_requirements_lock.py
          python -m compileall -q .
          python run_release_validation.py --report /tmp/release-validation.json
          cat /tmp/release-validation.json

      - name: Commit validated source
        if: steps.transfer.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git clean -fdX
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Harden CIO operations and risk-adjusted allocation'
          git push origin HEAD:agent/harden-cio-operations-risk-sizing
