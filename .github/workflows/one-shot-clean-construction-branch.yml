name: One-shot construction branch cleanup

on:
  push:
    branches:
      - agent/portfolio-construction-engine
    paths:
      - .github/workflows/one-shot-clean-construction-branch.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/portfolio-construction-engine

      - name: Remove superseded draft and temporary workflows
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path("tests/test_portfolio_construction_engine.py")
          source = test_path.read_text(encoding="utf-8")
          source = source.replace(
              '    assert "confidence" not in source\n',
              '    assert "decision.final_confidence" not in source\n    assert ".final_confidence" not in source\n',
              1,
          )
          test_path.write_text(source, encoding="utf-8")

          for relative in (
              "portfolio/construction.py",
              ".github/workflows/one-shot-fix-construction-test.yml",
              ".github/workflows/one-shot-clean-construction-branch.yml",
          ):
              path = Path(relative)
              if path.exists():
                  path.unlink()
          PY

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove superseded construction draft"
          git push origin HEAD:agent/portfolio-construction-engine