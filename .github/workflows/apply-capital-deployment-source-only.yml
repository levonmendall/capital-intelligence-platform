name: Apply capital deployment source-only correction

on:
  push:
    branches:
      - fix/capital-deployment-research-breadth
    paths:
      - .github/workflows/apply-capital-deployment-source-only.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract and apply vetted patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/apply-capital-deployment-research-breadth.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          code = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          Path('/tmp/apply_capital_deployment.py').write_text(code + "\n")
          PY
          python /tmp/apply_capital_deployment.py

      - name: Validate focused behavior
        shell: bash
        run: |
          python -m pip install -q pytest
          python -m compileall -q opportunity/engine.py operations/comprehensive_market_discovery_legacy.py evaluation/persistent_cash.py tests/test_capital_deployment_architecture.py
          python -m pytest -q tests/test_capital_deployment_architecture.py tests/test_opportunity_engine.py tests/test_persistent_cash_diagnostic.py
          git diff --check

      - name: Commit runtime changes only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opportunity/engine.py operations/comprehensive_market_discovery_legacy.py evaluation/persistent_cash.py tests/test_capital_deployment_architecture.py
          git commit -m "Broaden research funnel and restore sizing authority boundaries"
          git push origin HEAD:fix/capital-deployment-research-breadth
