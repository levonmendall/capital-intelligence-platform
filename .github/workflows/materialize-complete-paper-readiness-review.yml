name: Materialize Complete Paper Readiness Review

on:
  push:
    branches:
      - agent/complete-paper-readiness-review
    paths:
      - tools/materialize_complete_paper_readiness_review.py
      - .github/workflows/materialize-complete-paper-readiness-review.yml
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: materialize-complete-paper-readiness-review
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt

      - name: Apply reviewed corrections
        run: python tools/materialize_complete_paper_readiness_review.py

      - name: Remove temporary materializer
        run: |
          rm tools/materialize_complete_paper_readiness_review.py
          rm .github/workflows/materialize-complete-paper-readiness-review.yml

      - name: Validate focused readiness contracts
        run: |
          python -m compileall -q reporting cio run_scheduler.py cio_pending_transactions.py production_smoke_test.py
          pytest -q tests/test_complete_paper_readiness_review.py

      - name: Commit materialized review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden paper decision readiness and CIO semantics"
          git push origin HEAD:agent/complete-paper-readiness-review
