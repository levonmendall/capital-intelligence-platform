name: Export Autonomous Paper Source

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/export-autonomous-paper-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Package exact source
        run: |
          tar \
            --exclude=.git \
            --exclude=database \
            --exclude=backups \
            --exclude=reports \
            -czf "$RUNNER_TEMP/capital-intelligence-source.tar.gz" .
          sha256sum "$RUNNER_TEMP/capital-intelligence-source.tar.gz" > "$RUNNER_TEMP/capital-intelligence-source.sha256"

      - name: Upload source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: autonomous-paper-source
          path: |
            ${{ runner.temp }}/capital-intelligence-source.tar.gz
            ${{ runner.temp }}/capital-intelligence-source.sha256
          if-no-files-found: error
          retention-days: 1
