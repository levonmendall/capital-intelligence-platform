name: Apply collapsed decision detail update

on:
  push:
    branches:
      - agent/collapse-decision-change-details

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/collapse-decision-change-details
          fetch-depth: 0

      - name: Collapse decision-change detail panels
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app_impl.py")
          source = path.read_text(encoding="utf-8")

          replacements = {
              '''        with right:\n            text_card(\n                "What could change the state",\n                (\n                    "A completed evidence comparison, independent review, CIO synthesis, "\n                    "and feasible construction are required before capital can change."\n                ),\n            )\n''': '''        with right:\n            with st.expander("What could change the state"):\n                st.write(\n                    "A completed evidence comparison, independent review, CIO synthesis, "\n                    "and feasible construction are required before capital can change."\n                )\n''',
              '''        text_card(\n            "What could change the decision",\n            _joined_items(\n                briefing.get("evidence_that_changes_conclusion", []),\n                "No additional decision-change conditions were recorded.",\n            ),\n        )\n''': '''        with st.expander("What could change the decision"):\n            st.write(\n                _joined_items(\n                    briefing.get("evidence_that_changes_conclusion", []),\n                    "No additional decision-change conditions were recorded.",\n                )\n            )\n''',
              '''    policy_rate = "Unavailable" if readings is None else f"{readings.federal_funds_rate:.2f}%"\n\n''': '''    policy_rate = "Unavailable" if readings is None else f"{readings.federal_funds_rate:.2f}%"\n    assessment_change_conditions = _joined_items(\n        latest_briefing.get("evidence_that_changes_conclusion", [])\n        if isinstance(latest_briefing, dict)\n        else [],\n        "A material change in growth, inflation, policy, liquidity, or cross-asset evidence would trigger review.",\n    )\n\n''',
              '''        with right:\n            text_card(\n                "Portfolio implication",\n                _plain_text(\n                    environment.get("portfolio_impact"),\n                    _plain_text(\n                        latest_briefing.get("why_it_matters") if isinstance(latest_briefing, dict) else None,\n                        "The environment record does not independently authorize a portfolio change.",\n                    ),\n                ),\n            )\n    elif live_market.get("status") in {"connected", "partial"} and readings is not None:\n''': '''        with right:\n            text_card(\n                "Portfolio implication",\n                _plain_text(\n                    environment.get("portfolio_impact"),\n                    _plain_text(\n                        latest_briefing.get("why_it_matters") if isinstance(latest_briefing, dict) else None,\n                        "The environment record does not independently authorize a portfolio change.",\n                    ),\n                ),\n            )\n        with st.expander("What could change the assessment"):\n            st.write(assessment_change_conditions)\n    elif live_market.get("status") in {"connected", "partial"} and readings is not None:\n''',
              '''        text_card(\n            "What could change the assessment",\n            _joined_items(\n                latest_briefing.get("evidence_that_changes_conclusion", [])\n                if isinstance(latest_briefing, dict)\n                else [],\n                "A material change in growth, inflation, policy, liquidity, or cross-asset evidence would trigger review.",\n            ),\n        )\n''': '''        with st.expander("What could change the assessment"):\n            st.write(assessment_change_conditions)\n''',
          }

          for old, new in replacements.items():
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected one exact replacement target, found {count}: {old[:80]!r}")
              source = source.replace(old, new, 1)

          path.write_text(source, encoding="utf-8")

          tests = Path("tests/test_surface_information_hierarchy.py")
          test_source = tests.read_text(encoding="utf-8")
          addition = '''\n\ndef test_decision_change_details_are_collapsed_by_default() -> None:\n    source = Path("app_impl.py").read_text(encoding="utf-8")\n    today = _function_block(source, "_render_today", "_render_environment")\n    environment = _function_block(source, "_render_environment", "_render_portfolio")\n    assert 'with st.expander("What could change the decision"):' in today\n    assert 'with st.expander("What could change the state"):' in today\n    assert environment.count('with st.expander("What could change the assessment"):') == 2\n    assert 'text_card(\n            "What could change the decision"' not in today\n    assert 'text_card(\n            "What could change the assessment"' not in environment\n'''
          if "def test_decision_change_details_are_collapsed_by_default" not in test_source:
              tests.write_text(test_source.rstrip() + addition + "\n", encoding="utf-8")
          PY

      - name: Validate focused presentation behavior
        run: |
          python -m py_compile app_impl.py
          python -m pytest -q tests/test_surface_information_hierarchy.py tests/test_streamlit_surfaces.py

      - name: Remove temporary workflow and push
        run: |
          rm .github/workflows/apply-collapse-decision-details.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_impl.py tests/test_surface_information_hierarchy.py .github/workflows/apply-collapse-decision-details.yml
          git commit -m "Collapse decision change details"
          git push origin HEAD:agent/collapse-decision-change-details
