name: Preserve paper approval contract

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/expose-daily-cio-briefing'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out communication branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/expose-daily-cio-briefing
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Preserve compatibility contract
        run: python scripts/preserve_paper_approval_contract.py

      - name: Validate targeted presentation contracts
        run: |
          python -m py_compile app.py tests/test_surface_information_hierarchy.py
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q \
            tests/test_surface_information_hierarchy.py \
            tests/test_paper_trading_ui_approval.py

      - name: Commit compatibility correction
        run: |
          rm .github/workflows/preserve-paper-approval-contract.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Preserve paper approval presentation contract'
          git push origin HEAD:agent/expose-daily-cio-briefing
