name: Apply universal-market implementation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/universal-paper-markets'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/universal-paper-markets
      - name: Apply and verify universal-market implementation
        shell: bash
        run: |
          exec > >(tee /tmp/universal-market-diagnostic.log) 2>&1
          set -euxo pipefail
          git config user.name "OpenAI Agent"
          git config user.email "agent@openai.com"
          git fetch origin main
          git merge --no-edit origin/main
          cat .universal-market-patch/chunk-*.b64 \
            | base64 -d \
            | gzip -d > /tmp/universal-market.patch
          set +e
          git apply --3way /tmp/universal-market.patch
          apply_status=$?
          set -e
          mapfile -t unresolved < <(git diff --name-only --diff-filter=U)
          if [[ $apply_status -ne 0 ]]; then
            if [[ ${#unresolved[@]} -ne 1 || "${unresolved[0]}" != "governance/__init__.py" ]]; then
              printf 'unexpected patch conflicts: %s\n' "${unresolved[*]:-none}"
              exit "$apply_status"
            fi
          fi
          cat .universal-market-patch/governance-init.py.gz.b64 \
            | base64 -d \
            | gzip -d > governance/__init__.py
          git add governance/__init__.py
          cat .universal-market-patch/test-universal-market-scope.py.gz.b64 \
            | base64 -d \
            | gzip -d > tests/test_universal_market_scope.py
          git add tests/test_universal_market_scope.py
          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "unresolved merge conflicts remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          cat .universal-market-patch/expected-blobs.json.gz.b64 \
            | base64 -d \
            | gzip -d > /tmp/expected-blobs.json
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          expected = json.loads(Path('/tmp/expected-blobs.json').read_text(encoding='utf-8'))
          failures = []
          for path, expected_sha in sorted(expected.items()):
              target = Path(path)
              if not target.is_file():
                  failures.append(f'{path}: missing')
                  continue
              actual_sha = subprocess.check_output(
                  ['git', 'hash-object', path],
                  text=True,
              ).strip()
              if actual_sha != expected_sha:
                  failures.append(f'{path}: {actual_sha} != {expected_sha}')
          if failures:
              raise SystemExit('\n'.join(failures))
          print(f'verified {len(expected)} universal-market file blobs')
          PY
          rm -rf .universal-market-patch
          rm -f .universal-market-export-trigger
          rm -f .github/workflows/export-universal-market-source.yml
          git add -A
          git diff --cached --check
          git commit -m "Enable universal governed paper markets"
          git push origin HEAD:agent/universal-paper-markets
      - name: Upload applicator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-market-applicator-diagnostics
          path: /tmp/universal-market-diagnostic.log
          retention-days: 1
          if-no-files-found: warn
