name: Materialize Committee CIO V2 Phase 2 PR

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: materialize-committee-cio-v2-phase2-pr
  cancel-in-progress: false

jobs:
  materialize:
    if: github.head_ref == 'feature/committee-cio-v2-phase2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out phase branch
        uses: actions/checkout@v4
        with:
          ref: feature/committee-cio-v2-phase2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize Phase 2 source
        run: python scripts/materialize_committee_cio_v2_phase2.py

      - name: Align canonical-cycle fixtures with applicable evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_canonical_cio_cycle.py")
          text = path.read_text(encoding="utf-8")
          old_import = '''from committee.specialists import (
              MacroSpecialistContext,
              MarketSpecialistContext,
          )
          '''
          new_import = '''from committee.specialists import (
              AssetValuationSpecialistContext,
              MacroSpecialistContext,
              MarketSpecialistContext,
          )
          '''
          if text.count(old_import) != 1:
              raise SystemExit("canonical-cycle specialist import changed")
          text = text.replace(old_import, new_import, 1)
          old_context = '''        company=None,
              )
          '''
          new_context = '''        company=None,
                  asset_valuation=(
                      None
                      if candidate.instrument.asset_class in {
                          CandidateAssetClass.US_EQUITY,
                          CandidateAssetClass.INTERNATIONAL_EQUITY,
                      }
                      else AssetValuationSpecialistContext(
                          as_of=AS_OF,
                          asset_class=candidate.instrument.asset_class,
                          expected_return_impact=0.02,
                          confidence=0.85,
                          valuation_evidence=(
                              "Independent point-in-time valuation and return-driver evidence is complete",
                          ),
                          contradictory_evidence=(
                              "Valuation relationships may change before implementation",
                          ),
                          critical_assumptions=(
                              "The asset-specific return drivers remain representative",
                          ),
                          risks=("The valuation estimate remains uncertain",),
                          limitations=("The valuation is point-in-time",),
                          change_conditions=(
                              "Reassess after material valuation or return-driver changes",
                          ),
                          evidence_identifiers=(
                              f"valuation:{candidate.instrument.symbol.lower()}:cycle",
                          ),
                      )
                  ),
              )
          '''
          if text.count(old_context) != 1:
              raise SystemExit("canonical-cycle context fixture changed")
          path.write_text(
              text.replace(old_context, new_context, 1),
              encoding="utf-8",
          )
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run focused Phase 2 validation
        run: |
          python -m py_compile \
            committee/evidence_applicability.py \
            committee/specialists.py \
            committee/__init__.py
          python -m pytest -q \
            tests/test_applicable_evidence_matrix.py \
            tests/test_cross_asset_forecast_specialist.py \
            tests/test_canonical_cio_cycle.py \
            tests/test_cio_cycle_integrity_corrections.py

      - name: Publish reviewed source and remove temporary materializer
        run: |
          rm scripts/materialize_committee_cio_v2_phase2.py
          rm .github/workflows/materialize-committee-cio-v2-phase2-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Require applicable valuation and return-driver evidence"
          git push origin HEAD:feature/committee-cio-v2-phase2
