name: Materialize Committee CIO V2 Phase 2 PR

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: materialize-committee-cio-v2-phase2-pr
  cancel-in-progress: false

jobs:
  materialize:
    if: github.head_ref == 'feature/committee-cio-v2-phase2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out phase branch
        uses: actions/checkout@v4
        with:
          ref: feature/committee-cio-v2-phase2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize Phase 2 source
        run: python scripts/materialize_committee_cio_v2_phase2.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run focused Phase 2 validation
        run: |
          python -m py_compile \
            committee/evidence_applicability.py \
            committee/specialists.py \
            committee/__init__.py
          python -m pytest -q \
            tests/test_applicable_evidence_matrix.py \
            tests/test_cross_asset_forecast_specialist.py \
            tests/test_canonical_cio_cycle.py \
            tests/test_cio_cycle_integrity_corrections.py

      - name: Publish reviewed source and remove temporary materializer
        run: |
          rm scripts/materialize_committee_cio_v2_phase2.py
          rm .github/workflows/materialize-committee-cio-v2-phase2-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Require applicable valuation and return-driver evidence"
          git push origin HEAD:feature/committee-cio-v2-phase2
