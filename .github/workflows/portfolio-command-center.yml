name: Validate Portfolio Command Center

on:
  pull_request:
    paths:
      - "all_market_certification_ui.py"
      - "operations/all_market_certification_envelope.py"
      - "operations/asset_class_evaluation_status.py"
      - "portfolio_only_runtime.py"
      - "portfolio_evidence_accumulation_ui.py"
      - "ui_reporting_time.py"
      - "ui_runtime_composition.py"
      - "tests/test_all_market_certification_envelope.py"
      - "tests/test_all_market_certification_ui.py"
      - "tests/test_asset_class_evaluation_status_scope.py"
      - "tests/test_crypto_style_portfolio_command_center.py"
      - "tests/test_portfolio_evidence_accumulation_ui.py"
      - "tests/test_ui_reporting_time.py"
      - "tests/browser/test_portfolio_command_center_browser.py"
      - ".github/workflows/portfolio-command-center.yml"
  push:
    branches: [main]
    paths:
      - "all_market_certification_ui.py"
      - "operations/all_market_certification_envelope.py"
      - "operations/asset_class_evaluation_status.py"
      - "portfolio_only_runtime.py"
      - "portfolio_evidence_accumulation_ui.py"
      - "ui_reporting_time.py"
      - "ui_runtime_composition.py"
      - "tests/test_all_market_certification_envelope.py"
      - "tests/test_all_market_certification_ui.py"
      - "tests/test_asset_class_evaluation_status_scope.py"
      - "tests/test_crypto_style_portfolio_command_center.py"
      - "tests/test_portfolio_evidence_accumulation_ui.py"
      - "tests/test_ui_reporting_time.py"
      - "tests/browser/test_portfolio_command_center_browser.py"
      - ".github/workflows/portfolio-command-center.yml"

permissions:
  contents: read

jobs:
  portfolio-command-center:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked runtime dependencies
        run: pip install --require-hashes -r requirements.lock

      - name: Install development dependencies
        run: pip install -r requirements-dev.txt

      - name: Install browser-test dependencies
        run: pip install -r requirements-browser.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Compile command center modules
        run: >-
          python -m py_compile
          all_market_certification_ui.py
          operations/all_market_certification_envelope.py
          operations/asset_class_evaluation_status.py
          portfolio_only_runtime.py
          portfolio_evidence_accumulation_ui.py
          ui_reporting_time.py
          tests/test_all_market_certification_envelope.py
          tests/test_all_market_certification_ui.py
          tests/test_asset_class_evaluation_status_scope.py
          tests/test_portfolio_evidence_accumulation_ui.py
          tests/test_ui_reporting_time.py
          tests/browser/test_portfolio_command_center_browser.py

      - name: Locate preinstalled Chrome
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "CAPITAL_INTELLIGENCE_SYSTEM_CHROME=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Run command center regressions
        run: >-
          pytest -q
          tests/test_all_market_certification_envelope.py
          tests/test_all_market_certification_ui.py
          tests/test_asset_class_evaluation_status_scope.py
          tests/test_crypto_style_portfolio_command_center.py
          tests/test_portfolio_evidence_accumulation_ui.py
          tests/test_ui_reporting_time.py
          tests/test_capability_scoped_runtime_v2.py

      - name: Run desktop and iPhone production command center browser gate
        env:
          CAPITAL_INTELLIGENCE_BROWSER_TESTS: "1"
        run: pytest -q tests/browser/test_portfolio_command_center_browser.py

      - name: Publish command center screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portfolio-command-center-browser
          path: reports/browser/portfolio-command-center-*.png
          if-no-files-found: ignore
          retention-days: 14