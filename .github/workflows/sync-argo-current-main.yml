name: Synchronize ARGO with current main

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: synchronize-argo-current-main
  cancel-in-progress: false

jobs:
  synchronize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/adaptive-robust-growth-ensemble'
    runs-on: ubuntu-latest
    steps:
      - name: Check out ARGO branch
        uses: actions/checkout@v4
        with:
          ref: agent/adaptive-robust-growth-ensemble
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge current main without publishing yet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-ff --no-commit origin/main
          rm -f .github/workflows/sync-argo-current-main.yml
          git add -A
          python -m compileall -q .

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-dev.txt

      - name: Run complete repository test suite
        run: python -m pytest -q --maxfail=10

      - name: Commit synchronized merge
        shell: bash
        run: |
          set -euo pipefail
          git commit -m 'Merge current main into adaptive growth ensemble'
          git push origin HEAD:agent/adaptive-robust-growth-ensemble
