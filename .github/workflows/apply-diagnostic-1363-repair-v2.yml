name: Apply diagnostic 1363 repair with dependencies

on:
  push:
    branches:
      - repair/diagnostic-1363-publication-readback

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/diagnostic-1363-publication-readback
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Reuse reviewed one-shot repair payload
        shell: bash
        run: |
          sed -n "/python - <<'PY'/,/^          PY$/p" .github/workflows/apply-diagnostic-1363-repair.yml \
            | sed '1d;$d;s/^          //' > /tmp/apply_diagnostic_1363_repair.py
          python /tmp/apply_diagnostic_1363_repair.py
      - name: Compile repaired modules
        run: |
          python -m py_compile \
            operations/bounded_provider_preselection_publication.py \
            operations/transactional_comprehensive_discovery_lane.py \
            operations/transactional_lane_comprehensive_discovery_coordinator.py \
            tests/test_diagnostic_1363_publication_durability.py
      - name: Run focused regressions
        run: |
          python -m pytest -q \
            tests/test_diagnostic_1363_publication_durability.py \
            tests/test_transactional_comprehensive_discovery_lanes.py \
            tests/test_transactional_lane_comprehensive_discovery_coordinator.py
      - name: Commit validated repair
        shell: bash
        run: |
          rm .github/workflows/apply-diagnostic-1363-repair.yml
          rm .github/workflows/apply-diagnostic-1363-repair-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fail closed on incomplete provider publication durability"
          git push origin HEAD:repair/diagnostic-1363-publication-readback
