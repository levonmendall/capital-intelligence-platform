name: Temporary diagnose prequalification retry loop

on:
  push:
    branches: [codex/diagnose-prequalification-retry-loop]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Locate retry and freshness ownership
        shell: bash
        run: |
          set -o pipefail
          grep -R -n -E 'complete_all_market_coverage_required|maximum_attempts|retrying comprehensive all-market evidence qualification|evidence qualification attempt|stage_isolated_evidence' --include='*.py' . > /tmp/retry-matches.txt || true
          grep -R -n -E 'EVIDENCE_PLANE_MAX_AGE|component_max_age_seconds|valid_through|_MAX_PREPARATION_PASSES' --include='*.py' operations run_*.py >> /tmp/retry-matches.txt || true
      - name: Capture current public diagnostic
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 30 https://capital-intelligence-platform.onrender.com/app/static/cio-diagnostic.json -o /tmp/live-diagnostic.json || printf '{"capture_failed":true}\n' > /tmp/live-diagnostic.json
      - uses: actions/upload-artifact@v4
        with:
          name: prequalification-loop-diagnostic
          path: |
            /tmp/retry-matches.txt
            /tmp/live-diagnostic.json
          retention-days: 1
