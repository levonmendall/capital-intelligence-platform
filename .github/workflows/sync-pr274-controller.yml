name: Synchronize PR274 Recovery Branch

on:
  push:
    branches:
      - main
    paths:
      - .pr274-sync-trigger-v2

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/recover-pr264-materialization
          fetch-depth: 0
      - run: bash tools/sync_pr274_with_main.sh
