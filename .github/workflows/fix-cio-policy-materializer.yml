name: Fix CIO policy materializer syntax

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cio-decision-policy-consistency
          fetch-depth: 0
      - name: Correct materializer source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/materialize-cio-decision-policy-consistency.yml')
          text = path.read_text()
          old = "          '''))\n          tests_path.write_text(tests)"
          new = "          ''')\n          tests_path.write_text(tests)"
          if text.count(old) != 1:
              raise SystemExit('materializer syntax anchor not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/fix-cio-policy-materializer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/materialize-cio-decision-policy-consistency.yml .github/workflows/fix-cio-policy-materializer.yml
          git commit -m "Correct CIO policy materializer syntax"
          git push origin HEAD:agent/cio-decision-policy-consistency
