name: Fix Forward Decision thesis monitor compatibility

on:
  push:
    branches:
      - agent/forward-decision-intelligence-v2
    paths:
      - .github/workflows/fix-forward-decision-thesis-monitor.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/forward-decision-intelligence-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply compatibility fix and regression
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('intelligence/predictive_market.py')
          text = path.read_text()
          old = '''    thesis_monitor = ThesisMonitor(
        thesis="Governed candidate thesis: " + "; ".join(catalysts[:2]),
        must_remain_true=tuple(getattr(candidate, "critical_assumptions", ()) or ()),
        invalidation_conditions=tuple(getattr(candidate, "invalidation_conditions", ()) or ()),
        monitor_evidence=tuple(getattr(candidate, "monitoring_indicators", ()) or ()),
    )
'''
          new = '''    invalidation_conditions = tuple(
        getattr(candidate, "invalidation_conditions", ()) or ()
    )
    thesis_monitor = (
        None
        if not invalidation_conditions
        else ThesisMonitor(
            thesis="Governed candidate thesis: " + "; ".join(catalysts[:2]),
            must_remain_true=tuple(
                getattr(candidate, "critical_assumptions", ()) or ()
            ),
            invalidation_conditions=invalidation_conditions,
            monitor_evidence=tuple(
                getattr(candidate, "monitoring_indicators", ()) or ()
            ),
        )
    )
'''
          if text.count(old) != 1:
              raise SystemExit('thesis monitor patch target mismatch')
          path.write_text(text.replace(old, new, 1))

          test_path = Path('tests/test_predictive_forward_decision_context.py')
          test = test_path.read_text()
          test = test.replace(
              'from types import SimpleNamespace\n',
              'from dataclasses import replace\nfrom types import SimpleNamespace\n',
              1,
          )
          test += '''\n\ndef test_candidate_without_explicit_invalidation_is_not_dropped_by_advisory_v2():\n    candidate = replace(_candidate(), invalidation_conditions=())\n    result = build_predictive_market_intelligence(candidate=candidate, features=SimpleNamespace(momentum=0.15, six_month_return=0.12, twelve_month_return=0.18, annualized_volatility=0.24, rolling_annual_median=0.10), flow_observation=_flow_observation(candidate), market=_market(), existing_forward_intelligence=None)\n    assert result.forward_intelligence.decision_context is not None\n    assert result.forward_intelligence.decision_context.thesis_monitor is None\n'''
          test_path.write_text(test)
          PY
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run regression tests
        run: |
          python -m pytest -q tests/test_predictive_forward_decision_context.py tests/test_optional_comprehensive_discovery_isolation.py tests/test_forward_decision_intelligence_v2.py
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-forward-decision-thesis-monitor.yml
          git add intelligence/predictive_market.py tests/test_predictive_forward_decision_context.py
          git diff --cached --check
          git commit -m "Keep advisory thesis monitoring optional"
          git push origin HEAD:agent/forward-decision-intelligence-v2
