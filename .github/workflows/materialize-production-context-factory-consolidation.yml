name: Materialize Production Context Factory Consolidation

on:
  push:
    branches:
      - refactor/consolidate-production-context-factory
    paths:
      - scripts/materialize_production_context_factory_consolidation.py
      - .github/workflows/materialize-production-context-factory-consolidation.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/materialize_production_context_factory_consolidation.py
      - .github/workflows/materialize-production-context-factory-consolidation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-production-context-factory-consolidation
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      CAPITAL_INTELLIGENCE_DAILY_STAGE_BINDINGS: ${{ github.workspace }}/deploy/canonical-daily-stage-bindings.validation.json
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: refactor/consolidate-production-context-factory
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply reviewed consolidation
        run: python scripts/materialize_production_context_factory_consolidation.py

      - name: Install locked runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt

      - name: Validate production-context assembly and scheduling
        run: |
          python -m compileall -q application tests/test_production_context_factory.py
          git diff --check
          pytest -q \
            tests/test_production_context_factory.py \
            tests/test_production_context_assembly.py \
            tests/test_production_context_publication_timing.py \
            tests/test_production_context_publication_runtime.py \
            tests/test_production_canonical_scheduler.py

      - name: Publish final consolidated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/materialize_production_context_factory_consolidation.py
          git rm -f .github/workflows/materialize-production-context-factory-consolidation.yml
          git add -A
          git commit -m "Consolidate production-context provider factory wiring"
          git push origin HEAD:refactor/consolidate-production-context-factory
