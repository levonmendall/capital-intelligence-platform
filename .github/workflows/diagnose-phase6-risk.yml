name: Diagnose Phase 6 Risk Intelligence

on:
  push:
    branches:
      - feature/committee-cio-v2-phase6-risk-intelligence
    paths:
      - .github/workflows/diagnose-phase6-risk.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: feature/committee-cio-v2-phase6-risk-intelligence
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt
      - name: Capture focused failures
        run: |
          set +e
          pytest -q -vv --tb=long \
            tests/test_risk_intelligence.py \
            tests/test_risk_intelligence_cycle.py \
            tests/test_canonical_cio_cycle.py \
            > docs/PHASE6_FAILURE_DIAGNOSTIC.txt 2>&1
          echo "exit_code=$?" >> docs/PHASE6_FAILURE_DIAGNOSTIC.txt
          exit 0
      - name: Publish diagnostic and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PHASE6_FAILURE_DIAGNOSTIC.txt
          git rm .github/workflows/diagnose-phase6-risk.yml
          git commit -m "Capture Phase 6 focused failure diagnostics"
          git push origin HEAD:feature/committee-cio-v2-phase6-risk-intelligence
