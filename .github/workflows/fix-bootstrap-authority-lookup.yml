name: Fix bootstrap authority lookup

on:
  push:
    branches:
      - feature/universal-investable-ownership

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/universal-investable-ownership
          fetch-depth: 0
      - name: Repair stale authority field and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("governance/market_participation.py")
          text = path.read_text(encoding="utf-8")
          stale = "self._allocatable_entry_by_instrument"
          canonical = "self._bootstrap_entry_by_instrument"
          if stale not in text:
              raise SystemExit("stale bootstrap authority lookup was not found")
          text = text.replace(stale, canonical)
          if stale in text:
              raise SystemExit("stale bootstrap authority lookup remains")
          if canonical not in text:
              raise SystemExit("canonical bootstrap authority lookup was not written")
          path.write_text(text, encoding="utf-8")
          PY
          git rm .github/workflows/fix-bootstrap-authority-lookup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add governance/market_participation.py
          git commit -m "Fix capability authority bootstrap lookup"
          git push origin HEAD:feature/universal-investable-ownership
