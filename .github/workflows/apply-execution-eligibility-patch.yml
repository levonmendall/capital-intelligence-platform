name: Apply execution eligibility patch

on:
  push:
    branches:
      - agent/enforce-execution-eligibility

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated patch
        shell: bash
        run: |
          set -euo pipefail
          cat .ci-patch/part-* > /tmp/execution-eligibility.patch
          git apply --3way --whitespace=error-all /tmp/execution-eligibility.patch
          rm -rf .ci-patch
          rm -f .github/workflows/apply-execution-eligibility-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enforce certified paper execution eligibility"
          git push origin HEAD:${GITHUB_REF_NAME}
