name: Apply execution eligibility patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/enforce-execution-eligibility'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - name: Apply and verify validated patch
        shell: bash
        run: |
          set -euo pipefail
          cat .ci-patch/part-* > /tmp/execution-eligibility.patch

          set +e
          git apply --3way --whitespace=nowarn /tmp/execution-eligibility.patch
          apply_status=$?
          set -e

          conflicted="$(git diff --name-only --diff-filter=U)"
          if [[ -n "$conflicted" ]]; then
            while IFS= read -r path; do
              git checkout --theirs -- "$path"
              git add -- "$path"
            done <<< "$conflicted"
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved patch conflicts remain" >&2
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          patch = Path('/tmp/execution-eligibility.patch').read_text(encoding='utf-8')
          current = None
          expected = {}
          for line in patch.splitlines():
              if line.startswith('diff --git a/'):
                  current = line.split(' b/', 1)[1]
              elif current is not None and line.startswith('index '):
                  match = re.match(r'index [0-9a-f]+\.\.([0-9a-f]+)', line)
                  if match:
                      expected[current] = match.group(1)
                      current = None
          failures = []
          for path, expected_sha in expected.items():
              actual = subprocess.check_output(
                  ['git', 'hash-object', path], text=True
              ).strip()
              if actual != expected_sha:
                  failures.append(f'{path}: expected {expected_sha}, got {actual}')
          if failures:
              raise SystemExit('Patch target verification failed:\n' + '\n'.join(failures))
          print(f'Verified {len(expected)} patched file blobs')
          PY

          if [[ $apply_status -ne 0 && -z "$conflicted" ]]; then
            echo "Patch failed without resolvable conflicts" >&2
            exit 1
          fi

          rm -rf .ci-patch
          rm -f .github/workflows/apply-execution-eligibility-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enforce certified paper execution eligibility"
          git push origin HEAD:${{ github.head_ref }}
