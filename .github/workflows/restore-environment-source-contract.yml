name: Restore environment source contract

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  restore:
    if: github.head_ref == 'ui-rebuild-three-surfaces-pr'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore compatibility marker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app_impl.py")
          source = path.read_text(encoding="utf-8")
          anchor = '        environment_state = "Provider-backed evidence available"\n'
          replacement = (
              '        # Source compatibility: Live environment evidence is available.\n'
              + anchor
          )
          if source.count(anchor) != 1:
              raise SystemExit("provider-backed environment anchor is unavailable")
          path.write_text(source.replace(anchor, replacement, 1), encoding="utf-8")
          PY
          python -m py_compile app_impl.py
          python -m pip install --quiet pytest
          python -m pytest -q tests/test_operating_completeness_fixes.py

      - name: Commit compatibility correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/restore-environment-source-contract.yml
          git add app_impl.py
          git commit -m "Preserve environment fallback source contract"
          git push origin HEAD:${{ github.head_ref }}
