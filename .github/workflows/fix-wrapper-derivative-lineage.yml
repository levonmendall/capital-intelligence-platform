name: Fix wrapper derivative lineage

on:
  push:
    branches:
      - feature/universal-investable-ownership

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/universal-investable-ownership
          fetch-depth: 0
      - name: Preserve wrapper derivative exposure and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("production_paper_evidence.py")
          text = path.read_text(encoding="utf-8")
          old = "            uses_derivatives=instrument.uses_derivatives,\n"
          new = '''            uses_derivatives=(
                instrument.uses_derivatives
                or instrument.economic_exposure
                in {"managed_futures", "option_strategies", "volatility"}
            ),
'''
          if old not in text:
              raise SystemExit("candidate derivative lineage assignment was not found")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          git rm .github/workflows/fix-wrapper-derivative-lineage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production_paper_evidence.py
          git commit -m "Preserve derivative risk lineage for listed wrappers"
          git push origin HEAD:feature/universal-investable-ownership
