name: Comment Triggered Weekend CIO Run

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  cio-run:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/run-cio-weekend'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
      CAPITAL_INTELLIGENCE_ENVIRONMENT: development
      CAPITAL_INTELLIGENCE_DATA_DIR: ${{ runner.temp }}/capital-intelligence-cio-run
      CAPITAL_INTELLIGENCE_SCHEDULER_TIMEZONE: America/Los_Angeles
      CAPITAL_INTELLIGENCE_SCHEDULER_HOUR: "7"
      CAPITAL_INTELLIGENCE_SCHEDULER_TIMES: 07:00,10:00,12:45
      CAPITAL_INTELLIGENCE_PAPER_EXECUTION_MODE: automatic
      CAPITAL_INTELLIGENCE_RUN_PROVIDER_VALIDATION_ON_STARTUP: "false"
      CAPITAL_INTELLIGENCE_PROVIDER_VALIDATION_REQUIRED: "false"
      CAPITAL_INTELLIGENCE_PUBLIC_LIVE_COLLECTION_ENABLED: "true"
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      APCA_API_BASE_URL: https://paper-api.alpaca.markets
      APCA_DATA_BASE_URL: https://data.alpaca.markets
      APCA_DATA_FEED: iex
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      CAPITAL_INTELLIGENCE_EODHD_API_TOKEN: ${{ secrets.CAPITAL_INTELLIGENCE_EODHD_API_TOKEN }}
      CAPITAL_INTELLIGENCE_DATABENTO_API_KEY: ${{ secrets.CAPITAL_INTELLIGENCE_DATABENTO_API_KEY }}
      SEC_USER_AGENT: Capital Intelligence Platform levonmendall2369@gmail.com

    steps:
      - name: Check out latest main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked runtime dependencies
        run: pip install --require-hashes -r requirements.lock

      - name: Initialize isolated canonical state
        id: initialize
        continue-on-error: true
        run: python initialize.py

      - name: Run one CIO operator pass
        id: operator
        if: steps.initialize.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          python run_autonomous_paper_operator.py --once --force-public-collection \
            | tee reports/weekend-cio-run.jsonl

      - name: Build credential-safe summary
        if: always()
        env:
          INITIALIZE_OUTCOME: ${{ steps.initialize.outcome }}
          OPERATOR_OUTCOME: ${{ steps.operator.outcome }}
        run: |
          mkdir -p reports
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          log_path = Path('reports/weekend-cio-run.jsonl')
          payload = None
          if log_path.exists():
              for line in log_path.read_text(encoding='utf-8').splitlines():
                  line = line.strip()
                  if not line.startswith('{'):
                      continue
                  try:
                      candidate = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if isinstance(candidate, dict) and 'cycle' in candidate:
                      payload = candidate

          summary = {
              'initialize_outcome': os.getenv('INITIALIZE_OUTCOME'),
              'operator_step_outcome': os.getenv('OPERATOR_OUTCOME'),
          }
          if payload is not None:
              context = payload.get('production_context_publication') or {}
              cycle = payload.get('cycle') or {}
              summary.update({
                  'operator_status': payload.get('status'),
                  'context_state': context.get('state'),
                  'context_detail': context.get('detail'),
                  'cycle_status': cycle.get('status'),
                  'cycle_detail': cycle.get('detail'),
                  'cycle_key': cycle.get('cycle_key'),
                  'paper_execution': (payload.get('paper_execution') or {}).get('state'),
                  'paper_only': payload.get('paper_only'),
                  'real_money_authorized': payload.get('real_money_authorized'),
              })

          state_path = Path(os.environ['CAPITAL_INTELLIGENCE_DATA_DIR']) / 'production-context-publication-state.json'
          if state_path.exists():
              state = json.loads(state_path.read_text(encoding='utf-8'))
              summary['comprehensive_discovery_lane_counts'] = state.get(
                  'comprehensive_discovery_lane_counts'
              )
              summary['candidate_count'] = state.get('candidate_count')
              summary['exclusion_count'] = state.get('exclusion_count')

          passed = (
              summary.get('context_state') in {'ready', 'reused'}
              and summary.get('cycle_status') == 'completed'
              and summary.get('paper_only') is True
              and summary.get('real_money_authorized') is False
          )
          summary['validation_passed'] = passed
          Path('reports/weekend-cio-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )

          lanes = summary.get('comprehensive_discovery_lane_counts') or {}
          lane_lines = []
          for name, detail in sorted(lanes.items()):
              if isinstance(detail, dict):
                  lane_lines.append(
                      f"- `{name}`: scheduled={detail.get('scheduled')}, "
                      f"selected={detail.get('selected')}, "
                      f"reason={detail.get('schedule_reason')}"
                  )
          if not lane_lines:
              lane_lines.append('- No lane state was persisted.')

          status = 'PASS' if passed else 'FAIL'
          markdown = f'''## Weekend CIO validation: {status}

- Initialization: `{summary.get('initialize_outcome')}`
- Operator: `{summary.get('operator_status')}`
- Production context: `{summary.get('context_state')}`
- CIO cycle: `{summary.get('cycle_status')}`
- Cycle key: `{summary.get('cycle_key')}`
- Paper execution: `{summary.get('paper_execution')}`
- Paper only: `{summary.get('paper_only')}`
- Real money authorized: `{summary.get('real_money_authorized')}`

**Context detail:** {summary.get('context_detail')}

**Cycle detail:** {summary.get('cycle_detail')}

### Discovery lanes
{chr(10).join(lane_lines)}
'''
          Path('reports/weekend-cio-summary.md').write_text(markdown, encoding='utf-8')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Post CIO result to pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.issue.number }}" --body-file reports/weekend-cio-summary.md

      - name: Upload CIO run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: weekend-cio-run
          path: reports/
          if-no-files-found: warn
          retention-days: 14
