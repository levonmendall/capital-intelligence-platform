name: Apply validated canonical cycle fixes

on:
  pull_request:
    paths:
      - .github/workflows/export-canonical-cycle-source.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical cycle branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/canonical-cio-cycle-daily-briefing
          persist-credentials: true

      - name: Apply locally validated patch
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 --decode > /tmp/canonical-cycle-fixes.patch
          git apply --check /tmp/canonical-cycle-fixes.patch
          git apply /tmp/canonical-cycle-fixes.patch
          rm -f .github/workflows/export-canonical-cycle-source.yml

      - name: Validate exact updated branch
        run: |
          python -m compileall -q .
          pytest -q

      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add application/cio_cycle.py committee/specialists.py portfolio/construction_engine.py tests/test_canonical_cio_cycle.py .github/workflows/export-canonical-cycle-source.yml
          git commit -m "Complete canonical CIO cycle validation"
          git push origin HEAD:agent/canonical-cio-cycle-daily-briefing