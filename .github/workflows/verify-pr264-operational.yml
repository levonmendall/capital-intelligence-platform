name: Verify PR264 Operational Completion

on:
  pull_request:
    paths:
      - .github/workflows/verify-pr264-operational.yml
      - api/app.py
      - api/routes/__init__.py
      - api/routes/provider_validation.py
      - initialize.py
      - operations/comprehensive_market_discovery.py
      - operations/provider_validation.py
      - providers/databento.py
      - providers/eodhd.py
      - render.yaml
      - run_provider_validation.py
      - tests/test_comprehensive_market_discovery.py
      - tests/test_provider_validation.py
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-pr264-operational.yml
      - api/app.py
      - api/routes/__init__.py
      - api/routes/provider_validation.py
      - initialize.py
      - operations/comprehensive_market_discovery.py
      - operations/provider_validation.py
      - providers/databento.py
      - providers/eodhd.py
      - render.yaml
      - run_provider_validation.py
      - tests/test_comprehensive_market_discovery.py
      - tests/test_provider_validation.py
  workflow_dispatch:
  schedule:
    - cron: "17 14 * * 1-5"

permissions:
  contents: read

concurrency:
  group: pr264-operational-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-and-contract-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create isolated Python environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt "pytest>=8,<9"
      - name: Compile PR264 operational source
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m py_compile \
            operations/comprehensive_market_discovery.py \
            operations/provider_validation.py \
            api/routes/provider_validation.py \
            initialize.py \
            run_provider_validation.py \
            tests/test_comprehensive_market_discovery.py \
            tests/test_provider_validation.py
      - name: Run PR264 deterministic regressions
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest -q \
            tests/test_comprehensive_market_discovery.py \
            tests/test_provider_validation.py

  live-provider-validation:
    if: github.event_name != 'pull_request'
    needs: source-and-contract-validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CAPITAL_INTELLIGENCE_EODHD_API_TOKEN: ${{ secrets.CAPITAL_INTELLIGENCE_EODHD_API_TOKEN }}
      CAPITAL_INTELLIGENCE_DATABENTO_API_KEY: ${{ secrets.CAPITAL_INTELLIGENCE_DATABENTO_API_KEY }}
      CAPITAL_INTELLIGENCE_RELEASE: ${{ github.sha }}
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require EODHD validation credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CAPITAL_INTELLIGENCE_EODHD_API_TOKEN:-}" ]]; then
            echo "CAPITAL_INTELLIGENCE_EODHD_API_TOKEN is required for release validation." >&2
            exit 1
          fi
      - name: Install provider validation runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
      - name: Validate live providers for this release
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python run_provider_validation.py \
            --report provider-validation-report.json \
            | tee provider-validation-output.json
      - name: Publish credential-safe validation summary
        if: always()
        shell: bash
        run: |
          {
            echo "## PR264 live-provider validation"
            echo
            echo "Release: \`${GITHUB_SHA}\`"
            echo
            if [[ -f provider-validation-report.json ]]; then
              echo '```json'
              cat provider-validation-report.json
              echo '```'
            else
              echo "No report was produced. Review the failed validation step."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
