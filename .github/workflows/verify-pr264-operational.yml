name: Verify PR264 Operational Completion

on:
  pull_request:
    paths:
      - .github/workflows/verify-pr264-operational.yml
      - api/app.py
      - api/routes/__init__.py
      - api/routes/provider_validation.py
      - config/comprehensive_market_discovery.json
      - config/crypto_venue_bindings.all_markets.json
      - initialize.py
      - operations/certified_investable_catalog.py
      - operations/comprehensive_market_discovery.py
      - operations/comprehensive_market_discovery_legacy.py
      - operations/provider_preselection_publication_runtime.py
      - run_manual_cio_diagnostic.py
      - tests/test_deep_market_evidence_concurrency.py
      - tests/test_manual_cio_diagnostic_restart_recovery.py
      - operations/provider_validation.py
      - providers/crypto_venues.py
      - providers/databento.py
      - providers/databento_options.py
      - providers/massive_options.py
      - providers/redundant_options.py
      - providers/eodhd.py
      - render.yaml
      - run_provider_validation.py
      - tests/test_certified_crypto_discovery_catalog.py
      - tests/test_comprehensive_market_discovery.py
      - tests/test_comprehensive_market_discovery_default_config.py
      - tests/test_databento_options.py
      - tests/test_provider_validation.py
      - tests/test_redundant_options_provider.py
      - tests/test_run_provider_validation_policy.py
      - tests/test_run_provider_validation_redundancy.py
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-pr264-operational.yml
      - api/app.py
      - api/routes/__init__.py
      - api/routes/provider_validation.py
      - config/comprehensive_market_discovery.json
      - config/crypto_venue_bindings.all_markets.json
      - initialize.py
      - operations/certified_investable_catalog.py
      - operations/comprehensive_market_discovery.py
      - operations/comprehensive_market_discovery_legacy.py
      - operations/provider_preselection_publication_runtime.py
      - run_manual_cio_diagnostic.py
      - tests/test_deep_market_evidence_concurrency.py
      - tests/test_manual_cio_diagnostic_restart_recovery.py
      - operations/provider_validation.py
      - providers/crypto_venues.py
      - providers/databento.py
      - providers/databento_options.py
      - providers/massive_options.py
      - providers/redundant_options.py
      - providers/eodhd.py
      - render.yaml
      - run_provider_validation.py
      - tests/test_certified_crypto_discovery_catalog.py
      - tests/test_comprehensive_market_discovery.py
      - tests/test_comprehensive_market_discovery_default_config.py
      - tests/test_databento_options.py
      - tests/test_provider_validation.py
      - tests/test_redundant_options_provider.py
      - tests/test_run_provider_validation_policy.py
      - tests/test_run_provider_validation_redundancy.py
  workflow_dispatch:
  schedule:
    - cron: "17 14 * * 1-5"

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr264-operational-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-and-contract-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create isolated Python environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt "pytest>=8,<9"
      - name: Compile PR264 operational source
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m py_compile \
            providers/crypto_venues.py \
            providers/databento_options.py \
            providers/massive_options.py \
            providers/redundant_options.py \
            operations/certified_investable_catalog.py \
            operations/comprehensive_market_discovery.py \
            operations/comprehensive_market_discovery_legacy.py \
            operations/provider_preselection_publication_runtime.py \
            operations/provider_validation.py \
            api/routes/provider_validation.py \
            initialize.py \
            run_manual_cio_diagnostic.py \
            run_provider_validation.py \
            tests/test_certified_crypto_discovery_catalog.py \
            tests/test_comprehensive_market_discovery.py \
            tests/test_comprehensive_market_discovery_default_config.py \
            tests/test_deep_market_evidence_concurrency.py \
            tests/test_databento_options.py \
            tests/test_manual_cio_diagnostic_restart_recovery.py \
            tests/test_provider_preselection_publication_runtime.py \
            tests/test_provider_validation.py \
            tests/test_redundant_options_provider.py \
            tests/test_run_provider_validation_policy.py \
            tests/test_run_provider_validation_redundancy.py
      - name: Run PR264 deterministic regressions
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest -q \
            tests/test_certified_crypto_discovery_catalog.py \
            tests/test_comprehensive_market_discovery.py \
            tests/test_comprehensive_market_discovery_default_config.py \
            tests/test_deep_market_evidence_concurrency.py \
            tests/test_databento_options.py \
            tests/test_manual_cio_diagnostic_restart_recovery.py \
            tests/test_provider_preselection_publication_runtime.py \
            tests/test_provider_validation.py \
            tests/test_redundant_options_provider.py \
            tests/test_run_provider_validation_policy.py \
            tests/test_run_provider_validation_redundancy.py

  live-provider-validation:
    if: github.event_name != 'pull_request'
    needs: source-and-contract-validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAPITAL_INTELLIGENCE_EODHD_API_TOKEN: ${{ secrets.CAPITAL_INTELLIGENCE_EODHD_API_TOKEN || secrets.EODHD_API_TOKEN || secrets.EODHD_API_KEY }}
      CAPITAL_INTELLIGENCE_DATABENTO_API_KEY: ${{ secrets.CAPITAL_INTELLIGENCE_DATABENTO_API_KEY || secrets.DATABENTO_API_KEY }}
      CAPITAL_INTELLIGENCE_MASSIVE_OPTIONS_API_KEY: ${{ secrets.CAPITAL_INTELLIGENCE_MASSIVE_OPTIONS_API_KEY || secrets.MASSIVE_API_KEY || secrets.POLYGON_API_KEY }}
      CAPITAL_INTELLIGENCE_RELEASE: ${{ github.sha }}
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install provider validation runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
      - name: Generate credential-safe live-provider report
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python run_provider_validation.py \
            --allow-failure \
            --report provider-validation-report.json \
            | tee provider-validation-output.json
      - name: Publish credential-safe validation summary
        if: always()
        shell: bash
        run: |
          {
            echo "## PR264 live-provider validation"
            echo
            echo "Release: \`${GITHUB_SHA}\`"
            echo
            if [[ -f provider-validation-report.json ]]; then
              echo '```json'
              cat provider-validation-report.json
              echo '```'
            else
              echo "No report was produced. Review the failed validation step."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Publish durable audit evidence to PR276
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          marker = "<!-- pr264-live-provider-audit -->"
          report_path = Path("provider-validation-report.json")
          if report_path.exists():
              report = json.loads(report_path.read_text(encoding="utf-8"))
              ready = report.get("ready") is True
              status = "✅ PASSED" if ready else "❌ BLOCKED"
              report_text = json.dumps(report, sort_keys=True, indent=2)
          else:
              ready = False
              status = "❌ BLOCKED"
              report_text = json.dumps(
                  {
                      "ready": False,
                      "release": os.environ.get("GITHUB_SHA", "unknown"),
                      "detail": "The live-provider workflow did not produce a report.",
                      "credentials_exposed": False,
                      "real_money_authorized": False,
                  },
                  sort_keys=True,
                  indent=2,
              )

          body = (
              f"{marker}\n"
              f"## PR264 live-provider release audit — {status}\n\n"
              f"Release: `{os.environ.get('GITHUB_SHA', 'unknown')}`\n\n"
              "This is the credential-safe result from the trusted `main` workflow. "
              "It contains no provider tokens or raw market payloads.\n\n"
              f"```json\n{report_text}\n```"
          )
          repository = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          api_root = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "capital-intelligence-provider-validation",
          }

          def request_json(url: str, *, method: str = "GET", payload=None):
              data = None
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
              request = Request(url, data=data, headers=headers, method=method)
              try:
                  with urlopen(request, timeout=30) as response:
                      return json.loads(response.read().decode("utf-8"))
              except HTTPError as error:
                  detail = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"GitHub audit publication failed with HTTP {error.code}: {detail[:500]}"
                  ) from error

          comments = request_json(f"{api_root}/issues/276/comments?per_page=100")
          existing = next(
              (
                  item
                  for item in comments
                  if isinstance(item, dict)
                  and marker in str(item.get("body") or "")
              ),
              None,
          )
          if existing is None:
              request_json(
                  f"{api_root}/issues/276/comments",
                  method="POST",
                  payload={"body": body},
              )
          else:
              request_json(
                  f"{api_root}/issues/comments/{existing['id']}",
                  method="PATCH",
                  payload={"body": body},
              )
          PY
      - name: Enforce required live-provider proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          path = Path("provider-validation-report.json")
          if not path.exists():
              raise SystemExit("live-provider validation report was not produced")
          payload = json.loads(path.read_text(encoding="utf-8"))
          if payload.get("ready") is not True:
              failed = payload.get("failed_required_checks") or ["unknown"]
              raise SystemExit(
                  "required live-provider proof failed: " + ", ".join(map(str, failed))
              )
          PY
