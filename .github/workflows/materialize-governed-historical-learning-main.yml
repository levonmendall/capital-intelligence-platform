name: Materialize Governed Historical Learning Branch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-governed-historical-learning-main.yml
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: materialize-governed-historical-learning-main
  cancel-in-progress: false

env:
  STATUS_ISSUE: "214"
  TARGET_BRANCH: agent/governed-historical-learning-input
  TEMP_WORKFLOW: .github/workflows/materialize-governed-historical-learning-main.yml

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish materializer start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(cat <<EOF
          ## Materialization state

          **State:** running

          - Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Target branch: \`$TARGET_BRANCH\`
          - Trigger commit: \`$GITHUB_SHA\`

          The workflow is synchronizing the implementation branch, applying or preserving the governed historical-learning integration, cleaning temporary files, and will replace this body with exact success or failure details.
          EOF
          )"
          gh issue edit "$STATUS_ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --body "$body"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Synchronize and materialize with captured diagnostics
        id: materialize
        shell: bash
        run: |
          log_path="$RUNNER_TEMP/governed-historical-learning-materialization.log"
          set +e
          (
            set -e
            echo "== Configure Git identity =="
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            echo "== Synchronize latest main =="
            git fetch origin main
            if ! git merge --no-edit origin/main; then
              conflicts="$(git diff --name-only --diff-filter=U)"
              if [[ "$conflicts" != "$TEMP_WORKFLOW" ]]; then
                echo "Unexpected merge conflicts:"
                printf '%s\n' "$conflicts"
                exit 1
              fi
              echo "Resolving the known temporary-workflow conflict by preserving its deletion."
              git rm -f "$TEMP_WORKFLOW"
              git commit --no-edit
            fi
            if [[ -f tools/materialize_governed_historical_learning.py ]]; then
              echo "== Apply governed historical learning integration =="
              python tools/materialize_governed_historical_learning.py
            else
              echo "Materialized source is already present; preserving it while synchronizing main."
            fi
            echo "== Remove temporary execution files =="
            rm -f tools/materialize_governed_historical_learning.py
            rm -f .github/workflows/materialize-governed-historical-learning.yml
            rm -f "$TEMP_WORKFLOW"
            rm -f materialization.log
            echo "== Validate and publish target branch =="
            git add -A
            git diff --cached --check
            if git diff --cached --quiet; then
              echo "No source changes remained to commit."
            else
              git commit -m "Complete governed historical learning implementation"
            fi
            git push origin HEAD:$TARGET_BRANCH
          ) > "$log_path" 2>&1
          status=$?
          cat "$log_path"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "log_path=$log_path" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish exact materializer result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.materialize.outputs.exit_code }}
          LOG_PATH: ${{ steps.materialize.outputs.log_path }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          exit_code = os.environ.get("EXIT_CODE") or "unavailable"
          log_path = Path(os.environ.get("LOG_PATH") or "/nonexistent")
          log = (
              log_path.read_text(encoding="utf-8", errors="replace")
              if log_path.exists()
              else "No materialization log was produced."
          )
          log = log[-12000:]
          state = "completed" if exit_code == "0" else "failed"
          body = f"""## Materialization state

          **State:** {state}

          - Workflow run: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}
          - Target branch: `{os.environ['TARGET_BRANCH']}`
          - Trigger commit: `{os.environ['GITHUB_SHA']}`
          - Exit code: `{exit_code}`

          ## Execution log

          ```text
          {log}
          ```
          """
          subprocess.run(
              [
                  "gh",
                  "issue",
                  "edit",
                  os.environ["STATUS_ISSUE"],
                  "--repo",
                  os.environ["GITHUB_REPOSITORY"],
                  "--body",
                  body,
              ],
              check=True,
          )
          PY
      - name: Enforce materialization success
        if: always()
        env:
          EXIT_CODE: ${{ steps.materialize.outputs.exit_code }}
        run: test "$EXIT_CODE" = "0"

# Trigger compatibility correction: absent history caps confidence but does not invent a size cut.
