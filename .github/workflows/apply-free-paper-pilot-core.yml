name: Apply free paper pilot core support

on:
  push:
    branches:
      - pr-166-free-paper-pilot
    paths:
      - .github/workflows/apply-free-paper-pilot-core.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr-166-free-paper-pilot
          fetch-depth: 0
      - name: Extend canonical paper profiles to core listed instruments
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('portfolio/multi_asset_controls.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              'mandatory instrument, leverage, contract, currency, and capability checks for all\nclassified non-core liquid public markets.',
              'mandatory instrument, leverage, contract, currency, and capability checks for all\nclassified liquid public markets.',
              1,
          )
          old = '''        if self.asset_class not in EXPANSION_ASSET_CLASSES:\n            raise ValueError("profile is only valid for classified governed non-core markets")\n'''
          new = '''        if self.asset_class is CandidateAssetClass.OTHER:\n            raise ValueError("unclassified instruments cannot receive an execution profile")\n'''
          if source.count(old) != 1:
              raise SystemExit('multi_asset_controls profile boundary not found exactly once')
          path.write_text(source.replace(old, new), encoding='utf-8')

          path = Path('portfolio/multi_asset_execution.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              '    version: str = "multi-asset-paper-execution.v1"\n    maximum_quote_age_minutes: int = 5\n',
              '    version: str = "multi-asset-paper-execution.v2"\n    maximum_quote_age_minutes: int = 5\n    us_equity_commission_bps: float = 0.0\n    us_etf_commission_bps: float = 0.0\n    cash_equivalent_commission_bps: float = 0.0\n',
              1,
          )
          source = source.replace(
              '        for field_name in (\n            "crypto_commission_bps",\n',
              '        for field_name in (\n            "us_equity_commission_bps",\n            "us_etf_commission_bps",\n            "cash_equivalent_commission_bps",\n            "crypto_commission_bps",\n',
              1,
          )
          source = source.replace(
              '''            return {\n                CandidateAssetClass.CRYPTO: TradingSessionModel.CONTINUOUS_24_7,\n''',
              '''            return {\n                CandidateAssetClass.US_EQUITY: TradingSessionModel.EXCHANGE_LOCAL,\n                CandidateAssetClass.US_ETF: TradingSessionModel.EXCHANGE_LOCAL,\n                CandidateAssetClass.CASH_EQUIVALENT: TradingSessionModel.EXCHANGE_LOCAL,\n                CandidateAssetClass.CRYPTO: TradingSessionModel.CONTINUOUS_24_7,\n''',
              1,
          )
          source = source.replace(
              '''        return {\n            CandidateAssetClass.CRYPTO: self.crypto_commission_bps,\n''',
              '''        return {\n            CandidateAssetClass.US_EQUITY: self.us_equity_commission_bps,\n            CandidateAssetClass.US_ETF: self.us_etf_commission_bps,\n            CandidateAssetClass.CASH_EQUIVALENT: self.cash_equivalent_commission_bps,\n            CandidateAssetClass.CRYPTO: self.crypto_commission_bps,\n''',
              1,
          )
          source = source.replace(
              '            return instrument_type in {"spot", "token", "stablecoin", "bond"}\n',
              '            return instrument_type in {"spot", "token", "stablecoin", "bond", "common_stock", "preferred_stock", "fund"}\n',
              1,
          )
          source = source.replace(
              '''        return asset_class in {\n            CandidateAssetClass.CRYPTO,\n''',
              '''        return asset_class in {\n            CandidateAssetClass.US_EQUITY,\n            CandidateAssetClass.US_ETF,\n            CandidateAssetClass.CASH_EQUIVALENT,\n            CandidateAssetClass.CRYPTO,\n''',
              1,
          )
          path.write_text(source, encoding='utf-8')
          PY
      - name: Verify syntax
        run: python -m py_compile portfolio/multi_asset_controls.py portfolio/multi_asset_execution.py providers/alpaca_paper.py
      - name: Commit core support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-free-paper-pilot-core.yml
          git add portfolio/multi_asset_controls.py portfolio/multi_asset_execution.py
          git commit -m "Support core listed instruments in paper executor"
          git push origin HEAD:pr-166-free-paper-pilot
