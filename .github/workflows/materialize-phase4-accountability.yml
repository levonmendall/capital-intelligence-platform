name: Materialize Phase 4 Accountability

on:
  push:
    branches:
      - feature/committee-cio-v2-phase4-accountability
    paths:
      - .github/workflows/materialize-phase4-accountability.yml
      - scripts/materialize_phase4_accountability.py
      - portfolio/decision_reconciliation.py
      - tests/test_construction_decision_reconciliation.py
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-phase4-accountability
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      PHASE_IDENTIFIER: committee-cio-v2-phase4-accountability
    steps:
      - name: Check out phase branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: feature/committee-cio-v2-phase4-accountability
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply reviewed Phase 4 patch
        run: python scripts/materialize_phase4_accountability.py

      - name: Install locked runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt

      - name: Run construction accountability regressions
        run: >-
          pytest -q
          tests/test_construction_decision_reconciliation.py
          tests/test_canonical_cio_cycle.py
          tests/test_cio_persistence.py

      - name: Publish final source and remove temporary materializer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add application/cio_cycle.py cio/persistence.py portfolio/construction_api.py
          git rm scripts/materialize_phase4_accountability.py
          git rm .github/workflows/materialize-phase4-accountability.yml
          git add portfolio/decision_reconciliation.py tests/test_construction_decision_reconciliation.py
          git commit -m "Add CIO-to-construction reconciliation accountability"
          git push origin HEAD:feature/committee-cio-v2-phase4-accountability
