name: Inspect Live CIO Failure

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read credential-safe production diagnostic
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request

          url = "https://capital-intelligence-platform.onrender.com/app/static/cio-diagnostic.json"
          request = urllib.request.Request(
              url,
              headers={"Accept": "application/json", "User-Agent": "cio-failure-inspector/1.0"},
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              payload = json.loads(response.read().decode("utf-8"))

          if payload.get("credential_safe") is not True:
              raise SystemExit("diagnostic is not marked credential-safe")
          if payload.get("paper_only") is not True or payload.get("real_money_authorized") is not False:
              raise SystemExit("diagnostic authority markers are unsafe")

          def safe_text(value):
              text = str(value or "")[:1800]
              text = re.sub(r"(?i)([?&](?:api[_-]?key|apikey|api_token|access_token|token)=)[^&\\s]+", r"\\1[REDACTED]", text)
              text = re.sub(r"(?i)(\\bBearer\\s+)[A-Za-z0-9._~+/=-]{8,}", r"\\1[REDACTED]", text)
              text = re.sub(r"(?i)(password|secret|api[_-]?key|api[_-]?token|access[_-]?token)\\s*[:=]\\s*[^; ,]+", r"\\1=[REDACTED]", text)
              return text

          result = {
              "active_release": payload.get("active_release"),
              "request_id": payload.get("request_id") or payload.get("diagnostic_id"),
              "state": payload.get("state"),
              "stage": payload.get("stage"),
              "detail": safe_text(payload.get("detail")),
              "context_attempt_state": payload.get("context_attempt_state"),
              "context_attempt_detail": safe_text(payload.get("context_attempt_detail")),
              "comprehensive_discovery_required": payload.get("comprehensive_discovery_required"),
              "comprehensive_discovery_limitations": [safe_text(item) for item in (payload.get("comprehensive_discovery_limitations") or [])][:10],
              "top_level_keys": sorted(str(key) for key in payload.keys()),
          }
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
