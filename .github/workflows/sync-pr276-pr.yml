name: Synchronize PR276 With Main

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/sync-pr276-pr.yml

permissions:
  contents: write

jobs:
  synchronize:
    if: github.event.pull_request.head.ref == 'agent/verify-pr264-live-and-ci'
    runs-on: ubuntu-latest
    steps:
      - name: Check out writable PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/verify-pr264-live-and-ci
          fetch-depth: 0
      - name: Merge current main and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "capital-intelligence-automation"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          rm -f .github/workflows/sync-pr276-pr.yml
          git add -A
          git commit -m "Remove PR276 synchronization transport"
          git push origin HEAD:agent/verify-pr264-live-and-ci
