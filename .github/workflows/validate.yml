name: Validate Capital Intelligence Platform

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PYTHONPATH: ${{ github.workspace }}
      CAPITAL_INTELLIGENCE_DAILY_STAGE_BINDINGS: ${{ github.workspace }}/deploy/canonical-daily-stage-bindings.validation.json

    steps:
      - name: Check out feature branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: true
          ref: feature/predictive-flow-expectations
          fetch-depth: 0

      - name: Patch multi-model forward lineage and restore workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("application/production_context.py")
          content = path.read_text(encoding="utf-8")
          old = '''                | {
                    (
                        f"forward_intelligence:{item.candidate_identifier}",
                        version,
                    )
                    for item in evidence.candidate_evidence
                    if item.forward_intelligence is not None
                    for version in item.forward_intelligence.model_versions
                }
'''
          new = '''                | {
                    (
                        f"forward_intelligence:{item.candidate_identifier}:{version}",
                        version,
                    )
                    for item in evidence.candidate_evidence
                    if item.forward_intelligence is not None
                    for version in item.forward_intelligence.model_versions
                }
'''
          if old in content:
              path.write_text(content.replace(old, new), encoding="utf-8")
          elif new not in content:
              raise SystemExit("forward-intelligence manifest block was not recognized")
          PY
          rm -f .github/workflows/patch-predictive-manifest.yml
          git show origin/main:.github/workflows/validate.yml > .github/workflows/validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add application/production_context.py .github/workflows/validate.yml .github/workflows/patch-predictive-manifest.yml
          if ! git diff --cached --quiet; then
            git commit -m "Support multiple forward models per candidate"
            git push origin HEAD:feature/predictive-flow-expectations
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install locked runtime dependencies
        run: pip install --require-hashes -r requirements.lock

      - name: Install development dependencies
        run: pip install -r requirements-dev.txt

      - name: Install browser-test dependencies
        run: pip install -r requirements-browser.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Verify runtime lock integrity
        run: python scripts/verify_requirements_lock.py

      - name: Install Chromium for real Streamlit browser tests
        run: python -m playwright install --with-deps chromium

      - name: Run desktop and iPhone Streamlit browser gate
        env:
          CAPITAL_INTELLIGENCE_BROWSER_TESTS: "1"
        run: >-
          pytest -q
          tests/browser/test_streamlit_browser.py
          tests/browser/test_sticky_primary_navigation.py
          tests/browser/test_today_story_placement.py
          tests/browser/test_environment_story_placement.py
          tests/browser/test_distinct_surface_content.py

      - name: Run deterministic release validation
        run: timeout --signal=TERM 40m python run_release_validation.py --report reports/release-validation.json

      - name: Publish release diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-validation-results
          path: |
            reports/release-validation.json
            reports/golden-end-to-end-gate.json
            reports/event-quality-benchmark.json
            reports/pytest-results.xml
            reports/browser/
          if-no-files-found: ignore
          retention-days: 14
