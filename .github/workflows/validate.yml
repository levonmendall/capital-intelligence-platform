name: Apply final universal investability fix

on:
  push:
    branches:
      - ops/finalize-universal-investability

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: feature/universal-investable-ownership
          fetch-depth: 0
          persist-credentials: true

      - name: Apply correction and restore canonical workflows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("production_paper_evidence.py")
          text = path.read_text(encoding="utf-8")
          old = "            uses_derivatives=instrument.uses_derivatives,\n"
          new = '''            uses_derivatives=(
                instrument.uses_derivatives
                or instrument.economic_exposure
                in {"managed_futures", "option_strategies", "volatility"}
            ),
'''
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          elif new not in text:
              raise SystemExit("candidate derivative lineage assignment was not found")
          PY
          rm -f .github/workflows/fix-wrapper-derivative-lineage.yml
          git show origin/main:.github/workflows/validate.yml > .github/workflows/validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production_paper_evidence.py .github/workflows/validate.yml
          git add -u .github/workflows/fix-wrapper-derivative-lineage.yml || true
          if git diff --cached --quiet; then
            echo "Target branch already contains the correction."
            exit 0
          fi
          git commit -m "Preserve derivative risk lineage for listed wrappers"
          git push origin HEAD:feature/universal-investable-ownership
