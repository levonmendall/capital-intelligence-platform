name: Validate Capital Intelligence Platform

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PYTHONPATH: ${{ github.workspace }}
      CAPITAL_INTELLIGENCE_DAILY_STAGE_BINDINGS: ${{ github.workspace }}/deploy/canonical-daily-stage-bindings.validation.json

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install locked runtime dependencies
        run: pip install --require-hashes -r requirements.lock

      - name: Install development dependencies
        run: pip install -r requirements-dev.txt

      - name: Install browser-test dependencies
        run: pip install -r requirements-browser.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Verify runtime lock integrity
        run: python scripts/verify_requirements_lock.py

      - name: Install Chromium for real Streamlit browser tests
        run: python -m playwright install --with-deps chromium

      - name: Run desktop and iPhone Streamlit browser gate
        env:
          CAPITAL_INTELLIGENCE_BROWSER_TESTS: "1"
        run: pytest -q tests/browser/test_streamlit_browser.py

      - name: Run deterministic release validation
        run: timeout --signal=TERM 40m python run_release_validation.py --report reports/release-validation.json

      - name: Publish release diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-validation-results
          path: |
            reports/release-validation.json
            reports/pytest-results.xml
            reports/browser/
          if-no-files-found: ignore
          retention-days: 14
