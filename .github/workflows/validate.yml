name: Validate Capital Intelligence Platform

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Initialize platform
        run: python initialize.py

      - name: Run intelligence engine
        run: python run_intelligence.py

      - name: Run canonical regime pipeline
        run: python run_regime.py

      - name: Run automated tests
        run: pytest -q --junitxml=pytest-results.xml

      - name: Publish automated test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Build hardened runtime image
        run: docker build --tag capital-intelligence:validation .
