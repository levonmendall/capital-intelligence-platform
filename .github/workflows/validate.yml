name: Validate Capital Intelligence Platform

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PYTHONPATH: ${{ github.workspace }}
      CAPITAL_INTELLIGENCE_DAILY_STAGE_BINDINGS: ${{ github.workspace }}/deploy/canonical-daily-stage-bindings.validation.json

    steps:
      - name: Check out feature branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: true
          ref: feature/predictive-flow-expectations
          fetch-depth: 0

      - name: Reconcile predictive scenarios and robustness authority
        run: |
          python - <<'PY'
          from pathlib import Path

          policy_path = Path("portfolio/compounding_allocation.py")
          policy = policy_path.read_text(encoding="utf-8")
          old_gap = '''        probability_gap = float(
            getattr(robustness, "probability_consistency_gap", 1.0)
        )
'''
          new_gap = '''        robustness_reasons = tuple(
            str(item)
            for item in (getattr(robustness, "reasons", ()) or ())
        )
'''
          old_gate = '''        if probability_gap > self.maximum_probability_consistency_gap + _EPSILON:
            reasons.append("stated and scenario-implied success probabilities diverge too far")
'''
          new_gate = '''        if any(
            "inconsistent with the disclosed scenarios" in item
            for item in robustness_reasons
        ):
            reasons.append(
                "the authoritative robustness assessment found inconsistent success probabilities"
            )
'''
          if policy.count(old_gap) != 1 or policy.count(old_gate) != 1:
              raise SystemExit("staged-participation probability blocks were not recognized")
          policy = policy.replace(old_gap, new_gap).replace(old_gate, new_gate)
          policy_path.write_text(policy, encoding="utf-8")

          predictive_path = Path("intelligence/predictive_market.py")
          predictive = predictive_path.read_text(encoding="utf-8")
          old_scenarios = '''    scenarios = tuple((*existing.scenarios, *predictive.scenarios))
'''
          new_scenarios = '''    grouped_scenarios: dict[str, list[ForwardScenario]] = {}
    for item in (*existing.scenarios, *predictive.scenarios):
        grouped_scenarios.setdefault(item.label, []).append(item)
    scenarios = tuple(
        ForwardScenario(
            label=label,
            return_delta=_clip(
                sum(item.return_delta for item in values),
                -0.25,
                0.25,
            ),
            probability_delta=_clip(
                sum(item.probability_delta for item in values),
                -0.20,
                0.20,
            ),
            path_drawdown_delta=_clip(
                sum(item.path_drawdown_delta for item in values),
                -0.25,
                0.0,
            ),
            rationale=" ".join(
                dict.fromkeys(item.rationale for item in values)
            ),
            evidence_identifiers=tuple(
                dict.fromkeys(
                    identifier
                    for item in values
                    for identifier in item.evidence_identifiers
                )
            ),
        )
        for label, values in sorted(grouped_scenarios.items())
    )
'''
          if predictive.count(old_scenarios) != 1:
              raise SystemExit("forward scenario merge block was not recognized")
          predictive_path.write_text(
              predictive.replace(old_scenarios, new_scenarios),
              encoding="utf-8",
          )

          test_path = Path("tests/test_predictive_market_intelligence.py")
          tests = test_path.read_text(encoding="utf-8")
          old_import = '''from intelligence.predictive_market import (
    CapitalFlowEngine,
    CapitalFlowState,
    MarketExpectationsEngine,
    build_predictive_market_intelligence,
)
'''
          new_import = '''from intelligence.forward import (
    ForwardIntelligenceBundle,
    ForwardScenario,
    ForwardSignal,
)
from intelligence.predictive_market import (
    CapitalFlowEngine,
    CapitalFlowState,
    MarketExpectationsEngine,
    build_predictive_market_intelligence,
    merge_forward_intelligence,
)
'''
          if tests.count(old_import) != 1:
              raise SystemExit("predictive test import block was not recognized")
          tests = tests.replace(old_import, new_import)
          addition = '''

def test_duplicate_forward_scenario_labels_are_reconciled_not_appended() -> None:
    signal = ForwardSignal(
        identifier="signal:test",
        as_of=NOW,
        name="test signal",
        channels=("forecast",),
        expected_return_impact=0.01,
        confidence=0.60,
        evidence=("test evidence",),
        contradictory_evidence=(),
        assumptions=("test assumption",),
        risks=("test risk",),
        change_conditions=("test change",),
        evidence_identifiers=("evidence:test",),
    )
    existing = ForwardIntelligenceBundle(
        identifier="forward:existing",
        candidate_identifier="candidate:test:ABC",
        as_of=NOW,
        signals=(signal,),
        scenarios=(
            ForwardScenario(
                label="bull",
                return_delta=0.05,
                probability_delta=0.01,
                path_drawdown_delta=0.0,
                rationale="existing bull case",
                evidence_identifiers=("evidence:existing",),
            ),
        ),
        diagnostics=(),
        model_versions=("existing.v1",),
    )
    predictive = ForwardIntelligenceBundle(
        identifier="forward:predictive",
        candidate_identifier="candidate:test:ABC",
        as_of=NOW,
        signals=(),
        scenarios=(
            ForwardScenario(
                label="bull",
                return_delta=0.04,
                probability_delta=0.02,
                path_drawdown_delta=0.0,
                rationale="predictive bull case",
                evidence_identifiers=("evidence:predictive",),
            ),
        ),
        diagnostics=(),
        model_versions=("predictive.v1",),
    )

    merged = merge_forward_intelligence(existing, predictive)

    assert len(merged.scenarios) == 1
    assert merged.scenarios[0].label == "bull"
    assert merged.scenarios[0].return_delta == 0.09
    assert merged.scenarios[0].probability_delta == 0.03
    assert set(merged.scenarios[0].evidence_identifiers) == {
        "evidence:existing",
        "evidence:predictive",
    }
'''
          if "test_duplicate_forward_scenario_labels_are_reconciled_not_appended" not in tests:
              tests += addition
          test_path.write_text(tests, encoding="utf-8")
          PY
          git show origin/main:.github/workflows/validate.yml > .github/workflows/validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio/compounding_allocation.py intelligence/predictive_market.py tests/test_predictive_market_intelligence.py .github/workflows/validate.yml
          git commit -m "Reconcile predictive scenarios through robustness authority"
          git push origin HEAD:feature/predictive-flow-expectations

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install locked runtime dependencies
        run: pip install --require-hashes -r requirements.lock

      - name: Install development dependencies
        run: pip install -r requirements-dev.txt

      - name: Install browser-test dependencies
        run: pip install -r requirements-browser.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Verify runtime lock integrity
        run: python scripts/verify_requirements_lock.py

      - name: Install Chromium for real Streamlit browser tests
        run: python -m playwright install --with-deps chromium

      - name: Run desktop and iPhone Streamlit browser gate
        env:
          CAPITAL_INTELLIGENCE_BROWSER_TESTS: "1"
        run: >-
          pytest -q
          tests/browser/test_streamlit_browser.py
          tests/browser/test_sticky_primary_navigation.py
          tests/browser/test_today_story_placement.py
          tests/browser/test_environment_story_placement.py
          tests/browser/test_distinct_surface_content.py

      - name: Run deterministic release validation
        run: timeout --signal=TERM 40m python run_release_validation.py --report reports/release-validation.json

      - name: Publish release diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-validation-results
          path: |
            reports/release-validation.json
            reports/golden-end-to-end-gate.json
            reports/event-quality-benchmark.json
            reports/pytest-results.xml
            reports/browser/
          if-no-files-found: ignore
          retention-days: 14
