name: Repair Phase 2 Production Fixture

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: repair-phase2-production-fixture
  cancel-in-progress: false

jobs:
  repair:
    if: github.head_ref == 'feature/committee-cio-v2-phase2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out phase branch
        uses: actions/checkout@v4
        with:
          ref: feature/committee-cio-v2-phase2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply production fixture repair
        run: python scripts/repair_phase2_production_fixture.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run production adapter and applicable evidence regressions
        run: |
          python -m pytest -q \
            tests/test_canonical_production_context_adapter.py \
            tests/test_applicable_evidence_matrix.py \
            tests/test_canonical_cio_cycle.py

      - name: Publish fixture correction and remove temporary repair tools
        run: |
          rm scripts/repair_phase2_production_fixture.py
          rm .github/workflows/repair-phase2-production-fixture.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align production context fixture with applicable evidence"
          git push origin HEAD:feature/committee-cio-v2-phase2
