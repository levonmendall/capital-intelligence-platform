name: Apply point-in-time decision evaluation

on:
  pull_request:
    paths:
      - .github/workflows/apply-point-in-time-evaluation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out patch staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/export-canonical-cycle-source
          persist-credentials: true

      - name: Reconstruct validated patch
        run: |
          cat .github/patches/eval-gz-00.b64 .github/patches/eval-gz-01.b64 \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/point-in-time-evaluation.patch
          test -s /tmp/point-in-time-evaluation.patch

      - name: Check out product branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/point-in-time-decision-evaluation
          persist-credentials: true

      - name: Apply exact evaluation patch
        run: |
          patch -p1 --forward --batch < /tmp/point-in-time-evaluation.patch

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt
          python -m pip check
          python scripts/verify_requirements_lock.py

      - name: Validate exact updated branch
        run: |
          python -m compileall -q .
          python initialize.py
          python run_intelligence.py
          python run_regime.py
          pytest -q

      - name: Commit validated evaluation layer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            application/cio_cycle.py \
            cio/persistence.py \
            docs/POINT_IN_TIME_EVALUATION.md \
            evaluation/__init__.py \
            evaluation/persistence.py \
            evaluation/point_in_time.py \
            evaluation/walk_forward.py \
            tests/test_canonical_cio_cycle.py \
            tests/test_point_in_time_evaluation.py
          git commit -m 'Add point-in-time decision evaluation and calibration'
          git push origin HEAD:agent/point-in-time-decision-evaluation