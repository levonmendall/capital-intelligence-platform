name: Align ARGO policy regression thresholds

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: align-argo-policy-regressions
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/adaptive-robust-growth-ensemble'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact ARGO branch
        uses: actions/checkout@v4
        with:
          ref: agent/adaptive-robust-growth-ensemble
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Align policy-boundary regression
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_free_paper_pilot.py')
          text = path.read_text(encoding='utf-8')
          old = '''                "target_cash_weight": 0.10,\n                "target_weights": [{"symbol": "VTI", "weight": 0.20}],\n'''
          new = '''                "target_cash_weight": 0.04,\n                "target_weights": [{"symbol": "VTI", "weight": 0.20}],\n'''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one stale cash-floor assertion')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          rm -f .github/workflows/fix-argo-policy-regressions.yml
          python -m compileall -q tests/test_free_paper_pilot.py
          git add -A

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-dev.txt

      - name: Run focused policy regressions
        run: |
          python -m pytest -q \
            tests/test_free_paper_pilot.py \
            tests/test_adaptive_robust_growth_ensemble.py \
            tests/test_decision_process_upgrade.py::test_hysteresis_defers_first_buy_but_emergency_reduction_bypasses

      - name: Commit aligned regression
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo 'No regression correction was staged.' >&2
            exit 1
          fi
          git commit -m 'Align free-paper policy regression with growth mandate'
          git push origin HEAD:agent/adaptive-robust-growth-ensemble
