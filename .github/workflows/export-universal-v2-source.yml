name: Apply universal ownership v2 patch

on:
  push:
    branches:
      - feature/universal-investable-ownership-v2
  pull_request:
    branches:
      - main

concurrency:
  group: universal-investable-ownership-v2-apply
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: feature/universal-investable-ownership-v2
          fetch-depth: 0
      - name: Apply complete implementation patch
        shell: bash
        run: |
          set -euo pipefail
          PATCH_DIR=".github/universal-investable-ownership-v2-patch"
          if [[ ! -f "$PATCH_DIR/READY" ]]; then
            echo "Implementation patch is not complete yet."
            exit 0
          fi
          cat "$PATCH_DIR"/chunk-* | base64 --decode | bzip2 --decompress > /tmp/universal-v2.patch
          git apply --index /tmp/universal-v2.patch
          git rm -r "$PATCH_DIR"
          git rm ".github/workflows/export-universal-v2-source.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Make investable ownership capability-based across the full universe"
          git push origin HEAD:feature/universal-investable-ownership-v2
