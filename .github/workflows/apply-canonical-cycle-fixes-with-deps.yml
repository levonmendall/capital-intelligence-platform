name: Apply canonical cycle fixes with dependencies

on:
  pull_request:
    paths:
      - .github/workflows/apply-canonical-cycle-fixes-with-deps.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out temporary export branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/export-canonical-cycle-source
          persist-credentials: true

      - name: Extract validated patch
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          source = Path('.github/workflows/export-canonical-cycle-source.yml').read_text(encoding='utf-8')
          marker = '          PATCH_B64: '
          encoded = next(line[len(marker):] for line in source.splitlines() if line.startswith(marker))
          Path('/tmp/canonical-cycle-fixes.patch').write_bytes(base64.b64decode(encoded))
          PY

      - name: Check out canonical cycle branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/canonical-cio-cycle-daily-briefing
          persist-credentials: true

      - name: Apply validated patch
        run: |
          git apply --check /tmp/canonical-cycle-fixes.patch
          git apply /tmp/canonical-cycle-fixes.patch
          rm -f .github/workflows/export-canonical-cycle-source.yml

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt
          python -m pip check
          python scripts/verify_requirements_lock.py

      - name: Validate exact updated branch
        run: |
          python -m compileall -q .
          python initialize.py
          python run_intelligence.py
          python run_regime.py
          pytest -q

      - name: Commit validated fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add application/cio_cycle.py committee/specialists.py portfolio/construction_engine.py tests/test_canonical_cio_cycle.py .github/workflows/export-canonical-cycle-source.yml
          git commit -m 'Complete canonical CIO cycle validation'
          git push origin HEAD:agent/canonical-cio-cycle-daily-briefing