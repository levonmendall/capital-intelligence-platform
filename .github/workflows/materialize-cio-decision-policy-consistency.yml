name: Materialize CIO decision policy consistency

on:
  push:
    branches:
      - agent/cio-decision-policy-consistency

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cio-decision-policy-consistency
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply isolated decision-policy corrections
        run: python .github/materialize_cio_policy.py

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate focused decision policies
        run: |
          python -m py_compile cio/committee.py cio/service.py cio/persistence.py committee/specialists.py application/cio_cycle.py
          PYTHONPATH=. python -m pytest -q tests/test_decision_process_upgrade.py tests/test_cio_persistence.py

      - name: Commit materialized source
        shell: bash
        run: |
          rm -f .github/materialize_cio_policy.py
          rm -f .cio-policy-materialize-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cio/committee.py cio/__init__.py committee/specialists.py cio/service.py cio/persistence.py application/cio_cycle.py tests/test_decision_process_upgrade.py docs/CIO_DECISION_POLICY_CORRECTIONS.md .github/materialize_cio_policy.py .cio-policy-materialize-trigger
          git commit -m "Differentiate CIO evidence veto consequences"
          git push origin HEAD:agent/cio-decision-policy-consistency
