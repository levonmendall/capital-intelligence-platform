name: Apply paper-operation evidence authority

on:
  pull_request:
    paths:
      - .github/workflows/apply-paper-operation-evidence.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out patch staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/export-paper-operation-evidence
          persist-credentials: true

      - name: Reconstruct and verify validated patch
        run: |
          cat \
            .github/patches/paper-operation-evidence-00.part \
            .github/patches/paper-operation-evidence-01.part \
            .github/patches/paper-operation-evidence-02.part \
            .github/patches/paper-operation-evidence-03a.part \
            .github/patches/paper-operation-evidence-03b.part \
            .github/patches/paper-operation-evidence-04.part \
            | base64 --decode \
            > /tmp/paper-operation-evidence.patch.gz
          echo '690b1eb02e216b0c582f452bec95d9314f7946c72741b6b5f8d73b36969f307e  /tmp/paper-operation-evidence.patch.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/paper-operation-evidence.patch.gz > /tmp/paper-operation-evidence.patch
          echo 'd41a3de4a388c948f36018a2979aca19253a7e1517007f92a73dc8322d3090c6  /tmp/paper-operation-evidence.patch' | sha256sum --check

      - name: Check out product branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/paper-operation-evidence
          persist-credentials: true

      - name: Apply exact paper-operation evidence patch
        run: patch -p3 --forward --batch < /tmp/paper-operation-evidence.patch

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt
          python -m pip check
          python scripts/verify_requirements_lock.py

      - name: Validate exact updated branch
        run: |
          python -m compileall -q .
          python initialize.py
          python run_intelligence.py
          python run_regime.py
          pytest -q

      - name: Commit validated paper-operation evidence authority
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            README.md \
            ROADMAP.md \
            docs/OPERATIONS.md \
            docs/PAPER_OPERATION_EVIDENCE.md \
            evaluation/__init__.py \
            evaluation/paper_operation.py \
            run_paper_operation_review.py \
            tests/test_paper_operation_evidence.py \
            tests/test_run_paper_operation_review.py
          git commit -m 'Add paper-operation evidence authority'
          git push origin HEAD:agent/paper-operation-evidence
