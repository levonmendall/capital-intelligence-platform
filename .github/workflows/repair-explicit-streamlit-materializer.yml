name: Repair explicit Streamlit materializer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'fix/explicit-streamlit-entrypoints'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/explicit-streamlit-entrypoints
          fetch-depth: 0
      - name: Repair secure entrypoint transformation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/materialize-explicit-streamlit-entrypoints.yml')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          start = next(
              index
              for index, line in enumerate(lines)
              if line.startswith("          page_config = '''st.set_page_config")
          )
          end = next(
              index
              for index in range(start + 1, len(lines))
              if "start = source.find('def _authorized_source()" in lines[index]
          )
          replacement = [
              "          page_config_start = source.find('st.set_page_config(\\n')\n",
              "          if page_config_start >= 0:\n",
              "              next_section = source.find('\\n\\n@st.cache_resource', page_config_start)\n",
              "              if next_section < 0:\n",
              "                  raise SystemExit('secure_app page configuration boundary mismatch')\n",
              "              source = source[:page_config_start] + source[next_section + 2:]\n",
          ]
          path.write_text(''.join(lines[:start] + replacement + lines[end:]), encoding='utf-8')
          Path('.github/workflows/repair-explicit-streamlit-materializer.yml').unlink()
          PY
          git add -A
          git commit -m "Repair explicit Streamlit materializer"
          git push origin HEAD:fix/explicit-streamlit-entrypoints
