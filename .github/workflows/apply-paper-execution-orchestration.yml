name: Apply paper execution orchestration

on:
  pull_request:
    paths:
      - .github/workflows/apply-paper-execution-orchestration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out patch staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/export-paper-execution-canonical3
          persist-credentials: true

      - name: Reconstruct and verify validated patch
        run: |
          cat .github/patches/pr84-paper-execution-{00..03}.b64 \
            | base64 --decode \
            > /tmp/pr84-paper-execution.patch.gz
          echo '0a7dfccbb83d3fd8e447bc790d719ca01573ae593d8339d600cc2a26d02ec6b4  /tmp/pr84-paper-execution.patch.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/pr84-paper-execution.patch.gz > /tmp/pr84-paper-execution.patch
          echo 'c29a80a6d186c0cc2d6a83bef4c57f0ba532fbe83001ea55750bb8801f6e20ea  /tmp/pr84-paper-execution.patch' | sha256sum --check

      - name: Check out product branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/paper-execution-orchestration-canonical
          persist-credentials: true

      - name: Apply exact paper-execution patch
        run: patch -p3 --forward --batch < /tmp/pr84-paper-execution.patch

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt
          python -m pip check
          python scripts/verify_requirements_lock.py

      - name: Validate exact updated branch
        run: |
          python -m compileall -q .
          python initialize.py
          python run_intelligence.py
          python run_regime.py
          pytest -q

      - name: Commit validated paper-execution authority
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            README.md \
            ROADMAP.md \
            docs/OPERATIONS.md \
            docs/PAPER_EXECUTION_ORCHESTRATION.md \
            portfolio/execution.py \
            run_paper_execution.py \
            tests/paper_execution_factories.py \
            tests/test_paper_execution_orchestration.py \
            tests/test_run_paper_execution.py
          git commit -m 'Add paper execution orchestration'
          git push origin HEAD:agent/paper-execution-orchestration-canonical
