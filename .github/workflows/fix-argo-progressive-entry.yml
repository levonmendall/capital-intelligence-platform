name: Repair ARGO progressive-entry hysteresis

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: repair-argo-progressive-entry
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/adaptive-robust-growth-ensemble'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact ARGO branch
        uses: actions/checkout@v4
        with:
          ref: agent/adaptive-robust-growth-ensemble
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply scoped progressive-entry correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python - <<'PY'
          from pathlib import Path

          path = Path('cio/service.py')
          text = path.read_text(encoding='utf-8')

          old_call = '''                profile=profile,\n                emergency=(\n'''
          new_call = '''                profile=profile,\n                progressive_lane=progressive_lane,\n                emergency=(\n'''
          if text.count(old_call) != 1:
              raise SystemExit('expected exactly one hysteresis call insertion point')
          text = text.replace(old_call, new_call, 1)

          old_signature = '''        prior_context: PriorDecisionContext | None,\n        profile: DecisionPolicyProfile,\n        emergency: bool,\n'''
          new_signature = '''        prior_context: PriorDecisionContext | None,\n        profile: DecisionPolicyProfile,\n        progressive_lane: bool,\n        emergency: bool,\n'''
          if text.count(old_signature) != 1:
              raise SystemExit('expected exactly one hysteresis signature insertion point')
          text = text.replace(old_signature, new_signature, 1)

          old_required = '''        if action is CIOAction.BUY:\n            required = profile.entry_persistence_cycles\n            observed = prior_context.consecutive_supportive_cycles + 1\n'''
          new_required = '''        if action is CIOAction.BUY:\n            # Participation and exploration lanes may establish a deliberately\n            # small first position immediately. Ordinary acquisition still\n            # requires confirmation across at least two completed cycles.\n            required = (\n                1\n                if progressive_lane\n                else max(2, profile.entry_persistence_cycles)\n            )\n            observed = prior_context.consecutive_supportive_cycles + 1\n'''
          if text.count(old_required) != 1:
              raise SystemExit('expected exactly one BUY hysteresis block')
          text = text.replace(old_required, new_required, 1)
          path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/fix-argo-progressive-entry.yml
          python -m compileall -q cio/service.py
          git add -A

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-dev.txt

      - name: Run focused growth and hysteresis regressions
        run: |
          python -m pytest -q \
            tests/test_adaptive_robust_growth_ensemble.py \
            tests/test_decision_process_upgrade.py::test_hysteresis_defers_first_buy_but_emergency_reduction_bypasses

      - name: Commit corrected product source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo 'No correction was staged.' >&2
            exit 1
          fi
          git commit -m 'Preserve acquisition hysteresis outside growth lanes'
          git push origin HEAD:agent/adaptive-robust-growth-ensemble
