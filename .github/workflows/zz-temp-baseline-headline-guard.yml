name: Temporary baseline headline guard

on:
  push:
    branches: [codex/baseline-headline-guard-check]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt
      - run: pytest -q tests/test_headline_runtime_secret_guard.py
