name: Materialize three-surface rebuild

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'ui-rebuild-three-surfaces-pr'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply reviewed rebuild
        shell: bash
        run: |
          cat .github/rebuild-payload/part1 \
              .github/rebuild-payload/part2 \
              .github/rebuild-payload/part3 \
              .github/rebuild-payload/part4 > /tmp/rebuild.b64
          python - <<'PY'
          from pathlib import Path
          import base64
          import zlib

          encoded = Path('/tmp/rebuild.b64').read_text().strip()
          Path('/tmp/three-surface-rebuild.patch').write_bytes(
              zlib.decompress(base64.b64decode(encoded))
          )
          PY
          git apply --check /tmp/three-surface-rebuild.patch
          git apply /tmp/three-surface-rebuild.patch

      - name: Validate rebuilt surfaces
        shell: bash
        run: |
          python -m py_compile app.py app_impl.py tests/test_surface_information_hierarchy.py
          python -m pip install --quiet pytest
          python -m pytest -q \
            tests/test_surface_information_hierarchy.py \
            tests/test_portfolio_education_ui.py \
            tests/test_concise_operating_intelligence_ui.py \
            tests/test_premium_streamlit_interface.py \
            tests/test_premium_navigation_runtime.py

      - name: Commit materialized source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .github/rebuild-payload
          git rm .github/workflows/materialize-three-surface-rebuild.yml
          git add app.py app_impl.py tests/test_surface_information_hierarchy.py
          git commit -m "Rebuild Today Environment and Portfolio surfaces"
          git push origin HEAD:${{ github.head_ref }}
