name: Fix dynamic instrument authority selection

on:
  push:
    branches:
      - feature/universal-investable-ownership

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/universal-investable-ownership
          fetch-depth: 0
      - name: Restore dynamic certification selection and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("governance/market_participation.py")
          text = path.read_text(encoding="utf-8")

          old_identifier = '''def _instrument_identifier(item: object) -> str:\n    return str(getattr(item, "instrument_identifier", "")).strip()\n'''
          new_identifier = '''def _instrument_identifier(item: object) -> str:\n    value = getattr(item, "instrument_identifier", None)\n    if value is None:\n        value = getattr(item, "instrument_id", "")\n    return str(value).strip()\n'''
          if old_identifier not in text:
              raise SystemExit("instrument identifier helper was not found")
          text = text.replace(old_identifier, new_identifier, 1)

          old_execution = '''def _execution_asset_class(item: object) -> CandidateAssetClass | None:\n    value = getattr(item, "execution_asset_class", None)\n    if isinstance(value, CandidateAssetClass):\n        return value\n    try:\n        return CandidateAssetClass(str(value))\n    except (TypeError, ValueError):\n        return None\n'''
          new_execution = '''def _execution_asset_class(item: object) -> CandidateAssetClass | None:\n    value = getattr(item, "execution_asset_class", None)\n    if value is None:\n        value = getattr(item, "asset_class", None)\n    if isinstance(value, CandidateAssetClass):\n        return value\n    try:\n        return CandidateAssetClass(str(value))\n    except (TypeError, ValueError):\n        return None\n'''
          if old_execution not in text:
              raise SystemExit("execution asset-class helper was not found")
          text = text.replace(old_execution, new_execution, 1)

          old_signature = '''    def filter_paper_allocatable(\n        self,\n        instruments: Iterable[object],\n        *,\n        universe_identifier: str | None = None,\n    ) -> tuple[object, ...]:\n'''
          new_signature = '''    def filter_paper_allocatable(\n        self,\n        instruments: Iterable[object],\n        *,\n        universe_identifier: str | None = None,\n        evaluated_at: datetime | None = None,\n    ) -> tuple[object, ...]:\n'''
          if old_signature not in text:
              raise SystemExit("filter signature was not found")
          text = text.replace(old_signature, new_signature, 1)

          old_loop = '''            if identifier in self._bootstrap_entry_by_instrument:\n                selected.append(item)\n                continue\n            if self._active_capability_entry(item) is None:\n                continue\n            if self._complete_active_capability(\n                item,\n                universe_identifier=resolved_identifier,\n            ):\n                selected.append(item)\n'''
          new_loop = '''            if identifier in self._bootstrap_entry_by_instrument:\n                selected.append(item)\n                continue\n            if self.instrument_authority is not None and evaluated_at is not None:\n                capability = self.instrument_authority.assess(\n                    item, evaluated_at=evaluated_at\n                )\n                if capability.paper_allocatable:\n                    selected.append(item)\n                    continue\n            if self._active_capability_entry(item) is None:\n                continue\n            if self._complete_active_capability(\n                item,\n                universe_identifier=resolved_identifier,\n            ):\n                selected.append(item)\n'''
          if old_loop not in text:
              raise SystemExit("paper allocation selection loop was not found")
          text = text.replace(old_loop, new_loop, 1)

          old_call = '''        selected = self.filter_paper_allocatable(\n            instruments,\n            universe_identifier=universe_identifier,\n        )\n'''
          new_call = '''        selected = self.filter_paper_allocatable(\n            instruments,\n            universe_identifier=universe_identifier,\n            evaluated_at=evaluated_at,\n        )\n'''
          if old_call not in text:
              raise SystemExit("decision authority filter call was not found")
          text = text.replace(old_call, new_call, 1)

          path.write_text(text, encoding="utf-8")
          PY
          git rm .github/workflows/fix-dynamic-instrument-authority.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add governance/market_participation.py
          git commit -m "Restore certified instruments to dynamic paper authority"
          git push origin HEAD:feature/universal-investable-ownership
