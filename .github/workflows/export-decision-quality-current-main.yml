name: Export decision-quality current main

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/export-decision-quality-current-main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Package source
        run: |
          zip -qr /tmp/capital-intelligence-current-main.zip . -x '.git/*'
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: decision-quality-current-main
          path: /tmp/capital-intelligence-current-main.zip
          retention-days: 1
