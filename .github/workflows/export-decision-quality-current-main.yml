name: Export decision-quality source inputs

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/export-decision-quality-current-main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Package current main
        run: |
          # Refresh after premium HTML rendering hotfix.
          git rev-parse HEAD > /tmp/current-main-sha.txt
          zip -qr /tmp/capital-intelligence-current-main.zip . -x '.git/*'
      - name: Upload current main
        uses: actions/upload-artifact@v4
        with:
          name: decision-quality-current-main
          path: |
            /tmp/capital-intelligence-current-main.zip
            /tmp/current-main-sha.txt
          retention-days: 1
      - name: Check out PR 143 original base
        uses: actions/checkout@v4
        with:
          ref: c8b4d73b239136feadd00c56d6685245e6dfcffb
          clean: true
      - name: Package PR 143 original base
        run: |
          zip -qr /tmp/all-markets-paper-readiness-base.zip . -x '.git/*'
      - name: Upload PR 143 original base
        uses: actions/upload-artifact@v4
        with:
          name: all-markets-paper-readiness-base
          path: /tmp/all-markets-paper-readiness-base.zip
          retention-days: 1
      - name: Check out pending all-market readiness branch
        uses: actions/checkout@v4
        with:
          ref: agent/all-markets-paper-ready-v2
          clean: true
      - name: Package pending readiness source
        run: |
          zip -qr /tmp/all-markets-paper-readiness-pr143.zip . -x '.git/*'
      - name: Upload pending readiness source
        uses: actions/upload-artifact@v4
        with:
          name: all-markets-paper-readiness-pr143
          path: /tmp/all-markets-paper-readiness-pr143.zip
          retention-days: 1
