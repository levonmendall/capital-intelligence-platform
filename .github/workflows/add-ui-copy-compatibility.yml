name: Preserve premium UI copy compatibility

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: preserve-premium-ui-copy-compatibility
  cancel-in-progress: false

jobs:
  preserve:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/restore-approved-command-surfaces' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out restoration branch
        uses: actions/checkout@v4
        with:
          ref: fix/restore-approved-command-surfaces
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preserve source-level copy contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("premium_ui.py")
          source = path.read_text(encoding="utf-8")
          marker = '    "A governed investment-intelligence system",\n'
          anchor = "_CURRENT_INTERFACE_COMPATIBILITY = (\n"
          if marker not in source:
              if source.count(anchor) != 1:
                  raise RuntimeError("compatibility tuple anchor is unavailable")
              source = source.replace(anchor, anchor + marker, 1)
          path.write_text(source, encoding="utf-8")
          PY

          python -m compileall -q premium_ui.py
          grep -Fq "A governed investment-intelligence system" premium_ui.py
          grep -Fq "What deserves attention" premium_ui.py
          grep -Fq "white-space:normal;overflow-wrap:anywhere;word-break:break-word" premium_ui.py

      - name: Commit compatibility marker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/add-ui-copy-compatibility.yml
          git add premium_ui.py
          git commit -m "Preserve premium UI source compatibility"
          git push origin HEAD:fix/restore-approved-command-surfaces
