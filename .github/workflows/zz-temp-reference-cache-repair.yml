name: Temporary reference cache repair
on:
  push:
    branches: [repair/reference-boundary-broad-cache-reclamation]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/reference-boundary-broad-cache-reclamation
      - name: Apply reference handoff repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('run_stage_isolated_evidence_pipeline.py')
          text = path.read_text(encoding='utf-8')
          old = '''def _run_reference_cache_reclamation(values: Mapping[str, str]) -> None:\n    """Release completed evidence cache before reference imports begin."""\n\n    _run_completed_evidence_cache_reclamation(\n        values,\n        stage="reference",\n        event=_REFERENCE_CACHE_RECLAMATION_EVENT,\n        code=_REFERENCE_CACHE_RECLAMATION_CODE,\n    )\n'''
          new = '''def _run_reference_cache_reclamation(values: Mapping[str, str]) -> None:\n    """Release bounded clean data-root cache before reference imports begin."""\n\n    _run_completed_evidence_cache_reclamation(\n        values,\n        stage="reference",\n        event=_REFERENCE_CACHE_RECLAMATION_EVENT,\n        code=_COMPREHENSIVE_DISCOVERY_CACHE_RECLAMATION_CODE,\n        capture_report=True,\n    )\n'''
          if text.count(old) != 1:
              raise SystemExit('reference reclaimer target did not match exactly once')
          text = text.replace(old, new)
          old_comment = '''        # Release clean pages at the two heavyweight stage boundaries where production\n        # telemetry has shown persistent raw cgroup pressure. The reference boundary stays\n        # narrow. The comprehensive boundary additionally performs a bounded exact-path\n        # data-root ownership scan only after us_equity_discovery has durably completed and\n        # exited. Both children are advisory only and cannot advance evidence state.\n'''
          new_comment = '''        # Release clean pages at the two heavyweight stage boundaries where production\n        # telemetry has shown persistent raw cgroup pressure. Both boundaries use the same\n        # bounded data-root scan and clean-page advice before the fresh stage interpreter is\n        # spawned. Failed-attempt dirty-page flushing remains separately restricted to the\n        # supersession boundary. Neither path changes an evidence or memory threshold.\n'''
          if text.count(old_comment) != 1:
              raise SystemExit('reference boundary comment target did not match exactly once')
          path.write_text(text.replace(old_comment, new_comment), encoding='utf-8')
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add run_stage_isolated_evidence_pipeline.py
          git diff --cached --check
          git commit -m "Reclaim broad clean cache before reference"
          git push origin HEAD:repair/reference-boundary-broad-cache-reclamation
