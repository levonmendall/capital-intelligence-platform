name: Diagnose Phase 6 Release Validation

on:
  push:
    branches:
      - feature/committee-cio-v2-phase6-risk-intelligence-clean
    paths:
      - .github/workflows/diagnose-phase6-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
      CAPITAL_INTELLIGENCE_DAILY_STAGE_BINDINGS: ${{ github.workspace }}/deploy/canonical-daily-stage-bindings.validation.json
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: feature/committee-cio-v2-phase6-risk-intelligence-clean
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt
          pip install -r requirements-browser.txt
      - name: Capture release validation
        run: |
          set +e
          timeout --signal=TERM 40m python run_release_validation.py --report reports/release-validation.json > reports/phase6-release-output.txt 2>&1
          echo "exit_code=$?" >> reports/phase6-release-output.txt
          exit 0
      - name: Publish diagnostic and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/release-validation.json reports/phase6-release-output.txt reports/pytest-results.xml || true
          git rm .github/workflows/diagnose-phase6-release.yml
          git commit -m "Capture Phase 6 release validation diagnostics"
          git push origin HEAD:feature/committee-cio-v2-phase6-risk-intelligence-clean
