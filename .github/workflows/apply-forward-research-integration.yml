name: Apply forward research integration
on:
  push:
    branches:
      - agent/forward-opportunity-final-20260809

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.event.head_commit.message == 'Retry forward research integration validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/forward-opportunity-final-20260809
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply integration patch
        run: python .github/apply_forward_research_patch.py
      - name: Install locked runtime dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile forward research integration
        run: python -m py_compile data/provider_dataset.py intelligence/forward_research.py intelligence/predictive_market.py intelligence/__init__.py
      - name: Run focused regressions
        run: |
          pytest -q \
            tests/test_forward_research.py \
            tests/test_forward_decision_intelligence_v2.py \
            tests/test_predictive_forward_decision_context.py \
            tests/test_predictive_market_intelligence.py
      - name: Commit clean implementation
        run: |
          rm .github/apply_forward_research_patch.py
          rm .github/workflows/apply-forward-research-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add forward opportunity discovery and governed nowcasting"
          git push origin HEAD:agent/forward-opportunity-final-20260809
