name: Run weekend market materializer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'agent/weekend-market-availability'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract and apply correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/materialize-weekend-market-availability.yml')
          lines = source.read_text(encoding='utf-8').splitlines()
          start_marker = "          python - <<'PY'"
          end_marker = "          PY"
          try:
              start = lines.index(start_marker) + 1
              end = lines.index(end_marker, start)
          except ValueError as error:
              raise RuntimeError('cannot extract materializer patch script') from error
          script_lines = [
              line[10:] if line.startswith('          ') else line
              for line in lines[start:end]
          ]
          Path('/tmp/apply_weekend_market_patch.py').write_text(
              '\n'.join(script_lines) + '\n',
              encoding='utf-8',
          )
          PY
          python /tmp/apply_weekend_market_patch.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Compile changed runtime
        run: |
          python -m py_compile \
            operations/comprehensive_market_discovery.py \
            operations/equity_discovery.py \
            tests/test_weekend_discovery_schedule.py

      - name: Run discovery regressions
        run: |
          python -m pytest -q \
            tests/test_comprehensive_market_discovery.py \
            tests/test_weekend_discovery_schedule.py

      - name: Commit validated correction
        shell: bash
        run: |
          rm \
            .github/workflows/materialize-weekend-market-availability.yml \
            .github/workflows/run-weekend-market-materializer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            operations/comprehensive_market_discovery.py \
            operations/equity_discovery.py \
            tests/test_weekend_discovery_schedule.py \
            .github/workflows/materialize-weekend-market-availability.yml \
            .github/workflows/run-weekend-market-materializer.yml
          git commit -m "Schedule closed-market discovery on weekdays"
          git push origin HEAD:agent/weekend-market-availability
