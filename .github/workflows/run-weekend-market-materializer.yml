name: Run weekend market materializer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'agent/weekend-market-availability'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply schedule-aware discovery correction
        run: python .github/scripts/apply_weekend_market_availability.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Compile changed runtime
        run: |
          python -m py_compile \
            operations/comprehensive_market_discovery.py \
            operations/equity_discovery.py \
            tests/test_weekend_discovery_schedule.py

      - name: Run discovery regressions
        run: |
          python -m pytest -q \
            tests/test_comprehensive_market_discovery.py \
            tests/test_weekend_discovery_schedule.py

      - name: Commit validated correction
        shell: bash
        run: |
          rm \
            .github/scripts/apply_weekend_market_availability.py \
            .github/workflows/materialize-weekend-market-availability.yml \
            .github/workflows/run-weekend-market-materializer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            operations/comprehensive_market_discovery.py \
            operations/equity_discovery.py \
            tests/test_weekend_discovery_schedule.py \
            .github/scripts/apply_weekend_market_availability.py \
            .github/workflows/materialize-weekend-market-availability.yml \
            .github/workflows/run-weekend-market-materializer.yml
          git commit -m "Schedule closed-market discovery on weekdays"
          git push origin HEAD:agent/weekend-market-availability
