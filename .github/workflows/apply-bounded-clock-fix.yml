name: Apply bounded live clock reconciliation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/expand-return-opportunity-discovery'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and apply bounded clock fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < tools/bounded_clock_fix/payload)" -eq 1912
          echo '6fc4a75ec788203c0f2a847ed3f96de382388ad856266d60794ac1639036c77d  tools/bounded_clock_fix/payload' | sha256sum -c -
          base64 --decode tools/bounded_clock_fix/payload > /tmp/bounded-clock.patch.xz
          echo '700d6cdb888a148db80afe55c2b5736178759aec28cbf621aed6aefbb777d0e5  /tmp/bounded-clock.patch.xz' | sha256sum -c -
          xz --decompress --stdout /tmp/bounded-clock.patch.xz > /tmp/bounded-clock.patch
          echo 'ce9c8cd3cd02fb7d5010dfe46ad5c53eb4f8540ad96cee94eff6302e20768a1d  /tmp/bounded-clock.patch' | sha256sum -c -
          git apply --check -p3 /tmp/bounded-clock.patch
          git apply -p3 /tmp/bounded-clock.patch

      - name: Commit clean bounded-clock correction
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/bounded_clock_fix
          rm -f .github/workflows/apply-bounded-clock-fix.yml
          git config user.name 'capital-intelligence-automation'
          git config user.email 'capital-intelligence-automation@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Normalize bounded live provider clock skew'
          git push origin "HEAD:${{ github.head_ref }}"
