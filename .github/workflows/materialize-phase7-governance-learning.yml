name: Materialize Phase 7 Governance and Learning

on:
  push:
    branches:
      - feature/committee-cio-v2-phase7-governance-learning
    paths:
      - .github/workflows/materialize-phase7-governance-learning.yml
      - scripts/materialize_phase7_governance_learning.py
      - scripts/repair_phase7_materializer.py
      - cio/policy_authority.py
      - cio/evidence_outage.py
      - evaluation/decision_value.py
      - tests/test_policy_outage_and_decision_value.py
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: ${{ github.workspace }}
      MATERIALIZATION_REVISION: "3"
    steps:
      - name: Check out phase branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: feature/committee-cio-v2-phase7-governance-learning
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply reviewed Phase 7 integration
        run: |
          python scripts/repair_phase7_materializer.py
          python scripts/materialize_phase7_governance_learning.py

      - name: Install locked runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt

      - name: Run policy, outage, learning and canonical regressions
        run: >-
          pytest -q
          tests/test_policy_outage_and_decision_value.py
          tests/test_canonical_cio_cycle.py
          tests/test_cio_persistence.py
          tests/test_risk_intelligence.py
          tests/test_forward_intelligence.py

      - name: Publish final source and remove temporary materializer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cio/models.py cio/service.py cio/__init__.py cio/policy_authority.py cio/evidence_outage.py
          git add opportunity/engine.py application/cio_cycle.py evaluation/__init__.py evaluation/decision_value.py
          git add tests/test_policy_outage_and_decision_value.py
          git rm -f scripts/materialize_phase7_governance_learning.py
          git rm scripts/repair_phase7_materializer.py
          git rm .github/workflows/materialize-phase7-governance-learning.yml
          git commit -m "Integrate canonical policy outage aging and advisory decision learning"
          git push origin HEAD:feature/committee-cio-v2-phase7-governance-learning
