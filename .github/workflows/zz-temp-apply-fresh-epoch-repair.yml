name: Temporary apply fresh-epoch repair

on:
  push:
    branches: [codex/fresh-epoch-after-structural-prep]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested repair patch
        shell: bash
        env:
          REPAIR_PATCH_B64: >-
            
        run: |
          set -euo pipefail
          printf '%s' "$REPAIR_PATCH_B64" | base64 --decode > /tmp/repair.patch.gz
          gzip -dc /tmp/repair.patch.gz > /tmp/repair.patch
          if patch -p1 --dry-run < /tmp/repair.patch >/dev/null; then
            patch -p1 < /tmp/repair.patch
            git config user.name "capital-intelligence-repair-bot"
            git config user.email "actions@users.noreply.github.com"
            git add \
              operations/comprehensive_discovery_structural_preparation.py \
              operations/release_prequalification_parent_watchdog.py \
              operations/stage_isolated_evidence_pipeline.py \
              operations/transactional_comprehensive_discovery_lane.py \
              run_stage_isolated_evidence_stage.py \
              tests/test_comprehensive_discovery_structural_preparation.py \
              tests/test_pre_comprehensive_discovery_cache_reclamation.py \
              tests/test_release_prequalification_stage_liveness.py \
              tests/test_stage_isolated_evidence_pipeline.py \
              tests/test_stage_isolated_prequalification_telemetry.py
            git commit -m "Start fresh evidence epoch after structural preparation"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          elif patch -p1 -R --dry-run < /tmp/repair.patch >/dev/null; then
            echo "Repair patch already applied."
          else
            echo "Repair patch does not match branch state." >&2
            exit 1
          fi
