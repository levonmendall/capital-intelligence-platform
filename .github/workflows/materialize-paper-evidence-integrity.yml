name: Materialize Paper Evidence Integrity

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: materialize-paper-evidence-integrity
  cancel-in-progress: false

jobs:
  materialize:
    if: github.head_ref == 'agent/complete-paper-evidence-publishers'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out evidence branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/complete-paper-evidence-publishers
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt

      - name: Apply evidence integrity controls
        run: python tools/materialize_paper_evidence_integrity.py

      - name: Remove temporary integrity tooling
        run: |
          rm tools/materialize_paper_evidence_integrity.py
          rm .github/workflows/materialize-paper-evidence-integrity.yml

      - name: Validate focused evidence integrity
        run: |
          python -m compileall -q production_paper_evidence.py production_context_publication_governed.py
          pytest -q tests/test_alpaca_historical_bars.py tests/test_production_context_publication_runtime.py

      - name: Commit evidence integrity controls
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Strengthen point-in-time paper evidence integrity"
          git push origin HEAD:agent/complete-paper-evidence-publishers
