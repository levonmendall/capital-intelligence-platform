name: Apply direct global-market implementation

on:
  push:
    branches:
      - agent/enable-direct-global-market-paper
    paths:
      - .github/agent_payload/**
      - .github/workflows/apply-direct-global-market.yml

permissions:
  contents: write

concurrency:
  group: apply-direct-global-market
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/enable-direct-global-market-paper
          fetch-depth: 0

      - name: Validate and apply product patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/agent_payload/direct-global-*.b64 > /tmp/direct-global.b64
          base64 --decode /tmp/direct-global.b64 > /tmp/direct-global.patch.gz
          gzip --test /tmp/direct-global.patch.gz
          gzip --decompress --stdout /tmp/direct-global.patch.gz > /tmp/direct-global.patch
          test -s /tmp/direct-global.patch
          git apply --check /tmp/direct-global.patch
          git apply --index /tmp/direct-global.patch

          # The finished commit must contain product changes only.
          rm -rf .github/agent_payload
          rm -f .github/workflows/apply-direct-global-market.yml
          rm -f .github/workflows/export-agent-repo.yml
          git add -A

          # Guard against reintroducing the removed blanket market ban.
          ! git grep -n 'direct_instrument_classes_prohibited' -- ':!tests/**'
          ! git grep -n 'Direct futures.*spot FX.*direct crypto.*remain prohibited' -- ':!tests/**'

          python -m compileall -q .

      - name: Commit exact implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Enable direct global-market paper opportunities'
          git push origin HEAD:agent/enable-direct-global-market-paper
