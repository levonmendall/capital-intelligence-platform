name: Patch predictive manifest lineage

on:
  push:
    branches:
      - feature/predictive-flow-expectations
    paths:
      - .github/workflows/patch-predictive-manifest.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: true
          ref: feature/predictive-flow-expectations
      - name: Make forward model lineage unique per candidate and model
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("application/production_context.py")
          content = path.read_text(encoding="utf-8")
          old = '''                | {
                    (
                        f"forward_intelligence:{item.candidate_identifier}",
                        version,
                    )
                    for item in evidence.candidate_evidence
                    if item.forward_intelligence is not None
                    for version in item.forward_intelligence.model_versions
                }
'''
          new = '''                | {
                    (
                        f"forward_intelligence:{item.candidate_identifier}:{version}",
                        version,
                    )
                    for item in evidence.candidate_evidence
                    if item.forward_intelligence is not None
                    for version in item.forward_intelligence.model_versions
                }
'''
          if content.count(old) != 1:
              raise SystemExit("expected exactly one forward-intelligence manifest block")
          path.write_text(content.replace(old, new), encoding="utf-8")
          PY
          rm .github/workflows/patch-predictive-manifest.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add application/production_context.py .github/workflows/patch-predictive-manifest.yml
          git commit -m "Support multiple forward models per candidate"
          git push origin HEAD:feature/predictive-flow-expectations
