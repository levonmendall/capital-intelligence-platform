name: Materialize Comprehensive Market Discovery

on:
  push:
    branches:
      - agent/comprehensive-market-discovery
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: comprehensive-market-discovery-materializer
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'levonmendall/capital-intelligence-platform-'
    runs-on: ubuntu-latest
    timeout-minutes: 55

    env:
      PYTHONPATH: ${{ github.workspace }}
      CAPITAL_INTELLIGENCE_DAILY_STAGE_BINDINGS: ${{ github.workspace }}/deploy/canonical-daily-stage-bindings.validation.json

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/comprehensive-market-discovery
          fetch-depth: 0

      - name: Verify and unpack reviewed source package
        shell: bash
        run: |
          set -euo pipefail
          echo "5728597ddc2826afb0709e79be382e8066e256a1ee50bcbd477d6819152dae04  .comprehensive-market-discovery/payload.part00.0" | sha256sum --check --strict
          echo "165fba851ea7daca3e9efacfdb58447f93e5a5b7cc544e019d7e5affc97b1828  .comprehensive-market-discovery/payload.part00.1" | sha256sum --check --strict
          echo "f92adf3e71c965874e5b3a894f74fd7cd7b1cb7831fd023ba74532fd357be832  .comprehensive-market-discovery/payload.part00.2" | sha256sum --check --strict
          echo "c594ab04986eec8006569d1e73bc8c308639d69b19a0b7916e0bb96387cd2333  .comprehensive-market-discovery/payload.part00.3" | sha256sum --check --strict
          echo "584fa603abe1cd1571ef0c54fcfaf2723b26d5b0fce002e22f00441b2a941aa9  .comprehensive-market-discovery/payload.part01.0" | sha256sum --check --strict
          echo "9903e0ec383cfd18e11079097c533fa033fa3ef17915f7833033efae6049bc59  .comprehensive-market-discovery/payload.part01.1" | sha256sum --check --strict
          echo "7641fb5281be09fd6762ebcefbbe350d5aba1054417b5e63f18cd244d11107d0  .comprehensive-market-discovery/payload.part01.2" | sha256sum --check --strict
          echo "da4163ed5ed57efd40c951f3b33f01c01c9767a16bbacef56a8d73ed6c0ada70  .comprehensive-market-discovery/payload.part01.3" | sha256sum --check --strict
          echo "768794a1987507bd8765286539d6ce1a2f24acd2dfdc6395e35b70995615afdf  .comprehensive-market-discovery/payload.part02" | sha256sum --check --strict
          cat \
            .comprehensive-market-discovery/payload.part00.0 \
            .comprehensive-market-discovery/payload.part00.1 \
            .comprehensive-market-discovery/payload.part00.2 \
            .comprehensive-market-discovery/payload.part00.3 \
            .comprehensive-market-discovery/payload.part01.0 \
            .comprehensive-market-discovery/payload.part01.1 \
            .comprehensive-market-discovery/payload.part01.2 \
            .comprehensive-market-discovery/payload.part01.3 \
            .comprehensive-market-discovery/payload.part02 \
            > /tmp/comprehensive-market-discovery.b64
          echo "512c76e9da01d0f73def32c6553b3e6e290ccf7478aae775b7302e53b10af5c5  /tmp/comprehensive-market-discovery.b64" | sha256sum --check --strict
          base64 --decode /tmp/comprehensive-market-discovery.b64 > /tmp/comprehensive-market-discovery.tar.gz
          echo "0d600b7f2502f4da6e42b90f146f8642c051440206615a040155f10a8c721757  /tmp/comprehensive-market-discovery.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file /tmp/comprehensive-market-discovery.tar.gz --directory .
          python tools/apply_comprehensive_market_discovery.py

      - name: Remove one-use transport
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .comprehensive-market-discovery
          rm -f tools/apply_comprehensive_market_discovery.py
          rm -f .github/workflows/materialize-comprehensive-market-discovery.yml

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt
          python -m pip check

      - name: Compile changed runtime
        run: |
          python -m py_compile \
            operations/comprehensive_market_discovery.py \
            operations/free_paper_pilot.py \
            operations/direct_global_markets.py \
            production_paper_evidence.py \
            production_context_publication_governed.py \
            tests/test_comprehensive_market_discovery.py

      - name: Run comprehensive discovery regressions
        run: python -m pytest -q tests/test_comprehensive_market_discovery.py

      - name: Run deterministic release validation
        run: timeout --signal=TERM 40m python run_release_validation.py --report reports/release-validation.json

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "capital-intelligence-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Materializer produced no implementation changes" >&2
            exit 1
          fi
          git commit -m "Expand comprehensive market discovery"
          git push origin HEAD:agent/comprehensive-market-discovery
