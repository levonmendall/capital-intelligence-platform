name: Apply CIO cycle integrity corrections

on:
  push:
    branches:
      - fix/cio-cycle-decision-integrity
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.event_name == 'pull_request' || github.event.head_commit.message != 'Apply CIO cycle integrity corrections'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cio-cycle-decision-integrity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode and apply corrections
        run: |
          base64 -d tools/apply_cio_cycle_integrity_corrections.py.gz.b64 | gzip -d > tools/apply_cio_cycle_integrity_corrections.py
          python tools/apply_cio_cycle_integrity_corrections.py
          rm tools/apply_cio_cycle_integrity_corrections.py
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile corrected modules
        run: >-
          python -m compileall
          application/cio_cycle.py
          application/production_context_contract.py
          application/production_context_runtime.py
          application/forecast_support.py
          cio/cycle_disposition.py
          cio/service.py
          operations/active_paper_universe.py
          portfolio/production_scenarios.py
          reporting/daily_cio.py
          run_autonomous_paper_operator.py
          public_live_collection_runtime.py
      - name: Run focused decision-process tests
        run: >-
          python -m pytest -q
          tests/test_cio_cycle_integrity_corrections.py
          tests/test_cio_cycle.py
          tests/test_production_context_runtime.py
          tests/test_production_context_contract.py
          tests/test_daily_cio.py
          tests/test_run_autonomous_paper_operator.py
      - name: Commit corrections
        run: |
          git config user.name "capital-intelligence-bot"
          git config user.email "capital-intelligence-bot@users.noreply.github.com"
          git add application cio operations portfolio reporting tests \
            production_context_publication_governed.py \
            production_context_publication_runtime.py \
            public_live_collection_runtime.py \
            run_autonomous_paper_operator.py
          git commit -m "Apply CIO cycle integrity corrections"
          git push origin HEAD:fix/cio-cycle-decision-integrity
