name: Refresh cryptography lock

on:
  push:
    branches:
      - feature/compounding-allocation-core
    paths:
      - requirements.txt
      - .github/workflows/refresh-cryptography-lock.yml

permissions:
  contents: write

jobs:
  compile-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: true
          ref: feature/compounding-allocation-core
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Compile hashed runtime lock
        run: |
          python -m pip install --upgrade pip pip-tools
          pip-compile --generate-hashes --output-file=requirements.lock --strip-extras requirements.txt
      - name: Commit refreshed lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Regenerate runtime lock for cryptography 50"
          git push origin HEAD:feature/compounding-allocation-core
