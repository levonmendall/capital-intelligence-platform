name: Materialize Live EODHD Cutoff Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'fix/live-eodhd-snapshot-cutoff'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply point-in-time correction and cleanup
        run: python .github/scripts/apply_live_eodhd_cutoff_fix.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Compile affected runtime
        run: |
          python -m py_compile \
            providers/eodhd.py \
            tests/test_eodhd_provider.py \
            operations/comprehensive_market_discovery.py \
            production_context_publication_governed.py

      - name: Run focused regressions
        run: |
          python -m pytest -q \
            tests/test_eodhd_provider.py \
            tests/test_comprehensive_market_discovery.py \
            tests/test_weekend_discovery_schedule.py

      - name: Commit validated correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve live EODHD snapshot availability"
          git push origin HEAD:fix/live-eodhd-snapshot-cutoff
