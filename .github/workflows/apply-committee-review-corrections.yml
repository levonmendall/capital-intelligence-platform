name: Apply committee review corrections

on:
  push:
    branches:
      - fix/cio-cycle-decision-integrity

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.event.head_commit.message != 'Apply committee review corrections'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cio-cycle-decision-integrity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode and apply committee corrections
        run: |
          base64 -d tools/apply_committee_review_corrections.py.gz.b64 | gzip -d > tools/apply_committee_review_corrections.py
          python tools/apply_committee_review_corrections.py
          rm tools/apply_committee_review_corrections.py
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile corrected modules
        run: >-
          python -m compileall
          opportunity/models.py
          opportunity/engine.py
          opportunity/__init__.py
          committee/specialists.py
          cio/cycle_disposition.py
          cio/service.py
          portfolio/production_scenarios.py
      - name: Run focused committee and CIO tests
        run: >-
          python -m pytest -q
          tests/test_committee_review_corrections.py
          tests/test_cio_cycle_integrity_corrections.py
          tests/test_cio_cycle.py
          tests/test_production_context_runtime.py
          tests/test_production_context_contract.py
          tests/test_daily_cio.py
      - name: Commit validated corrections
        run: |
          git config user.name "capital-intelligence-bot"
          git config user.email "capital-intelligence-bot@users.noreply.github.com"
          git add opportunity committee cio portfolio tests
          git rm tools/apply_committee_review_corrections.py.gz.b64
          git rm .github/workflows/apply-committee-review-corrections.yml
          git commit -m "Apply committee review corrections"
          git push origin HEAD:fix/cio-cycle-decision-integrity
