name: Recover direct global-market implementation

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: recover-direct-global-market
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/complete-direct-global-market-paper'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact recovery branch
        uses: actions/checkout@v4
        with:
          ref: agent/complete-direct-global-market-paper
          fetch-depth: 0

      - name: Locate newest complete direct-market foundation
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --prune
          : > /tmp/direct-market-foundations.txt
          while read -r ref timestamp; do
            if git cat-file -e "${ref}:config/direct_global_market_universe.json" 2>/dev/null \
              && git cat-file -e "${ref}:operations/direct_global_markets.py" 2>/dev/null; then
              printf '%s %s\n' "$timestamp" "$ref" >> /tmp/direct-market-foundations.txt
            fi
          done < <(git for-each-ref --format='%(refname) %(committerdate:unix)' refs/remotes/origin)
          sort -nr /tmp/direct-market-foundations.txt | tee /tmp/direct-market-foundations-sorted.txt
          candidate=$(awk 'NR==1 {print $2}' /tmp/direct-market-foundations-sorted.txt)
          test -n "$candidate"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          git archive --format=tar.gz --output=/tmp/direct-market-foundation.tar.gz "$candidate"
          git show -s --format='%H%n%ci%n%s' "$candidate" > /tmp/direct-market-foundation-source.txt

      - name: Upload readable foundation
        uses: actions/upload-artifact@v4
        with:
          name: direct-market-foundation
          path: |
            /tmp/direct-market-foundation.tar.gz
            /tmp/direct-market-foundation-source.txt
            /tmp/direct-market-foundations-sorted.txt
          if-no-files-found: error
          retention-days: 1
