name: Locate readable direct-market foundation

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: locate-readable-direct-market-foundation
  cancel-in-progress: false

jobs:
  locate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/complete-direct-global-market-paper'
    runs-on: ubuntu-latest
    steps:
      - name: Check out product branch with complete history
        uses: actions/checkout@v4
        with:
          ref: agent/complete-direct-global-market-paper
          fetch-depth: 0

      - name: Scan every remote branch for readable direct-market source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --prune
          : > /tmp/direct-market-foundations.txt
          while read -r ref timestamp; do
            if git cat-file -e "${ref}:config/direct_global_market_universe.json" 2>/dev/null \
              && git cat-file -e "${ref}:operations/direct_global_markets.py" 2>/dev/null; then
              sha=$(git rev-parse "$ref")
              printf '%s\t%s\t%s\n' "$timestamp" "$sha" "$ref" \
                >> /tmp/direct-market-foundations.txt
            fi
          done < <(
            git for-each-ref \
              --format='%(refname) %(committerdate:unix)' \
              refs/remotes/origin
          )
          sort -nr /tmp/direct-market-foundations.txt \
            | tee /tmp/direct-market-foundations-sorted.txt
          test -s /tmp/direct-market-foundations-sorted.txt

          candidate=$(awk 'NR==1 {print $3}' /tmp/direct-market-foundations-sorted.txt)
          candidate_sha=$(awk 'NR==1 {print $2}' /tmp/direct-market-foundations-sorted.txt)
          printf 'SELECTED_CANDIDATE=%s\nSELECTED_SHA=%s\n' \
            "$candidate" "$candidate_sha"
          echo '--- candidate direct-market files ---'
          git ls-tree -r --name-only "$candidate" \
            | grep -E '(^config/direct_|^operations/direct_|direct_global|multi_asset|paper_execution|material_reassessment)' \
            | sort
          echo '--- candidate commits not in current main ---'
          git log --oneline --no-merges "origin/main..${candidate}" | head -80
