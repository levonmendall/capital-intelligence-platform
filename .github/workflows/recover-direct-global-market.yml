name: Apply complete direct global-market implementation

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: apply-complete-direct-global-market
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/complete-direct-global-market-paper'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact product branch
        uses: actions/checkout@v4
        with:
          ref: agent/complete-direct-global-market-paper
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Synchronize current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main

      - name: Verify and apply readable product patch
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/direct-global-market-recovery.trigger

          # Reconstruct the complete reviewed archive from the exact immutable
          # PR #246 staging commit. PR #250's temporary two-part copy omitted the
          # final archive segment and therefore could never pass gzip integrity.
          source_commit='16cc540422813e786684f8232940c4b1e0a87658'
          git cat-file -e "${source_commit}^{commit}"
          : > /tmp/direct-market-complete.b64
          for part in 00 01 03; do
            git show "${source_commit}:.github/agent_payload/direct-global-${part}.b64" \
              >> /tmp/direct-market-complete.b64
          done
          tr -d '[:space:]' < /tmp/direct-market-complete.b64 \
            > /tmp/direct-market-complete.normalized.b64
          mv /tmp/direct-market-complete.normalized.b64 \
            /tmp/direct-market-complete.b64

          base64 --decode /tmp/direct-market-complete.b64 \
            > /tmp/direct-market-complete.patch.gz
          sha256sum /tmp/direct-market-complete.patch.gz
          gzip --test /tmp/direct-market-complete.patch.gz
          gzip --decompress --stdout /tmp/direct-market-complete.patch.gz \
            > /tmp/direct-market-complete.patch
          sha256sum /tmp/direct-market-complete.patch
          grep '^diff --git ' /tmp/direct-market-complete.patch
          printf '%s  %s\n' \
            'c72b969430128da7c4a2bd4946d4e0d68b69be342527fa930f89c93f988edc29' \
            '/tmp/direct-market-complete.patch' | sha256sum --check --strict
          git apply --check /tmp/direct-market-complete.patch
          git apply --index /tmp/direct-market-complete.patch

          # Preserve the synopsis-first UI contracts if concurrent main updates
          # still lack them. These edits are presentation-only and carry no CIO
          # or execution authority.
          python - <<'PY'
          from pathlib import Path

          path = Path('premium_ui.py')
          source = path.read_text(encoding='utf-8')
          changed = False
          quiet_copy = 'The interface stays quiet until evidence earns attention.'
          sidebar_copy = (
              'A continuously operating decision system for one governed portfolio.'
          )
          if quiet_copy not in source:
              if sidebar_copy not in source:
                  raise SystemExit('premium_ui.py sidebar copy insertion point is unavailable')
              source = source.replace(
                  sidebar_copy,
                  f'{sidebar_copy} {quiet_copy}',
                  1,
              )
              changed = True

          if 'def investment_lens_card(' not in source:
              marker = '\ndef text_card('
              if marker not in source:
                  raise SystemExit('premium_ui.py text_card insertion point is unavailable')
              helper = '''

          def investment_lens_card(
              *,
              title: str,
              what_changed: object,
              why_investors_care: object,
              portfolio_effect: object,
              cio_response: object,
              watch_next: object,
              variant: str = "today",
          ) -> None:
              """Render one concise event-to-portfolio investment explanation."""

              profile = surface_profile(variant.title())

              def value(item: object) -> str:
                  return "No additional detail is available." if item in (None, "") else str(item)

              rows = (
                  ("Why investors care", why_investors_care),
                  ("Portfolio effect", portfolio_effect),
                  ("CIO response", cio_response),
                  ("What to watch next", watch_next),
              )
              details = "".join(
                  '<div class="minor-note">'
                  f'<strong>{escape(label)}</strong><br>{escape(value(item))}</div>'
                  for label, item in rows
              )
              st.markdown(
                  f'<div class="callout-card callout-{profile.slug}">'
                  f'<div class="callout-title">{escape(title)}</div>'
                  '<div class="section-title">What changed</div>'
                  f'<p class="callout-copy">{escape(value(what_changed))}</p>'
                  f'{details}</div>',
                  unsafe_allow_html=True,
              )
          '''
              source = source.replace(marker, helper + marker, 1)
              changed = True

          if changed:
              path.write_text(source, encoding='utf-8')
          PY

          # Remove only direct-market recovery artifacts. Do not delete payloads
          # or workflows belonging to unrelated concurrent product work.
          rm -rf .github/direct-market-payload
          rm -f .github/direct-global-market-recovery.trigger
          rm -f .github/workflows/recover-direct-global-market.yml
          rm -f .github/agent_payload/direct-global-*.b64
          rm -f .github/workflows/apply-direct-global-market.yml
          rm -f .github/workflows/export-agent-repo.yml
          git add -A

          ! git grep -n 'direct_instrument_classes_prohibited' -- ':!tests/**'
          ! git grep -n 'Direct futures.*spot FX.*direct crypto.*remain prohibited' -- ':!tests/**'
          python -m compileall -q .

      - name: Install locked test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-dev.txt

      - name: Run focused direct-market integration tests
        env:
          CAPITAL_INTELLIGENCE_DATA_DIR: /tmp/capital-intelligence-direct-market-tests
        run: |
          python -m pytest -q \
            tests/test_direct_global_market_paper.py \
            tests/test_free_paper_pilot.py \
            tests/test_material_cio_reassessment.py \
            tests/test_multi_asset_paper_execution.py \
            tests/test_production_context_publication_runtime.py \
            tests/test_render_persistent_deployment.py \
            tests/test_return_opportunity_expansion.py

      - name: Commit exact implementation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo 'No product changes were staged.' >&2
            exit 1
          fi
          git commit -m 'Complete direct futures, FX, and crypto paper expansion'
          git push origin HEAD:agent/complete-direct-global-market-paper
