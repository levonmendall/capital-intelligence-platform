name: Materialize Phase 3 Evidence Independence

on:
  push:
    branches:
      - feature/committee-cio-v2-phase3
    paths:
      - .github/workflows/materialize-phase3-evidence-independence.yml
      - scripts/materialize_phase3_evidence_independence.py
      - cio/evidence_independence.py
      - tests/test_committee_evidence_independence.py
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-phase3-evidence-independence
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out phase branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: feature/committee-cio-v2-phase3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply reviewed Phase 3 patch
        run: python scripts/materialize_phase3_evidence_independence.py

      - name: Install locked runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt

      - name: Run evidence independence and canonical CIO regressions
        run: >-
          pytest -q
          tests/test_committee_evidence_independence.py
          tests/test_canonical_cio_cycle.py

      - name: Publish final source and remove temporary materializer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cio/committee.py cio/growth_ensemble.py cio/service.py cio/persistence.py
          git rm scripts/materialize_phase3_evidence_independence.py
          git rm .github/workflows/materialize-phase3-evidence-independence.yml
          git add cio/evidence_independence.py tests/test_committee_evidence_independence.py
          git commit -m "Apply dependency-aware committee evidence independence"
          git push origin HEAD:feature/committee-cio-v2-phase3
