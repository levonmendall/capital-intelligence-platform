name: Ten-Year Historical Backfill

on:
  pull_request:
    branches: [main]
    paths:
      - "historical_replay/**"
      - "run_historical_backfill.py"
      - "run_historical_shadow_replay.py"
      - "run_canonical_historical_replay.py"
      - "config/historical_replay_free_sources.json"
      - "tests/test_historical_replay.py"
      - "tests/test_canonical_historical_replay.py"
      - "tests/test_canonical_no_action_learning.py"
      - "tests/test_historical_certification_workflow.py"
      - ".github/workflows/historical-backfill.yml"
  push:
    branches: [main]
    paths:
      - "historical_replay/**"
      - "run_historical_backfill.py"
      - "run_canonical_historical_replay.py"
      - "config/historical_replay_free_sources.json"
      - ".github/workflows/historical-backfill.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  issues: write

concurrency:
  group: historical-backfill-${{ github.ref }}
  cancel-in-progress: true

env:
  CERTIFICATION_ISSUE_NUMBER: "208"

jobs:
  announce:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish running certification state
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BODY=$(cat <<EOF
          ## Current certification state

          **State:** running

          - **Commit:** \`${TARGET_SHA}\`
          - **Workflow run:** [#${GITHUB_RUN_ID}](${RUN_URL})
          - **Started at:** \`${STARTED_AT}\`
          - **Mode:** ten-year public-source backfill followed directly by monthly Canonical CIO replay

          The workflow will replace this entry with exact credential-free counts when certification completes.

          ## Permanent safety boundary

          - Research only: **true**
          - Execution authorized: **false**
          - Paper execution authorized: **false**
          - Real money authorized: **false**
          - Policy promotion authorized: **false**
          - Performance claims authorized: **false**
          EOF
          )
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/${CERTIFICATION_ISSUE_NUMBER}" \
            -f body="${BODY}" >/dev/null
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=pending \
            -f context=historical-replay/canonical-cio \
            -f description="Ten-year backfill and Canonical CIO replay are running" \
            -f target_url="${RUN_URL}" >/dev/null || true

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked runtime dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Run historical replay tests
        run: |
          python -m pytest -q \
            tests/test_historical_replay.py \
            tests/test_canonical_historical_replay.py \
            tests/test_canonical_no_action_learning.py \
            tests/test_historical_certification_workflow.py
      - name: Compile historical replay commands
        run: |
          python -m compileall -q \
            historical_replay \
            run_historical_backfill.py \
            run_historical_shadow_replay.py \
            run_canonical_historical_replay.py

  backfill:
    if: github.event_name != 'pull_request'
    needs: [announce, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      records_written: ${{ steps.metrics.outputs.records_written }}
      strict_records: ${{ steps.metrics.outputs.strict_records }}
      canonical_invoked: ${{ steps.metrics.outputs.canonical_invoked }}
      blocked_cutoffs: ${{ steps.metrics.outputs.blocked_cutoffs }}
      total_cutoffs: ${{ steps.metrics.outputs.total_cutoffs }}
      relevant_records: ${{ steps.metrics.outputs.relevant_records }}
      price_records: ${{ steps.metrics.outputs.price_records }}
      macro_records: ${{ steps.metrics.outputs.macro_records }}
      archive_scans: ${{ steps.metrics.outputs.archive_scans }}
      runtime_version: ${{ steps.metrics.outputs.runtime_version }}
      learning_observations: ${{ steps.metrics.outputs.learning_observations }}
      cio_decision_observations: ${{ steps.metrics.outputs.cio_decision_observations }}
      qualification_observations: ${{ steps.metrics.outputs.qualification_observations }}
      realized_outcomes: ${{ steps.metrics.outputs.realized_outcomes }}
      avoided_losses: ${{ steps.metrics.outputs.avoided_losses }}
      missed_opportunities: ${{ steps.metrics.outputs.missed_opportunities }}
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      CAPITAL_INTELLIGENCE_HISTORICAL_DATA_DIR: database/historical_replay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked runtime dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Backfill the governed ten-year public-source window
        run: |
          python run_historical_backfill.py \
            --max-records-per-source 100000 \
            --report historical-backfill-report.json
      - name: Run the production Canonical CIO over historical cutoffs
        run: |
          python run_canonical_historical_replay.py \
            --cadence monthly \
            --initial-portfolio-value 250000 \
            --report canonical-historical-replay.json
      - name: Capture credential-free completion metrics
        id: metrics
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          backfill = json.loads(
              Path("historical-backfill-report.json").read_text(encoding="utf-8")
          )
          canonical = json.loads(
              Path("canonical-historical-replay.json").read_text(encoding="utf-8")
          )
          values = {
              "records_written": int(backfill.get("records_written", 0)),
              "strict_records": int(backfill.get("strict_replay_records", 0)),
              "canonical_invoked": int(canonical.get("canonical_cio_invoked_count", 0)),
              "blocked_cutoffs": int(canonical.get("blocked_cutoff_count", 0)),
              "total_cutoffs": int(canonical.get("decision_cutoff_count", 0)),
              "relevant_records": int(canonical.get("relevant_record_count", 0)),
              "price_records": int(canonical.get("price_record_count", 0)),
              "macro_records": int(canonical.get("macro_record_count", 0)),
              "archive_scans": int(canonical.get("archive_scan_count", 0)),
              "runtime_version": str(canonical.get("runtime_version", "unknown")),
              "learning_observations": int(canonical.get("learning_observation_count", 0)),
              "cio_decision_observations": int(canonical.get("cio_decision_observation_count", 0)),
              "qualification_observations": int(canonical.get("qualification_observation_count", 0)),
              "realized_outcomes": int(canonical.get("realized_outcome_count", 0)),
              "avoided_losses": int(canonical.get("avoided_loss_count", 0)),
              "missed_opportunities": int(canonical.get("missed_opportunity_count", 0)),
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              for name, value in values.items():
                  stream.write(f"{name}={value}\n")
          print(json.dumps(values, sort_keys=True))
          PY
      - name: Upload append-only historical evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ten-year-historical-replay-${{ github.sha }}
          path: |
            database/historical_replay
            historical-backfill-report.json
            canonical-historical-replay.json
          retention-days: 30
          if-no-files-found: error

  publish-certification:
    if: always() && github.event_name != 'pull_request'
    needs: [announce, validate, backfill]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ github.sha }}
      VALIDATION_RESULT: ${{ needs.validate.result }}
      BACKFILL_RESULT: ${{ needs.backfill.result }}
      RECORDS_WRITTEN: ${{ needs.backfill.outputs.records_written }}
      STRICT_RECORDS: ${{ needs.backfill.outputs.strict_records }}
      CANONICAL_INVOKED: ${{ needs.backfill.outputs.canonical_invoked }}
      BLOCKED_CUTOFFS: ${{ needs.backfill.outputs.blocked_cutoffs }}
      TOTAL_CUTOFFS: ${{ needs.backfill.outputs.total_cutoffs }}
      RELEVANT_RECORDS: ${{ needs.backfill.outputs.relevant_records }}
      PRICE_RECORDS: ${{ needs.backfill.outputs.price_records }}
      MACRO_RECORDS: ${{ needs.backfill.outputs.macro_records }}
      ARCHIVE_SCANS: ${{ needs.backfill.outputs.archive_scans }}
      RUNTIME_VERSION: ${{ needs.backfill.outputs.runtime_version }}
      LEARNING_OBSERVATIONS: ${{ needs.backfill.outputs.learning_observations }}
      CIO_DECISION_OBSERVATIONS: ${{ needs.backfill.outputs.cio_decision_observations }}
      QUALIFICATION_OBSERVATIONS: ${{ needs.backfill.outputs.qualification_observations }}
      REALIZED_OUTCOMES: ${{ needs.backfill.outputs.realized_outcomes }}
      AVOIDED_LOSSES: ${{ needs.backfill.outputs.avoided_losses }}
      MISSED_OPPORTUNITIES: ${{ needs.backfill.outputs.missed_opportunities }}
    steps:
      - name: Publish durable certification ledger
        shell: bash
        run: |
          set -euo pipefail
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          COMPLETED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [[ "${VALIDATION_RESULT}" == "success" && "${BACKFILL_RESULT}" == "success" ]]; then
            STATE="completed"
            STATUS_STATE="success"
            DESCRIPTION="obs=${LEARNING_OBSERVATIONS} realized=${REALIZED_OUTCOMES} canonical=${CANONICAL_INVOKED}/${TOTAL_CUTOFFS} blocked=${BLOCKED_CUTOFFS}"
          else
            STATE="failed"
            STATUS_STATE="failure"
            DESCRIPTION="Historical certification failed: validate=${VALIDATION_RESULT} backfill=${BACKFILL_RESULT}"
          fi
          value() {
            local raw="$1"
            if [[ -n "${raw}" ]]; then printf '%s' "${raw}"; else printf 'unavailable'; fi
          }
          BODY=$(cat <<EOF
          ## Current certification state

          **State:** ${STATE}

          - **Commit:** \`${TARGET_SHA}\`
          - **Workflow run:** [#${GITHUB_RUN_ID}](${RUN_URL})
          - **Completed at:** \`${COMPLETED_AT}\`
          - **Validation result:** \`${VALIDATION_RESULT}\`
          - **Backfill/replay result:** \`${BACKFILL_RESULT}\`

          ## Archive certification

          - Records written: **$(value "${RECORDS_WRITTEN}")**
          - Strict-replay records: **$(value "${STRICT_RECORDS}")**
          - Relevant replay records: **$(value "${RELEVANT_RECORDS}")**
          - Price records: **$(value "${PRICE_RECORDS}")**
          - Macro records: **$(value "${MACRO_RECORDS}")**

          ## Canonical CIO replay

          - Canonical cutoffs invoked: **$(value "${CANONICAL_INVOKED}") / $(value "${TOTAL_CUTOFFS}")**
          - Blocked cutoffs: **$(value "${BLOCKED_CUTOFFS}")**
          - Archive scans: **$(value "${ARCHIVE_SCANS}")**
          - Runtime version: \`$(value "${RUNTIME_VERSION}")\`

          ## Governed historical learning

          - Total learning observations: **$(value "${LEARNING_OBSERVATIONS}")**
          - CIO decision observations: **$(value "${CIO_DECISION_OBSERVATIONS}")**
          - Pre-CIO qualification observations: **$(value "${QUALIFICATION_OBSERVATIONS}")**
          - Observations with realized outcomes: **$(value "${REALIZED_OUTCOMES}")**
          - Avoided losses: **$(value "${AVOIDED_LOSSES}")**
          - Missed opportunities: **$(value "${MISSED_OPPORTUNITIES}")**

          Pre-CIO qualification outcomes remain explicitly distinct from CIO decisions. Raw underlying returns and decision-relative outcome values are both retained in the protected evidence artifact.

          ## Permanent safety boundary

          - Research only: **true**
          - Execution authorized: **false**
          - Paper execution authorized: **false**
          - Real money authorized: **false**
          - Policy promotion authorized: **false**
          - Performance claims authorized: **false**

          The complete compressed archive and reports are retained in the protected workflow artifact. Provider payloads, credentials, simulated returns, and security-sensitive details are not published here.
          EOF
          )
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/${CERTIFICATION_ISSUE_NUMBER}" \
            -f body="${BODY}" >/dev/null
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="${STATUS_STATE}" \
            -f context=historical-replay/canonical-cio \
            -f description="${DESCRIPTION:0:140}" \
            -f target_url="${RUN_URL}" >/dev/null || true
