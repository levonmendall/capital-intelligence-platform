name: Apply operating intelligence integration

on:
  push:
    branches:
      - agent/complete-informative-operating-surfaces
    paths:
      - .github/operating-intelligence-update-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/complete-informative-operating-surfaces
          fetch-depth: 0
      - name: Apply updates
        run: python tools/apply_operating_intelligence_updates.py
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py educational_market_briefing_ui.py operating_intelligence_ui.py providers/economic_snapshot.py production_context_publication_governed.py tests/test_educational_market_briefing.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Integrate connected operating intelligence"
            git push origin HEAD:agent/complete-informative-operating-surfaces
          fi
