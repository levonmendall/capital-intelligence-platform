name: Apply CIO acquisition target fix

on:
  push:
    branches:
      - agent/adaptive-robust-growth-ensemble
    paths:
      - .github/workflows/apply-cio-acquisition-target-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/adaptive-robust-growth-ensemble
          fetch-depth: 0
      - name: Apply and compile
        run: |
          python .github/agent_payload/fix_cio_acquisition_target.py
          python -m py_compile cio/service.py
      - name: Commit fix
        run: |
          rm -f .github/agent_payload/fix_cio_acquisition_target.py
          rm -f .github/workflows/apply-cio-acquisition-target-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Preserve full-conviction acquisition sizing"
          git push origin HEAD:agent/adaptive-robust-growth-ensemble
