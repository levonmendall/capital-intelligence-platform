name: Apply portfolio-first UI redesign

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: portfolio-first-ui-redesign
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/run-portfolio-first-ui-materialization'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply reviewed interface patch
        shell: bash
        run: |
          set -euo pipefail
          parts=(
            .github/agent_payload/portfolio-first-ui-patch-00.part
            .github/agent_payload/portfolio-first-ui-patch-01.part
            .github/agent_payload/portfolio-first-ui-patch-02.part
            .github/agent_payload/portfolio-first-ui-patch-03.part
            .github/agent_payload/portfolio-first-ui-patch-04.part
            .github/agent_payload/portfolio-first-ui-patch-05.part
            .github/agent_payload/portfolio-first-ui-patch-06.part
            .github/agent_payload/portfolio-first-ui-patch-07.part
          )
          for part in "${parts[@]}"; do
            test -s "$part"
          done
          cat "${parts[@]}" > /tmp/portfolio-first-ui.patch
          # The daily/economic presentation file was already committed directly to main.
          # Apply the remaining reviewed files without attempting to replay that hunk.
          git apply --exclude=concise_operating_intelligence_ui.py --check /tmp/portfolio-first-ui.patch
          git apply --exclude=concise_operating_intelligence_ui.py /tmp/portfolio-first-ui.patch
          rm -f \
            .github/agent_payload/portfolio-first-ui.tar.gz.b64 \
            .github/agent_payload/portfolio-first-ui-00.b64 \
            .github/agent_payload/portfolio-first-ui-01.b64 \
            .github/agent_payload/portfolio-first-ui-02.b64 \
            .github/agent_payload/portfolio-first-ui-03.b64 \
            .github/agent_payload/portfolio-first-ui-04.b64 \
            .github/agent_payload/portfolio-first-ui-05.b64 \
            "${parts[@]}" \
            .github/portfolio-first-ui-materialization.trigger \
            .github/workflows/apply-portfolio-first-ui-redesign.yml

      - name: Validate interface implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            app.py \
            premium_ui.py \
            concise_operating_intelligence_ui.py \
            navigation_ui.py \
            cio_report_history_ui.py \
            live_operating_console.py \
            historical_replay_ui.py
          python -m pip install --disable-pip-version-check --quiet pytest
          pytest -q \
            tests/test_portfolio_education_ui.py \
            tests/test_concise_operating_intelligence_ui.py \
            tests/test_surface_information_hierarchy.py \
            tests/test_premium_streamlit_interface.py \
            tests/test_live_streamlit_navigation.py

      - name: Commit redesign to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Refine portfolio-first investment education interface'
          git push origin HEAD:main
