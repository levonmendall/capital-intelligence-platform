name: Apply full-universe screening orchestration

on:
  pull_request:
    paths:
      - .github/workflows/apply-full-universe-screening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out patch staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/export-full-universe-screening
          persist-credentials: true

      - name: Reconstruct and verify validated patch
        run: |
          cat .github/patches/full-universe-screening-{00..02}.b64 \
            | base64 --decode \
            > /tmp/full-universe-screening.patch.gz
          echo 'e9390dbfd0125a95900edc02a528a10de6307aab0382a2dc8d3c590d9d0dba73  /tmp/full-universe-screening.patch.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/full-universe-screening.patch.gz > /tmp/full-universe-screening.patch
          echo 'c9cd223b709a195ca9abcaa4fe31fad5a7dbe2d8798968208599d72873750e67  /tmp/full-universe-screening.patch' | sha256sum --check

      - name: Check out product branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/full-universe-screening-orchestration
          persist-credentials: true

      - name: Apply exact orchestration patch
        run: patch -p1 --forward --batch < /tmp/full-universe-screening.patch

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt
          python -m pip check
          python scripts/verify_requirements_lock.py

      - name: Validate exact updated branch
        run: |
          python -m compileall -q .
          python initialize.py
          python run_intelligence.py
          python run_regime.py
          pytest -q

      - name: Commit validated full-universe orchestration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            README.md \
            ROADMAP.md \
            docs/OPERATIONS.md \
            docs/OPERATIONAL_SLOS.md \
            docs/FULL_UNIVERSE_SCREENING.md \
            screening/__init__.py \
            screening/orchestration.py \
            run_full_universe_screening.py \
            tests/test_full_universe_screening.py \
            tests/test_run_full_universe_screening.py
          git commit -m 'Add complete-universe screening orchestration'
          git push origin HEAD:agent/full-universe-screening-orchestration