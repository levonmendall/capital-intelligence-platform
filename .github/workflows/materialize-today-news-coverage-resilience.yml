name: Materialize Today News Coverage Resilience

on:
  push:
    branches:
      - fix/today-news-coverage-resilience
    paths:
      - scripts/materialize_today_news_coverage_resilience.py
      - scripts/repair_today_news_coverage_materializer.py
      - .github/workflows/materialize-today-news-coverage-resilience.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/materialize_today_news_coverage_resilience.py
      - scripts/repair_today_news_coverage_materializer.py
      - .github/workflows/materialize-today-news-coverage-resilience.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-today-news-coverage-resilience
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}
      MATERIALIZATION_REVISION: "3"
      CAPITAL_INTELLIGENCE_DAILY_STAGE_BINDINGS: ${{ github.workspace }}/deploy/canonical-daily-stage-bindings.validation.json
    steps:
      - name: Check out repair branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: fix/today-news-coverage-resilience
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Repair one-use materializer
        run: python scripts/repair_today_news_coverage_materializer.py

      - name: Apply reviewed Today coverage repair
        run: python scripts/materialize_today_news_coverage_resilience.py

      - name: Install locked runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt

      - name: Validate collection, recency, retention and presentation contracts
        run: |
          python -m compileall -q .
          git diff --check
          pytest -q \
            tests/test_public_live_collection_runtime.py \
            tests/test_public_live_information.py \
            tests/test_public_live_information_runtime.py \
            tests/test_educational_market_briefing.py \
            tests/test_public_event_recency_runtime.py \
            tests/test_today_story_retention_runtime.py \
            tests/test_today_news_coverage_resilience.py \
            tests/test_today_event_alignment_runtime.py \
            tests/test_today_development_card_format_runtime.py \
            tests/test_today_environment_storytelling.py \
            tests/test_autonomous_paper_operator.py

      - name: Publish final repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/materialize_today_news_coverage_resilience.py
          git rm -f scripts/repair_today_news_coverage_materializer.py
          git rm -f .github/workflows/materialize-today-news-coverage-resilience.yml
          git add -A
          git commit -m "Keep Today populated with resilient current news coverage"
          git push origin HEAD:fix/today-news-coverage-resilience
