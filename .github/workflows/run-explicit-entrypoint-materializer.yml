name: Run explicit entrypoint materializer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'fix/explicit-streamlit-entrypoints'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/explicit-streamlit-entrypoints
          fetch-depth: 0
      - name: Apply corrected materializer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/materialize-explicit-streamlit-entrypoints.yml')
          text = workflow.read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          script = dedent(text[start:end])
          lines = script.splitlines(keepends=True)
          page_blocks = [
              index
              for index, line in enumerate(lines)
              if "page_config = '''st.set_page_config" in line
          ]
          if len(page_blocks) < 2:
              raise SystemExit(f'expected two page configuration blocks, found {len(page_blocks)}')
          block_start = page_blocks[-1]
          block_end = next(
              index
              for index in range(block_start + 1, len(lines))
              if "start = source.find('def _authorized_source()" in lines[index]
          )
          indentation = lines[block_start][: len(lines[block_start]) - len(lines[block_start].lstrip())]
          replacement = [
              indentation + "page_config_start = source.find('st.set_page_config(\\n')\n",
              indentation + "if page_config_start >= 0:\n",
              indentation + "    next_section = source.find('\\n\\n@st.cache_resource', page_config_start)\n",
              indentation + "    if next_section < 0:\n",
              indentation + "        raise SystemExit('secure_app page configuration boundary mismatch')\n",
              indentation + "    source = source[:page_config_start] + source[next_section + 2:]\n",
          ]
          corrected = ''.join(lines[:block_start] + replacement + lines[block_end:])
          exec(compile(corrected, '<explicit-entrypoint-materializer>', 'exec'), {'__name__': '__main__'})

          def replace_test_function(path_value: str, name: str, body: str) -> None:
              path = Path(path_value)
              source = path.read_text(encoding='utf-8')
              start = source.index(f'def {name}(')
              next_function = source.find('\ndef ', start + 4)
              end = len(source) if next_function < 0 else next_function + 1
              replacement_source = dedent(body).strip() + '\n\n'
              path.write_text(
                  source[:start] + replacement_source + source[end:],
                  encoding='utf-8',
              )

          replace_test_function(
              'tests/test_concise_operating_intelligence_ui.py',
              'test_app_uses_synopsis_first_operating_presenter',
              '''
              def test_app_uses_synopsis_first_operating_presenter() -> None:
                  source = Path("app_impl.py").read_text(encoding="utf-8")

                  assert "from concise_operating_intelligence_ui import (" in source
                  assert "render_today_market_brief" in source
                  assert "render_environment_economic_brief" in source
                  assert "render_today_opportunity_scan" in source
                  assert "render_history_decision_accountability" in source
                  assert "render_information_freshness" in source
              ''',
          )
          replace_test_function(
              'tests/test_educational_market_briefing.py',
              'test_app_places_connected_intelligence_at_surface_entry',
              '''
              def test_app_places_connected_intelligence_at_surface_entry() -> None:
                  source = Path("app_impl.py").read_text(encoding="utf-8")

                  assert "render_today_market_brief" in source
                  assert "render_environment_economic_brief" in source
                  assert "render_today_opportunity_scan" in source
                  assert "render_history_decision_accountability" in source
                  assert "render_information_freshness" in source
                  assert "operating intelligence insertion point is unavailable" not in source
                  assert "render_today_market_brief(briefing=briefing)" in source
                  assert "render_environment_economic_brief(briefing=latest_briefing)" in source
              ''',
          )
          replace_test_function(
              'tests/test_live_operating_console.py',
              'test_app_wires_all_four_surfaces_to_live_refresh_and_reports',
              '''
              def test_app_wires_all_four_surfaces_to_live_refresh_and_reports() -> None:
                  source = open("app_impl.py", encoding="utf-8").read()

                  for surface in (
                      "_render_today",
                      "_render_environment",
                      "_render_portfolio",
                      "_render_history",
                  ):
                      assert surface in source
                  assert source.count('@st.fragment(run_every="30s")') == 4
                  assert "render_live_market_status(" in source
                  assert "render_live_environment_market_table(" in source
                  assert "render_live_portfolio_marks(" in source
                  assert "render_operating_report_history(" in source
                  assert "render_pending_transaction_report(" in source
              ''',
          )
          replace_test_function(
              'tests/test_live_streamlit_navigation.py',
              'test_live_entrypoint_installs_navigation_before_application_execution',
              '''
              def test_live_entrypoint_installs_navigation_before_application_execution() -> None:
                  source = (ROOT / "app.py").read_text(encoding="utf-8")

                  import_position = source.index(
                      "from navigation_ui import install as _install_navigation_ui"
                  )
                  install_position = source.index("_install_navigation_ui(_premium_ui)")
                  implementation_position = source.index("import app_impl as _app_impl")
                  render_position = source.index("_app_impl.render_application(**kwargs)")

                  assert import_position < install_position < implementation_position < render_position
                  assert "exec(compile" not in source
              ''',
          )
          replace_test_function(
              'tests/test_paper_trading_ui_approval.py',
              'test_authenticated_app_passes_principal_to_consent_controls',
              '''
              def test_authenticated_app_passes_principal_to_consent_controls() -> None:
                  implementation = (ROOT / "app_impl.py").read_text(encoding="utf-8")
                  secure = (ROOT / "secure_app.py").read_text(encoding="utf-8")

                  assert "from paper_trading_ui import render_paper_decision_controls" in implementation
                  assert "render_paper_decision_controls(" in implementation
                  assert "principal=principal" in implementation
                  assert "get_mandate_details_fn=bindings[\"get_mandate_details\"]" in secure
                  assert "get_portfolio_totals_fn=bindings[\"get_portfolio_totals\"]" in secure
                  assert "get_trade_history_fn=bindings[\"get_trade_history\"]" in secure
                  assert "exec(compile" not in secure
              ''',
          )
          replace_test_function(
              'tests/test_premium_streamlit_interface.py',
              'test_secure_app_source_adapter_remains_compatible',
              '''
              def test_secure_app_source_adapter_remains_compatible() -> None:
                  app = (ROOT / "app.py").read_text(encoding="utf-8")
                  implementation = (ROOT / "app_impl.py").read_text(encoding="utf-8")
                  secure = (ROOT / "secure_app.py").read_text(encoding="utf-8")

                  assert "import app_impl as _app_impl" in app
                  assert "def render_application(" in implementation
                  assert "def run_authenticated_app(" in secure
                  assert "from app import render_application" in secure
                  assert "configure_page=False" in secure
                  assert "exec(compile" not in app
                  assert "exec(compile" not in secure
              ''',
          )
          Path('tests/test_secure_streamlit_entrypoint.py').write_text(
              dedent('''
              """Regression checks for explicit authenticated Streamlit execution."""

              from pathlib import Path


              ROOT = Path(__file__).resolve().parents[1]


              def test_direct_entrypoint_configures_the_page_before_rendering() -> None:
                  entrypoint = (ROOT / "app.py").read_text(encoding="utf-8")

                  assert "def render_application(" in entrypoint
                  assert "if configure_page:" in entrypoint
                  assert "st.set_page_config(" in entrypoint
                  assert "_app_impl.render_application(**kwargs)" in entrypoint
                  assert "exec(compile" not in entrypoint


              def test_authenticated_entrypoint_owns_page_configuration_once() -> None:
                  secure = (ROOT / "secure_app.py").read_text(encoding="utf-8")

                  assert "def run_authenticated_app(" in secure
                  assert "if configure_page:" in secure
                  assert "st.set_page_config(" in secure
                  assert "render_application(" in secure
                  assert "configure_page=False" in secure
                  assert "exec(compile" not in secure


              def test_implementation_accepts_explicit_authorized_bindings() -> None:
                  implementation = (ROOT / "app_impl.py").read_text(encoding="utf-8")

                  assert "st.set_page_config(" not in implementation
                  assert "def render_application(" in implementation
                  assert "get_mandate_details_fn" in implementation
                  assert "get_portfolio_totals_fn" in implementation
                  assert "get_trade_history_fn" in implementation
                  compile(implementation, "app_impl.py", "exec")
              ''').lstrip(),
              encoding='utf-8',
          )
          replace_test_function(
              'tests/test_streamlit_ui_import_resilience.py',
              'test_streamlit_entrypoint_preserves_secure_portfolio_bindings',
              '''
              def test_streamlit_entrypoint_preserves_secure_portfolio_bindings() -> None:
                  entrypoint = (ROOT / "app.py").read_text(encoding="utf-8")
                  implementation = (ROOT / "app_impl.py").read_text(encoding="utf-8")
                  secure = (ROOT / "secure_app.py").read_text(encoding="utf-8")

                  assert "import app_impl as _app_impl" in entrypoint
                  assert "_app_impl.render_application(**kwargs)" in entrypoint
                  assert "get_mandate_details_fn" in implementation
                  assert "get_portfolio_totals_fn" in implementation
                  assert "get_trade_history_fn" in implementation
                  assert "_authorized_bindings(principal)" in secure
                  assert "exec(compile" not in entrypoint
                  assert "exec(compile" not in secure
              ''',
          )

          for filename in (
              '.github/workflows/materialize-explicit-streamlit-entrypoints.yml',
              '.github/workflows/repair-explicit-streamlit-materializer.yml',
              '.github/workflows/run-explicit-entrypoint-materializer.yml',
              '.explicit-streamlit-entrypoints-applied',
          ):
              Path(filename).unlink(missing_ok=True)
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-dev.txt
      - name: Compile entrypoints
        run: python -m compileall -q app.py app_impl.py secure_app.py render_app.py tests/test_explicit_streamlit_entrypoints.py
      - name: Run complete repository suite
        run: python -m pytest -q --maxfail=10
      - name: Commit validated entrypoints
        shell: bash
        run: |
          set -euo pipefail
          rm -f database/worker-heartbeat.json
          git add -A
          git commit -m "Replace nested Streamlit source execution"
          git push origin HEAD:fix/explicit-streamlit-entrypoints
