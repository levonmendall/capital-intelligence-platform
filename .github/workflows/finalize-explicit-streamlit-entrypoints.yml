name: Finalize explicit Streamlit entrypoints

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'fix/explicit-streamlit-entrypoints'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/explicit-streamlit-entrypoints
          fetch-depth: 0
      - name: Materialize and repair generated contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/run-explicit-entrypoint-materializer.yml')
          text = workflow.read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          script = dedent(text[start:end])
          exec(compile(script, '<final-explicit-entrypoint-materializer>', 'exec'), {'__name__': '__main__'})

          test = Path('tests/test_paper_trading_ui_approval.py')
          source = test.read_text(encoding='utf-8')
          source = source.replace(
              'assert "get_mandate_details_fn=bindings["get_mandate_details"]" in secure',
              'assert \'get_mandate_details_fn=bindings["get_mandate_details"]\' in secure',
          )
          source = source.replace(
              'assert "get_portfolio_totals_fn=bindings["get_portfolio_totals"]" in secure',
              'assert \'get_portfolio_totals_fn=bindings["get_portfolio_totals"]\' in secure',
          )
          source = source.replace(
              'assert "get_trade_history_fn=bindings["get_trade_history"]" in secure',
              'assert \'get_trade_history_fn=bindings["get_trade_history"]\' in secure',
          )
          test.write_text(source, encoding='utf-8')

          for filename in (
              '.github/workflows/materialize-explicit-streamlit-entrypoints.yml',
              '.github/workflows/repair-explicit-streamlit-materializer.yml',
              '.github/workflows/run-explicit-entrypoint-materializer.yml',
              '.github/workflows/finalize-explicit-streamlit-entrypoints.yml',
              '.explicit-streamlit-entrypoints-applied',
          ):
              Path(filename).unlink(missing_ok=True)
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-dev.txt
      - name: Compile entrypoints and tests
        run: python -m compileall -q app.py app_impl.py secure_app.py render_app.py tests
      - name: Run complete repository suite
        run: python -m pytest -q --maxfail=10
      - name: Commit validated entrypoints
        shell: bash
        run: |
          set -euo pipefail
          rm -f database/worker-heartbeat.json
          git add -A
          git commit -m "Replace nested Streamlit source execution"
          git push origin HEAD:fix/explicit-streamlit-entrypoints
