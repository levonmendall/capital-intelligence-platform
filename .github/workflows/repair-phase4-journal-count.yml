name: Repair Phase 4 Journal Count

on:
  push:
    branches:
      - feature/committee-cio-v2-phase4-accountability
    paths:
      - .github/workflows/repair-phase4-journal-count.yml
      - scripts/repair_phase4_journal_count.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: feature/committee-cio-v2-phase4-accountability
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - run: python scripts/repair_phase4_journal_count.py
      - run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt
      - run: pytest -q tests/test_canonical_cio_cycle.py tests/test_construction_decision_reconciliation.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_canonical_cio_cycle.py
          git rm scripts/repair_phase4_journal_count.py
          git rm .github/workflows/repair-phase4-journal-count.yml
          git commit -m "Align canonical journal count with construction reconciliation"
          git push origin HEAD:feature/committee-cio-v2-phase4-accountability
