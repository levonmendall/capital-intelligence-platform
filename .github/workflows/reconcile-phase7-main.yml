name: Reconcile Phase 7 with Main

on:
  push:
    branches:
      - feature/committee-cio-v2-phase7-governance-learning
    paths:
      - .github/workflows/reconcile-phase7-main.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Phase 7
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: feature/committee-cio-v2-phase7-governance-learning
          fetch-depth: 0

      - name: Merge current main and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge --no-edit origin/main; then
            echo "Unresolved files:"
            git diff --name-only --diff-filter=U
            git diff --cc
            exit 1
          fi
          git rm .github/workflows/reconcile-phase7-main.yml
          git commit --amend --no-edit
          git push origin HEAD:feature/committee-cio-v2-phase7-governance-learning
