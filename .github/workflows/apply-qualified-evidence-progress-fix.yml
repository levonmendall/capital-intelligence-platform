name: Apply qualified evidence progress fix

on:
  push:
    branches:
      - agent/register-qualified-evidence-progress-stage

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add branch-only surgical repair helper'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/register-qualified-evidence-progress-stage
      - name: Apply surgical progress contract repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('operations/manual_cio_diagnostic.py')
          source = path.read_text(encoding='utf-8')
          old = '        "canonical_portfolio_initialization",\n        "public_information_collection",\n'
          new = '        "canonical_portfolio_initialization",\n        "qualified_evidence_consumption",\n        "public_information_collection",\n'
          if old not in source:
              raise SystemExit('expected progress-stage registry anchor not found')
          if '        "qualified_evidence_consumption",\n' not in source:
              source = source.replace(old, new, 1)
              path.write_text(source, encoding='utf-8')

          test = Path('tests/test_qualified_evidence_progress_stage_registration.py')
          test.write_text('''from __future__ import annotations\n\nfrom datetime import datetime, timezone\n\nfrom operations.manual_cio_diagnostic import (\n    claim_manual_cio_diagnostic,\n    record_manual_cio_diagnostic_progress,\n    request_manual_cio_diagnostic,\n)\n\n\nNOW = datetime(2026, 8, 16, 20, 58, tzinfo=timezone.utc)\n\n\ndef test_qualified_evidence_consumption_progress_stage_is_registered(tmp_path) -> None:\n    values = {\n        "CAPITAL_INTELLIGENCE_DATA_DIR": str(tmp_path),\n        "CAPITAL_INTELLIGENCE_MANUAL_CIO_DIAGNOSTIC_PROGRESS_ENABLED": "true",\n    }\n    request_manual_cio_diagnostic(\n        requested_by="render-release:qualified-evidence-progress",\n        now=NOW,\n        values=values,\n    )\n    claimed = claim_manual_cio_diagnostic(now=NOW, values=values)\n    assert claimed is not None\n\n    updated = record_manual_cio_diagnostic_progress(\n        "qualified_evidence_consumption",\n        values=values,\n    )\n\n    assert updated is not None\n    assert updated.progress_stage == "qualified_evidence_consumption"\n    assert updated.detail == "governed_progress=qualified_evidence_consumption"\n    assert updated.to_dict()["paper_only"] is True\n    assert updated.to_dict()["real_money_authorized"] is False\n''', encoding='utf-8')
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operations/manual_cio_diagnostic.py tests/test_qualified_evidence_progress_stage_registration.py
          git diff --cached --check
          git commit -m "Register qualified evidence consumption progress stage"
          git push origin HEAD:agent/register-qualified-evidence-progress-stage
