name: Apply provider productionization

on:
  push:
    branches:
      - agent/provider-productionization
    paths:
      - ".provider-productionization-release/**"
      - ".github/workflows/apply-provider-productionization.yml"
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-provider-productionization
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/provider-productionization'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/provider-productionization
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and extract release payload
        shell: bash
        run: |
          set -euo pipefail
          cat .provider-productionization-release/chunk-* > /tmp/provider-productionization.tar.gz.b64
          base64 --decode /tmp/provider-productionization.tar.gz.b64 > /tmp/provider-productionization.tar.gz
          echo "7381618497da8a6bec505d6b39a70fddd68b61f0f9c70f23cb01d503f9f5de0c  /tmp/provider-productionization.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/provider-productionization.tar.gz -C .
          rm -rf .provider-productionization-release
          rm -f .github/workflows/apply-provider-productionization.yml

      - name: Commit productionized provider stack
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Productionize configured data providers"
          git push origin HEAD:agent/provider-productionization
