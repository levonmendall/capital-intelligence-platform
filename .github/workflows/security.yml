name: Security Review

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    # Same exact-tag Render deploy escape hatch as release validation.
    if: >-
      ${{
        github.event_name != 'push' ||
        !contains(github.event.head_commit.message, '[render-ci-bypass]')
      }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false

      # GitHub CodeQL code scanning is free for public repositories. For a private
      # user-owned repository without GitHub Code Security, keep this required job
      # meaningful with a local Python SAST fallback instead of failing on an
      # unavailable platform entitlement. CodeQL resumes automatically if the
      # repository is public again.
      - name: Initialize CodeQL
        if: ${{ !github.event.repository.private }}
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: python

      - name: Analyze with CodeQL
        if: ${{ !github.event.repository.private }}
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7

      - name: Set up Python for private-repository SAST
        if: ${{ github.event.repository.private }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install private-repository SAST
        if: ${{ github.event.repository.private }}
        run: python -m pip install --upgrade pip "bandit>=1.8,<2"

      - name: Run private-repository Python SAST
        if: ${{ github.event.repository.private }}
        run: bandit -r . -x ./tests -lll -iii

  advisory-audits:
    if: >-
      ${{
        github.event_name != 'push' ||
        !contains(github.event.head_commit.message, '[render-ci-bypass]')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependency auditor
        run: python -m pip install --upgrade pip "pip-audit>=2.9,<3"

      - name: Block vulnerable Python dependencies
        run: pip-audit -r requirements.lock --progress-spinner off --strict

      - name: Build security image
        run: docker build -t capital-intelligence:security .

      - name: Capture high and critical container findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: capital-intelligence:security
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Publish container scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-results
          path: trivy-results.json
          if-no-files-found: error
          retention-days: 7

      - name: Block fixable critical container findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: capital-intelligence:security
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
