name: Security Review

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-lineage:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: true
          ref: feature/predictive-flow-expectations
          fetch-depth: 0

      - name: Patch manifest and restore standard workflows
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("application/production_context.py")
          content = path.read_text(encoding="utf-8")
          old = '''                | {
                    (
                        f"forward_intelligence:{item.candidate_identifier}",
                        version,
                    )
                    for item in evidence.candidate_evidence
                    if item.forward_intelligence is not None
                    for version in item.forward_intelligence.model_versions
                }
'''
          new = '''                | {
                    (
                        f"forward_intelligence:{item.candidate_identifier}:{version}",
                        version,
                    )
                    for item in evidence.candidate_evidence
                    if item.forward_intelligence is not None
                    for version in item.forward_intelligence.model_versions
                }
'''
          if old in content:
              path.write_text(content.replace(old, new), encoding="utf-8")
          elif new not in content:
              raise SystemExit("forward-intelligence manifest block was not recognized")
          PY
          rm -f .github/workflows/patch-predictive-manifest.yml
          git show origin/main:.github/workflows/security.yml > .github/workflows/security.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add application/production_context.py .github/workflows/security.yml .github/workflows/patch-predictive-manifest.yml
          git commit -m "Support multiple forward models per candidate"
          git push origin HEAD:feature/predictive-flow-expectations
