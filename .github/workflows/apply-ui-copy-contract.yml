name: Apply UI copy contract

on:
  push:
    branches:
      - pr-155-distinct-command-surfaces
    paths:
      - .github/workflows/apply-ui-copy-contract.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr-155-distinct-command-surfaces
          fetch-depth: 0
      - name: Preserve interface principle contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('premium_ui.py')
          source = path.read_text(encoding='utf-8')
          old = '''APP_SUBTITLE = (
              "A living capital-allocation command system for one governed portfolio."
          )'''
          new = '''APP_SUBTITLE = (
              "A living capital-allocation command system for one governed portfolio. "
              "The interface stays quiet until evidence earns attention."
          )'''
          if source.count(old) != 1:
              raise SystemExit('expected interface subtitle not found exactly once')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
      - name: Commit focused correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-ui-copy-contract.yml
          git add premium_ui.py
          git commit -m "Preserve interface principle contract"
          git push origin HEAD:pr-155-distinct-command-surfaces
