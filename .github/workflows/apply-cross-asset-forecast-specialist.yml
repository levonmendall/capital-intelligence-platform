name: Apply Cross-Asset Forecast Specialist

on:
  push:
    branches:
      - agent/add-cross-asset-forecast-specialist
    paths:
      - .github/workflows/apply-cross-asset-forecast-specialist.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-cross-asset-forecast-specialist
          fetch-depth: 0

      - name: Verify and apply specialist patch
        shell: bash
        run: |
          set -euo pipefail
          cat .agent/cross_asset_patch.part-* > /tmp/cross_asset_patch.b64
          echo "a178b1f173a79240b32fbc1cc00fb1c73a0d818d770ae790044b34d3d496f50e  /tmp/cross_asset_patch.b64" | sha256sum --check --strict
          base64 --decode /tmp/cross_asset_patch.b64 | gzip --decompress > /tmp/cross_asset.patch
          git apply --check /tmp/cross_asset.patch
          git apply /tmp/cross_asset.patch
          rm -rf .agent
          rm -f .github/workflows/apply-cross-asset-forecast-specialist.yml

      - name: Commit exact implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add cross-asset forecast and scenario specialist"
          git push origin HEAD:agent/add-cross-asset-forecast-specialist
