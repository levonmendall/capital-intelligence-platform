name: Materialize EODHD Crypto Venue Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'fix/eodhd-crypto-venue-classification'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Check out correction branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply venue classification correction
        run: python .github/scripts/apply_eodhd_crypto_venue_fix.py

      - name: Install locked and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Compile affected runtime
        run: |
          python -m py_compile \
            operations/comprehensive_market_discovery.py \
            tests/test_comprehensive_market_discovery.py \
            production_context_publication_governed.py \
            run_autonomous_paper_operator.py

      - name: Run focused regressions
        run: |
          python -m pytest -q \
            tests/test_comprehensive_market_discovery.py \
            tests/test_weekend_discovery_schedule.py \
            tests/test_eodhd_provider.py

      - name: Run isolated live weekend CIO pass
        env:
          CAPITAL_INTELLIGENCE_ENVIRONMENT: development
          CAPITAL_INTELLIGENCE_DATA_DIR: ${{ runner.temp }}/capital-intelligence-crypto-fix
          CAPITAL_INTELLIGENCE_SCHEDULER_TIMEZONE: America/Los_Angeles
          CAPITAL_INTELLIGENCE_SCHEDULER_HOUR: '7'
          CAPITAL_INTELLIGENCE_SCHEDULER_TIMES: '07:00'
          CAPITAL_INTELLIGENCE_PAPER_EXECUTION_MODE: automatic
          CAPITAL_INTELLIGENCE_RUN_PROVIDER_VALIDATION_ON_STARTUP: 'false'
          CAPITAL_INTELLIGENCE_PROVIDER_VALIDATION_REQUIRED: 'false'
          CAPITAL_INTELLIGENCE_PUBLIC_LIVE_COLLECTION_ENABLED: 'true'
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          APCA_API_BASE_URL: https://paper-api.alpaca.markets
          APCA_DATA_BASE_URL: https://data.alpaca.markets
          APCA_DATA_FEED: iex
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
          CAPITAL_INTELLIGENCE_EODHD_API_TOKEN: ${{ secrets.CAPITAL_INTELLIGENCE_EODHD_API_TOKEN }}
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          CAPITAL_INTELLIGENCE_DATABENTO_API_KEY: ${{ secrets.CAPITAL_INTELLIGENCE_DATABENTO_API_KEY }}
          SEC_USER_AGENT: Capital Intelligence Platform levonmendall2369@gmail.com
        shell: bash
        run: |
          mkdir -p "$CAPITAL_INTELLIGENCE_DATA_DIR" reports
          python initialize.py
          set -o pipefail
          python run_autonomous_paper_operator.py --once --force-public-collection \
            | tee reports/eodhd-crypto-fix-cio.jsonl
          python - <<'PY'
          import json
          from pathlib import Path

          payload = None
          for line in Path('reports/eodhd-crypto-fix-cio.jsonl').read_text(encoding='utf-8').splitlines():
              line = line.strip()
              if not line.startswith('{'):
                  continue
              try:
                  candidate = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if isinstance(candidate, dict) and 'cycle' in candidate:
                  payload = candidate
          if payload is None:
              raise SystemExit('CIO operator did not emit a governed result')
          context = payload.get('production_context_publication') or {}
          cycle = payload.get('cycle') or {}
          print(json.dumps({
              'operator_status': payload.get('status'),
              'context_state': context.get('state'),
              'context_detail': context.get('detail'),
              'candidate_count': context.get('candidate_count'),
              'instrument_count': context.get('instrument_count'),
              'cycle_status': cycle.get('status'),
              'cycle_detail': cycle.get('detail'),
              'paper_execution': (payload.get('paper_execution') or {}).get('state'),
              'paper_only': payload.get('paper_only'),
              'real_money_authorized': payload.get('real_money_authorized'),
          }, indent=2, sort_keys=True))
          if context.get('state') not in {'ready', 'reused'}:
              raise SystemExit('Production context did not become ready')
          if cycle.get('status') != 'completed':
              raise SystemExit('CIO cycle did not complete')
          if payload.get('paper_only') is not True:
              raise SystemExit('Paper-only invariant failed')
          if payload.get('real_money_authorized') is not False:
              raise SystemExit('Real-money authority invariant failed')
          PY

      - name: Remove temporary materializer files
        run: |
          rm -f .github/scripts/apply_eodhd_crypto_venue_fix.py
          rm -f .github/workflows/materialize-eodhd-crypto-venue-fix.yml

      - name: Commit validated correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Classify EODHD CC records as crypto'
          git push origin HEAD:fix/eodhd-crypto-venue-classification
