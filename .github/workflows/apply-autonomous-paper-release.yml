name: Apply Autonomous Paper Release

on:
  workflow_dispatch:
  push:
    branches:
      - agent/start-autonomous-paper-trading
    paths:
      - ".autonomous-paper-release/**"
      - ".github/workflows/apply-autonomous-paper-release.yml"

permissions:
  contents: write

concurrency:
  group: apply-autonomous-paper-release
  cancel-in-progress: false

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/start-autonomous-paper-trading
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify and apply exact payload
        shell: bash
        run: |
          set -euo pipefail
          cat .autonomous-paper-release/chunk-* > "$RUNNER_TEMP/autonomous-paper-release.b64"
          base64 --decode "$RUNNER_TEMP/autonomous-paper-release.b64" > "$RUNNER_TEMP/autonomous-paper-release.tar.gz"
          printf '%s  %s\n' \
            'a713efd78a38dc5818e70231f491dae389564665f10b14a3308d55566092cc04' \
            "$RUNNER_TEMP/autonomous-paper-release.tar.gz" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/autonomous-paper-release.tar.gz" --directory .
          rm -rf .autonomous-paper-release
          rm -f .github/workflows/export-autonomous-paper-source.yml
          rm -f .github/workflows/apply-autonomous-paper-release.yml

      - name: Verify exact product diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          cat > "$RUNNER_TEMP/expected-files.txt" <<'EOF'
          README.md
          config/free_paper_pilot.env.example
          config/free_paper_pilot_universe.json
          deploy/production.env.example
          deploy/staging.env.example
          docker-compose.yml
          docs/CANONICAL_DAILY_OPERATIONS.md
          docs/FREE_PAPER_PILOT.md
          docs/PAPER_TRADING_AUTHORITY_MODEL.md
          docs/USER_APPROVED_PAPER_EXECUTION.md
          paper_execution_runtime.py
          paper_trading_ui.py
          run_autonomous_paper_operator.py
          run_free_paper_pilot.py
          run_free_paper_pilot_universe.py
          streamlit_paper_execution_worker.py
          tests/test_autonomous_paper_operator.py
          tests/test_free_paper_pilot.py
          tests/test_paper_trading_ui_approval.py
          tests/test_streamlit_paper_execution_worker.py
          EOF
          git diff --name-only origin/main...HEAD > "$RUNNER_TEMP/preexisting-files.txt"
          git diff --name-only > "$RUNNER_TEMP/working-files.txt"
          cat "$RUNNER_TEMP/preexisting-files.txt" "$RUNNER_TEMP/working-files.txt" \
            | grep -v '^\.autonomous-paper-release/' \
            | grep -v '^\.github/workflows/export-autonomous-paper-source.yml$' \
            | grep -v '^\.github/workflows/apply-autonomous-paper-release.yml$' \
            | sort -u > "$RUNNER_TEMP/actual-files.txt"
          sort -u "$RUNNER_TEMP/expected-files.txt" -o "$RUNNER_TEMP/expected-files.txt"
          diff -u "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/actual-files.txt"
          git diff --check

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Compile application
        run: python -m compileall -q .

      - name: Run focused autonomous paper tests
        run: |
          python -m pytest -q \
            tests/test_autonomous_paper_operator.py \
            tests/test_streamlit_paper_execution_worker.py \
            tests/test_paper_trading_ui_approval.py \
            tests/test_free_paper_pilot.py \
            --maxfail=1

      - name: Run complete repository suite
        run: python -m pytest -q --maxfail=1

      - name: Confirm transport cleanup
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .autonomous-paper-release
          test ! -e .github/workflows/export-autonomous-paper-source.yml
          test ! -e .github/workflows/apply-autonomous-paper-release.yml
          git diff --check

      - name: Publish clean implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "capital-intelligence-release-bot"
          git config user.email "capital-intelligence-release-bot@users.noreply.github.com"
          git add -A
          git commit -m "Start autonomous paper trading without launch ceremony"
          git push origin HEAD:agent/start-autonomous-paper-trading
