name: Retry immediate paper-test access

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'policy/remove-paper-burn-in' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out policy branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: policy/remove-paper-burn-in
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply embedded migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/apply-immediate-paper-access.yml')
          text = workflow.read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("          PY\n", start)
          lines = text[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith('          ') else line for line in lines) + "\n"
          exec(compile(script, str(workflow), 'exec'), {'__name__': '__main__'})
          Path('.github/workflows/retry-immediate-paper-access.yml').unlink()
          PY

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt

      - name: Validate migration surface
        shell: bash
        run: |
          python -m compileall -q governance operations portfolio providers *.py tests
          python -m pytest -q \
            tests/test_immediate_paper_access.py \
            tests/test_streamlit_paper_execution_worker.py \
            tests/test_paper_trading_launch.py \
            tests/test_paper_test_campaign.py
          ! git grep -n "requires exact entry, launch, and runtime authorities" -- . ':!docs/archive/**'
          ! git grep -n "paper execution requires exact authority versions" -- . ':!docs/archive/**'

      - name: Commit immediate paper access
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove paper-test launch clearance"
          git push origin HEAD:policy/remove-paper-burn-in
