name: Materialize Committee CIO V2 Phase 1

on:
  push:
    branches:
      - feature/committee-cio-v2-phase1

permissions:
  contents: write

concurrency:
  group: materialize-committee-cio-v2-phase1
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out phase branch
        uses: actions/checkout@v4
        with:
          ref: feature/committee-cio-v2-phase1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply economic-qualification consistency correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_exact_count(path: str, old: str, new: str, expected: int) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} matches, found {count}: {old[:80]!r}"
                  )
              target.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "cio/service.py",
              'version: str = "cio-synthesis.v7-growth"',
              'version: str = "cio-synthesis.v8-economic-consistency"',
          )
          replace_exact_count(
              "cio/service.py",
              "allow_soft_failures=progressive_lane,",
              "allow_soft_failures=False,",
              2,
          )
          replace_once(
              "cio/service.py",
              '''        if (\n            not progressive_lane\n            and robustness.effective_probability_of_success\n            < profile.minimum_probability_of_success\n        ):''',
              '''        if (\n            robustness.effective_probability_of_success\n            < profile.minimum_probability_of_success\n        ):''',
          )
          replace_once(
              "cio/service.py",
              '''        if (\n            not progressive_lane\n            and robustness.evidence_adjusted_return\n            < profile.minimum_net_expected_return\n        ):''',
              '''        if (\n            robustness.evidence_adjusted_return\n            < profile.minimum_net_expected_return\n        ):''',
          )
          replace_once(
              "cio/service.py",
              "        if not progressive_lane and opportunity_edge < profile.minimum_opportunity_edge:",
              "        if opportunity_edge < profile.minimum_opportunity_edge:",
          )
          replace_once(
              "cio/service.py",
              '''\n        if portfolio.recommended_position_weight is None:\n''',
              '''\n        if robustness.stressed_edge <= 0.0:\n            if current_weight > 0.0:\n                return (\n                    CIOAction.HOLD,\n                    None,\n                    "The holding is preserved, but adverse probability stress removes its positive edge and blocks additional capital.",\n                )\n            return (\n                CIOAction.NO_SUPERIOR_OPPORTUNITY,\n                None,\n                "The candidate does not retain a positive economic edge after adverse scenario-probability stress.",\n            )\n\n        if portfolio.recommended_position_weight is None:\n''',
          )

          replace_once(
              "cio/robustness.py",
              'version: str = "robust-decision.v3"',
              'version: str = "robust-decision.v4-economic-consistency"',
          )
          replace_once(
              "cio/robustness.py",
              '''        stressed_floor = self.policy.minimum_stressed_edge\n        if policy_profile is not None:\n            stressed_floor = min(stressed_floor, -0.001)\n''',
              '''        stressed_floor = self.policy.minimum_stressed_edge\n''',
          )
          replace_once(
              "cio/robustness.py",
              '''        Full acquisitions require every robustness control. Participation and\n        exploration may treat edge, stress, uncertainty, and probability-of-loss\n        shortfalls as sizing inputs. Scenario integrity and worst-case portfolio\n        loss remain hard portfolio-survival constraints.\n''',
              '''        Canonical positive allocations require every robustness control. The\n        allow_soft_failures parameter remains only for backward-compatible research\n        diagnostics and must not be enabled by CIO allocation paths.\n''',
          )

          replace_once(
              "opportunity/engine.py",
              'version: str = "opportunity-qualification.v6-growth"',
              'version: str = "opportunity-qualification.v7-economic-consistency"',
          )
          replace_once(
              "opportunity/engine.py",
              '''                        f"{lane.value} lane: hard evidence, liquidity, downside, cost, and integrity controls passed",\n''',
              '''                        f"{lane.value} research lane: hard evidence, liquidity, downside, cost, and integrity controls passed; this lane is non-authoritative and cannot receive positive canonical capital until all economic qualification and robustness controls clear",\n''',
          )

          replace_once(
              "tests/test_adaptive_robust_growth_ensemble.py",
              '''def test_cio_uses_ensemble_and_progressive_lanes() -> None:\n    source = Path("cio/service.py").read_text(encoding="utf-8")\n    assert "AdaptiveRobustGrowthEnsemble" in source\n    assert 'progressive_lane = str(analysis_lane).lower()' in source\n    assert "ensemble.minimum_target_weight" in source\n    assert "effective_position_multiplier" in source\n    assert "if not progressive_lane:" in source\n    assert "growth_cap = (" in source\n    assert "if progressive_lane" in source\n''',
              '''def test_cio_keeps_progressive_lanes_research_only_below_economic_hurdles() -> None:\n    source = Path("cio/service.py").read_text(encoding="utf-8")\n    assert "AdaptiveRobustGrowthEnsemble" in source\n    assert 'progressive_lane = str(analysis_lane).lower()' in source\n    assert "ensemble.minimum_target_weight" in source\n    assert "effective_position_multiplier" in source\n    assert source.count("allow_soft_failures=False") == 2\n    assert "robustness.stressed_edge <= 0.0" in source\n    assert "growth_cap = (" in source\n    assert "if progressive_lane" in source\n''',
          )
          replace_once(
              "tests/test_opportunity_engine.py",
              '''    assert qualification.analysis_lane in {\n        AnalysisLane.PARTICIPATION,\n        AnalysisLane.EXPLORATION,\n    }\n    assert any(reason_fragment in reason for reason in qualification.reasons)\n''',
              '''    assert qualification.analysis_lane in {\n        AnalysisLane.PARTICIPATION,\n        AnalysisLane.EXPLORATION,\n    }\n    assert any("research lane" in reason for reason in qualification.reasons)\n    assert any(reason_fragment in reason for reason in qualification.reasons)\n''',
          )

          Path("tests/test_progressive_lane_economic_authority.py").write_text(
              '''from __future__ import annotations\n\nfrom dataclasses import replace\n\nfrom cio import CIOAction, CandidateAssetClass, ChiefInvestmentOfficer\nfrom opportunity import AnalysisLane, OpportunityEngine\nfrom tests.test_decision_quality_reconciliation import _candidate, _context, _packet\n\n\ndef test_progressive_lane_cannot_authorize_capital_below_canonical_hurdles() -> None:\n    candidate = _candidate(\n        "RESEARCHPROBE",\n        base=0.05,\n        bull=0.10,\n        bear=-0.02,\n    )\n    candidate = replace(\n        candidate,\n        instrument=replace(\n            candidate.instrument,\n            asset_class=CandidateAssetClass.US_ETF,\n            economic_exposure_class=CandidateAssetClass.CRYPTO,\n            replication_method="us-listed-economic-exposure-wrapper",\n            instrument_type="etf",\n        ),\n    )\n    qualification = OpportunityEngine().qualify(candidate, _context())\n\n    assert qualification.qualified\n    assert qualification.analysis_lane in {\n        AnalysisLane.PARTICIPATION,\n        AnalysisLane.EXPLORATION,\n    }\n\n    packet = _packet(candidate, duplicate_origins=False)\n    packet = replace(\n        packet,\n        analyses=tuple(\n            replace(analysis, expected_return_impact=0.0, scenario_adjustments=())\n            for analysis in packet.analyses\n        ),\n    )\n    decision = ChiefInvestmentOfficer().synthesize(\n        candidate,\n        qualification.universe,\n        packet,\n        capital_comparison=qualification.capital_comparison,\n        analysis_lane=qualification.analysis_lane.value,\n    )\n\n    assert decision.action in {\n        CIOAction.NO_SUPERIOR_OPPORTUNITY,\n        CIOAction.WATCH,\n    }\n    assert decision.recommended_position_weight is None\n    assert decision.action not in {CIOAction.BUY, CIOAction.INCREASE}\n\n\ndef test_cio_source_has_no_progressive_soft_failure_allocation_path() -> None:\n    source = __import__("pathlib").Path("cio/service.py").read_text(encoding="utf-8")\n    assert "allow_soft_failures=progressive_lane" not in source\n    assert source.count("allow_soft_failures=False") == 2\n    assert "not progressive_lane\\n            and robustness.evidence_adjusted_return" not in source\n    assert "not progressive_lane and opportunity_edge" not in source\n''',
              encoding="utf-8",
          )
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run focused Phase 1 validation
        run: |
          python -m py_compile cio/service.py cio/robustness.py opportunity/engine.py
          python -m pytest -q \
            tests/test_opportunity_engine.py \
            tests/test_adaptive_robust_growth_ensemble.py \
            tests/test_progressive_lane_economic_authority.py \
            tests/test_decision_process_upgrade.py

      - name: Commit materialized source and remove one-use workflow
        shell: bash
        run: |
          rm .github/workflows/materialize-committee-cio-v2-phase1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enforce economic qualification for every positive allocation"
          git push origin HEAD:feature/committee-cio-v2-phase1
