name: Fix runtime market authority binding

on:
  push:
    branches:
      - feature/universal-investable-ownership

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/universal-investable-ownership
          fetch-depth: 0
      - name: Bind exact market authority and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("application/production_context_executor.py")
          text = path.read_text(encoding="utf-8")
          old = """        authority_universe = _candidate_authority_universe(self, context=context)\n        publication_snapshot = _publication_snapshot(self, context=context)\n"""
          new = """        market_authority = CanonicalMarketParticipationAuthority.load()\n        authority_universe = _candidate_authority_universe(self, context=context)\n        publication_snapshot = _publication_snapshot(self, context=context)\n"""
          if old not in text:
              raise SystemExit("runtime authority insertion point was not found")
          text = text.replace(old, new, 1)
          if text.count("market_authority = CanonicalMarketParticipationAuthority.load()") != 1:
              raise SystemExit("runtime market authority binding is not unique")
          path.write_text(text, encoding="utf-8")
          PY
          git rm .github/workflows/fix-runtime-market-authority.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add application/production_context_executor.py
          git commit -m "Bind runtime market authority before CIO candidate loading"
          git push origin HEAD:feature/universal-investable-ownership
