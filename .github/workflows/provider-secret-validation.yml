name: Validate Provider Secrets

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/provider-secret-validation.yml"
      - "providers/provider_credentials.py"
      - "providers/environment_aliases.py"
      - "providers/__init__.py"
      - "run_provider_secret_validation.py"
      - "tests/test_provider_credentials.py"
      - "tests/test_provider_environment_aliases.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/provider-secret-validation.yml"
      - "providers/provider_credentials.py"
      - "providers/environment_aliases.py"
      - "providers/__init__.py"
      - "run_provider_secret_validation.py"
      - "tests/test_provider_credentials.py"
      - "tests/test_provider_environment_aliases.py"

permissions:
  contents: read

concurrency:
  group: provider-secret-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}

      # Alpha Vantage aliases.
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}

      # Alpaca paper credentials.
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      APCA_API_BASE_URL: https://paper-api.alpaca.markets
      APCA_DATA_BASE_URL: https://data.alpaca.markets
      APCA_DATA_FEED: iex

      # Databento aliases.
      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
      CAPITAL_INTELLIGENCE_DATABENTO_API_KEY: ${{ secrets.CAPITAL_INTELLIGENCE_DATABENTO_API_KEY }}

      # EODHD aliases.
      EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
      EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
      CAPITAL_INTELLIGENCE_EODHD_API_TOKEN: ${{ secrets.CAPITAL_INTELLIGENCE_EODHD_API_TOKEN }}

      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      # OpenFIGI aliases.
      OPEN_FIGI_API_KEY: ${{ secrets.OPEN_FIGI_API_KEY }}
      OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}

      # Twelve Data aliases.
      TWELVE_API_KEY: ${{ secrets.TWELVE_API_KEY }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked runtime dependencies
        run: pip install --require-hashes -r requirements.lock

      - name: Validate all configured provider credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python run_provider_secret_validation.py \
            --require-all \
            --output reports/provider-secret-validation.json

      - name: Publish credential-safe summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path("reports/provider-secret-validation.json")
          if not source.exists():
              summary = "Provider secret validation did not produce a report.\n"
          else:
              payload = json.loads(source.read_text(encoding="utf-8"))
              lines = [
                  f"state={payload.get('state')}",
                  f"configured_provider_count={payload.get('configured_provider_count', 0)}",
                  f"passed_provider_count={payload.get('passed_provider_count', 0)}",
                  f"blockers={'; '.join(payload.get('blockers', [])) or 'none'}",
              ]
              for provider in payload.get("providers", []):
                  lines.append(
                      f"{provider.get('provider')}="
                      f"{'passed' if provider.get('passed') else 'blocked'} "
                      f"via {provider.get('selected_credential') or 'none'}"
                  )
              summary = "\n".join(lines) + "\n"
          with Path(__import__('os').environ['GITHUB_STEP_SUMMARY']).open(
              'a', encoding='utf-8'
          ) as handle:
              handle.write("## Provider secret validation\n\n```text\n" + summary + "```\n")
          PY

      - name: Upload credential-safe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-secret-validation
          path: reports/provider-secret-validation.json
          if-no-files-found: warn
          retention-days: 14
