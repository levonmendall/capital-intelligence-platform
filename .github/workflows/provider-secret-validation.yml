name: Validate Provider Secrets

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/provider-secret-validation.yml"
      - "config/cme_span_datamine_file_ids.json"
      - "provider_environment.py"
      - "providers/cme_datamine_span.py"
      - "providers/free_derivative_risk.py"
      - "providers/provider_credentials.py"
      - "providers/provider_activation_audit.py"
      - "providers/supplemental_quotes.py"
      - "providers/environment_aliases.py"
      - "providers/__init__.py"
      - "run_provider_secret_validation.py"
      - "tests/test_cme_datamine_span.py"
      - "tests/test_provider_credentials.py"
      - "tests/test_provider_environment_aliases.py"
      - "tests/test_provider_environment_activation.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/provider-secret-validation.yml"
      - "config/cme_span_datamine_file_ids.json"
      - "provider_environment.py"
      - "providers/cme_datamine_span.py"
      - "providers/free_derivative_risk.py"
      - "providers/provider_credentials.py"
      - "providers/provider_activation_audit.py"
      - "providers/supplemental_quotes.py"
      - "providers/environment_aliases.py"
      - "providers/__init__.py"
      - "run_provider_secret_validation.py"
      - "tests/test_cme_datamine_span.py"
      - "tests/test_provider_credentials.py"
      - "tests/test_provider_environment_aliases.py"
      - "tests/test_provider_environment_activation.py"

permissions:
  contents: read

concurrency:
  group: provider-secret-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}

      # Alpha Vantage aliases.
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      CAPITAL_INTELLIGENCE_ALPHA_VANTAGE_API_KEY: ${{ secrets.CAPITAL_INTELLIGENCE_ALPHA_VANTAGE_API_KEY }}

      # Alpaca paper/market-data credentials.
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_MARKET_DATA_API_KEY: ${{ secrets.ALPACA_MARKET_DATA_API_KEY }}
      CAPITAL_INTELLIGENCE_ALPACA_MARKET_DATA_API_KEY: ${{ secrets.CAPITAL_INTELLIGENCE_ALPACA_MARKET_DATA_API_KEY }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      ALPACA_MARKET_DATA_API_SECRET: ${{ secrets.ALPACA_MARKET_DATA_API_SECRET }}
      CAPITAL_INTELLIGENCE_ALPACA_MARKET_DATA_API_SECRET: ${{ secrets.CAPITAL_INTELLIGENCE_ALPACA_MARKET_DATA_API_SECRET }}
      APCA_API_BASE_URL: https://paper-api.alpaca.markets
      APCA_DATA_BASE_URL: https://data.alpaca.markets
      APCA_DATA_FEED: iex

      # Massive / Polygon-compatible aliases.
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      CAPITAL_INTELLIGENCE_MASSIVE_API_KEY: ${{ secrets.CAPITAL_INTELLIGENCE_MASSIVE_API_KEY }}
      CAPITAL_INTELLIGENCE_MASSIVE_OPTIONS_API_KEY: ${{ secrets.CAPITAL_INTELLIGENCE_MASSIVE_OPTIONS_API_KEY }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}

      # Tradier aliases used by the current repository secret inventory.
      TRADIER_API_KEY: ${{ secrets.TRADIER_API_KEY }}
      TRADIER_API_TOKEN: ${{ secrets.TRADIER_API_TOKEN }}
      TRADIER_ACCESS_TOKEN: ${{ secrets.TRADIER_ACCESS_TOKEN }}
      CAPITAL_INTELLIGENCE_TRADIER_API_KEY: ${{ secrets.CAPITAL_INTELLIGENCE_TRADIER_API_KEY }}
      CAPITAL_INTELLIGENCE_TRADIER_API_TOKEN: ${{ secrets.CAPITAL_INTELLIGENCE_TRADIER_API_TOKEN }}

      # EODHD aliases.
      EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
      EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
      CAPITAL_INTELLIGENCE_EODHD_API_KEY: ${{ secrets.CAPITAL_INTELLIGENCE_EODHD_API_KEY }}
      CAPITAL_INTELLIGENCE_EODHD_API_TOKEN: ${{ secrets.CAPITAL_INTELLIGENCE_EODHD_API_TOKEN }}

      # OpenFIGI aliases.
      OPEN_FIGI_API_KEY: ${{ secrets.OPEN_FIGI_API_KEY }}
      OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
      CAPITAL_INTELLIGENCE_OPENFIGI_API_KEY: ${{ secrets.CAPITAL_INTELLIGENCE_OPENFIGI_API_KEY }}

      # Twelve Data aliases.
      TWELVE_API_KEY: ${{ secrets.TWELVE_API_KEY }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      CAPITAL_INTELLIGENCE_TWELVE_DATA_API_KEY: ${{ secrets.CAPITAL_INTELLIGENCE_TWELVE_DATA_API_KEY }}

      # Public/economic provider credentials, including the exact alias families
      # visible in the current repository secret list.
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      CAPITAL_INTELLIGENCE_FRED_API_KEY: ${{ secrets.CAPITAL_INTELLIGENCE_FRED_API_KEY }}
      BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
      CAPITAL_INTELLIGENCE_BEA_API_KEY: ${{ secrets.CAPITAL_INTELLIGENCE_BEA_API_KEY }}
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
      US_CENSUS_API_KEY: ${{ secrets.US_CENSUS_API_KEY }}
      CAPITAL_INTELLIGENCE_CENSUS_API_KEY: ${{ secrets.CAPITAL_INTELLIGENCE_CENSUS_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      CAPITAL_INTELLIGENCE_EIA_API_KEY: ${{ secrets.CAPITAL_INTELLIGENCE_EIA_API_KEY }}
      USDA_NASS_API_KEY: ${{ secrets.USDA_NASS_API_KEY }}
      CAPITAL_INTELLIGENCE_USDA_NASS_API_KEY: ${{ secrets.CAPITAL_INTELLIGENCE_USDA_NASS_API_KEY }}
      NASA_FIRMS_MAP_KEY: ${{ secrets.NASA_FIRMS_MAP_KEY }}
      NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
      CAPITAL_INTELLIGENCE_NASA_FIRMS_MAP_KEY: ${{ secrets.CAPITAL_INTELLIGENCE_NASA_FIRMS_MAP_KEY }}

      # FINRA API Platform OAuth aliases.
      FINRA_CLIENT_ID: ${{ secrets.FINRA_CLIENT_ID }}
      CAPITAL_INTELLIGENCE_FINRA_CLIENT_ID: ${{ secrets.CAPITAL_INTELLIGENCE_FINRA_CLIENT_ID }}
      FINRA_API_CLIENT_ID: ${{ secrets.FINRA_API_CLIENT_ID }}
      FINRA_API_KEY_ID: ${{ secrets.FINRA_API_KEY_ID }}
      FINRA_CLIENT_SECRET: ${{ secrets.FINRA_CLIENT_SECRET }}
      CAPITAL_INTELLIGENCE_FINRA_CLIENT_SECRET: ${{ secrets.CAPITAL_INTELLIGENCE_FINRA_CLIENT_SECRET }}
      FINRA_API_CLIENT_SECRET: ${{ secrets.FINRA_API_CLIENT_SECRET }}
      FINRA_API_SECRET: ${{ secrets.FINRA_API_SECRET }}
      FINRA_API_SECRET_KEY: ${{ secrets.FINRA_API_SECRET_KEY }}
      FINRA_API_KEY: ${{ secrets.FINRA_API_KEY }}
      FINRA_API_TOKEN: ${{ secrets.FINRA_API_TOKEN }}
      CAPITAL_INTELLIGENCE_FINRA_API_TOKEN: ${{ secrets.CAPITAL_INTELLIGENCE_FINRA_API_TOKEN }}

      # CME exact-futures integration slots. Presence is audited but does not make
      # CME active until the production consumer, rights, and certification exist.
      CAPITAL_INTELLIGENCE_CME_MARKET_DATA_API_KEY: ${{ secrets.CAPITAL_INTELLIGENCE_CME_MARKET_DATA_API_KEY }}
      CAPITAL_INTELLIGENCE_CME_MARKET_DATA_BINDING: ${{ secrets.CAPITAL_INTELLIGENCE_CME_MARKET_DATA_BINDING }}
      CAPITAL_INTELLIGENCE_CME_MARKET_DATA_CONTRACT_REFERENCE: ${{ secrets.CAPITAL_INTELLIGENCE_CME_MARKET_DATA_CONTRACT_REFERENCE }}
      CAPITAL_INTELLIGENCE_CME_MARKET_DATA_LICENSE_APPROVAL: ${{ secrets.CAPITAL_INTELLIGENCE_CME_MARKET_DATA_LICENSE_APPROVAL }}
      CAPITAL_INTELLIGENCE_CME_MARKET_DATA_CERTIFICATION_ID: ${{ secrets.CAPITAL_INTELLIGENCE_CME_MARKET_DATA_CERTIFICATION_ID }}

      # CME DataMine SPAN entitlement. The repository-local catalog contains only
      # non-secret file-ID patterns supplied by CME; API credentials stay external.
      CAPITAL_INTELLIGENCE_CME_MARGIN_BINDING: config/cme_span_datamine_file_ids.json
      CAPITAL_INTELLIGENCE_CME_DATAMINE_API_ID: ${{ secrets.CAPITAL_INTELLIGENCE_CME_DATAMINE_API_ID }}
      CAPITAL_INTELLIGENCE_CME_DATAMINE_API_PASSWORD: ${{ secrets.CAPITAL_INTELLIGENCE_CME_DATAMINE_API_PASSWORD }}
      CME_DATAMINE_API_ID: ${{ secrets.CME_DATAMINE_API_ID }}
      CME_DATAMINE_API_PASSWORD: ${{ secrets.CME_DATAMINE_API_PASSWORD }}
      CME_API_ID: ${{ secrets.CME_API_ID }}
      CME_API_PASSWORD: ${{ secrets.CME_API_PASSWORD }}

      # Optional institutional provider keys declared by the all-market bundle.
      CAPITAL_INTELLIGENCE_LSEG_MARKET_DATA_API_KEY: ${{ secrets.CAPITAL_INTELLIGENCE_LSEG_MARKET_DATA_API_KEY }}
      LSEG_MARKET_DATA_API_KEY: ${{ secrets.LSEG_MARKET_DATA_API_KEY }}
      CAPITAL_INTELLIGENCE_LSEG_REFERENCE_API_KEY: ${{ secrets.CAPITAL_INTELLIGENCE_LSEG_REFERENCE_API_KEY }}
      LSEG_REFERENCE_API_KEY: ${{ secrets.LSEG_REFERENCE_API_KEY }}
      CAPITAL_INTELLIGENCE_LSEG_FUNDAMENTALS_API_KEY: ${{ secrets.CAPITAL_INTELLIGENCE_LSEG_FUNDAMENTALS_API_KEY }}
      LSEG_FUNDAMENTALS_API_KEY: ${{ secrets.LSEG_FUNDAMENTALS_API_KEY }}
      CAPITAL_INTELLIGENCE_ICE_FIXED_INCOME_API_KEY: ${{ secrets.CAPITAL_INTELLIGENCE_ICE_FIXED_INCOME_API_KEY }}
      ICE_FIXED_INCOME_API_KEY: ${{ secrets.ICE_FIXED_INCOME_API_KEY }}
      CAPITAL_INTELLIGENCE_ICE_MARGIN_API_KEY: ${{ secrets.CAPITAL_INTELLIGENCE_ICE_MARGIN_API_KEY }}
      ICE_MARGIN_API_KEY: ${{ secrets.ICE_MARGIN_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked runtime dependencies
        run: pip install --require-hashes -r requirements.lock

      - name: Validate required live provider credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python run_provider_secret_validation.py \
            --require-all \
            --output reports/provider-secret-validation.json

      - name: Audit provider activation and routing
        if: always()
        shell: bash
        run: |
          mkdir -p reports
          python -m providers.provider_activation_audit > reports/provider-activation-audit.json

      - name: Publish credential-safe summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          validation_source = Path("reports/provider-secret-validation.json")
          if not validation_source.exists():
              validation = "Provider secret validation did not produce a report.\n"
          else:
              payload = json.loads(validation_source.read_text(encoding="utf-8"))
              lines = [
                  f"state={payload.get('state')}",
                  f"configured_provider_count={payload.get('configured_provider_count', 0)}",
                  f"passed_provider_count={payload.get('passed_provider_count', 0)}",
                  f"blockers={'; '.join(payload.get('blockers', [])) or 'none'}",
              ]
              for provider in payload.get("providers", []):
                  lines.append(
                      f"{provider.get('provider')}="
                      f"{'passed' if provider.get('passed') else 'blocked'} "
                      f"via {provider.get('selected_credential') or 'none'}"
                  )
              validation = "\n".join(lines) + "\n"

          activation_source = Path("reports/provider-activation-audit.json")
          if not activation_source.exists():
              activation = "Provider activation audit did not produce a report.\n"
          else:
              payload = json.loads(activation_source.read_text(encoding="utf-8"))
              lines = [
                  f"counts={payload.get('counts', {})}",
                  f"unrouted={', '.join(payload.get('unrouted_provider_ids', [])) or 'none'}",
                  f"missing_credentials={', '.join(payload.get('missing_credential_provider_ids', [])) or 'none'}",
              ]
              activation = "\n".join(lines) + "\n"

          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as handle:
              handle.write("## Provider secret validation\n\n```text\n" + validation + "```\n")
              handle.write("\n## Provider activation audit\n\n```text\n" + activation + "```\n")
          PY

      - name: Upload credential-safe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provider-secret-validation
          path: |
            reports/provider-secret-validation.json
            reports/provider-activation-audit.json
          if-no-files-found: warn
          retention-days: 14
