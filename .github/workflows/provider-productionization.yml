name: Provider Productionization

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/provider-productionization.yml"
      - "config/databento_instrument_bindings.all_markets.json"
      - "provider_runtime_diagnostics.py"
      - "providers/databento.py"
      - "providers/supplemental_quotes.py"
      - "run_databento_catalog.py"
      - "run_eodhd_binding_expansion.py"
      - "run_provider_runtime_diagnostics.py"
      - "run_provider_technical_certification.py"
      - "run_supplemental_quote_crosscheck.py"
      - "tests/test_databento_provider.py"
      - "tests/test_eodhd_binding_expansion.py"
      - "tests/test_provider_runtime_diagnostics.py"
      - "tests/test_provider_technical_certification.py"
      - "tests/test_supplemental_quotes.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/provider-productionization.yml"
      - "config/databento_instrument_bindings.all_markets.json"
      - "provider_runtime_diagnostics.py"
      - "providers/databento.py"
      - "providers/supplemental_quotes.py"
      - "run_databento_catalog.py"
      - "run_eodhd_binding_expansion.py"
      - "run_provider_runtime_diagnostics.py"
      - "run_provider_technical_certification.py"
      - "run_supplemental_quote_crosscheck.py"
      - "tests/test_databento_provider.py"
      - "tests/test_eodhd_binding_expansion.py"
      - "tests/test_provider_runtime_diagnostics.py"
      - "tests/test_provider_technical_certification.py"
      - "tests/test_supplemental_quotes.py"

permissions:
  contents: read

concurrency:
  group: provider-productionization-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      GITHUB_ACTIONS: "true"

      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}

      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      APCA_API_BASE_URL: https://paper-api.alpaca.markets
      APCA_DATA_BASE_URL: https://data.alpaca.markets
      APCA_DATA_FEED: iex

      DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
      CAPITAL_INTELLIGENCE_DATABENTO_API_KEY: ${{ secrets.CAPITAL_INTELLIGENCE_DATABENTO_API_KEY }}
      CAPITAL_INTELLIGENCE_DATABENTO_INSTRUMENT_BINDINGS: config/databento_instrument_bindings.all_markets.json

      EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
      EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
      CAPITAL_INTELLIGENCE_EODHD_API_TOKEN: ${{ secrets.CAPITAL_INTELLIGENCE_EODHD_API_TOKEN }}
      CAPITAL_INTELLIGENCE_EODHD_BINDINGS: config/eodhd_instrument_bindings.all_markets.json

      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      OPEN_FIGI_API_KEY: ${{ secrets.OPEN_FIGI_API_KEY }}
      OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
      TWELVE_API_KEY: ${{ secrets.TWELVE_API_KEY }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked runtime dependencies
        run: pip install --require-hashes -r requirements.lock

      - name: Install development dependencies
        run: pip install -r requirements-dev.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run focused provider productionization tests
        run: |
          python -m pytest -q \
            tests/test_databento_provider.py \
            tests/test_eodhd_binding_expansion.py \
            tests/test_provider_runtime_diagnostics.py \
            tests/test_provider_technical_certification.py \
            tests/test_supplemental_quotes.py

      - name: Validate configured credentials
        run: |
          mkdir -p reports
          python run_provider_secret_validation.py \
            --require-all \
            --output reports/provider-secret-validation.json

      - name: Inspect runtime provider availability
        run: |
          python run_provider_runtime_diagnostics.py \
            --environment-name github_actions \
            --output reports/provider-runtime-diagnostics.json

      - name: Inspect Databento entitlements and schemas
        run: |
          python run_databento_catalog.py \
            --output reports/databento-capability-report.json

      - name: Cross-check supplemental quotes
        run: |
          python run_supplemental_quote_crosscheck.py \
            --symbol AAPL \
            --maximum-divergence-bps 250 \
            --output reports/supplemental-quote-crosscheck.json

      - name: Assemble technical certification
        run: |
          python run_provider_technical_certification.py \
            --credential-report reports/provider-secret-validation.json \
            --runtime-report reports/provider-runtime-diagnostics.json \
            --databento-report reports/databento-capability-report.json \
            --output reports/provider-technical-certification.json \
            --require-technical-ready

      - name: Publish credential-safe summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          names = (
              "provider-secret-validation.json",
              "provider-runtime-diagnostics.json",
              "databento-capability-report.json",
              "supplemental-quote-crosscheck.json",
              "provider-technical-certification.json",
          )
          lines = []
          for name in names:
              path = Path("reports") / name
              if not path.exists():
                  lines.append(f"{name}=missing")
                  continue
              payload = json.loads(path.read_text(encoding="utf-8"))
              lines.append(f"{name}={payload.get('state', 'generated')}")
              if name == "databento-capability-report.json":
                  lines.append(
                      f"databento_dataset_count={payload.get('dataset_count', 0)}"
                  )
                  lines.append(
                      "databento_available_binding_count="
                      f"{payload.get('available_binding_count', 0)}"
                  )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("## Provider productionization\n\n```text\n")
              handle.write("\n".join(lines) + "\n```\n")
          PY

      - name: Upload credential-safe provider evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-productionization
          path: reports/*.json
          if-no-files-found: warn
          retention-days: 30
