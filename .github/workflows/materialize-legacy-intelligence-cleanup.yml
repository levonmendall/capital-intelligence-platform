name: Materialize Legacy Intelligence Cleanup

on:
  push:
    branches:
      - cleanup/remove-legacy-intelligence-stack
    paths:
      - scripts/materialize_legacy_intelligence_cleanup.py
      - .github/workflows/materialize-legacy-intelligence-cleanup.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/materialize_legacy_intelligence_cleanup.py
      - .github/workflows/materialize-legacy-intelligence-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-legacy-intelligence-cleanup
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      CAPITAL_INTELLIGENCE_DAILY_STAGE_BINDINGS: ${{ github.workspace }}/deploy/canonical-daily-stage-bindings.validation.json
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: cleanup/remove-legacy-intelligence-stack
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply reviewed cleanup
        run: python scripts/materialize_legacy_intelligence_cleanup.py

      - name: Install locked runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt

      - name: Validate canonical authority and active recommendation contracts
        run: |
          python -m compileall -q .
          git diff --check
          python - <<'PY'
          import cio
          import intelligence
          from intelligence.recommendation import Recommendation
          assert hasattr(cio, "ChiefInvestmentOfficer")
          assert "ChiefInvestmentOfficer" not in intelligence.__all__
          assert "GuidanceSynthesizer" not in intelligence.__all__
          assert Recommendation is not None
          PY
          pytest -q \
            tests/test_canonical_cio.py \
            tests/test_decision_process_upgrade.py \
            tests/test_canonical_cio_cycle.py \
            tests/test_cio_runtime_continuity_blockers.py \
            tests/test_production_canonical_scheduler.py

      - name: Publish final cleanup source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/materialize_legacy_intelligence_cleanup.py
          git rm -f .github/workflows/materialize-legacy-intelligence-cleanup.yml
          git add -A
          git commit -m "Remove disconnected legacy intelligence decision stack"
          git push origin HEAD:cleanup/remove-legacy-intelligence-stack
