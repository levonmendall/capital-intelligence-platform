name: Repair canonical holding current marks

on:
  push:
    branches:
      - repair/canonical-holding-current-marks

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/canonical-holding-current-marks
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply narrow governed repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one patch target, found {count}")
              target.write_text(text.replace(old, new, 1))

          replace_once(
              "production_paper_evidence_impl.py",
              '''@dataclass(frozen=True, slots=True)\nclass PaperEvidenceBuildResult:\n    candidates: tuple[CandidateDecisionRecord, ...]\n    candidate_evidence: tuple[ProductionCandidateEvidence, ...]\n    holding_evidence: tuple[ProductionHoldingEvidence, ...]\n    exclusions: tuple[tuple[str, tuple[str, ...]], ...]\n    macro: MacroSpecialistContext\n''',
              '''@dataclass(frozen=True, slots=True)\nclass PaperEvidenceBuildResult:\n    candidates: tuple[CandidateDecisionRecord, ...]\n    candidate_evidence: tuple[ProductionCandidateEvidence, ...]\n    holding_evidence: tuple[ProductionHoldingEvidence, ...]\n    exclusions: tuple[tuple[str, tuple[str, ...]], ...]\n    macro: MacroSpecialistContext\n    holding_marks: tuple[tuple[str, float], ...] = ()\n''',
          )

          replace_once(
              "production_paper_evidence_impl.py",
              '''    holding_evidence = tuple(holding_values)\n    return PaperEvidenceBuildResult(\n        candidates=tuple(candidates),\n        candidate_evidence=tuple(candidate_evidence),\n        holding_evidence=holding_evidence,\n        exclusions=tuple(exclusions),\n        macro=macro,\n    )\n''',
              '''    holding_evidence = tuple(holding_values)\n    holding_marks = tuple(\n        (position.symbol, features_by_symbol[position.symbol].current_price)\n        for position in portfolio.positions\n    )\n    return PaperEvidenceBuildResult(\n        candidates=tuple(candidates),\n        candidate_evidence=tuple(candidate_evidence),\n        holding_evidence=holding_evidence,\n        exclusions=tuple(exclusions),\n        macro=macro,\n        holding_marks=holding_marks,\n    )\n''',
          )

          replace_once(
              "production_context_publication_governed.py",
              '''def _mark_portfolio(snapshot, build_result, *, decision_as_of: datetime):\n    prices = {\n        item.instrument.symbol: item.current_price\n        for item in build_result.candidates\n    }\n    missing = sorted(\n        position.symbol\n        for position in snapshot.positions\n        if position.symbol not in prices\n    )\n    if missing:\n        raise ProductionPaperEvidenceError(\n            f"current marks are unavailable for canonical holdings: {missing}"\n        )\n    return replace(\n        snapshot,\n        positions=tuple(\n            replace(\n                position,\n                mark_price=prices[position.symbol],\n                updated_at=decision_as_of,\n            )\n            for position in snapshot.positions\n        ),\n    )\n''',
              '''def _mark_portfolio(snapshot, build_result, *, decision_as_of: datetime):\n    candidate_prices = {\n        item.instrument.symbol: item.current_price\n        for item in build_result.candidates\n    }\n    canonical_symbols = {position.symbol for position in snapshot.positions}\n    raw_holding_marks = getattr(build_result, "holding_marks", ())\n    holding_prices: dict[str, float] = {}\n    try:\n        for item in raw_holding_marks:\n            if not isinstance(item, tuple) or len(item) != 2:\n                raise TypeError("holding mark entries must be (symbol, price) pairs")\n            symbol, raw_price = item\n            normalized_symbol = str(symbol).strip().upper()\n            if not normalized_symbol or isinstance(raw_price, bool):\n                raise TypeError("holding mark symbol and price are invalid")\n            price = float(raw_price)\n            if not isfinite(price) or price <= 0.0:\n                raise ValueError("holding mark prices must be finite and positive")\n            if normalized_symbol in holding_prices:\n                raise ValueError("holding mark symbols must be unique")\n            holding_prices[normalized_symbol] = price\n    except (TypeError, ValueError) as error:\n        raise ProductionPaperEvidenceError(\n            f"certified holding marks are invalid: {error}"\n        ) from error\n\n    unexpected = sorted(set(holding_prices) - canonical_symbols)\n    if unexpected:\n        raise ProductionPaperEvidenceError(\n            "certified holding marks include non-held instruments: "\n            f"{unexpected}"\n        )\n    conflicting = sorted(\n        symbol\n        for symbol in canonical_symbols\n        if symbol in candidate_prices\n        and symbol in holding_prices\n        and candidate_prices[symbol] != holding_prices[symbol]\n    )\n    if conflicting:\n        raise ProductionPaperEvidenceError(\n            "candidate and mandatory holding marks disagree for canonical holdings: "\n            f"{conflicting}"\n        )\n\n    prices = dict(candidate_prices)\n    prices.update(holding_prices)\n    missing = sorted(\n        position.symbol\n        for position in snapshot.positions\n        if position.symbol not in prices\n    )\n    if missing:\n        raise ProductionPaperEvidenceError(\n            f"current marks are unavailable for canonical holdings: {missing}"\n        )\n    return replace(\n        snapshot,\n        positions=tuple(\n            replace(\n                position,\n                mark_price=prices[position.symbol],\n                updated_at=decision_as_of,\n            )\n            for position in snapshot.positions\n        ),\n    )\n''',
          )

          replace_once(
              "tests/test_canonical_holding_evidence_reconciliation.py",
              "from datetime import datetime, timezone\n",
              "from dataclasses import dataclass\nfrom datetime import datetime, timedelta, timezone\n",
          )
          replace_once(
              "tests/test_canonical_holding_evidence_reconciliation.py",
              '''    assert result.holding_evidence == ("holding-evidence",)\n    assert result.exclusions[0][0] == mcd.instrument_identifier\n''',
              '''    assert result.holding_evidence == ("holding-evidence",)\n    assert result.holding_marks == (("MCD", 100.0),)\n    assert result.exclusions[0][0] == mcd.instrument_identifier\n''',
          )

          test_path = Path("tests/test_canonical_holding_evidence_reconciliation.py")
          test_path.write_text(
              test_path.read_text()
              + '''\n\n@dataclass(frozen=True)\nclass _TestPosition:\n    symbol: str\n    mark_price: float\n    updated_at: datetime\n\n\n@dataclass(frozen=True)\nclass _TestSnapshot:\n    positions: tuple[_TestPosition, ...]\n\n\ndef test_mark_portfolio_uses_certified_holding_mark_without_candidate_nomination():\n    as_of = datetime(2026, 8, 8, 18, 0, tzinfo=timezone.utc)\n    snapshot = _TestSnapshot(\n        positions=(\n            _TestPosition(\n                symbol="MCD",\n                mark_price=95.0,\n                updated_at=as_of - timedelta(days=1),\n            ),\n        )\n    )\n    build_result = SimpleNamespace(\n        candidates=(),\n        holding_marks=(("MCD", 100.0),),\n    )\n\n    marked = governed._mark_portfolio(\n        snapshot,\n        build_result,\n        decision_as_of=as_of,\n    )\n\n    assert marked.positions[0].mark_price == 100.0\n    assert marked.positions[0].updated_at == as_of\n    assert build_result.candidates == ()\n\n\ndef test_mark_portfolio_rejects_mark_for_non_holding():\n    as_of = datetime(2026, 8, 8, 18, 0, tzinfo=timezone.utc)\n    snapshot = _TestSnapshot(\n        positions=(_TestPosition("MCD", 95.0, as_of - timedelta(days=1)),)\n    )\n    build_result = SimpleNamespace(\n        candidates=(),\n        holding_marks=(("VTI", 200.0),),\n    )\n\n    try:\n        governed._mark_portfolio(snapshot, build_result, decision_as_of=as_of)\n    except governed.ProductionPaperEvidenceError as error:\n        assert "non-held instruments" in str(error)\n    else:\n        raise AssertionError("non-held holding mark must fail closed")\n\n\ndef test_mark_portfolio_still_fails_closed_without_certified_holding_mark():\n    as_of = datetime(2026, 8, 8, 18, 0, tzinfo=timezone.utc)\n    snapshot = _TestSnapshot(\n        positions=(_TestPosition("MCD", 95.0, as_of - timedelta(days=1)),)\n    )\n    build_result = SimpleNamespace(candidates=(), holding_marks=())\n\n    try:\n        governed._mark_portfolio(snapshot, build_result, decision_as_of=as_of)\n    except governed.ProductionPaperEvidenceError as error:\n        assert "current marks are unavailable" in str(error)\n    else:\n        raise AssertionError("missing certified holding mark must fail closed")\n'''
          )
          PY

      - name: Compile touched modules
        run: |
          python -m compileall -q \
            production_paper_evidence_impl.py \
            production_context_publication_governed.py \
            tests/test_canonical_holding_evidence_reconciliation.py
          git diff --check

      - name: Install focused test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run focused regressions
        run: python -m pytest -q tests/test_canonical_holding_evidence_reconciliation.py

      - name: Commit validated repair and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/repair-canonical-holding-current-marks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production_paper_evidence_impl.py production_context_publication_governed.py tests/test_canonical_holding_evidence_reconciliation.py .github/workflows/repair-canonical-holding-current-marks.yml
          git commit -m "Preserve certified marks for evidence-only holdings"
          git push origin HEAD:repair/canonical-holding-current-marks
