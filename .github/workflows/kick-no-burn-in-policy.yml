name: Apply no-burn-in policy from pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply embedded policy patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/apply-no-burn-in-policy.yml")
          text = workflow.read_text(encoding="utf-8")
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          lines = text[start:end].splitlines()
          script = "\n".join(
              line[10:] if line.startswith("          ") else line for line in lines
          ) + "\n"
          exec(compile(script, str(workflow), "exec"), {"__name__": "__main__"})
          Path(".github/workflows/kick-no-burn-in-policy.yml").unlink()
          PY

      - name: Verify and commit
        shell: bash
        run: |
          python -m compileall -q governance operations run_paper_test_campaign.py run_paper_trading_launch.py tests
          python - <<'PY'
          import json
          from pathlib import Path
          policy = json.loads(Path("config/paper_trading_launch_policy.json").read_text())
          assert policy["minimum_burn_in_days"] == 0
          assert policy["minimum_scheduled_cycles"] == 1
          assert policy["version"] == "paper-trading-launch-policy.v2"
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove mandatory paper-test burn-in"
          git push origin HEAD:${{ github.head_ref }}
