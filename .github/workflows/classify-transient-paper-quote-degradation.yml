name: Classify transient paper quote degradation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'fix/operational-truth-and-runtime-hardening'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/operational-truth-and-runtime-hardening
          fetch-depth: 0
      - name: Check whether correction is already applied
        id: gate
        shell: bash
        run: |
          if [[ -f .paper-quote-degradation-applied ]]; then
            echo "apply=false" >> "$GITHUB_OUTPUT"
          else
            echo "apply=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply quote-degradation boundary
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python - <<'PY'
          from pathlib import Path

          path = Path('operations/free_paper_pilot.py')
          text = path.read_text(encoding='utf-8')
          old = '''    validated: list[str] = []\n    quote_times: list[tuple[str, str]] = []\n    account_status = \"unavailable\"\n'''
          new = '''    validated: list[str] = []\n    quote_times: list[tuple[str, str]] = []\n    execution_blocks: list[str] = []\n    account_status = \"unavailable\"\n'''
          if text.count(old) != 1:
              raise SystemExit('readiness execution block declaration anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''                if bid <= 0.0 or ask <= 0.0:\n                    if market_open:\n                        raise ValueError(f\"{symbol} quote is not executable\")\n                    warnings.append(\n                        f\"{symbol}: closed-market IEX top of book is not executable; execution remains held\"\n                    )\n                elif ask < bid:\n                    raise ValueError(f\"{symbol} quote is crossed\")\n'''
          new = '''                if bid <= 0.0 or ask <= 0.0:\n                    if market_open:\n                        execution_blocks.append(\n                            f\"{symbol}: IEX top of book is not executable\"\n                        )\n                    else:\n                        warnings.append(\n                            f\"{symbol}: closed-market IEX top of book is not executable; execution remains held\"\n                        )\n                elif ask < bid:\n                    execution_blocks.append(f\"{symbol}: IEX quote is crossed\")\n'''
          if text.count(old) != 1:
              raise SystemExit('readiness quote execution anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''                if market_open and quote_reference_time - effective_observed > maximum_age:\n                    blockers.append(\n                        f\"{symbol}: live quote is older than {universe.maximum_quote_age_minutes} minutes\"\n                    )\n        except (AlpacaPaperProviderError, KeyError, TypeError, ValueError) as error:\n            blockers.append(f\"Alpaca IEX quote validation failed: {error}\")\n\n    configuration_ready = not blockers\n    execution_ready_now = configuration_ready and market_open\n'''
          new = '''                if market_open and quote_reference_time - effective_observed > maximum_age:\n                    execution_blocks.append(\n                        f\"{symbol}: live quote is older than {universe.maximum_quote_age_minutes} minutes\"\n                    )\n        except (AlpacaPaperProviderError, KeyError, TypeError, ValueError) as error:\n            execution_blocks.append(f\"Alpaca IEX quote validation failed: {error}\")\n\n    warnings.extend(\n        f\"Execution held: {detail}\" for detail in dict.fromkeys(execution_blocks)\n    )\n    configuration_ready = not blockers\n    execution_ready_now = configuration_ready and market_open and not execution_blocks\n'''
          if text.count(old) != 1:
              raise SystemExit('readiness result classification anchor mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_free_paper_pilot.py')
          source = test.read_text(encoding='utf-8')
          addition = '''\n\ndef test_market_open_non_executable_unheld_wrapper_holds_execution_not_configuration() -> None:\n    def partial_quote_http_get(url: str, **kwargs: Any) -> _Response:\n        if url.endswith(\"/v2/stocks/quotes/latest\"):\n            symbols = str(kwargs[\"params\"][\"symbols\"]).split(\",\")\n            return _Response(\n                {\n                    \"quotes\": {\n                        symbol: {\n                            \"bp\": 0.0 if symbol == \"WTPI\" else 99.9,\n                            \"ap\": 0.0 if symbol == \"WTPI\" else 100.1,\n                            \"bs\": 0 if symbol == \"WTPI\" else 500,\n                            \"as\": 0 if symbol == \"WTPI\" else 400,\n                            \"t\": (NOW - timedelta(seconds=3)).isoformat(),\n                        }\n                        for symbol in symbols\n                    }\n                }\n            )\n        return _http_get(url, **kwargs)\n\n    universe = load_free_paper_pilot_universe(\n        ROOT / \"config\" / \"free_paper_pilot_universe.json\"\n    )\n    client = AlpacaPaperClient(\n        AlpacaPaperSettings(api_key_id=\"paper-key\", secret_key=\"paper-secret\"),\n        http_get=partial_quote_http_get,\n    )\n\n    report = assess_free_paper_pilot_readiness(\n        universe=universe,\n        client=client,\n        evaluated_at=NOW,\n    )\n\n    assert report.configuration_ready\n    assert not report.execution_ready_now\n    assert not report.blockers\n    assert any(\n        \"Execution held: WTPI: IEX top of book is not executable\" in warning\n        for warning in report.warnings\n    )\n\n\ndef test_quote_provider_outage_holds_execution_without_invalidating_configuration() -> None:\n    def unavailable_quote_http_get(url: str, **kwargs: Any) -> _Response:\n        if url.endswith(\"/v2/stocks/quotes/latest\"):\n            return _Response({\"message\": \"temporarily unavailable\"}, status_code=503)\n        return _http_get(url, **kwargs)\n\n    universe = load_free_paper_pilot_universe(\n        ROOT / \"config\" / \"free_paper_pilot_universe.json\"\n    )\n    client = AlpacaPaperClient(\n        AlpacaPaperSettings(api_key_id=\"paper-key\", secret_key=\"paper-secret\"),\n        http_get=unavailable_quote_http_get,\n    )\n\n    report = assess_free_paper_pilot_readiness(\n        universe=universe,\n        client=client,\n        evaluated_at=NOW,\n    )\n\n    assert report.configuration_ready\n    assert not report.execution_ready_now\n    assert not report.blockers\n    assert any(\"Execution held: Alpaca IEX quote validation failed\" in warning for warning in report.warnings)\n'''
          if 'test_market_open_non_executable_unheld_wrapper_holds_execution_not_configuration' in source:
              raise SystemExit('quote degradation tests already present')
          test.write_text(source.rstrip() + addition + '\n', encoding='utf-8')
          Path('.paper-quote-degradation-applied').write_text('applied\n', encoding='utf-8')
          PY
      - name: Install dependencies
        if: steps.gate.outputs.apply == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-dev.txt
      - name: Compile changed runtime
        if: steps.gate.outputs.apply == 'true'
        run: python -m compileall -q operations tests/test_free_paper_pilot.py
      - name: Run complete repository suite
        if: steps.gate.outputs.apply == 'true'
        run: python -m pytest -q --maxfail=10
      - name: Commit validated correction
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f database/worker-heartbeat.json
          git add -A
          git commit -m "Classify transient paper quote degradation"
          git push origin HEAD:fix/operational-truth-and-runtime-hardening
