name: One-shot all-asset provider redundancy

on:
  push:
    branches:
      - agent/all-asset-provider-redundancy
    paths:
      - .github/workflows/one-shot-all-asset-provider-redundancy.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/all-asset-provider-redundancy
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wire all-asset redundancy into production discovery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('operations/comprehensive_market_discovery_legacy.py')
          text = path.read_text()

          replacements = [
              (
                  'from dataclasses import dataclass\n',
                  'from dataclasses import dataclass, replace\n',
              ),
              (
                  '''from providers.redundant_options import (\n    build_redundant_options_provider,\n)\n''',
                  '''from providers.redundant_options import (\n    build_redundant_options_provider,\n)\nfrom providers.databento_futures_history import DatabentoFuturesHistoryProvider\nfrom providers.redundant_market_history import (\n    MarketHistoryCandidate,\n    RedundantMarketHistoryError,\n    RedundantMarketHistoryRouter,\n)\nfrom providers.twelve_data_history import TwelveDataHistoryProvider\n''',
              ),
              (
                  '''    options_provider = build_redundant_options_provider(\n        primary=databento_options_provider,\n    )\n    option_records = tuple(\n''',
                  '''    options_provider = build_redundant_options_provider(\n        primary=databento_options_provider,\n    )\n    history_router = RedundantMarketHistoryRouter()\n    twelve_history = TwelveDataHistoryProvider(http_get=http_get)\n    databento_futures_history = DatabentoFuturesHistoryProvider()\n    option_records = tuple(\n''',
              ),
              (
                  '''    def load_record_rows(\n        record: DiscoveryCatalogRecord,\n''',
                  '''    def _source_code(record: DiscoveryCatalogRecord) -> str:\n        source_tail = str(record.source_identifier).rsplit(":", 1)[-1].strip()\n        return source_tail or record.symbol\n\n    def _twelve_history_symbols(\n        record: DiscoveryCatalogRecord,\n    ) -> tuple[str, ...]:\n        code = _source_code(record).upper()\n        if record.asset_class is CandidateAssetClass.FX:\n            compact = re.sub(r"[^A-Z]", "", code)\n            if len(compact) == 6:\n                return (f"{compact[:3]}/{compact[3:]}",)\n            return ()\n        if record.asset_class is CandidateAssetClass.CRYPTO:\n            compact = code.replace("_", "-").replace("/", "-")\n            parts = tuple(item for item in compact.split("-") if item)\n            if len(parts) == 2:\n                return (f"{parts[0]}/{parts[1]}",)\n            return ()\n        if record.asset_class is CandidateAssetClass.INTERNATIONAL_EQUITY:\n            return tuple(dict.fromkeys((f"{code}:{record.venue}", code)))\n        if record.asset_class is CandidateAssetClass.FIXED_INCOME:\n            return tuple(dict.fromkeys((code, record.symbol)))\n        if record.asset_class in {\n            CandidateAssetClass.US_EQUITY,\n            CandidateAssetClass.US_ETF,\n        }:\n            return tuple(dict.fromkeys((record.provider_symbol, record.symbol)))\n        return ()\n\n    def _route_market_history(\n        record: DiscoveryCatalogRecord,\n        *,\n        primary_rows: Sequence[Mapping[str, object]] = (),\n    ):\n        candidates: list[MarketHistoryCandidate] = []\n        provider_kind = record.provider_kind.lower()\n        if provider_kind == "alpaca":\n            candidates.append(\n                MarketHistoryCandidate(\n                    "alpaca",\n                    record.provider_symbol,\n                    lambda rows=tuple(primary_rows): rows,\n                    configured=client is not None,\n                )\n            )\n            yahoo_record = replace(record, provider_kind="yahoo")\n            candidates.append(\n                MarketHistoryCandidate(\n                    "yahoo",\n                    yahoo_record.provider_symbol,\n                    lambda item=yahoo_record: _yahoo_rows(\n                        item,\n                        as_of=timestamp,\n                        history_days=policy.history_days,\n                        http_get=http_get,\n                    ),\n                )\n            )\n        elif provider_kind == "yahoo":\n            candidates.append(\n                MarketHistoryCandidate(\n                    "yahoo",\n                    record.provider_symbol,\n                    lambda item=record: _yahoo_rows(\n                        item,\n                        as_of=timestamp,\n                        history_days=policy.history_days,\n                        http_get=http_get,\n                    ),\n                )\n            )\n        elif provider_kind == "eodhd":\n            candidates.append(\n                MarketHistoryCandidate(\n                    "eodhd",\n                    record.provider_symbol,\n                    lambda item=record: _eodhd_rows(\n                        item,\n                        as_of=timestamp,\n                        history_days=policy.history_days,\n                        provider=provider,\n                    ),\n                )\n            )\n\n        twelve_symbols = _twelve_history_symbols(record)\n        if twelve_symbols:\n            candidates.append(\n                MarketHistoryCandidate(\n                    "twelve_data",\n                    "|".join(twelve_symbols),\n                    lambda symbols=twelve_symbols: twelve_history.daily_history(\n                        symbols,\n                        as_of=timestamp,\n                        history_days=policy.history_days,\n                    )[1],\n                    configured=twelve_history.configured,\n                )\n            )\n\n        if provider_kind == "yahoo" and record.asset_class in {\n            CandidateAssetClass.INTERNATIONAL_EQUITY,\n            CandidateAssetClass.FX,\n        }:\n            code = _source_code(record).upper()\n            exchange = "FOREX" if record.asset_class is CandidateAssetClass.FX else record.venue\n            suffix = f".{exchange}"\n            eodhd_symbol = code if code.endswith(suffix) else code + suffix\n            eodhd_record = replace(\n                record,\n                provider_kind="eodhd",\n                provider_symbol=eodhd_symbol,\n            )\n            candidates.append(\n                MarketHistoryCandidate(\n                    "eodhd",\n                    eodhd_symbol,\n                    lambda item=eodhd_record: _eodhd_rows(\n                        item,\n                        as_of=timestamp,\n                        history_days=policy.history_days,\n                        provider=provider,\n                    ),\n                )\n            )\n\n        if record.asset_class is CandidateAssetClass.FUTURE:\n            candidates.append(\n                MarketHistoryCandidate(\n                    "databento",\n                    record.symbol,\n                    lambda item=record: databento_futures_history.daily_history(\n                        symbol=item.symbol,\n                        venue=item.venue,\n                        currency=item.currency,\n                        as_of=timestamp,\n                        history_days=policy.history_days,\n                        dataset=item.provider_dataset or "GLBX.MDP3",\n                    ),\n                    configured=databento_futures_history.configured,\n                )\n            )\n\n        return history_router.fetch(\n            tuple(candidates),\n            as_of=timestamp,\n            minimum_rows=policy.minimum_history_bars,\n        )\n\n    def load_record_rows(\n        record: DiscoveryCatalogRecord,\n''',
              ),
              (
                  '''        elif record.provider_kind == "alpaca":\n            raw_rows = alpaca_histories.get(record.provider_symbol.upper(), ())\n            parsed_rows: list[dict[str, object]] = []\n            for raw in raw_rows:\n                if not isinstance(raw, Mapping):\n                    continue\n                observed = _timestamp(raw.get("t"))\n                close = _number(raw.get("c"))\n                volume = _number(raw.get("v"))\n                if observed is None or observed > timestamp or close <= 0.0:\n                    continue\n                parsed_rows.append(\n                    {"t": observed, "c": close, "v": max(0.0, volume)}\n                )\n            rows = tuple(parsed_rows)\n            option_price = 0.0\n        elif record.provider_kind == "yahoo":\n            rows = _yahoo_rows(\n                record,\n                as_of=timestamp,\n                history_days=policy.history_days,\n                http_get=http_get,\n            )\n            option_price = 0.0\n        elif record.provider_kind == "eodhd":\n            rows = _eodhd_rows(\n                record,\n                as_of=timestamp,\n                history_days=policy.history_days,\n                provider=provider,\n            )\n            option_price = 0.0\n        else:\n            # Databento and other provider-native records are ranked only after a\n            # runtime probe supplies point-in-time bars. Missing evidence remains\n            # an explicit exclusion rather than being synthesized.\n            return None\n        return rows, option_price, tuple(option_rows), option_evidence\n''',
                  '''        else:\n            primary_rows: tuple[dict[str, object], ...] = ()\n            if record.provider_kind == "alpaca":\n                parsed_rows: list[dict[str, object]] = []\n                for raw in alpaca_histories.get(record.provider_symbol.upper(), ()):\n                    if not isinstance(raw, Mapping):\n                        continue\n                    observed = _timestamp(raw.get("t"))\n                    close = _number(raw.get("c"))\n                    volume = _number(raw.get("v"))\n                    if observed is None or observed > timestamp or close <= 0.0:\n                        continue\n                    parsed_rows.append(\n                        {"t": observed, "c": close, "v": max(0.0, volume)}\n                    )\n                primary_rows = tuple(parsed_rows)\n            try:\n                routed_history = _route_market_history(\n                    record,\n                    primary_rows=primary_rows,\n                )\n            except RedundantMarketHistoryError:\n                return None\n            rows = routed_history.rows\n            option_price = 0.0\n            option_evidence = routed_history.evidence_identifiers\n        return rows, option_price, tuple(option_rows), option_evidence\n''',
              ),
              (
                  '''    remaining_records = tuple(\n        item for item in ordered_records if item.provider_kind != "alpaca"\n    )\n''',
                  '''    remaining_records = tuple(\n        item\n        for item in ordered_records\n        if item.provider_kind != "alpaca" or client is None\n    )\n''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'expected one production patch target, found {count}: {old[:100]!r}'
                  )
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          python - <<'PY'
          from pathlib import Path

          path = Path('providers/eodhd.py')
          text = path.read_text()
          old_codes = '_DIRECTORY_CONTINUITY_STATUS_CODES = frozenset({402, 404})'
          new_codes = '_DIRECTORY_CONTINUITY_STATUS_CODES = frozenset({401, 402, 403, 404, 408, 425, 429, 500, 502, 503, 504})'
          if text.count(old_codes) != 1:
              raise SystemExit('unexpected EODHD continuity status declaration')
          text = text.replace(old_codes, new_codes, 1)
          old_guard = 'if error.status_code not in _DIRECTORY_CONTINUITY_STATUS_CODES:\n                raise'
          new_guard = 'if not (\n                error.retryable\n                or error.status_code in _DIRECTORY_CONTINUITY_STATUS_CODES\n            ):\n                raise'
          count = text.count(old_guard)
          if count != 2:
              raise SystemExit(f'expected two EODHD continuity guards, found {count}')
          text = text.replace(old_guard, new_guard)
          text = text.replace(
              'an EODHD HTTP 402 entitlement response or HTTP 404 unsupported-directory response may',
              'an EODHD auth/entitlement, access-cap, throttling, transient, 5xx, or unsupported-directory failure may',
              1,
          )
          path.write_text(text)
          PY
      - name: Compile provider redundancy modules
        run: |
          python -m compileall -q \
            providers/redundant_market_history.py \
            providers/twelve_data_history.py \
            providers/databento_futures_history.py \
            providers/eodhd.py \
            operations/comprehensive_market_discovery_legacy.py \
            tests/test_redundant_market_history.py
      - name: Install locked test environment
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.lock
          python -m pip install --disable-pip-version-check -q pytest
      - name: Run focused provider and discovery regressions
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_redundant_market_history.py \
            tests/test_redundant_options_provider.py \
            tests/test_option_catalog_failure_publication.py \
            tests/test_deep_market_evidence_concurrency.py \
            tests/test_eodhd_directory_fallback.py \
            tests/test_eodhd_402_twelve_data_fallback.py
      - name: Commit validated production integration and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-all-asset-provider-redundancy.yml
          git add \
            providers/eodhd.py \
            operations/comprehensive_market_discovery_legacy.py
          git diff --cached --check
          git commit -m "Wire governed redundancy across asset history lanes"
          git push origin HEAD:agent/all-asset-provider-redundancy
