name: Materialize Legacy Analytical Orchestration Cleanup

on:
  push:
    branches:
      - cleanup/remove-legacy-analytical-orchestration
    paths:
      - scripts/materialize_legacy_analytical_orchestration_cleanup.py
      - .github/workflows/materialize-legacy-analytical-orchestration-cleanup.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/materialize_legacy_analytical_orchestration_cleanup.py
      - .github/workflows/materialize-legacy-analytical-orchestration-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-legacy-analytical-orchestration-cleanup
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      CAPITAL_INTELLIGENCE_DAILY_STAGE_BINDINGS: ${{ github.workspace }}/deploy/canonical-daily-stage-bindings.validation.json
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: cleanup/remove-legacy-analytical-orchestration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply reviewed cleanup
        run: python scripts/materialize_legacy_analytical_orchestration_cleanup.py

      - name: Install locked runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt

      - name: Validate active engine stores and read-only APIs
        run: |
          python -m compileall -q .
          git diff --check
          python - <<'PY'
          import intelligence
          assert "AnalyticalEngineCycleExecutor" not in intelligence.__all__
          assert "LiquidityAwareCycleExecutor" not in intelligence.__all__
          PY
          pytest -q \
            tests/test_business_cycle_integration.py \
            tests/test_credit_cycle_integration.py \
            tests/test_global_liquidity_integration.py \
            tests/test_market_breadth_integration.py \
            tests/test_risk_integration.py \
            tests/test_technical_momentum_integration.py \
            tests/test_valuation_integration.py \
            tests/test_multi_engine_governance_integration.py \
            tests/test_multi_engine_normalization_integration.py \
            tests/test_multi_engine_synthesis_integration.py \
            tests/test_production_canonical_scheduler.py

      - name: Publish final cleanup source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/materialize_legacy_analytical_orchestration_cleanup.py
          git rm -f .github/workflows/materialize-legacy-analytical-orchestration-cleanup.yml
          git add -A
          git commit -m "Remove retired analytical wrapper orchestration"
          git push origin HEAD:cleanup/remove-legacy-analytical-orchestration
