name: Export agent repository

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-agent-repo.yml
      - operations/**
      - providers/**
      - cio/**
      - config/**
      - tests/**
      - docs/**
      - '*.py'
      - render.yaml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Archive repository
        run: |
          tar --exclude=.git -czf /tmp/capital-intelligence-repository.tar.gz .
      - name: Upload repository archive
        uses: actions/upload-artifact@v4
        with:
          name: capital-intelligence-repository
          path: /tmp/capital-intelligence-repository.tar.gz
          if-no-files-found: error
          retention-days: 1
