name: Materialize EODHD 402 continuity fix

on:
  push:
    branches:
      - fix/eodhd-402-directory-continuity

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/eodhd-402-directory-continuity
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply bounded continuity correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          provider_path = Path("providers/eodhd.py")
          source = provider_path.read_text(encoding="utf-8")

          active_old = '''        except EODHDRetrievalFailure as error:
              if not error.retryable:
                  raise
              cached = self._load_directory_cache(
          '''
          active_new = '''        except EODHDRetrievalFailure as error:
              # EODHD uses HTTP 402 for quota/package-access states. Those states
              # are not immediately retryable, but a recent previously successful
              # directory remains bounded continuity evidence under the existing
              # cache-age and fail-closed governance controls.
              cache_eligible = error.retryable or error.status_code == 402
              if not cache_eligible:
                  raise
              cached = self._load_directory_cache(
          '''
          if active_old not in source:
              raise SystemExit("active-directory resilience insertion point not found")
          source = source.replace(active_old, active_new, 1)

          delisted_old = '''            if query.provider_symbol not in _ACTIVE_ONLY_SYMBOL_DIRECTORIES:
                  raw_delisted = self._request(
                      f"/exchange-symbol-list/{query.provider_symbol}",
                      params={"delisted": 1},
                      resource=f"delisted symbol directory {query.provider_symbol}",
                      timeout=max(self.timeout, _DIRECTORY_REQUEST_TIMEOUT_SECONDS),
                  )
                  if not isinstance(raw_delisted, list):
                      raise EODHDRetrievalFailure(
                          resource=(
                              f"delisted symbol directory {query.provider_symbol}"
                          ),
                          category="invalid_payload_shape",
                          retryable=True,
                      )
                  delisted_directory = raw_delisted
              else:
          '''
          delisted_new = '''            if query.provider_symbol not in _ACTIVE_ONLY_SYMBOL_DIRECTORIES:
                  try:
                      raw_delisted = self._request(
                          f"/exchange-symbol-list/{query.provider_symbol}",
                          params={"delisted": 1},
                          resource=f"delisted symbol directory {query.provider_symbol}",
                          timeout=max(self.timeout, _DIRECTORY_REQUEST_TIMEOUT_SECONDS),
                      )
                      if not isinstance(raw_delisted, list):
                          raise EODHDRetrievalFailure(
                              resource=(
                                  f"delisted symbol directory {query.provider_symbol}"
                              ),
                              category="invalid_payload_shape",
                              retryable=True,
                          )
                  except EODHDRetrievalFailure as error:
                      if not (error.retryable or error.status_code == 402):
                          raise
                      directory_limitations = (
                          *directory_limitations,
                          "The current active directory remains usable, but the live delisted-symbol directory was unavailable.",
                          str(error),
                          "Historical delisting and identifier lineage remain fail-closed until separately certified evidence is available.",
                      )
                  else:
                      delisted_directory = raw_delisted
              else:
          '''
          if delisted_old not in source:
              raise SystemExit("delisted-directory resilience insertion point not found")
          source = source.replace(delisted_old, delisted_new, 1)
          provider_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/test_eodhd_directory_resilience.py")
          tests = test_path.read_text(encoding="utf-8")
          helper_old = '''def query(as_of: datetime = NOW) -> ProviderDatasetQuery:
              return ProviderDatasetQuery(
                  dataset_type=ProviderDatasetType.SYMBOL_DIRECTORY,
                  provider_symbol="CC",
                  as_of=as_of,
              )
          '''
          helper_new = '''def query(
              as_of: datetime = NOW,
              *,
              provider_symbol: str = "CC",
          ) -> ProviderDatasetQuery:
              return ProviderDatasetQuery(
                  dataset_type=ProviderDatasetType.SYMBOL_DIRECTORY,
                  provider_symbol=provider_symbol,
                  as_of=as_of,
              )
          '''
          if helper_old not in tests:
              raise SystemExit("query helper insertion point not found")
          tests = tests.replace(helper_old, helper_new, 1)

          marker = '''def test_expired_directory_cache_remains_fail_closed(tmp_path: Path) -> None:
          '''
          additions = '''def test_http_402_directory_failure_uses_recent_successful_cache(
              tmp_path: Path,
          ) -> None:
              provider([Response(live_payload())], cache_dir=tmp_path).fetch_dataset(query())
              later = NOW + timedelta(hours=2)

              snapshot = provider(
                  [Response({}, 402)],
                  cache_dir=tmp_path,
                  now=later,
              ).fetch_dataset(query(later))

              assert snapshot.quality_state is DataQualityState.CACHED
              assert snapshot.observed_at == NOW
              assert snapshot.payload["active"] == live_payload()
              assert any("HTTP 402" in item for item in snapshot.limitations)


          def test_equity_directory_keeps_active_continuity_when_delisted_402s(
              tmp_path: Path,
          ) -> None:
              provider(
                  [Response(live_payload()), Response([])],
                  cache_dir=tmp_path,
              ).fetch_dataset(query(provider_symbol="LSE"))
              later = NOW + timedelta(hours=2)

              snapshot = provider(
                  [Response({}, 402), Response({}, 402)],
                  cache_dir=tmp_path,
                  now=later,
              ).fetch_dataset(query(later, provider_symbol="LSE"))

              assert snapshot.quality_state is DataQualityState.CACHED
              assert snapshot.payload["active"] == live_payload()
              assert snapshot.payload["delisted"] == []
              assert any("delisted-symbol directory" in item for item in snapshot.limitations)
              assert any("HTTP 402" in item for item in snapshot.limitations)


          def test_http_402_without_recent_cache_remains_fail_closed(tmp_path: Path) -> None:
              with pytest.raises(EODHDProviderError, match="HTTP 402"):
                  provider(
                      [Response({}, 402)],
                      cache_dir=tmp_path,
                  ).fetch_dataset(query())


          '''
          if marker not in tests:
              raise SystemExit("test insertion point not found")
          tests = tests.replace(marker, additions + marker, 1)
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Validate syntax and focused regression
        shell: bash
        run: |
          python -m py_compile providers/eodhd.py tests/test_eodhd_directory_resilience.py
          python -m pip install --disable-pip-version-check -q pytest requests
          python -m pytest -q tests/test_eodhd_directory_resilience.py

      - name: Commit materialized fix
        shell: bash
        run: |
          rm .github/workflows/materialize-eodhd-402-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add providers/eodhd.py tests/test_eodhd_directory_resilience.py .github/workflows/materialize-eodhd-402-fix.yml
          git commit -m "Preserve EODHD directory continuity on HTTP 402"
          git push origin HEAD:fix/eodhd-402-directory-continuity
