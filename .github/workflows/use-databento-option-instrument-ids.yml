name: Use Databento Option Instrument IDs

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/use-databento-option-instrument-ids.yml
      - tools/use_databento_option_instrument_ids.py

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/prove-pr264-live-providers-now'
    runs-on: ubuntu-latest
    steps:
      - name: Check out writable branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/prove-pr264-live-providers-now
          fetch-depth: 0
      - name: Apply instrument-ID OPRA integration
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/use_databento_option_instrument_ids.py
          python3 -m py_compile \
            providers/databento_options.py \
            operations/comprehensive_market_discovery.py \
            tests/test_databento_options.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use Databento instrument IDs for OPRA bars"
          git push origin HEAD:agent/prove-pr264-live-providers-now
