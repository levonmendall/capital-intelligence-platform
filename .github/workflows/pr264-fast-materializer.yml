name: PR264 Fast Materializer

on:
  push:
    branches:
      - agent/recover-pr264-materialization
    paths:
      - .comprehensive-market-discovery/fast-trigger-v4

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/recover-pr264-materialization
          fetch-depth: 0
      - shell: bash
        run: bash tools/recover_pr264_fast_v2.sh
