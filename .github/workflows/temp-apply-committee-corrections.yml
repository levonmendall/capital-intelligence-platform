name: Temporary committee correction controller

on:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cio-cycle-decision-integrity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode correction script
        run: |
          base64 -d tools/apply_committee_review_corrections_v3.py.gz.b64 | gzip -d > /tmp/apply_committee_review_corrections.py
      - name: Apply corrections
        shell: bash
        run: |
          set +e
          python /tmp/apply_committee_review_corrections.py > /tmp/committee-correction.log 2>&1
          status=$?
          cat /tmp/committee-correction.log
          if [ $status -ne 0 ]; then
            cp /tmp/committee-correction.log tools/committee-correction-failure.txt
            git config user.name "capital-intelligence-bot"
            git config user.email "capital-intelligence-bot@users.noreply.github.com"
            git add tools/committee-correction-failure.txt
            git commit -m "Record committee correction failure"
            git push origin HEAD:fix/cio-cycle-decision-integrity
            exit $status
          fi
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile corrected modules
        run: >-
          python -m compileall
          opportunity/models.py
          opportunity/engine.py
          opportunity/__init__.py
          committee/specialists.py
          cio/cycle_disposition.py
          cio/service.py
          portfolio/production_scenarios.py
      - name: Run focused committee and CIO tests
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/test_committee_review_corrections.py \
            tests/test_cio_cycle_integrity_corrections.py \
            tests/test_cio_cycle.py \
            tests/test_production_context_runtime.py \
            tests/test_production_context_contract.py \
            tests/test_daily_cio.py \
            tests/test_run_autonomous_paper_operator.py > /tmp/committee-tests.log 2>&1
          status=$?
          cat /tmp/committee-tests.log
          if [ $status -ne 0 ]; then
            cp /tmp/committee-tests.log tools/committee-correction-failure.txt
            git config user.name "capital-intelligence-bot"
            git config user.email "capital-intelligence-bot@users.noreply.github.com"
            git add tools/committee-correction-failure.txt
            git commit -m "Record committee correction failure"
            git push origin HEAD:fix/cio-cycle-decision-integrity
            exit $status
          fi
      - name: Commit validated corrections
        run: |
          git config user.name "capital-intelligence-bot"
          git config user.email "capital-intelligence-bot@users.noreply.github.com"
          rm -f tools/committee-correction-failure.txt
          rm -f .github/workflows/apply-committee-review-corrections-v3.yml
          rm -f tools/apply_committee_review_corrections_v3.py.gz.b64
          rm -f tools/apply_cio_cycle_integrity_corrections.py.gz.b64
          rm -f tools/committee-correction-trigger-v3.txt
          git add -A opportunity committee cio portfolio tests tools .github/workflows
          git commit -m "Apply committee review corrections"
          git push origin HEAD:fix/cio-cycle-decision-integrity

  integrate-cio-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/cio-cycle-decision-integrity
          fetch-depth: 0
      - name: Merge and resolve governance overlaps
        run: |
          git config user.name "capital-intelligence-bot"
          git config user.email "capital-intelligence-bot@users.noreply.github.com"
          git fetch origin fix/cio-cycle-decision-integrity
          git merge --no-ff --no-commit origin/fix/cio-cycle-decision-integrity || true
          rm -f cio-integration-conflicts.txt
          python - <<'PY'
          from pathlib import Path

          def replace_single_conflict(path: str, resolution: str) -> None:
              source = Path(path)
              lines = source.read_text(encoding="utf-8").splitlines(keepends=True)
              starts = [i for i, line in enumerate(lines) if line.startswith("<<<<<<< ")]
              separators = [i for i, line in enumerate(lines) if line.startswith("=======")]
              ends = [i for i, line in enumerate(lines) if line.startswith(">>>>>>> ")]
              if not (len(starts) == len(separators) == len(ends) == 1):
                  raise SystemExit(
                      f"expected exactly one conflict in {path}; "
                      f"found starts={starts}, separators={separators}, ends={ends}"
                  )
              start, separator, end = starts[0], separators[0], ends[0]
              if not start < separator < end:
                  raise SystemExit(f"invalid conflict marker order in {path}")
              replacement = resolution.splitlines(keepends=True)
              source.write_text(
                  "".join(lines[:start] + replacement + lines[end + 1 :]),
                  encoding="utf-8",
              )

          replace_single_conflict(
              "application/cio_cycle.py",
              (
                  "        cycle_disposition = self.cycle_disposition_authority.decide(\n"
                  "            queue,\n"
                  "            as_of=portfolio.as_of,\n"
                  "        )\n"
              ),
          )
          replace_single_conflict(
              "application/production_context_contract.py",
              (
                  "from opportunity.snapshot import (\n"
                  "    DECISION_SNAPSHOT_KIND,\n"
                  "    build_opportunity_snapshot,\n"
                  "    load_opportunity_snapshot,\n"
                  ")\n"
                  "from operations.active_paper_universe import (\n"
                  "    load_active_paper_universe_for_publication,\n"
                  ")\n"
              ),
          )

          excluded = {
              ".github/workflows/integrate-cio-cycle.yml",
              ".github/workflows/temp-apply-committee-corrections.yml",
          }
          unresolved = []
          for path in Path(".").rglob("*"):
              if (
                  not path.is_file()
                  or ".git" in path.parts
                  or str(path) in excluded
              ):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  continue
              if "<<<<<<< " in text or ">>>>>>> " in text:
                  unresolved.append(str(path))
          if unresolved:
              raise SystemExit(f"unresolved merge markers remain: {unresolved}")
          PY
          git add application/cio_cycle.py application/production_context_contract.py
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Git still reports unresolved paths:"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          rm -f tools/apply_cio_cycle_integrity_corrections.py.gz.b64
          rm -f .github/workflows/apply-cio-cycle-integrity.yml
          rm -f .github/workflows/apply-committee-review-corrections.yml
          rm -f tools/apply_committee_review_corrections.py.gz.b64
          rm -f tools/cio_integration_trigger.txt
          rm -f cio-integration-conflicts.txt
          rm -f .github/workflows/integrate-cio-cycle.yml
          git add -A
          git commit -m "Integrate CIO cycle corrections"
          git push origin HEAD:integration/cio-cycle-decision-integrity
