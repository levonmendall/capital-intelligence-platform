name: Apply performance accounting

on:
  pull_request:
    paths:
      - ".github/workflows/apply-performance-accounting.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: pr-172-performance-accounting
          fetch-depth: 0
          persist-credentials: true

      - name: Apply audited accounting source
        shell: bash
        run: |
          cat .github/performance-accounting-payload/part* | base64 --decode > /tmp/performance-accounting.tgz
          tar -xzf /tmp/performance-accounting.tgz
          rm -rf .github/performance-accounting-payload
          rm -f .github/workflows/export-performance-audit.yml
          rm -f .github/workflows/apply-performance-accounting.yml

      - name: Install project dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt

      - name: Verify syntax and focused accounting tests
        shell: bash
        run: |
          python -m py_compile \
            portfolio/state.py \
            portfolio/multi_asset_execution.py \
            portfolio/performance.py \
            core/portfolio.py \
            run_portfolio_accounting_migration.py \
            run_portfolio_cash_flow.py \
            run_portfolio_mark_to_market.py \
            run_portfolio_position_adjustment.py \
            app_impl.py
          pytest -q \
            tests/test_canonical_portfolio_state.py \
            tests/test_cross_currency_portfolio_state.py \
            tests/test_multi_asset_paper_execution.py \
            tests/test_portfolio_performance_accounting.py

      - name: Commit accounting framework
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add reconciled portfolio performance accounting"
          git push origin HEAD:pr-172-performance-accounting
