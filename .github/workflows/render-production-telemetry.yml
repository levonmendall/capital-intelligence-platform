name: Capture Render Production Telemetry

on:
  deployment_status:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      expected_release:
        description: Optional deployed commit SHA to observe; defaults to current main
        required: false
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: render-production-telemetry-${{ github.event.deployment.sha || github.event.inputs.expected_release || github.sha }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'deployment_status' }}

jobs:
  capture:
    if: >-
      github.event_name != 'deployment_status' ||
      (
        github.event.deployment_status.state == 'success' &&
        github.event.deployment.environment == 'main - capital-intelligence-platform' &&
        github.event.deployment.production_environment == true &&
        github.event.deployment.ref == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TELEMETRY_URL: https://capital-intelligence-platform.onrender.com/v1/operations/cio-diagnostic
      EXPECTED_RELEASE: ${{ github.event.deployment.sha || github.event.inputs.expected_release || github.sha }}
      TELEMETRY_OUTPUT: /tmp/render-production-telemetry.json
      TELEMETRY_TIMELINE: /tmp/render-production-telemetry-timeline.json

    steps:
      - name: Check out exact release to observe
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_RELEASE }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture and publish production progress
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail

          watch_seconds=0
          if [[ "$GITHUB_EVENT_NAME" == "deployment_status" ]]; then
            watch_seconds=2100
          fi
          status_target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          publish_live_status() {
            local snapshot="$1"
            local status_output=""
            local status_state=""
            local status_description=""
            local -a status_lines=()

            if ! status_output="$(printf '%s\n' "$snapshot" | python scripts/render_telemetry_commit_status.py)"; then
              echo "::warning::Credential-safe telemetry status formatting failed"
              return 0
            fi

            mapfile -t status_lines <<< "$status_output"
            if [[ "${#status_lines[@]}" -ne 2 ]]; then
              echo "::warning::Credential-safe telemetry status had an unexpected shape"
              return 0
            fi
            status_state="${status_lines[0]}"
            status_description="${status_lines[1]}"

            if ! gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_RELEASE}" \
              -f state="$status_state" \
              -f context="render/cio-telemetry" \
              -f description="$status_description" \
              -f target_url="$status_target_url" \
              >/dev/null; then
              echo "::warning::Unable to publish live Render telemetry commit status"
            fi
          }

          python scripts/capture_render_production_telemetry_canonical.py \
            --url "$TELEMETRY_URL" \
            --expected-release "$EXPECTED_RELEASE" \
            --output "$TELEMETRY_OUTPUT" \
            --timeline-output "$TELEMETRY_TIMELINE" \
            --watch-seconds "$watch_seconds" \
            --interval-seconds 30 \
          | while IFS= read -r snapshot; do
              printf '%s\n' "$snapshot"
              publish_live_status "$snapshot"
            done

      - name: Publish safe telemetry summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$TELEMETRY_OUTPUT" ]]; then
            echo '### Render production telemetry' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$TELEMETRY_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### Render production telemetry unavailable' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload credential-safe production telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-production-telemetry-${{ env.EXPECTED_RELEASE }}-${{ github.run_id }}
          path: |
            /tmp/render-production-telemetry.json
            /tmp/render-production-telemetry-timeline.json
          if-no-files-found: warn
          retention-days: 14
