name: Apply complete decision process upgrade

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply-upgrade:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/complete-decision-process-upgrade'
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect staged patch
        id: staged
        shell: bash
        run: |
          if [[ -f .decision-release/decision-process-upgrade.sha256 ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify and apply exact patch
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ordered=(
            part.00
            part.01
            part.02.00
            part.02.01
            part.02.02
            part.02.03
            part.02.04
            part.02.05
            part.02.06
            part.03
            part.04
            part.05
            part.06
            part.07
            part.08
          )
          expected_blobs=(
            981210963118b4b764dbd62a8866b3acf1e29592
            ba0d02ce6dc460e82daf7b5dd12231c4a0023b30
            1316435212e1bc607d06f0410ac7f5d8e99aaa55
            1c3a9fe24b2441b50a33e6d564ac180c8b1fbf02
            6e3a5a72b53060a7a0000bf558bfdbe35495b402
            0548f08fb33e014703503717a9540cece3ea3c34
            380265e3ba67321ca8529995da18555864bc7a5b
            132f47a635ce41a2b5d06e6a3fb6f1c2b358ffe0
            086d5aa555b66008ba15900bf487b67aa2e1da37
            492019b96d035993b309c46d906839757cc768f5
            5a25e2366ff36a0759c54ed88922dfa0316b2ea2
            c7c545ad25600d0a06d0f12b2d72e8cec57f4e2c
            236a500fd07e5b1a63af583e8b40b29bc82e670d
            55ea64a076e50e10e8b0e84a503e82d379c68012
            fcafe74c0d40422b5b92811746a96f44507d099c
          )
          paths=()
          for index in "${!ordered[@]}"; do
            path=".decision-release/chunks/${ordered[$index]}"
            test -f "$path"
            actual_blob="$(git hash-object "$path")"
            if [[ "$actual_blob" != "${expected_blobs[$index]}" ]]; then
              echo "chunk hash mismatch: ${ordered[$index]} expected=${expected_blobs[$index]} actual=$actual_blob"
              exit 1
            fi
            paths+=("$path")
          done
          cat "${paths[@]}" \
            | tr -d '[:space:]' \
            | base64 --decode \
            | gzip --decompress > /tmp/decision-process-upgrade.patch
          expected="$(tr -d '[:space:]' < .decision-release/decision-process-upgrade.sha256)"
          actual="$(sha256sum /tmp/decision-process-upgrade.patch | awk '{print $1}')"
          if [[ "$actual" != "$expected" ]]; then
            echo "patch hash mismatch: expected=$expected actual=$actual"
            exit 1
          fi
          git apply --check /tmp/decision-process-upgrade.patch
          git apply --index /tmp/decision-process-upgrade.patch

      - name: Remove transport and applicator
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .decision-release
          rm -f .github/workflows/apply-decision-process-upgrade.yml
          git add -A
          git diff --cached --check

      - name: Commit production source
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Strengthen complete CIO decision process"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
