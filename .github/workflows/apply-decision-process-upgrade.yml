name: Apply complete decision process upgrade

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply-upgrade:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/complete-decision-process-upgrade'
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect staged patch
        id: staged
        shell: bash
        run: |
          if [[ -f .decision-release/decision-process-upgrade.sha256 ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify and apply exact patch
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tr -d '[:space:]' \
            < .decision-release/decision-process-upgrade.patch.gz.b64 \
            | base64 --decode \
            | gzip --decompress > /tmp/decision-process-upgrade.patch
          expected="$(tr -d '[:space:]' < .decision-release/decision-process-upgrade.sha256)"
          actual="$(sha256sum /tmp/decision-process-upgrade.patch | awk '{print $1}')"
          test "$actual" = "$expected"
          git apply --check /tmp/decision-process-upgrade.patch
          git apply --index /tmp/decision-process-upgrade.patch

      - name: Remove transport and applicator
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .decision-release
          rm -f .github/workflows/apply-decision-process-upgrade.yml
          git add -A
          git diff --cached --check

      - name: Commit production source
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Strengthen complete CIO decision process"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
