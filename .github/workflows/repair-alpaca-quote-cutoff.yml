name: Repair Alpaca closed-market readiness

on:
  push:
    branches:
      - fix-alpaca-authenticated-pairing
    paths:
      - ".github/workflows/repair-alpaca-quote-cutoff.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix-alpaca-authenticated-pairing
          fetch-depth: 0

      - name: Separate configuration from closed-market execution readiness
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("operations/free_paper_pilot.py")
          source = path.read_text(encoding="utf-8")
          old = '''                if bid <= 0.0 or ask <= 0.0 or ask < bid:\n                    raise ValueError(f"{symbol} quote is invalid or crossed")\n'''
          new = '''                if bid <= 0.0 or ask <= 0.0:\n                    if market_open:\n                        raise ValueError(f"{symbol} quote is not executable")\n                    warnings.append(\n                        f"{symbol}: closed-market IEX top of book is not executable; execution remains held"\n                    )\n                elif ask < bid:\n                    raise ValueError(f"{symbol} quote is crossed")\n'''
          if source.count(old) != 1:
              raise SystemExit("quote validity block not found exactly once")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")

          tests = Path("tests/test_free_paper_pilot.py")
          test_source = tests.read_text(encoding="utf-8")
          addition = '''\n\ndef test_closed_market_zero_top_of_book_holds_execution_without_blocking_configuration() -> None:\n    def closed_market_http_get(url: str, **kwargs: Any) -> _Response:\n        if url.endswith("/v2/clock"):\n            return _Response(\n                {\n                    "is_open": False,\n                    "timestamp": (NOW - timedelta(seconds=2)).isoformat(),\n                }\n            )\n        if url.endswith("/v2/stocks/quotes/latest"):\n            symbols = str(kwargs["params"]["symbols"]).split(",")\n            return _Response(\n                {\n                    "quotes": {\n                        symbol: {\n                            "bp": 0.0,\n                            "ap": 0.0,\n                            "bs": 0,\n                            "as": 0,\n                            "t": (NOW - timedelta(seconds=3)).isoformat(),\n                        }\n                        for symbol in symbols\n                    }\n                }\n            )\n        return _http_get(url, **kwargs)\n\n    universe = load_free_paper_pilot_universe(\n        ROOT / "config" / "free_paper_pilot_universe.json"\n    )\n    client = AlpacaPaperClient(\n        AlpacaPaperSettings(api_key_id="paper-key", secret_key="paper-secret"),\n        http_get=closed_market_http_get,\n    )\n\n    report = assess_free_paper_pilot_readiness(\n        universe=universe,\n        client=client,\n        evaluated_at=NOW,\n    )\n\n    assert report.configuration_ready\n    assert not report.execution_ready_now\n    assert not report.market_open\n    assert len(report.quote_timestamps) == 15\n    assert any("closed-market IEX top of book" in warning for warning in report.warnings)\n'''
          if "test_closed_market_zero_top_of_book_holds_execution_without_blocking_configuration" not in test_source:
              tests.write_text(test_source.rstrip() + addition + "\n", encoding="utf-8")
          PY

      - name: Commit closed-market readiness repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operations/free_paper_pilot.py tests/test_free_paper_pilot.py
          git commit -m "Hold closed-market quotes without blocking configuration"
          git push origin HEAD:fix-alpaca-authenticated-pairing
