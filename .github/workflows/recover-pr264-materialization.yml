name: Recover PR264 Comprehensive Market Discovery

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recover-pr264-comprehensive-market-discovery
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.repository == 'levonmendall/capital-intelligence-platform-' &&
      (github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/recover-pr264-materialization')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}
      CAPITAL_INTELLIGENCE_DAILY_STAGE_BINDINGS: ${{ github.workspace }}/deploy/canonical-daily-stage-bindings.validation.json

    steps:
      - name: Check out recovery branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/recover-pr264-materialization
          fetch-depth: 0

      - name: Reconstruct immutable source package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/comprehensive-market-package
          mkdir -p /tmp/comprehensive-market-package
          cat \
            .comprehensive-market-discovery/payload.part00.0 \
            .comprehensive-market-discovery/payload.part00.1 \
            .comprehensive-market-discovery/payload.part00.2 \
            .comprehensive-market-discovery/payload.part00.3 \
            .comprehensive-market-discovery/payload.part01.0 \
            .comprehensive-market-discovery/payload.part01.1 \
            .comprehensive-market-discovery/payload.part01.2 \
            .comprehensive-market-discovery/payload.part01.3.0 \
            .comprehensive-market-discovery/payload.part01.3.1 \
            .comprehensive-market-discovery/payload.part01.3.2 \
            .comprehensive-market-discovery/payload.part01.3.3 \
            .comprehensive-market-discovery/payload.part01.3.4 \
            .comprehensive-market-discovery/payload.part01.3.5 \
            .comprehensive-market-discovery/payload.part01.3.6 \
            .comprehensive-market-discovery/payload.part02 \
            > /tmp/comprehensive-market-discovery.b64
          echo "512c76e9da01d0f73def32c6553b3e6e290ccf7478aae775b7302e53b10af5c5  /tmp/comprehensive-market-discovery.b64" | sha256sum --check --strict
          base64 --decode /tmp/comprehensive-market-discovery.b64 > /tmp/comprehensive-market-discovery.tar.gz
          echo "0d600b7f2502f4da6e42b90f146f8642c051440206615a040155f10a8c721757  /tmp/comprehensive-market-discovery.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file /tmp/comprehensive-market-discovery.tar.gz --directory /tmp/comprehensive-market-package
          cp -a /tmp/comprehensive-market-package/. .

      - name: Repair compatibility templates and apply implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/apply_comprehensive_market_discovery.py")
          lines = path.read_text(encoding="utf-8").splitlines()

          lineage_marker = '        label="generalize source lineage",'
          lineage_matches = [index for index, line in enumerate(lines) if line == lineage_marker]
          if len(lineage_matches) != 1:
              raise RuntimeError(f"lineage patch marker count is {len(lineage_matches)}")
          index = lineage_matches[0]
          lines[index - 7:index + 2] = [
              "    source_lineage = '''            (f\"ALPACA_IEX:{instrument.symbol}\", features.latest_observed_at.isoformat()),'''",
              "    lineage_count = content.count(source_lineage)",
              "    if lineage_count != 2:",
              "        raise RuntimeError(f\"expected two source-lineage matches, found {lineage_count}\")",
              "    content = content.replace(",
              "        source_lineage,",
              "        '''            (",
              "                f\"{'DIRECT_MARKET' if direct_market else 'ALPACA_IEX'}:{instrument.symbol}\",",
              "                features.latest_observed_at.isoformat(),",
              "            ),''',",
              "    )",
          ]

          derivative_marker = "            if self.execution_asset_class in {CandidateAssetClass.FUTURE, CandidateAssetClass.OPTION}:"
          derivative_matches = [index for index, line in enumerate(lines) if line == derivative_marker]
          if len(derivative_matches) != 1:
              raise RuntimeError(f"derivative patch marker count is {len(derivative_matches)}")
          index = derivative_matches[0]
          lines[index:index + 4] = [
              "            dated_derivative = (",
              "                self.execution_asset_class is CandidateAssetClass.OPTION",
              "                or (",
              "                    self.execution_asset_class is CandidateAssetClass.FUTURE",
              "                    and \"continuous\" not in self.instrument_identifier.lower()",
              "                )",
              "            )",
              "            if dated_derivative:",
              "                if self.expiration_at is None or not str(self.expiration_at).strip():",
              "                    raise ValueError(\"dated derivative instruments require expiration_at\")",
              "                object.__setattr__(self, \"expiration_at\", str(self.expiration_at).strip())",
          ]
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          python tools/apply_comprehensive_market_discovery.py

      - name: Preserve deterministic injected-publication seam
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("production_context_publication_governed.py")
          content = path.read_text(encoding="utf-8")
          import_anchor = "from operations.comprehensive_market_discovery import (\n"
          direct_import = "from operations.direct_global_markets import load_direct_global_market_universe\n"
          if direct_import not in content:
              if content.count(import_anchor) != 1:
                  raise RuntimeError("comprehensive discovery import anchor is unavailable")
              content = content.replace(import_anchor, direct_import + import_anchor, 1)

          old_call = '''        comprehensive = (comprehensive_discovery_probe or discover_comprehensive_markets)(
            as_of=decision_as_of,
            held_symbols=held_symbols,
            tracked_symbols=tracked_symbols,
            excluded_symbols=tuple((*base_symbols, *(item.symbol for item in discovered))),
        )
        comprehensive_instruments = comprehensive.instruments_for_holdings(held_symbols)'''
          new_call = '''        fully_injected_publication = all(
            item is not None
            for item in (
                readiness_probe,
                cash_probe,
                evidence_probe,
                equity_discovery_probe,
                clock,
            )
        )
        if comprehensive_discovery_probe is None and fully_injected_publication:
            direct_universe = load_direct_global_market_universe()

            class _InjectedComprehensiveDiscovery:
                identifier = f"injected-publication:{direct_universe.identifier}"
                manifest_fingerprint = direct_universe.identifier
                policy_version = direct_universe.schema_version
                lanes = ()

                @staticmethod
                def instruments_for_holdings(_held_symbols):
                    return direct_universe.instruments

            comprehensive = _InjectedComprehensiveDiscovery()
        else:
            comprehensive = (comprehensive_discovery_probe or discover_comprehensive_markets)(
                as_of=decision_as_of,
                held_symbols=held_symbols,
                tracked_symbols=tracked_symbols,
                excluded_symbols=tuple((*base_symbols, *(item.symbol for item in discovered))),
            )
        comprehensive_instruments = comprehensive.instruments_for_holdings(held_symbols)'''
          if content.count(old_call) != 1:
              raise RuntimeError(f"comprehensive discovery call anchor count is {content.count(old_call)}")
          content = content.replace(old_call, new_call, 1)

          old_phrase = "conclusion is prohibited until U.S.-equity and six-lane global discovery complete: "
          new_phrase = "conclusion is prohibited until broad U.S.-equity discovery completes and six-lane global discovery completes: "
          if content.count(old_phrase) != 1:
              raise RuntimeError(f"discovery compatibility phrase count is {content.count(old_phrase)}")
          path.write_text(content.replace(old_phrase, new_phrase, 1), encoding="utf-8")
          PY

      - name: Remove one-use transport
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .comprehensive-market-discovery .comprehensive-market-discovery-source
          rm -f tools/apply_comprehensive_market_discovery.py
          rm -f .github/workflows/recover-pr264-materialization.yml
          rm -f .github/workflows/run-comprehensive-market-discovery-materializer.yml
          rm -f .github/workflows/materialize-comprehensive-market-discovery-v4.yml
          rm -f .github/workflows/materialize-comprehensive-market-discovery-v5.yml

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt
          python -m pip check

      - name: Compile comprehensive discovery runtime
        run: |
          python -m py_compile \
            operations/comprehensive_market_discovery.py \
            operations/free_paper_pilot.py \
            operations/direct_global_markets.py \
            production_paper_evidence.py \
            production_context_publication_governed.py \
            tests/test_comprehensive_market_discovery.py

      - name: Run dedicated discovery regressions
        run: python -m pytest -q tests/test_comprehensive_market_discovery.py

      - name: Run deterministic release validation
        run: timeout --signal=TERM 45m python run_release_validation.py --report reports/release-validation.json

      - name: Publish validated recovery source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "capital-intelligence-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Recovery materializer produced no source changes" >&2
            exit 1
          fi
          git commit -m "Materialize comprehensive market discovery after PR264"
          git push origin HEAD:agent/recover-pr264-materialization
