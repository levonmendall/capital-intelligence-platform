name: Restore compact UI audit field

on:
  push:
    branches:
      - agent/compact-mobile-ui

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/compact-mobile-ui
          fetch-depth: 0
      - name: Restore audit field without widening mobile table
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app_impl.py')
          source = path.read_text(encoding='utf-8')
          old = '''            display_frame(
                pd.DataFrame(
                    {
                        "As of": format_datetime(item.get("as_of")),
                        "Status": item.get("status"),
                        "Decision": item.get("portfolio_decision"),
                    }
                    for item in briefings
                )
            )
          '''
          new = '''            display_frame(
                pd.DataFrame(
                    (
                        {
                            "As of": format_datetime(item.get("as_of")),
                            "Status": item.get("status"),
                            "Decision": item.get("portfolio_decision"),
                            "Decision ID": _briefing_identifier(item),
                        }
                        for item in briefings
                    )
                )[["As of", "Status", "Decision"]]
            )
          '''
          if old not in source:
              raise SystemExit('expected compact decision table block not found')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
          python -m py_compile app_impl.py
          grep -q '"Decision ID": _briefing_identifier(item)' app_impl.py
          git diff --check
      - name: Commit audit-compatible compact table
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-compact-ui-audit.yml
          git add app_impl.py
          git commit -m "Preserve decision audit ID in compact history table"
          git push origin HEAD:agent/compact-mobile-ui
