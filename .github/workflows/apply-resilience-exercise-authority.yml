name: Apply resilience exercise authority

on:
  pull_request:
    paths:
      - .github/workflows/apply-resilience-exercise-authority.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out patch staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/export-resilience-exercise-authority
          persist-credentials: true

      - name: Reconstruct and verify validated patch
        run: |
          cat .github/patches/resilience-exercise-{00..03}.part \
            | base64 --decode \
            > /tmp/resilience-exercise.patch.gz
          echo 'f924c8de9d16bdab3438c94135eaaa74c0a5f40b2213bb26462109c437f4325e  /tmp/resilience-exercise.patch.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/resilience-exercise.patch.gz > /tmp/resilience-exercise.patch
          echo '6323301ad7d12d1515e3daf7662d4fe687e8c3c2bffdf575df2ee035c5c4ea7f  /tmp/resilience-exercise.patch' | sha256sum --check

      - name: Check out product branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/resilience-exercise-authority
          persist-credentials: true

      - name: Apply exact resilience exercise patch
        run: patch -p1 --forward --batch < /tmp/resilience-exercise.patch

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt
          python -m pip check
          python scripts/verify_requirements_lock.py

      - name: Validate exact updated branch
        run: |
          python -m compileall -q .
          python initialize.py
          python run_intelligence.py
          python run_regime.py
          pytest -q

      - name: Commit validated resilience exercise authority
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            README.md \
            ROADMAP.md \
            docs/OPERATIONS.md \
            docs/RESILIENCE_EXERCISES.md \
            operations/__init__.py \
            operations/resilience.py \
            run_resilience_exercises.py \
            tests/resilience_factories.py \
            tests/test_resilience_exercises.py \
            tests/test_run_resilience_exercises.py
          git commit -m 'Add resilience exercise authority'
          git push origin HEAD:agent/resilience-exercise-authority
