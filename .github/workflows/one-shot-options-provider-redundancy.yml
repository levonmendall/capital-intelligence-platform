name: One-shot options provider redundancy patch

on:
  push:
    branches:
      - agent/options-provider-redundancy
    paths:
      - .github/workflows/one-shot-options-provider-redundancy.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/options-provider-redundancy
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch production option discovery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('operations/comprehensive_market_discovery_legacy.py')
          text = path.read_text()

          replacements = [
              (
                  '''from providers.databento_options import (\n    DATABENTO_OPRA_DATASET,\n    DatabentoOptionsError,\n    DatabentoOptionsProvider,\n)\n''',
                  '''from providers.databento_options import (\n    DATABENTO_OPRA_DATASET,\n    DatabentoOptionsError,\n    DatabentoOptionsProvider,\n)\nfrom providers.redundant_options import (\n    build_redundant_options_provider,\n)\n''',
              ),
              (
                  '''    provider = databento_options_provider or DatabentoOptionsProvider()\n    if not provider.configured:\n        raise ComprehensiveMarketDiscoveryError(\n            "Databento OPRA credentials are required for defined-risk option discovery"\n        )\n''',
                  '''    provider = build_redundant_options_provider(\n        primary=databento_options_provider,\n    )\n    if not provider.configured:\n        raise ComprehensiveMarketDiscoveryError(\n            "At least one certified OPRA options provider is required for defined-risk option discovery"\n        )\n''',
              ),
              (
                  '''                    provider_kind="databento",\n                    provider_dataset=DATABENTO_OPRA_DATASET,\n                    provider_stype_in="instrument_id",\n                    provider_instrument_id=definition.instrument_id,\n                    source_identifier=(\n                        "databento-opra-definition:"\n                        f"{definition.session_date.isoformat()}:"\n                        f"{definition.symbol}:bar:{bar.observed_at.isoformat()}:"\n                        f"underlying:{quote_source_identifier}"\n                    ),\n''',
                  '''                    provider_kind=definition.provider_kind,\n                    provider_dataset=definition.provider_dataset,\n                    provider_stype_in=definition.provider_stype_in,\n                    provider_instrument_id=definition.provider_instrument_id,\n                    source_identifier=(\n                        f"{definition.source_identifier}:"\n                        f"bar:{bar.source_identifier}:"\n                        f"underlying:{quote_source_identifier}"\n                    ),\n''',
              ),
              (
                  '''            "Databento OPRA option discovery produced no priced contracts across "\n''',
                  '''            "Certified option provider discovery produced no priced contracts across "\n''',
              ),
              (
                  '''    options_provider = databento_options_provider or DatabentoOptionsProvider()\n''',
                  '''    options_provider = build_redundant_options_provider(\n        primary=databento_options_provider,\n    )\n''',
              ),
              (
                  '''            option_instruments = tuple(\n                (item.provider_instrument_id, item.provider_symbol)\n                for item in option_records\n                if item.provider_instrument_id is not None\n            )\n            if len(option_instruments) != len(option_records):\n                raise DatabentoOptionsError(\n                    "option records are missing provider instrument IDs"\n                )\n''',
                  '''            option_instruments = tuple(\n                (item.provider_instrument_id, item.provider_symbol)\n                for item in option_records\n            )\n''',
              ),
              (
                  '''                option_evidence = (\n                    f"databento-opra-bars:{record.symbol}:{_hash(option_material)}",\n                )\n''',
                  '''                option_sources = tuple(\n                    dict.fromkeys(\n                        str(getattr(item, "source_identifier", "")).strip()\n                        for item in option_rows\n                        if str(getattr(item, "source_identifier", "")).strip()\n                    )\n                )\n                option_evidence = (\n                    *option_sources,\n                    f"option-bars:{record.symbol}:{_hash(option_material)}",\n                )\n''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one patch target, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Compile focused modules
        run: |
          python -m compileall -q \
            providers/massive_options.py \
            providers/redundant_options.py \
            operations/comprehensive_market_discovery_legacy.py \
            tests/test_redundant_options_provider.py
      - name: Install focused test dependencies
        run: |
          python -m pip install --disable-pip-version-check -q pytest requests
      - name: Run focused redundancy and option discovery regressions
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_redundant_options_provider.py \
            tests/test_option_catalog_failure_publication.py \
            tests/test_deep_market_evidence_concurrency.py
      - name: Commit validated integration and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-options-provider-redundancy.yml
          git add operations/comprehensive_market_discovery_legacy.py
          git diff --cached --check
          git commit -m "Wire certified options provider redundancy"
          git push origin HEAD:agent/options-provider-redundancy
