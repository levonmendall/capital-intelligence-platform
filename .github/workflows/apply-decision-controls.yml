name: Apply decision controls

on:
  push:
    branches:
      - agent/strengthen-decision-policy
    paths:
      - .github/workflows/apply-decision-controls.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validated decision-control patch
        shell: bash
        run: |
          set -euo pipefail
          cat .agent/decision-controls.patch.part* > /tmp/decision-controls.patch
          git apply --index /tmp/decision-controls.patch
          rm -rf .agent
          rm .github/workflows/apply-decision-controls.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Strengthen CIO decision and construction controls"
          git push origin "HEAD:${GITHUB_REF_NAME}"
