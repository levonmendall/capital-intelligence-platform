name: Expose daily CIO briefing

on:
  push:
    branches:
      - agent/expose-daily-cio-briefing

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Expose daily CIO briefing'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out briefing branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/expose-daily-cio-briefing
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Apply communication corrections
        run: python scripts/expose_daily_cio_briefing.py

      - name: Verify changed Python compiles
        run: |
          python -m py_compile \
            app.py \
            app_impl.py \
            cio_pending_transactions_ui.py \
            tests/test_cio_briefing_visibility.py

      - name: Run focused regression tests
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          pytest -q \
            tests/test_cio_briefing_visibility.py \
            tests/test_operating_completeness_fixes.py

      - name: Commit product changes
        run: |
          rm .github/workflows/expose-daily-cio-briefing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Expose daily CIO briefing'
          git push origin HEAD:agent/expose-daily-cio-briefing
