name: Communicate all operating surfaces

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/expose-daily-cio-briefing'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out communication branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/expose-daily-cio-briefing
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Apply information hierarchy corrections
        run: python scripts/expose_daily_cio_briefing.py

      - name: Verify changed Python compiles
        run: |
          python -m py_compile \
            app.py \
            app_impl.py \
            premium_ui.py \
            cio_pending_transactions_ui.py \
            tests/test_surface_information_hierarchy.py

      - name: Run focused regression tests
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          pytest -q \
            tests/test_surface_information_hierarchy.py \
            tests/test_operating_completeness_fixes.py

      - name: Commit product changes
        run: |
          rm .github/workflows/expose-daily-cio-briefing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Communicate intelligence across all surfaces'
          git push origin HEAD:agent/expose-daily-cio-briefing
