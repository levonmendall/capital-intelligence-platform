name: Complete explicit Streamlit entrypoints

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  complete:
    if: github.head_ref == 'fix/explicit-streamlit-entrypoints'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/explicit-streamlit-entrypoints
          fetch-depth: 0
      - name: Materialize source and align hierarchy contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/finalize-explicit-streamlit-entrypoints.yml')
          text = workflow.read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          script = dedent(text[start:end])
          exec(compile(script, '<complete-explicit-entrypoints>', 'exec'), {'__name__': '__main__'})

          Path('tests/test_surface_information_hierarchy.py').write_text(
              dedent('''
              # Compact hierarchy contract for the four governed operating surfaces.

              from pathlib import Path


              def _function_block(source: str, name: str, next_name: str | None) -> str:
                  start = source.index(f"def {name}(")
                  end = (
                      len(source)
                      if next_name is None
                      else source.index(f"def {next_name}(", start)
                  )
                  return source[start:end]


              def test_every_surface_leads_with_a_compact_plain_language_synopsis() -> None:
                  source = Path("app_impl.py").read_text(encoding="utf-8")
                  expectations = (
                      ("_render_today", "_render_environment", "Decision pulse", "How the Today surface works"),
                      ("_render_environment", "_render_portfolio", "Market atmosphere", "How the Environment surface works"),
                      ("_render_portfolio", "_render_history", "Portfolio posture", "How the Portfolio surface works"),
                      ("_render_history", "render_application", "History synopsis", "How the History surface works"),
                  )
                  for name, next_name, synopsis, process_label in expectations:
                      block = _function_block(source, name, next_name)
                      assert synopsis in block
                      assert process_label in block
                      assert block.index(synopsis) < block.index(process_label)


              def test_today_answers_the_five_user_questions_visibly() -> None:
                  app_source = Path("app_impl.py").read_text(encoding="utf-8")
                  presenter_source = Path("concise_operating_intelligence_ui.py").read_text(encoding="utf-8")
                  ui_source = Path("premium_ui.py").read_text(encoding="utf-8")
                  block = _function_block(app_source, "_render_today", "_render_environment")
                  assert "render_today_market_brief(briefing=briefing)" in block
                  assert "Investment world today" in presenter_source
                  for label in (
                      "What changed",
                      "Why investors care",
                      "Portfolio effect",
                      "CIO response",
                      "What to watch next",
                  ):
                      assert label in ui_source
                  for label in (
                      "Market status",
                      "Portfolio action",
                      "Portfolio effect",
                      "What could change the decision",
                  ):
                      assert label in block


              def test_environment_portfolio_and_history_communicate_current_state() -> None:
                  source = Path("app_impl.py").read_text(encoding="utf-8")
                  for phrase in (
                      "The current economic and cross-asset setting",
                      "Portfolio implication",
                      "CIO response",
                      "Where capital sits, why it is positioned there",
                      "Why capital is positioned this way",
                      "Implementation state",
                      "Outcome status",
                  ):
                      assert phrase in source


              def test_operational_detail_follows_surface_synopses() -> None:
                  entrypoint = Path("app.py").read_text(encoding="utf-8")
                  implementation = Path("app_impl.py").read_text(encoding="utf-8")
                  for call in (
                      "render_today_market_brief(briefing=briefing)",
                      "render_today_opportunity_scan(briefing=briefing)",
                      "render_environment_economic_brief(briefing=latest_briefing)",
                      "render_information_freshness(briefing=briefing, surface=\"portfolio\")",
                      "render_live_market_status()",
                      "render_live_environment_market_table()",
                      "render_paper_decision_controls(",
                      "render_live_portfolio_marks(mandate)",
                      "render_operating_report_history()",
                      "render_cio_report_archive()",
                  ):
                      assert call in implementation
                  assert "Administrator operations" in entrypoint
                  assert "Production smoke test" in entrypoint
                  assert "_replace_source_once" not in entrypoint
                  assert "exec(compile" not in entrypoint


              def test_decision_change_details_are_collapsed_by_default() -> None:
                  implementation = Path("app_impl.py").read_text(encoding="utf-8")
                  assert 'with st.expander("Decision evidence and audit reference", expanded=False):' in implementation
                  assert 'with st.expander("What could change the assessment", expanded=False):' in implementation
                  assert 'with st.expander("Live operating context", expanded=False):' in implementation
                  assert 'with st.expander("Cross-asset market detail", expanded=False):' in implementation
                  assert 'with st.expander("Paper implementation and controls", expanded=False):' in implementation


              def test_mobile_hero_is_compact_and_direct() -> None:
                  source = Path("premium_ui.py").read_text(encoding="utf-8")
                  assert "Today's capital briefing" in source
                  assert "Today's market environment" in source
                  assert "Current portfolio position" in source
                  assert "Decisions, actions and learning" in source
                  assert ".compact-surface-head h1{font-size:1.82rem" in source
                  assert ".hero-shell{display:none}" in source


              def test_paper_implementation_uses_plain_language() -> None:
                  source = Path("cio_pending_transactions_ui.py").read_text(encoding="utf-8")
                  assert 'st.subheader("Paper implementation status")' in source
                  assert "How the latest CIO conclusion translates" in source
                  assert "CIO Pending Transaction Recommendations" not in source
              ''').lstrip(),
              encoding='utf-8',
          )

          for filename in (
              '.github/workflows/materialize-explicit-streamlit-entrypoints.yml',
              '.github/workflows/repair-explicit-streamlit-materializer.yml',
              '.github/workflows/run-explicit-entrypoint-materializer.yml',
              '.github/workflows/finalize-explicit-streamlit-entrypoints.yml',
              '.github/workflows/complete-explicit-streamlit-entrypoints.yml',
              '.explicit-streamlit-entrypoints-applied',
          ):
              Path(filename).unlink(missing_ok=True)
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-dev.txt
      - name: Compile source and tests
        run: python -m compileall -q app.py app_impl.py secure_app.py render_app.py tests
      - name: Run complete repository suite
        run: python -m pytest -q --maxfail=10
      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          rm -f database/worker-heartbeat.json
          git add -A
          git commit -m "Replace nested Streamlit source execution"
          git push origin HEAD:fix/explicit-streamlit-entrypoints
