name: Temporary PR807 validation

on:
  push:
    branches: [codex/reclaim-publication-cache-in-process]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
      CAPITAL_INTELLIGENCE_DAILY_STAGE_BINDINGS: ${{ github.workspace }}/deploy/canonical-daily-stage-bindings.validation.json
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked runtime dependencies
        run: pip install --require-hashes -r requirements.lock

      - name: Install development dependencies
        run: pip install -r requirements-dev.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Verify runtime lock integrity
        run: python scripts/verify_requirements_lock.py

      - name: Compile repair surface
        run: >-
          python -m py_compile
          operations/publication_lane_cache_reclamation.py
          operations/transactional_lane_comprehensive_discovery_coordinator.py
          tests/test_publication_lane_cache_reclamation.py

      - name: Run focused cache-reclamation regressions
        run: >-
          pytest -q
          tests/test_publication_lane_cache_reclamation.py
          tests/test_post_lane_cache_reclamation.py

      - name: Run full platform test suite
        run: pytest -q --maxfail=1
