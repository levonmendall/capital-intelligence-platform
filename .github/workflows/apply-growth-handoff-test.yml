name: Apply growth handoff test update

on:
  push:
    branches:
      - agent/adaptive-robust-growth-ensemble
    paths:
      - .github/workflows/apply-growth-handoff-test.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/adaptive-robust-growth-ensemble
          fetch-depth: 0
      - name: Update handoff test
        run: python .github/agent_payload/update_growth_handoff_test.py
      - name: Commit test contract
        run: |
          rm -f .github/agent_payload/update_growth_handoff_test.py
          rm -f .github/workflows/apply-growth-handoff-test.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Update opportunity-cost handoff contract"
          git push origin HEAD:agent/adaptive-robust-growth-ensemble
