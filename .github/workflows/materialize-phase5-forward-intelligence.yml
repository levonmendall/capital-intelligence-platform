name: Materialize Phase 5 Forward Intelligence

on:
  push:
    branches:
      - feature/committee-cio-v2-phase5-forward-intelligence
    paths:
      - .github/workflows/materialize-phase5-forward-intelligence.yml
      - scripts/materialize_phase5_forward_intelligence.py
      - scripts/repair_phase5_imports.py
      - intelligence/forward.py
      - tests/test_forward_intelligence.py
      - tests/test_forward_intelligence_integration.py
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-phase5-forward-intelligence
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}
      REPAIR_VERSION: "3"
    steps:
      - name: Check out phase branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: feature/committee-cio-v2-phase5-forward-intelligence
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply reviewed Phase 5 integration
        run: |
          python scripts/materialize_phase5_forward_intelligence.py
          python scripts/repair_phase5_imports.py

      - name: Install locked runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt

      - name: Run forward-intelligence and canonical regressions
        run: >-
          pytest -q
          tests/test_forward_intelligence.py
          tests/test_forward_intelligence_integration.py
          tests/test_canonical_cio_cycle.py
          tests/test_canonical_production_context_adapter.py

      - name: Publish final source and remove temporary materializer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intelligence/__init__.py intelligence/forward.py committee/specialists.py application/cio_cycle.py application/production_context.py
          git add tests/test_forward_intelligence.py tests/test_forward_intelligence_integration.py tests/test_canonical_cio_cycle.py
          git rm scripts/materialize_phase5_forward_intelligence.py
          git rm scripts/repair_phase5_imports.py
          git rm .github/workflows/materialize-phase5-forward-intelligence.yml
          git commit -m "Integrate governed forward business macro theme and currency intelligence"
          git push origin HEAD:feature/committee-cio-v2-phase5-forward-intelligence
