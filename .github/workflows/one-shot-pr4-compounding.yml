name: Apply PR4 compounding mandate

on:
  pull_request:
    paths:
      - .github/workflows/one-shot-pr4-compounding.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/remove-goal-oriented-mandates
          persist-credentials: true
      - name: Apply compounding mandate taxonomy
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          Path('config/mandates.json').write_text(json.dumps([{
              'code': 'COMPOUNDING',
              'name': 'Long-Term Compounding',
              'risk': 'Operational constraints only',
              'capital': 200000,
          }], indent=2) + '\n')

          p = Path('portfolio_managers/response.py')
          s = p.read_text()
          start = s.index('class MandateID')
          end = s.index('\n\n\nclass TradeAction', start)
          replacement = '''class MandateID(str, Enum):
              \"\"\"The sole investment mandate: maximize long-term compounded returns.

              Liquidity, concentration, leverage, turnover, and prohibited-exposure
              controls are operational constraint profiles, not competing objectives.
              \"\"\"

              COMPOUNDING = \"compounding\"'''
          p.write_text(s[:start] + replacement + s[end:])

          p = Path('core/seed.py')
          s = p.read_text().replace(
              \"Seed the database with the platform's investment mandates.\",
              'Compatibility seeding for the retired portfolio database.',
          ).replace(
              'Insert the configured mandates when they do not already exist.',
              'Insert only the legacy-compatible compounding portfolio record.',
          )
          p.write_text(s)

          p = Path('tests/test_cio_domain_models.py')
          s = p.read_text().replace(
              '''def test_all_eight_mandates_are_preserved() -> None:
              assert {mandate.value for mandate in MandateID} == {
                  \"preservation\",
                  \"income\",
                  \"balanced\",
                  \"growth\",
                  \"value\",
                  \"tactical\",
                  \"global\",
                  \"innovation\",
              }''',
              '''def test_only_compounding_mandate_is_active() -> None:
              assert {mandate.value for mandate in MandateID} == {\"compounding\"}''',
          )
          p.write_text(s)

          Path('docs/COMPOUNDING_MANDATE.md').write_text('''# Compounding Mandate

          > **Every recommendation is compared against all other available uses of capital, implemented at the portfolio level, continuously monitored against an explicit thesis, and evaluated afterward using the exact evidence available when the decision was made.**

          The platform has one investment mandate: maximize long-term compounded portfolio returns after implementation costs and within approved operational constraints.

          ## Not investment objectives

          Preservation, income, balanced, growth, tactical, value, global, and innovation are not active mandates. They may describe evidence, exposures, or historical research, but they cannot create separate decision authorities or competing portfolio goals.

          ## Operational constraint profiles

          Constraint profiles may specify minimum cash, maximum position and sector exposure, factor and correlation limits, liquidity participation, turnover, transaction-cost limits, leverage prohibitions, and restricted instruments. These profiles govern implementation feasibility only. They do not change opportunity ranking or the CIO objective.

          ## Compatibility boundary

          The retired mandate/trading database may retain historical labels for migration audit. Active portfolio state, scheduling, alerts, construction, and paper execution use the canonical compounding portfolio authority.
          ''')

          Path('tests/test_compounding_mandate_architecture.py').write_text('''from pathlib import Path

          from portfolio_managers.response import MandateID


          def test_only_compounding_mandate_is_configured() -> None:
              source = Path(\"config/mandates.json\").read_text(encoding=\"utf-8\").lower()
              assert '\"code\": \"compounding\"' in source
              for retired in (\"capital preservation\", \"income & stability\", \"balanced allocation\", \"growth opportunities\", \"tactical rotation\", \"opportunistic value\", \"global opportunities\", \"innovation & disruption\"):
                  assert retired not in source


          def test_only_compounding_mandate_enum_remains() -> None:
              assert tuple(MandateID) == (MandateID.COMPOUNDING,)


          def test_constraint_document_separates_controls_from_objective() -> None:
              text = Path(\"docs/COMPOUNDING_MANDATE.md\").read_text(encoding=\"utf-8\").lower()
              assert \"one investment mandate\" in text
              assert \"operational constraint profiles\" in text
              assert \"do not change opportunity ranking\" in text
          ''')

          for name in ('README.md', 'ROADMAP.md'):
              p = Path(name)
              s = p.read_text()
              marker = 'Long-term compounding is the sole investment mandate; all other portfolio profiles are operational constraints, not investor goals.\n'
              if marker not in s:
                  s += '\n' + marker
              p.write_text(s)
          PY
          rm .github/workflows/one-shot-pr4-compounding.yml
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Validate exact updated branch
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt
          python -m pip check
          python scripts/verify_requirements_lock.py
          python -m compileall -q .
          python initialize.py
          python run_intelligence.py
          python run_regime.py
          pytest -q
      - name: Commit validated mandate cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace goal-oriented mandates with compounding mandate'
          git push origin HEAD:agent/remove-goal-oriented-mandates
