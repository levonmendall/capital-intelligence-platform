name: Diagnose Databento Definition Keys

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-databento-definition-keys.yml
      - tools/diagnose_databento_definition_keys.py

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/prove-pr264-live-providers-now'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CAPITAL_INTELLIGENCE_DATABENTO_API_KEY: ${{ secrets.CAPITAL_INTELLIGENCE_DATABENTO_API_KEY || secrets.DATABENTO_API_KEY }}
    steps:
      - name: Check out probe branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/prove-pr264-live-providers-now
      - name: Install probe dependency
        run: python3 -m pip install "requests>=2.32,<3"
      - name: Report credential-safe definition keys
        run: python3 tools/diagnose_databento_definition_keys.py
