name: Verify Render CIO Diagnostic

on:
  workflow_run:
    workflows:
      - Validate Capital Intelligence Platform
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: verify-render-cio-diagnostic-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AUDIT_URL: https://capital-intelligence-platform.onrender.com/app/static/cio-diagnostic.json
      EXPECTED_RELEASE: ${{ github.event.workflow_run.head_sha }}
      AUDIT_OUTPUT: /tmp/render-cio-diagnostic.json
      VERIFICATION_LOG: /tmp/render-cio-diagnostic-verification.log
    steps:
      - name: Check out exact validated release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll and verify deployed all-market CIO diagnostic
        shell: bash
        run: |
          set -o pipefail
          python verify_render_cio_diagnostic.py \
            --url "$AUDIT_URL" \
            --expected-release "$EXPECTED_RELEASE" \
            --output "$AUDIT_OUTPUT" \
            --maximum-attempts 120 \
            --interval-seconds 15 \
            2>&1 | tee "$VERIFICATION_LOG"

      - name: Upload redacted production diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-cio-diagnostic-${{ github.event.workflow_run.head_sha }}
          path: |
            /tmp/render-cio-diagnostic.json
            /tmp/render-cio-diagnostic-verification.log
          if-no-files-found: warn
          retention-days: 14
