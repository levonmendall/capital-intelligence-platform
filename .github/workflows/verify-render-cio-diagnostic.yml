name: Verify Render CIO Diagnostic

on:
  deployment_status:
  schedule:
    - cron: "12,42 * * * *"
  workflow_dispatch:
    inputs:
      expected_release:
        description: Optional deployed commit SHA to verify; defaults to current main
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: verify-render-cio-diagnostic-${{ github.event.deployment.sha || github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name != 'deployment_status' ||
      (
        github.event.deployment_status.state == 'success' &&
        github.event.deployment.environment == 'main - capital-intelligence-platform' &&
        github.event.deployment.production_environment == true &&
        github.event.deployment.ref == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AUDIT_URL: https://capital-intelligence-platform.onrender.com/app/static/cio-diagnostic.json
      EXPECTED_RELEASE: ${{ github.event.deployment.sha || github.event.inputs.expected_release || github.sha }}
      AUDIT_OUTPUT: /tmp/render-cio-diagnostic.json
      VERIFICATION_LOG: /tmp/render-cio-diagnostic-verification.log
    steps:
      - name: Check out exact release to verify
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_RELEASE }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll and verify deployed all-market CIO diagnostic
        shell: bash
        run: |
          set -o pipefail
          python verify_render_cio_diagnostic.py \
            --url "$AUDIT_URL" \
            --expected-release "$EXPECTED_RELEASE" \
            --output "$AUDIT_OUTPUT" \
            --maximum-attempts 120 \
            --interval-seconds 15 \
            2>&1 | tee "$VERIFICATION_LOG"

      - name: Upload redacted production diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-cio-diagnostic-${{ env.EXPECTED_RELEASE }}
          path: |
            /tmp/render-cio-diagnostic.json
            /tmp/render-cio-diagnostic-verification.log
          if-no-files-found: warn
          retention-days: 14
