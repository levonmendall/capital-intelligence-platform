name: Verify Render CIO Diagnostic

on:
  deployment_status:
  schedule:
    - cron: "12,42 * * * *"
  workflow_dispatch:
    inputs:
      expected_release:
        description: Optional deployed commit SHA to verify; defaults to current main
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Keep deployment-triggered certification independent from routine scheduled
  # verification. New scheduled/manual checks for the same exact release should
  # replace stale ones instead of queueing indefinitely behind a hung poll.
  group: verify-render-cio-diagnostic-${{ github.event.deployment.sha || github.sha }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'deployment_status' }}

jobs:
  verify:
    if: >-
      github.event_name != 'deployment_status' ||
      (
        github.event.deployment_status.state == 'success' &&
        github.event.deployment.environment == 'main - capital-intelligence-platform' &&
        github.event.deployment.production_environment == true &&
        github.event.deployment.ref == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      # Render exposes Streamlit on the public service port. The internal FastAPI
      # child listens only on 127.0.0.1:8000, so public certification must read
      # the credential-safe audit from Streamlit's enabled static-file surface.
      AUDIT_URL: https://capital-intelligence-platform.onrender.com/app/static/cio-diagnostic.json
      EXPECTED_RELEASE: ${{ github.event.deployment.sha || github.event.inputs.expected_release || github.sha }}
      AUDIT_OUTPUT: /tmp/render-cio-diagnostic.json
      VERIFICATION_LOG: /tmp/render-cio-diagnostic-verification.log
      # For deployment-triggered certification, accept only a diagnostic request
      # created after this deployment was created. Scheduled/manual verification
      # leaves the boundary empty and preserves its existing exact-release behavior.
      CIO_DIAGNOSTIC_FRESH_AFTER: ${{ github.event.deployment.created_at || '' }}
    steps:
      - name: Check out exact release to verify
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_RELEASE }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll and verify deployed all-market CIO diagnostic
        timeout-minutes: 58
        shell: bash
        run: |
          set -o pipefail
          : > "$VERIFICATION_LOG"

          # Render can issue bounded replacement attempts for the same exact release.
          # If this verifier adopted an active attempt and that attempt later fails,
          # re-enter the canonical verifier instead of declaring the whole release
          # terminal immediately. On re-entry the failed request is the baseline and
          # the canonical verifier requires a new request_id within 45 x 15s (675s).
          # Any other verifier error remains terminal and fail-closed.
          for server_attempt in 1 2 3 4; do
            attempt_log="/tmp/render-cio-diagnostic-verification-${server_attempt}.log"
            set +e
            timeout --signal=TERM --kill-after=30s 54m \
              python verify_render_cio_diagnostic.py \
                --url "$AUDIT_URL" \
                --expected-release "$EXPECTED_RELEASE" \
                --output "$AUDIT_OUTPUT" \
                --maximum-attempts 220 \
                --interval-seconds 15 \
                --fresh-attempt-grace-attempts 45 \
              2>&1 | tee "$attempt_log"
            verifier_code=${PIPESTATUS[0]}
            set -e
            cat "$attempt_log" >> "$VERIFICATION_LOG"

            if [[ "$verifier_code" -eq 0 ]]; then
              exit 0
            fi
            if [[ "$server_attempt" -ge 4 ]]; then
              exit "$verifier_code"
            fi
            if [[ "$verifier_code" -ne 3 ]] || \
               ! grep -q 'current_diagnostic_failed:' "$attempt_log"; then
              exit "$verifier_code"
            fi

            echo "::notice title=Render CIO diagnostic replacement::failed_server_attempt=${server_attempt} state=awaiting_replacement_attempt release_match=yes"
          done

      - name: Upload redacted production diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-cio-diagnostic-${{ env.EXPECTED_RELEASE }}
          path: |
            /tmp/render-cio-diagnostic.json
            /tmp/render-cio-diagnostic-verification.log
          if-no-files-found: warn
          retention-days: 14
