name: Export CIO decision-quality source

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/correct-cio-decision-quality'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Package source
        run: |
          git rev-parse HEAD > /tmp/current-main-sha.txt
          zip -qr /tmp/cio-decision-quality-current-main.zip . -x '.git/*'
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: cio-decision-quality-current-main
          path: |
            /tmp/cio-decision-quality-current-main.zip
            /tmp/current-main-sha.txt
          retention-days: 1
