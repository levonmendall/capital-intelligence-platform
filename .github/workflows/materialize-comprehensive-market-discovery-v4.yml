name: Materialize Comprehensive Market Discovery V4

on:
  push:
    branches:
      - agent/comprehensive-market-discovery
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: comprehensive-market-discovery-materializer-v4
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'levonmendall/capital-intelligence-platform-'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONPATH: ${{ github.workspace }}
      CAPITAL_INTELLIGENCE_DAILY_STAGE_BINDINGS: ${{ github.workspace }}/deploy/canonical-daily-stage-bindings.validation.json
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/comprehensive-market-discovery
          fetch-depth: 0

      - name: Reconstruct verified implementation package
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .comprehensive-market-discovery/payload.part00.0 \
            .comprehensive-market-discovery/payload.part00.1 \
            .comprehensive-market-discovery/payload.part00.2 \
            .comprehensive-market-discovery/payload.part00.3 \
            .comprehensive-market-discovery/payload.part01.0 \
            .comprehensive-market-discovery/payload.part01.1 \
            .comprehensive-market-discovery/payload.part01.2 \
            .comprehensive-market-discovery/payload.part01.3.0 \
            .comprehensive-market-discovery/payload.part01.3.1 \
            .comprehensive-market-discovery/payload.part01.3.2 \
            .comprehensive-market-discovery/payload.part01.3.3 \
            .comprehensive-market-discovery/payload.part01.3.4 \
            .comprehensive-market-discovery/payload.part01.3.5 \
            .comprehensive-market-discovery/payload.part01.3.6 \
            .comprehensive-market-discovery/payload.part02 \
            > /tmp/comprehensive-market-discovery.b64
          echo "512c76e9da01d0f73def32c6553b3e6e290ccf7478aae775b7302e53b10af5c5  /tmp/comprehensive-market-discovery.b64" | sha256sum --check --strict
          base64 --decode /tmp/comprehensive-market-discovery.b64 > /tmp/comprehensive-market-discovery.tar.gz
          echo "0d600b7f2502f4da6e42b90f146f8642c051440206615a040155f10a8c721757  /tmp/comprehensive-market-discovery.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file /tmp/comprehensive-market-discovery.tar.gz --directory .

      - name: Repair templates and apply implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/apply_comprehensive_market_discovery.py")
          lines = path.read_text(encoding="utf-8").splitlines()

          lineage_marker = '        label="generalize source lineage",'
          lineage_matches = [i for i, line in enumerate(lines) if line == lineage_marker]
          if len(lineage_matches) != 1:
              raise RuntimeError(f"lineage marker count is {len(lineage_matches)}")
          index = lineage_matches[0]
          lines[index - 7:index + 2] = [
              "    source_lineage = '''            (f\"ALPACA_IEX:{instrument.symbol}\", features.latest_observed_at.isoformat()),'''",
              "    lineage_count = content.count(source_lineage)",
              "    if lineage_count != 2:",
              "        raise RuntimeError(",
              "            f\"generalize source lineage: expected two matches, found {lineage_count}\"",
              "        )",
              "    content = content.replace(",
              "        source_lineage,",
              "        '''            (",
              "                f\"{'DIRECT_MARKET' if direct_market else 'ALPACA_IEX'}:{instrument.symbol}\",",
              "                features.latest_observed_at.isoformat(),",
              "            ),''',",
              "    )",
          ]

          derivative_marker = "            if self.execution_asset_class in {CandidateAssetClass.FUTURE, CandidateAssetClass.OPTION}:"
          derivative_matches = [i for i, line in enumerate(lines) if line == derivative_marker]
          if len(derivative_matches) != 1:
              raise RuntimeError(f"derivative marker count is {len(derivative_matches)}")
          index = derivative_matches[0]
          lines[index:index + 4] = [
              "            dated_derivative = (",
              "                self.execution_asset_class is CandidateAssetClass.OPTION",
              "                or (",
              "                    self.execution_asset_class is CandidateAssetClass.FUTURE",
              "                    and \"continuous\" not in self.instrument_identifier.lower()",
              "                )",
              "            )",
              "            if dated_derivative:",
              "                if self.expiration_at is None or not str(self.expiration_at).strip():",
              "                    raise ValueError(\"dated derivative instruments require expiration_at\")",
              "                object.__setattr__(self, \"expiration_at\", str(self.expiration_at).strip())",
          ]
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          python tools/apply_comprehensive_market_discovery.py
          python - <<'PY'
          from pathlib import Path
          path = Path("production_context_publication_governed.py")
          content = path.read_text(encoding="utf-8")
          old = "conclusion is prohibited until U.S.-equity and six-lane global discovery complete: "
          new = "conclusion is prohibited until broad U.S.-equity discovery completes and six-lane global discovery completes: "
          if content.count(old) != 1:
              raise RuntimeError(f"discovery compatibility phrase count is {content.count(old)}")
          path.write_text(content.replace(old, new), encoding="utf-8")
          PY

      - name: Remove one-use transport
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .comprehensive-market-discovery
          rm -f tools/apply_comprehensive_market_discovery.py
          rm -f .github/workflows/materialize-comprehensive-market-discovery.yml
          rm -f .github/workflows/materialize-comprehensive-market-discovery-v2.yml
          rm -f .github/workflows/materialize-comprehensive-market-discovery-v3.yml
          rm -f .github/workflows/materialize-comprehensive-market-discovery-v4.yml

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt
          python -m pip check

      - name: Compile changed runtime
        run: python -m py_compile operations/comprehensive_market_discovery.py operations/free_paper_pilot.py operations/direct_global_markets.py production_paper_evidence.py production_context_publication_governed.py tests/test_comprehensive_market_discovery.py

      - name: Run comprehensive discovery regressions
        run: python -m pytest -q tests/test_comprehensive_market_discovery.py

      - name: Run deterministic release validation
        run: timeout --signal=TERM 40m python run_release_validation.py --report reports/release-validation.json

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "capital-intelligence-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Materializer produced no implementation changes" >&2
            exit 1
          fi
          git commit -m "Expand comprehensive market discovery"
          git push origin HEAD:agent/comprehensive-market-discovery
