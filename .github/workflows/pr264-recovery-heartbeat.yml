name: PR264 Recovery Heartbeat

on:
  push:
    branches:
      - agent/recover-pr264-materialization
    paths:
      - .comprehensive-market-discovery/heartbeat-trigger

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/recover-pr264-materialization
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p .recovery
          printf 'GitHub Actions branch push workflow executed.\n' > .recovery/heartbeat.txt
          rm -f .github/workflows/pr264-recovery-heartbeat.yml
          rm -f .comprehensive-market-discovery/heartbeat-trigger
          git config user.name "capital-intelligence-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Record PR264 recovery workflow heartbeat"
          git push origin HEAD:agent/recover-pr264-materialization
