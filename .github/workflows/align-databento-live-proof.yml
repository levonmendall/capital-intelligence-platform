name: Align Databento Live Proof

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/align-databento-live-proof.yml
      - tools/align_databento_live_proof.py

permissions:
  contents: write

jobs:
  align:
    if: github.event.pull_request.head.ref == 'agent/prove-pr264-live-providers-now'
    runs-on: ubuntu-latest
    steps:
      - name: Check out writable branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/prove-pr264-live-providers-now
          fetch-depth: 0
      - name: Align proof with production selector
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/align_databento_live_proof.py
          python3 -m py_compile \
            providers/databento_options.py \
            operations/provider_validation.py \
            tests/test_databento_options.py \
            tests/test_provider_validation.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align OPRA live proof with production selection"
          git push origin HEAD:agent/prove-pr264-live-providers-now
