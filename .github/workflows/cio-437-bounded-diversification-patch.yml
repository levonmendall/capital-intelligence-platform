name: Apply CIO 437 bounded diversification repair

on:
  push:
    branches:
      - fix/cio-437-bounded-diversification-finalization

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded diversification repair
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          new_function = base64.b64decode("").decode("utf-8")
          new_assert = base64.b64decode("").decode("utf-8")
          new_test = base64.b64decode("").decode("utf-8")

          source_path = Path("operations/bounded_terminal_screening.py")
          source = source_path.read_text(encoding="utf-8")
          start = source.index("    def finalize_diversification(")
          end = source.index("\n    @property\n    def eligible_count", start)
          source = source[:start] + new_function + source[end:]
          old_call = "            state_spool.finalize_diversification(batch_size=batch_size)\n"
          if old_call not in source:
              raise SystemExit("expected finalize_diversification call was not found")
          source = source.replace(
              old_call,
              "            state_spool.finalize_diversification(\n"
              "                batch_size=batch_size,\n"
              "                progress_label=progress_label,\n"
              "            )\n",
              1,
          )
          source_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/test_bounded_terminal_screening.py")
          tests = test_path.read_text(encoding="utf-8")
          if "from collections import Counter\n" not in tests:
              tests = tests.replace(
                  "from __future__ import annotations\n\n",
                  "from __future__ import annotations\n\nfrom collections import Counter\n",
                  1,
              )
          assert_start = tests.index("    assert stages[-5:] == [")
          assert_end = tests.index("    ]\n", assert_start) + len("    ]\n")
          tests = tests[:assert_start] + new_assert + tests[assert_end:]
          anchor = "\ndef test_terminal_screening_state_spool_keeps_record_state_out_of_python_heap():\n"
          if anchor not in tests:
              raise SystemExit("expected test insertion anchor was not found")
          tests = tests.replace(anchor, "\n" + new_test + anchor, 1)
          test_path.write_text(tests, encoding="utf-8")
          PY
      - name: Compile repaired files
        run: python -m py_compile operations/bounded_terminal_screening.py tests/test_bounded_terminal_screening.py
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operations/bounded_terminal_screening.py tests/test_bounded_terminal_screening.py
          git commit -m "Bound CIO diversification finalization"
          git push origin "HEAD:${GITHUB_REF_NAME}"
