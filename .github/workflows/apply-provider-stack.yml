name: Apply initial external data provider stack

on:
  push:
    branches:
      - agent/initial-external-data-provider-stack

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out provider branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify and materialize provider stack
        shell: bash
        run: |
          set -euo pipefail
          cat .provider-stack/chunk-* | base64 --decode > /tmp/provider-stack.tar.gz
          echo "97fc0ac86d168ee909318720d8fd174e99dce93be007e9f5514c4af4b31c38a4  /tmp/provider-stack.tar.gz" | sha256sum -c -
          tar -xzf /tmp/provider-stack.tar.gz -C .
          rm -rf .provider-stack
          rm -f .github/workflows/apply-provider-stack.yml

      - name: Commit materialized provider stack
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add initial external data provider stack"
          git push origin HEAD:agent/initial-external-data-provider-stack
