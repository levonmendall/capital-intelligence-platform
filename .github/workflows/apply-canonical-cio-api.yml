name: Apply canonical CIO API read model

on:
  pull_request:
    paths:
      - .github/workflows/apply-canonical-cio-api.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out patch staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/export-canonical-cycle-source
          persist-credentials: true

      - name: Reconstruct validated patch
        run: |
          base64 --decode .github/patches/cio-api.b64 \
            | gzip --decompress \
            > /tmp/canonical-cio-api.patch
          test -s /tmp/canonical-cio-api.patch

      - name: Check out product branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/canonical-cio-api-read-model
          persist-credentials: true

      - name: Apply exact API patch
        run: patch -p1 --forward --batch < /tmp/canonical-cio-api.patch

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt
          python -m pip check
          python scripts/verify_requirements_lock.py

      - name: Validate exact updated branch
        run: |
          python -m compileall -q .
          python initialize.py
          python run_intelligence.py
          python run_regime.py
          pytest -q

      - name: Commit validated canonical API
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            api/app.py \
            api/repositories.py \
            api/routes/__init__.py \
            api/routes/cio.py \
            api/routes/daily.py \
            api/routes/decisions.py \
            api/schemas.py \
            application/cio_cycle.py \
            cio/persistence.py \
            tests/test_authentication_authorization.py \
            tests/test_canonical_cio_cycle.py \
            tests/test_personal_cio_api.py
          git commit -m 'Expose canonical CIO journal API and isolate personal routes'
          git push origin HEAD:agent/canonical-cio-api-read-model