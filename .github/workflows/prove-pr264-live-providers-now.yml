name: Prove PR264 Live Providers Now

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/prove-pr264-live-providers-now.yml
      - operations/comprehensive_market_discovery.py
      - operations/provider_validation.py
      - providers/databento.py
      - providers/yahoo_public.py
      - tests/test_yahoo_public.py

permissions:
  contents: read

jobs:
  live-provider-proof:
    if: github.event.pull_request.head.ref == 'agent/prove-pr264-live-providers-now'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CAPITAL_INTELLIGENCE_EODHD_API_TOKEN: ${{ secrets.CAPITAL_INTELLIGENCE_EODHD_API_TOKEN || secrets.EODHD_API_TOKEN || secrets.EODHD_API_KEY }}
      CAPITAL_INTELLIGENCE_DATABENTO_API_KEY: ${{ secrets.CAPITAL_INTELLIGENCE_DATABENTO_API_KEY || secrets.DATABENTO_API_KEY }}
      CAPITAL_INTELLIGENCE_RELEASE: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out current proof branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/prove-pr264-live-providers-now
      - name: Install provider validation runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
      - name: Probe authenticated options entitlements
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          from datetime import datetime, timedelta, timezone
          import json
          import os
          import requests

          key = os.environ["CAPITAL_INTELLIGENCE_DATABENTO_API_KEY"]
          auth = (key, "")
          datasets = requests.get(
              "https://hist.databento.com/v0/metadata.list_datasets",
              auth=auth,
              timeout=30,
          ).json()
          print(
              "databento_options_datasets",
              [str(item) for item in datasets if "OPRA" in str(item).upper()],
          )
          schemas = requests.get(
              "https://hist.databento.com/v0/metadata.list_schemas",
              auth=auth,
              params={"dataset": "OPRA.PILLAR"},
              timeout=30,
          ).json()
          print("databento_opra_schemas", schemas)

          now = datetime.now(timezone.utc)
          tomorrow = now.date() + timedelta(days=1)
          resolved_response = requests.post(
              "https://hist.databento.com/v0/symbology.resolve",
              auth=auth,
              data={
                  "dataset": "OPRA.PILLAR",
                  "symbols": "SPY.OPT",
                  "stype_in": "parent",
                  "stype_out": "raw_symbol",
                  "start_date": now.date().isoformat(),
                  "end_date": tomorrow.isoformat(),
              },
              timeout=60,
          )
          print("databento_resolve_http", resolved_response.status_code)
          resolved = resolved_response.json()
          mappings = resolved.get("result", {}).get("SPY.OPT", []) if isinstance(resolved, dict) else []
          raw_symbols = sorted(
              {
                  str(item.get("s"))
                  for item in mappings
                  if isinstance(item, dict) and item.get("s")
              }
          )
          print("databento_resolve_count", len(raw_symbols))
          print("databento_resolve_sample", raw_symbols[:3])
          if not raw_symbols and isinstance(resolved, dict):
              print("databento_resolve_detail", resolved)

          bars_response = requests.post(
              "https://hist.databento.com/v0/timeseries.get_range",
              auth=auth,
              data={
                  "dataset": "OPRA.PILLAR",
                  "schema": "ohlcv-1d",
                  "symbols": "SPY.OPT",
                  "stype_in": "parent",
                  "start": (now - timedelta(days=7)).date().isoformat(),
                  "end": tomorrow.isoformat(),
                  "encoding": "json",
                  "pretty_px": "true",
                  "pretty_ts": "true",
                  "map_symbols": "true",
                  "limit": "20",
              },
              timeout=60,
          )
          print("databento_option_bars_http", bars_response.status_code)
          bar_records = []
          for line in bars_response.text.splitlines():
              try:
                  value = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if isinstance(value, dict):
                  bar_records.append(value)
          print("databento_option_bars_count", len(bar_records))
          if bar_records:
              print("databento_option_bars_keys", sorted(bar_records[0]))
              print(
                  "databento_option_bars_sample",
                  {
                      key: bar_records[0].get(key)
                      for key in ("symbol", "open", "high", "low", "close", "volume", "pretty_ts_event")
                  },
              )
          PY
      - name: Validate required live providers
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python run_provider_validation.py \
            --report provider-validation-report.json \
            | tee provider-validation-output.json
      - name: Publish credential-safe proof
        if: always()
        shell: bash
        run: |
          {
            echo "## PR264 live-provider proof"
            echo
            echo "Release: \`${CAPITAL_INTELLIGENCE_RELEASE}\`"
            echo
            if [[ -f provider-validation-report.json ]]; then
              echo '```json'
              cat provider-validation-report.json
              echo '```'
            else
              echo "No credential-safe report was produced."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
