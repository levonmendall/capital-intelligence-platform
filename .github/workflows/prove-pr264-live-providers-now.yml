name: Prove PR264 Live Providers Now

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/prove-pr264-live-providers-now.yml
      - operations/comprehensive_market_discovery.py
      - operations/provider_validation.py
      - providers/yahoo_public.py
      - tests/test_yahoo_public.py

permissions:
  contents: read

jobs:
  live-provider-proof:
    if: github.event.pull_request.head.ref == 'agent/prove-pr264-live-providers-now'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CAPITAL_INTELLIGENCE_EODHD_API_TOKEN: ${{ secrets.CAPITAL_INTELLIGENCE_EODHD_API_TOKEN || secrets.EODHD_API_TOKEN || secrets.EODHD_API_KEY }}
      CAPITAL_INTELLIGENCE_DATABENTO_API_KEY: ${{ secrets.CAPITAL_INTELLIGENCE_DATABENTO_API_KEY || secrets.DATABENTO_API_KEY }}
      CAPITAL_INTELLIGENCE_RELEASE: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out current proof branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/prove-pr264-live-providers-now
      - name: Install provider validation runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
      - name: Probe authenticated options entitlements
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import json
          import os
          import requests

          token = os.environ["CAPITAL_INTELLIGENCE_EODHD_API_TOKEN"]
          response = requests.get(
              "https://eodhd.com/api/mp/unicornbay/options/contracts",
              params={
                  "api_token": token,
                  "filter[underlying_symbol]": "SPY",
                  "page[limit]": 5,
                  "fmt": "json",
              },
              timeout=30,
          )
          print("eodhd_options_http", response.status_code)
          try:
              payload = response.json()
          except ValueError:
              payload = None
          if isinstance(payload, dict):
              print("eodhd_options_keys", sorted(payload)[:20])
              data = payload.get("data")
              print("eodhd_options_count", len(data) if isinstance(data, list) else -1)
              if isinstance(data, list) and data and isinstance(data[0], dict):
                  print("eodhd_option_record_keys", sorted(data[0])[:40])
              error = payload.get("message") or payload.get("error")
              if error:
                  print("eodhd_options_error", str(error)[:300])
          elif isinstance(payload, list):
              print("eodhd_options_count", len(payload))
              if payload and isinstance(payload[0], dict):
                  print("eodhd_option_record_keys", sorted(payload[0])[:40])
          else:
              print("eodhd_options_non_json", response.text[:300])

          key = os.environ.get("CAPITAL_INTELLIGENCE_DATABENTO_API_KEY", "")
          if key:
              db = requests.get(
                  "https://hist.databento.com/v0/metadata.list_datasets",
                  auth=(key, ""),
                  timeout=30,
              )
              datasets = db.json() if db.status_code == 200 else []
              option_sets = [str(item) for item in datasets if "OPRA" in str(item).upper()]
              print("databento_options_datasets", option_sets)
          PY
      - name: Validate required live providers
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python run_provider_validation.py \
            --report provider-validation-report.json \
            | tee provider-validation-output.json
      - name: Publish credential-safe proof
        if: always()
        shell: bash
        run: |
          {
            echo "## PR264 live-provider proof"
            echo
            echo "Release: \`${CAPITAL_INTELLIGENCE_RELEASE}\`"
            echo
            if [[ -f provider-validation-report.json ]]; then
              echo '```json'
              cat provider-validation-report.json
              echo '```'
            else
              echo "No credential-safe report was produced."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
