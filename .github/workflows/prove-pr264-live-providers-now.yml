name: Prove PR264 Live Providers Now

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/prove-pr264-live-providers-now.yml
      - operations/comprehensive_market_discovery.py
      - operations/provider_validation.py
      - providers/databento_options.py
      - providers/yahoo_public.py
      - tests/test_databento_options.py
      - tests/test_yahoo_public.py

permissions:
  contents: read

jobs:
  live-provider-proof:
    if: github.event.pull_request.head.ref == 'agent/prove-pr264-live-providers-now'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CAPITAL_INTELLIGENCE_EODHD_API_TOKEN: ${{ secrets.CAPITAL_INTELLIGENCE_EODHD_API_TOKEN || secrets.EODHD_API_TOKEN || secrets.EODHD_API_KEY }}
      CAPITAL_INTELLIGENCE_DATABENTO_API_KEY: ${{ secrets.CAPITAL_INTELLIGENCE_DATABENTO_API_KEY || secrets.DATABENTO_API_KEY }}
      CAPITAL_INTELLIGENCE_RELEASE: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out current proof branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/prove-pr264-live-providers-now
      - name: Install provider validation runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
      - name: Probe prior-session Databento OPRA chain
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          from datetime import datetime, timedelta, timezone
          import json
          import os
          import requests

          key = os.environ["CAPITAL_INTELLIGENCE_DATABENTO_API_KEY"]
          auth = (key, "")
          now = datetime.now(timezone.utc)
          completed_date = now.date() - timedelta(days=1)
          while completed_date.weekday() >= 5:
              completed_date -= timedelta(days=1)
          next_date = completed_date + timedelta(days=1)
          start_date = completed_date.isoformat()
          end_date = next_date.isoformat()
          print("completed_option_session", start_date)

          parent_response = requests.post(
              "https://hist.databento.com/v0/symbology.resolve",
              auth=auth,
              data={
                  "dataset": "OPRA.PILLAR",
                  "symbols": "SPY.OPT",
                  "stype_in": "parent",
                  "stype_out": "instrument_id",
                  "start_date": start_date,
                  "end_date": end_date,
              },
              timeout=60,
          )
          print("parent_to_instrument_http", parent_response.status_code)
          parent_payload = parent_response.json()
          parent_result = parent_payload.get("result", {}) if isinstance(parent_payload, dict) else {}
          parent_rows = parent_result.get("SPY.OPT", []) if isinstance(parent_result, dict) else []
          instrument_ids = sorted(
              {
                  str(row.get("s"))
                  for row in parent_rows
                  if isinstance(row, dict) and row.get("s") is not None
              }
          )
          print("parent_to_instrument_count", len(instrument_ids))
          print("parent_to_instrument_sample", instrument_ids[:5])
          if not instrument_ids:
              print("parent_to_instrument_detail", parent_payload)
              raise SystemExit(1)

          sample_ids = instrument_ids[:200]
          raw_response = requests.post(
              "https://hist.databento.com/v0/symbology.resolve",
              auth=auth,
              data={
                  "dataset": "OPRA.PILLAR",
                  "symbols": ",".join(sample_ids),
                  "stype_in": "instrument_id",
                  "stype_out": "raw_symbol",
                  "start_date": start_date,
                  "end_date": end_date,
              },
              timeout=60,
          )
          print("instrument_to_raw_http", raw_response.status_code)
          raw_payload = raw_response.json()
          raw_result = raw_payload.get("result", {}) if isinstance(raw_payload, dict) else {}
          raw_symbols = []
          if isinstance(raw_result, dict):
              for rows in raw_result.values():
                  if not isinstance(rows, list):
                      continue
                  for row in rows:
                      if isinstance(row, dict) and row.get("s"):
                          raw_symbols.append(str(row["s"]))
          raw_symbols = sorted(set(raw_symbols))
          print("instrument_to_raw_count", len(raw_symbols))
          print("instrument_to_raw_sample", raw_symbols[:5])
          if not raw_symbols:
              print("instrument_to_raw_detail", raw_payload)
              raise SystemExit(1)

          bars_response = requests.post(
              "https://hist.databento.com/v0/timeseries.get_range",
              auth=auth,
              data={
                  "dataset": "OPRA.PILLAR",
                  "schema": "ohlcv-1d",
                  "symbols": ",".join(raw_symbols[:20]),
                  "stype_in": "raw_symbol",
                  "start": start_date,
                  "end": end_date,
                  "encoding": "json",
                  "pretty_px": "true",
                  "pretty_ts": "true",
                  "map_symbols": "true",
                  "limit": "200",
              },
              timeout=60,
          )
          print("raw_option_bars_http", bars_response.status_code)
          bar_records = []
          for line in bars_response.text.splitlines():
              try:
                  value = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if isinstance(value, dict) and "detail" not in value:
                  bar_records.append(value)
          print("raw_option_bars_count", len(bar_records))
          if bar_records:
              print("raw_option_bar_keys", sorted(bar_records[0]))
              print(
                  "raw_option_bar_sample",
                  {
                      key: bar_records[0].get(key)
                      for key in (
                          "symbol",
                          "open",
                          "high",
                          "low",
                          "close",
                          "volume",
                          "pretty_ts_event",
                      )
                  },
              )
          else:
              print("raw_option_bars_detail", bars_response.text[:1000])
              raise SystemExit(1)
          PY
      - name: Validate required live providers
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python run_provider_validation.py \
            --report provider-validation-report.json \
            | tee provider-validation-output.json
      - name: Publish credential-safe proof
        if: always()
        shell: bash
        run: |
          {
            echo "## PR264 live-provider proof"
            echo
            echo "Release: \`${CAPITAL_INTELLIGENCE_RELEASE}\`"
            echo
            if [[ -f provider-validation-report.json ]]; then
              echo '```json'
              cat provider-validation-report.json
              echo '```'
            else
              echo "No credential-safe report was produced."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
