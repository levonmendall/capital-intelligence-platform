name: Prove PR264 Live Providers Now

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/prove-pr264-live-providers-now.yml
      - operations/comprehensive_market_discovery.py
      - operations/provider_validation.py
      - providers/databento.py
      - providers/yahoo_public.py
      - tests/test_yahoo_public.py

permissions:
  contents: read

jobs:
  live-provider-proof:
    if: github.event.pull_request.head.ref == 'agent/prove-pr264-live-providers-now'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CAPITAL_INTELLIGENCE_EODHD_API_TOKEN: ${{ secrets.CAPITAL_INTELLIGENCE_EODHD_API_TOKEN || secrets.EODHD_API_TOKEN || secrets.EODHD_API_KEY }}
      CAPITAL_INTELLIGENCE_DATABENTO_API_KEY: ${{ secrets.CAPITAL_INTELLIGENCE_DATABENTO_API_KEY || secrets.DATABENTO_API_KEY }}
      CAPITAL_INTELLIGENCE_RELEASE: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out current proof branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/prove-pr264-live-providers-now
      - name: Install provider validation runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
      - name: Probe authenticated options entitlements
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          from datetime import datetime, timezone
          import json
          import os
          import requests

          token = os.environ["CAPITAL_INTELLIGENCE_EODHD_API_TOKEN"]
          response = requests.get(
              "https://eodhd.com/api/mp/unicornbay/options/contracts",
              params={
                  "api_token": token,
                  "filter[underlying_symbol]": "SPY",
                  "page[limit]": 5,
                  "fmt": "json",
              },
              timeout=30,
          )
          print("eodhd_options_http", response.status_code)

          key = os.environ["CAPITAL_INTELLIGENCE_DATABENTO_API_KEY"]
          auth = (key, "")
          datasets_response = requests.get(
              "https://hist.databento.com/v0/metadata.list_datasets",
              auth=auth,
              timeout=30,
          )
          datasets = datasets_response.json() if datasets_response.status_code == 200 else []
          print(
              "databento_options_datasets",
              [str(item) for item in datasets if "OPRA" in str(item).upper()],
          )
          schemas_response = requests.get(
              "https://hist.databento.com/v0/metadata.list_schemas",
              auth=auth,
              params={"dataset": "OPRA.PILLAR"},
              timeout=30,
          )
          schemas = schemas_response.json() if schemas_response.status_code == 200 else []
          print("databento_opra_schemas", schemas)

          now = datetime.now(timezone.utc)
          definition_response = requests.post(
              "https://hist.databento.com/v0/timeseries.get_range",
              auth=auth,
              data={
                  "dataset": "OPRA.PILLAR",
                  "schema": "definition",
                  "symbols": "SPY.OPT",
                  "stype_in": "parent",
                  "start": now.date().isoformat(),
                  "end": now.isoformat(),
                  "encoding": "json",
                  "pretty_px": "true",
                  "pretty_ts": "true",
                  "map_symbols": "true",
                  "limit": "20",
              },
              timeout=60,
          )
          print("databento_definition_http", definition_response.status_code)
          records = []
          for line in definition_response.text.splitlines():
              try:
                  value = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if isinstance(value, dict):
                  records.append(value)
          print("databento_definition_count", len(records))
          if records:
              print("databento_definition_keys", sorted(records[0]))
              safe = {
                  key: records[0].get(key)
                  for key in (
                      "symbol",
                      "raw_symbol",
                      "asset",
                      "instrument_class",
                      "expiration",
                      "strike_price",
                      "underlying",
                  )
              }
              print("databento_definition_sample", safe)
          PY
      - name: Validate required live providers
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python run_provider_validation.py \
            --report provider-validation-report.json \
            | tee provider-validation-output.json
      - name: Publish credential-safe proof
        if: always()
        shell: bash
        run: |
          {
            echo "## PR264 live-provider proof"
            echo
            echo "Release: \`${CAPITAL_INTELLIGENCE_RELEASE}\`"
            echo
            if [[ -f provider-validation-report.json ]]; then
              echo '```json'
              cat provider-validation-report.json
              echo '```'
            else
              echo "No credential-safe report was produced."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
