name: Apply response-time availability authority

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/expand-return-opportunity-discovery'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and apply live availability fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < tools/live_availability_fix/payload)" -eq 2408
          echo 'b47efce494d896da56ee81f0adb44a7983d2940b0b85b9cac1df334f254e4a2f  tools/live_availability_fix/payload' | sha256sum -c -
          base64 --decode tools/live_availability_fix/payload > /tmp/live-availability.patch.xz
          echo '75de206163b933f7e53adcad081dfcff12ded3903afca4d623d539e91a25fd42  /tmp/live-availability.patch.xz' | sha256sum -c -
          xz --decompress --stdout /tmp/live-availability.patch.xz > /tmp/live-availability.patch
          echo '0ef3a11707e74ca072deb088595b927e50a26e7191a82f076eb05b47d9198080  /tmp/live-availability.patch' | sha256sum -c -
          git apply --check -p3 /tmp/live-availability.patch
          git apply -p3 /tmp/live-availability.patch

      - name: Commit clean live-availability correction
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/live_availability_fix
          rm -f .github/workflows/apply-live-availability-fix.yml
          git config user.name 'capital-intelligence-automation'
          git config user.email 'capital-intelligence-automation@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Use receipt time for live evidence availability'
          git push origin "HEAD:${{ github.head_ref }}"
