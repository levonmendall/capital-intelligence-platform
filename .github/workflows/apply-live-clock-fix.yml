name: Apply live clock normalization

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/expand-return-opportunity-discovery'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and apply live-clock fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < tools/live_clock_fix/payload)" -eq 4380
          echo '960675fcd17f1f1710959efd8ad734d47a7fd612cff3b4a39d13903a88c7db5c  tools/live_clock_fix/payload' | sha256sum -c -
          base64 --decode tools/live_clock_fix/payload > /tmp/live-clock-fix.patch.xz
          echo '043d3de7d1d13e406821e1980555fe493558a6ef6e13fa0b5d0dac0c5cbcdd63  /tmp/live-clock-fix.patch.xz' | sha256sum -c -
          xz --decompress --stdout /tmp/live-clock-fix.patch.xz > /tmp/live-clock-fix.patch
          echo 'fcf30657f32648522cb196a2e95045be565fe458586dbc88bbf04286f22b07af  /tmp/live-clock-fix.patch' | sha256sum -c -
          git apply --check -p1 /tmp/live-clock-fix.patch
          git apply -p1 /tmp/live-clock-fix.patch

      - name: Commit clean timing correction
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/live_clock_fix
          rm -f .github/workflows/apply-live-clock-fix.yml
          git config user.name 'capital-intelligence-automation'
          git config user.email 'capital-intelligence-automation@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Use collection-complete CIO timestamp'
          git push origin "HEAD:${{ github.head_ref }}"
