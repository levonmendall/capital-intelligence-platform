name: Fix PR264 Company Lineage

on:
  push:
    branches:
      - agent/verify-pr264-live-and-ci
    paths:
      - .pr264-company-lineage-trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/verify-pr264-live-and-ci
          fetch-depth: 0
      - name: Apply and publish correction
        shell: bash
        run: |
          set -euo pipefail
          python tools/fix_pr264_company_lineage.py
          python -m py_compile production_paper_evidence.py
          git config user.name "capital-intelligence-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Correct PR264 company-equity evidence lineage"
          git push origin HEAD:agent/verify-pr264-live-and-ci
