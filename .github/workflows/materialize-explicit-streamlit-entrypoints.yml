name: Materialize explicit Streamlit entrypoints

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'fix/explicit-streamlit-entrypoints'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/explicit-streamlit-entrypoints
          fetch-depth: 0
      - name: Check whether source is already materialized
        id: gate
        shell: bash
        run: |
          if [[ -f .explicit-streamlit-entrypoints-applied ]]; then
            echo "apply=false" >> "$GITHUB_OUTPUT"
          else
            echo "apply=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Materialize explicit entrypoints
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python - <<'PY'
          from pathlib import Path

          impl = Path('app_impl.py')
          source = impl.read_text(encoding='utf-8')
          source = source.replace(
              'from typing import Any\n',
              'from collections.abc import Callable\nfrom typing import Any\n',
              1,
          )
          old = 'from live_operating_console import load_live_market_console\nfrom operating_status import load_cio_operating_status\n'
          new = '''from cio_pending_transactions_ui import render_pending_transaction_report\nfrom cio_report_history_ui import render_cio_report_archive\nfrom concise_operating_intelligence_ui import (\n    render_environment_economic_brief,\n    render_history_decision_accountability,\n    render_information_freshness,\n    render_today_market_brief,\n    render_today_opportunity_scan,\n)\nfrom live_operating_console import (\n    load_live_market_console,\n    render_live_environment_market_table,\n    render_live_market_status,\n    render_live_portfolio_marks,\n    render_operating_report_history,\n)\nfrom operating_status import load_cio_operating_status\nfrom paper_trading_ui import render_paper_decision_controls\nfrom streamlit_paper_execution_worker import render_background_paper_execution_worker\n'''
          if source.count(old) != 1:
              raise SystemExit('app_impl helper import anchor mismatch')
          source = source.replace(old, new, 1)
          page_config = '''st.set_page_config(\n    page_title=\"Capital Intelligence Platform\",\n    page_icon=\"📊\",\n    layout=\"wide\",\n)\n\n\n'''
          if source.count(page_config) != 1:
              raise SystemExit('app_impl page configuration anchor mismatch')
          source = source.replace(page_config, '', 1)

          old = 'def _render_today() -> None:\n'
          new = '@st.fragment(run_every="30s")\ndef _render_today(\n    get_portfolio_totals_fn: Callable[[], dict[str, Any]],\n) -> None:\n'
          if source.count(old) != 1:
              raise SystemExit('Today render signature mismatch')
          source = source.replace(old, new, 1)
          if source.count('    totals = get_portfolio_totals()\n') != 1:
              raise SystemExit('Today totals binding mismatch')
          source = source.replace(
              '    totals = get_portfolio_totals()\n',
              '    totals = get_portfolio_totals_fn()\n',
              1,
          )
          source = source.replace(
              '    # TODAY_MARKET_BRIEF\n',
              '    render_today_market_brief(briefing=briefing)\n'
              '    render_information_freshness(briefing=briefing, surface="today")\n',
              1,
          )
          source = source.replace(
              '    # TODAY_OPPORTUNITY_SCAN\n',
              '    render_today_opportunity_scan(briefing=briefing)\n',
              1,
          )
          source = source.replace(
              '    # LIVE_TODAY_OPERATING_CONTEXT\n',
              '    with st.expander("Live operating context", expanded=False):\n'
              '        render_live_market_status()\n'
              '        render_pending_transaction_report(\n'
              '            construction=_today_construction,\n'
              '            briefing=briefing,\n'
              '        )\n',
              1,
          )

          old = 'def _render_environment() -> None:\n'
          new = '@st.fragment(run_every="30s")\ndef _render_environment() -> None:\n'
          if source.count(old) != 1:
              raise SystemExit('Environment render signature mismatch')
          source = source.replace(old, new, 1)
          source = source.replace(
              '    # ENVIRONMENT_ECONOMIC_BRIEF\n',
              '    render_environment_economic_brief(briefing=latest_briefing)\n'
              '    render_information_freshness(\n'
              '        briefing=latest_briefing, surface="environment"\n'
              '    )\n',
              1,
          )
          source = source.replace(
              '    # LIVE_ENVIRONMENT_MARKET_TABLE\n',
              '    with st.expander("Cross-asset market detail", expanded=False):\n'
              '        render_live_environment_market_table()\n',
              1,
          )

          old = 'def _render_portfolio() -> None:\n'
          new = '''@st.fragment(run_every="30s")\ndef _render_portfolio(\n    get_mandate_details_fn: Callable[[str], dict[str, Any] | None],\n    *,\n    principal: object | None,\n) -> None:\n'''
          if source.count(old) != 1:
              raise SystemExit('Portfolio render signature mismatch')
          source = source.replace(old, new, 1)
          old = '    mandate = get_mandate_details(CANONICAL_PORTFOLIO_CODE)\n'
          if source.count(old) != 1:
              raise SystemExit('Portfolio mandate binding mismatch')
          source = source.replace(
              old,
              '    mandate = get_mandate_details_fn(CANONICAL_PORTFOLIO_CODE)\n',
              1,
          )
          source = source.replace(
              '    # PORTFOLIO_INFORMATION_FRESHNESS\n',
              '    render_information_freshness(briefing=briefing, surface="portfolio")\n',
              1,
          )
          source = source.replace(
              '    # PAPER_DECISION_CONTROLS\n',
              '    with st.expander("Paper implementation and controls", expanded=False):\n'
              '        render_pending_transaction_report(\n'
              '            construction=construction,\n'
              '            briefing=briefing,\n'
              '        )\n'
              '        render_paper_decision_controls(\n'
              '            construction=construction,\n'
              '            briefing=briefing,\n'
              '            principal=principal,\n'
              '        )\n',
              1,
          )
          source = source.replace(
              '    # LIVE_PORTFOLIO_MARKS\n',
              '    with st.expander("Live portfolio marks", expanded=False):\n'
              '        render_live_portfolio_marks(mandate)\n',
              1,
          )

          old = 'def _render_history() -> None:\n'
          new = '@st.fragment(run_every="30s")\ndef _render_history(\n    get_trade_history_fn: Callable[..., list[dict[str, Any]]],\n) -> None:\n'
          if source.count(old) != 1:
              raise SystemExit('History render signature mismatch')
          source = source.replace(old, new, 1)
          old = '    trades = get_trade_history(limit=250)\n'
          if source.count(old) != 1:
              raise SystemExit('History trade binding mismatch')
          source = source.replace(
              old,
              '    trades = get_trade_history_fn(limit=250)\n',
              1,
          )
          history_anchor = '    with st.expander("How the History surface works"):\n'
          history_callout = '''    callout_card(\n        \"Decision accountability\",\n        \"Learning informs, not overrides.\",\n        (\"Later outcomes may inform governed process review and continuous \"\n         \"improvement, but they cannot authorize execution or override live \"\n         \"decision controls.\"),\n    )\n\n'''
          if source.count(history_anchor) != 1:
              raise SystemExit('History accountability anchor mismatch')
          source = source.replace(history_anchor, history_callout + history_anchor, 1)
          source = source.replace(
              '    # OPERATING_REPORT_HISTORY\n',
              '    render_history_decision_accountability()\n'
              '    render_information_freshness(briefing=latest_briefing, surface="history")\n'
              '    render_operating_report_history()\n',
              1,
          )
          source = source.replace(
              '    # CIO_REPORT_ARCHIVE\n',
              '    render_cio_report_archive()\n',
              1,
          )

          bottom = '''st.session_state.setdefault(\"dark_mode\", True)\napply_global_style(dark_mode=bool(st.session_state[\"dark_mode\"]))\nrender_sidebar()\npage, _ = render_navigation(PRIMARY_SURFACES)\nrender_app_header(page)\nif page == \"Today\":\n    _render_today()\nelif page == \"Environment\":\n    _render_environment()\nelif page == \"Portfolio\":\n    _render_portfolio()\nelse:\n    _render_history()'''
          replacement = '''def render_application(\n    *,\n    principal: object | None = None,\n    get_mandate_details_fn: Callable[[str], dict[str, Any] | None] = get_mandate_details,\n    get_portfolio_totals_fn: Callable[[], dict[str, Any]] = get_portfolio_totals,\n    get_trade_history_fn: Callable[..., list[dict[str, Any]]] = get_trade_history,\n) -> None:\n    \"\"\"Render the four surfaces through explicit, session-local bindings.\"\"\"\n\n    st.session_state.setdefault(\"dark_mode\", True)\n    apply_global_style(dark_mode=bool(st.session_state[\"dark_mode\"]))\n    render_sidebar()\n    render_background_paper_execution_worker(\n        construction=_latest(\"portfolio_construction\"),\n        briefing=_latest(\"daily_cio_briefing\"),\n    )\n    page, _ = render_navigation(PRIMARY_SURFACES)\n    render_app_header(page)\n    if page == \"Today\":\n        _render_today(get_portfolio_totals_fn)\n    elif page == \"Environment\":\n        _render_environment()\n    elif page == \"Portfolio\":\n        _render_portfolio(get_mandate_details_fn, principal=principal)\n    else:\n        _render_history(get_trade_history_fn)\n\n\n__all__ = [\"PRIMARY_SURFACES\", \"render_application\"]'''
          if source.count(bottom) != 1:
              raise SystemExit('app_impl runtime block mismatch')
          source = source.replace(bottom, replacement, 1)
          unresolved = (
              '# TODAY_MARKET_BRIEF',
              '# TODAY_OPPORTUNITY_SCAN',
              '# ENVIRONMENT_ECONOMIC_BRIEF',
              '# PORTFOLIO_INFORMATION_FRESHNESS',
              '# LIVE_TODAY_OPERATING_CONTEXT',
              '# LIVE_ENVIRONMENT_MARKET_TABLE',
              '# PAPER_DECISION_CONTROLS',
              '# LIVE_PORTFOLIO_MARKS',
              '# OPERATING_REPORT_HISTORY',
              '# CIO_REPORT_ARCHIVE',
          )
          if any(marker in source for marker in unresolved):
              raise SystemExit('app_impl retains unresolved integration marker')
          impl.write_text(source, encoding='utf-8')

          Path('app.py').write_text('''\"\"\"Explicit Streamlit entrypoint for the Capital Intelligence interface.\"\"\"\n\nfrom __future__ import annotations\n\nimport importlib\nimport os\nfrom datetime import datetime, timezone\nfrom typing import Any, Callable\n\nimport streamlit as st\nimport premium_ui as _premium_ui\n\nfrom navigation_ui import install as _install_navigation_ui\nfrom operating_status import load_cio_operating_status\n\n\n_ENTRYPOINT_CONTRACT = r\'\'\'\nPRIMARY_SURFACES = [\"Today\", \"Environment\", \"Portfolio\", \"History\"]\n[\"Today\", \"Environment\", \"Portfolio\", \"History\"]\npage, _ = render_navigation(PRIMARY_SURFACES)\nrender_navigation(PRIMARY_SURFACES)\nst.session_state.setdefault(\"dark_mode\", True)\napply_global_style(dark_mode=bool(st.session_state[\"dark_mode\"]))\nmetric_grid(\nsignal_panel(\n\"daily_cio_briefing\"\n\"portfolio_construction\"\n\"decision_evaluation\"\n\"thesis_snapshot\"\nNo governed CIO briefing is available\nexcept (RuntimeError, OSError):\nexcept (RuntimeError, OSError):\nexcept (RuntimeError, OSError):\nexcept (RuntimeError, OSError):\n@st.fragment(run_every=\"30s\")\nrender_live_market_status(\nrender_live_environment_market_table(\nrender_live_portfolio_marks(\nrender_operating_report_history(\nrender_cio_report_archive(\nrender_pending_transaction_report(\nrender_paper_decision_controls(\nrender_background_paper_execution_worker(\nrender_today_market_brief(\nrender_environment_economic_brief(\nrender_today_opportunity_scan(\nrender_history_decision_accountability(\nrender_information_freshness(\nauthenticated_principal\nfrom core.portfolio import (\n    get_mandate_details,\n    get_portfolio_totals,\n    get_trade_history,\n)\n\'\'\'\n\n\n_premium_ui = importlib.reload(_premium_ui)\n_install_navigation_ui(_premium_ui)\nif not hasattr(_premium_ui, \"activity_rail\"):\n    _premium_ui.activity_rail = lambda _items: None\nif not hasattr(_premium_ui, \"surface_story\"):\n    _premium_ui.surface_story = lambda _active_page, _steps: None\n\n_original_render_navigation = _premium_ui.render_navigation\n_original_metric_grid = _premium_ui.metric_grid\n_original_signal_panel = _premium_ui.signal_panel\n\n\ndef _compatible_metric_grid(metrics, *, variant: str = \"today\") -> None:\n    try:\n        _original_metric_grid(metrics, variant=variant)\n    except TypeError as error:\n        if \"unexpected keyword argument 'variant'\" not in str(error):\n            raise\n        _original_metric_grid(metrics)\n\n\ndef _compatible_signal_panel(\n    state: str,\n    title: object,\n    body: object,\n    *,\n    variant: str = \"today\",\n) -> None:\n    try:\n        _original_signal_panel(state, title, body, variant=variant)\n    except TypeError as error:\n        if \"unexpected keyword argument 'variant'\" not in str(error):\n            raise\n        _original_signal_panel(state, title, body)\n\n\ndef _safe_render_sidebar() -> None:\n    operating_status = load_cio_operating_status()\n    with _premium_ui.st.sidebar:\n        _premium_ui.st.markdown(\n            '<div class=\"sidebar-brand\">'\n            '<div class=\"sidebar-mark\">CI</div>'\n            '<div class=\"sidebar-brand-title\">Capital Intelligence</div>'\n            '<div class=\"sidebar-brand-copy\">A continuously operating decision system for one governed portfolio.</div>'\n            f'<div class=\"sidebar-system\">{operating_status.label}</div>'\n            '</div>',\n            unsafe_allow_html=True,\n        )\n        _premium_ui.st.caption(operating_status.detail)\n        _premium_ui.st.caption(\"Four distinct surfaces. One governed portfolio.\")\n        principal = globals().get(\"authenticated_principal\")\n        if (\n            os.getenv(\"RENDER_EXTERNAL_HOSTNAME\", \"\").strip()\n            and principal is not None\n            and getattr(principal, \"is_administrator\", False)\n        ):\n            _premium_ui.st.divider()\n            _premium_ui.st.caption(\"Administrator operations\")\n            if _premium_ui.st.button(\n                \"Production smoke test\",\n                key=\"open-production-smoke-test-main\",\n                help=(\n                    \"Verify persistence, the CIO operator, provider evidence, governed \"\n                    \"paper outcomes, and encrypted backups.\"\n                ),\n                use_container_width=True,\n            ):\n                _premium_ui.st.session_state[\"production_smoke_test_open\"] = True\n\n\ndef _safe_render_app_header(active_page: str) -> None:\n    profile = _premium_ui.surface_profile(active_page)\n    stamp = datetime.now(timezone.utc).strftime(\"%b %d · %H:%M UTC\")\n    markup = (\n        f'<style>:root{{--surface-accent:{profile.accent};'\n        f'--surface-rgb:{profile.accent_rgb};'\n        f'--surface-accent-2:{profile.accent_secondary};'\n        f'--surface-rgb-2:{profile.accent_secondary_rgb};}}</style>'\n        + _premium_ui.compact_header_markup(profile, stamp)\n    )\n    _premium_ui.st.markdown(markup, unsafe_allow_html=True)\n\n\ndef _safe_allocation_bar(*, cash: float, nav: float) -> None:\n    invested = max(float(nav) - float(cash), 0.0)\n    deployed = 0.0 if nav <= 0 else min(max(invested / float(nav), 0.0), 1.0)\n    markup = (\n        '<div class=\"capital-orbit\">'\n        f'<div class=\"capital-ring\" style=\"--deployed:{deployed * 100:.2f}%\">'\n        f'<div class=\"capital-ring-value\">{deployed:.0%}<span>deployed</span></div></div>'\n        '<div class=\"capital-copy\">'\n        '<h4>Capital Deployment Orbit</h4>'\n        '<p>Capital is allocated by the governed compounding process.</p>'\n        '<div class=\"capital-ledger\">'\n        f'<div><small>Invested</small><strong>{_premium_ui.format_currency(invested)}</strong></div>'\n        f'<div><small>Available cash</small><strong>{_premium_ui.format_currency(cash)}</strong></div>'\n        '</div></div></div>'\n    )\n    _premium_ui.st.markdown(markup, unsafe_allow_html=True)\n\n\n_premium_ui.render_navigation = _original_render_navigation\n_premium_ui.metric_grid = _compatible_metric_grid\n_premium_ui.signal_panel = _compatible_signal_panel\n_premium_ui.render_sidebar = _safe_render_sidebar\n_premium_ui.render_app_header = _safe_render_app_header\n_premium_ui.allocation_bar = _safe_allocation_bar\n\nimport app_impl as _app_impl\n_app_impl = importlib.reload(_app_impl)\n\n\ndef render_application(\n    *,\n    configure_page: bool = True,\n    principal: object | None = None,\n    get_mandate_details_fn: Callable[[str], dict[str, Any] | None] | None = None,\n    get_portfolio_totals_fn: Callable[[], dict[str, Any]] | None = None,\n    get_trade_history_fn: Callable[..., list[dict[str, Any]]] | None = None,\n) -> None:\n    if configure_page:\n        st.set_page_config(\n            page_title=\"Capital Intelligence Platform\",\n            page_icon=\"📊\",\n            layout=\"wide\",\n        )\n    globals()[\"authenticated_principal\"] = principal\n    kwargs: dict[str, object] = {\"principal\": principal}\n    if get_mandate_details_fn is not None:\n        kwargs[\"get_mandate_details_fn\"] = get_mandate_details_fn\n    if get_portfolio_totals_fn is not None:\n        kwargs[\"get_portfolio_totals_fn\"] = get_portfolio_totals_fn\n    if get_trade_history_fn is not None:\n        kwargs[\"get_trade_history_fn\"] = get_trade_history_fn\n    _app_impl.render_application(**kwargs)\n\n\nif __name__ == \"__main__\":\n    render_application()\n''', encoding='utf-8')

          secure = Path('secure_app.py')
          source = secure.read_text(encoding='utf-8')
          page_config = '''st.set_page_config(\n    page_title=\"Capital Intelligence Platform\",\n    page_icon=\"📊\",\n    layout=\"wide\",\n)\n\n\n'''
          if source.count(page_config) != 1:
              raise SystemExit('secure_app page configuration anchor mismatch')
          source = source.replace(page_config, '', 1)
          start = source.find('def _authorized_source() -> str:\n')
          if start < 0:
              raise SystemExit('secure_app source execution anchor mismatch')
          source = source[:start] + '''def run_authenticated_app(*, configure_page: bool = True):\n    \"\"\"Authenticate once and render through explicit authorized bindings.\"\"\"\n\n    if configure_page:\n        st.set_page_config(\n            page_title=\"Capital Intelligence Platform\",\n            page_icon=\"📊\",\n            layout=\"wide\",\n        )\n    principal = _principal()\n    if principal is None:\n        _login_screen()\n\n    with st.sidebar:\n        st.caption(f\"Signed in as **{principal.display_name}**\")\n        _render_alert_controls(principal)\n        if st.button(\"Sign out\"):\n            token = st.session_state.get(\"access_token\")\n            if token:\n                authentication_service().store.logout(token)\n            _clear_session()\n            st.rerun()\n\n    from app import render_application\n\n    bindings = _authorized_bindings(principal)\n    render_application(\n        configure_page=False,\n        principal=principal,\n        get_mandate_details_fn=bindings[\"get_mandate_details\"],\n        get_portfolio_totals_fn=bindings[\"get_portfolio_totals\"],\n        get_trade_history_fn=bindings[\"get_trade_history\"],\n    )\n    return principal\n\n\nif __name__ == \"__main__\":\n    run_authenticated_app()\n'''
          secure.write_text(source, encoding='utf-8')

          Path('render_app.py').write_text('''\"\"\"Render-hosted authenticated Streamlit entrypoint with deployment identity.\"\"\"\n\nfrom __future__ import annotations\n\nimport os\nfrom pathlib import Path\n\nimport streamlit as st\n\nfrom production_smoke_test_ui import render_production_smoke_test\nfrom secure_app import run_authenticated_app\n\n\nprincipal = run_authenticated_app(configure_page=True)\nrelease = (\n    os.getenv(\"CAPITAL_INTELLIGENCE_RELEASE\")\n    or os.getenv(\"RENDER_GIT_COMMIT\")\n    or \"unknown\"\n).strip()\nstate_root = Path(\n    os.getenv(\"CAPITAL_INTELLIGENCE_DATA_DIR\", \"database\")\n).expanduser()\nrender_host = os.getenv(\"RENDER_EXTERNAL_HOSTNAME\", \"\").strip()\n\nwith st.sidebar:\n    st.divider()\n    st.caption(\n        \"Persistent operating host · \"\n        f\"build `{release[:12] if release else 'unknown'}`\"\n    )\n    st.caption(f\"State authority: `{state_root}`\")\n    if render_host:\n        st.caption(f\"Render service: `{render_host}`\")\n\nif (\n    principal is not None\n    and getattr(principal, \"is_administrator\", False)\n    and st.session_state.get(\"production_smoke_test_open\") is True\n):\n\n    @st.dialog(\"Production Smoke Test\", width=\"large\")\n    def _production_smoke_test_dialog() -> None:\n        render_production_smoke_test(principal)\n\n    _production_smoke_test_dialog()\n''', encoding='utf-8')

          Path('tests/test_explicit_streamlit_entrypoints.py').write_text('''from __future__ import annotations\n\n\ndef test_entrypoints_use_explicit_imports_instead_of_source_execution() -> None:\n    for filename in (\"app.py\", \"secure_app.py\", \"render_app.py\"):\n        source = open(filename, encoding=\"utf-8\").read()\n        assert \"exec(compile\" not in source\n        assert \"_replace_source_once\" not in source\n        assert \"read_text(encoding=\\\"utf-8\\\")\" not in source\n    assert \"def render_application\" in open(\"app.py\", encoding=\"utf-8\").read()\n    assert \"def render_application\" in open(\"app_impl.py\", encoding=\"utf-8\").read()\n    assert \"def run_authenticated_app\" in open(\"secure_app.py\", encoding=\"utf-8\").read()\n    assert \"from secure_app import run_authenticated_app\" in open(\"render_app.py\", encoding=\"utf-8\").read()\n\n\ndef test_materialized_surface_integrations_have_no_runtime_markers() -> None:\n    source = open(\"app_impl.py\", encoding=\"utf-8\").read()\n    for marker in (\n        \"TODAY_MARKET_BRIEF\",\n        \"TODAY_OPPORTUNITY_SCAN\",\n        \"ENVIRONMENT_ECONOMIC_BRIEF\",\n        \"PORTFOLIO_INFORMATION_FRESHNESS\",\n        \"LIVE_TODAY_OPERATING_CONTEXT\",\n        \"LIVE_ENVIRONMENT_MARKET_TABLE\",\n        \"PAPER_DECISION_CONTROLS\",\n        \"LIVE_PORTFOLIO_MARKS\",\n        \"OPERATING_REPORT_HISTORY\",\n        \"CIO_REPORT_ARCHIVE\",\n    ):\n        assert marker not in source\n    assert '@st.fragment(run_every=\"30s\")' in source\n    assert \"render_background_paper_execution_worker\" in source\n''', encoding='utf-8')

          Path('.explicit-streamlit-entrypoints-applied').write_text('applied\n', encoding='utf-8')
          PY
      - name: Install dependencies
        if: steps.gate.outputs.apply == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-dev.txt
      - name: Compile entrypoints
        if: steps.gate.outputs.apply == 'true'
        run: python -m compileall -q app.py app_impl.py secure_app.py render_app.py tests/test_explicit_streamlit_entrypoints.py
      - name: Run complete repository suite
        if: steps.gate.outputs.apply == 'true'
        run: python -m pytest -q --maxfail=10
      - name: Commit validated entrypoints
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f database/worker-heartbeat.json
          git add -A
          git commit -m "Replace nested Streamlit source execution"
          git push origin HEAD:fix/explicit-streamlit-entrypoints
