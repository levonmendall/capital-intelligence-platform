name: Sync communication branch with main

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/expose-daily-cio-briefing'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out communication branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/expose-daily-cio-briefing
          fetch-depth: 0

      - name: Merge current main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main

      - name: Remove temporary workflow and validate
        run: |
          rm .github/workflows/sync-main-for-communication.yml
          python -m py_compile app.py app_impl.py premium_ui.py cio_pending_transactions_ui.py
          python -m pip install --disable-pip-version-check -r requirements.txt pytest
          python -m pytest -q \
            tests/test_surface_information_hierarchy.py \
            tests/test_operating_completeness_fixes.py \
            tests/test_paper_trading_ui_approval.py \
            tests/test_cio_decision_quality_corrections.py

      - name: Push synchronized branch
        run: |
          git add -A
          git commit -m 'Remove temporary branch sync workflow'
          git push origin HEAD:agent/expose-daily-cio-briefing
