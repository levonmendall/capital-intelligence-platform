name: Diagnose PR1 canonical orchestration payload

on:
  pull_request:
    paths:
      - .github/workflows/apply-pr1-canonical-orchestration.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/export-pr1-base

      - name: Reconstruct and inspect payload
        run: |
          cat .github/patches/pr1-canonical-orchestration-{00..01}.b64 \
            | base64 --decode \
            > pr1.patch.gz
          sha256sum pr1.patch.gz
          gzip --test pr1.patch.gz
          gzip --decompress --stdout pr1.patch.gz > pr1.patch
          sha256sum pr1.patch

      - name: Upload reconstructed payload
        uses: actions/upload-artifact@v4
        with:
          name: pr1-reconstructed-payload
          path: |
            pr1.patch.gz
            pr1.patch
          if-no-files-found: error
          retention-days: 1
