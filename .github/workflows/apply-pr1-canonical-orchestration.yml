name: Diagnose PR1 native payload

on:
  pull_request:
    paths:
      - .github/workflows/apply-pr1-canonical-orchestration.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out payload branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/export-pr1-base

      - name: Capture remote bytes and hashes
        run: |
          mkdir -p diagnostic
          cp .github/patches/pr1-native-*.b64 diagnostic/
          sha256sum diagnostic/pr1-native-*.b64 | tee diagnostic/chunk-hashes.txt
          cat diagnostic/pr1-native-{00..04}.b64 | base64 --decode > diagnostic/pr1.patch.gz
          sha256sum diagnostic/pr1.patch.gz | tee diagnostic/compressed-hash.txt
          if gzip --test diagnostic/pr1.patch.gz; then
            gzip --decompress --stdout diagnostic/pr1.patch.gz > diagnostic/pr1.patch
            sha256sum diagnostic/pr1.patch | tee diagnostic/patch-hash.txt
          else
            printf 'gzip-invalid\n' > diagnostic/patch-hash.txt
          fi

      - name: Upload diagnostic bytes
        uses: actions/upload-artifact@v4
        with:
          name: pr1-native-diagnostic
          path: diagnostic
          if-no-files-found: error
          retention-days: 1
