name: Materialize Paper Evidence Inventory

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-paper-evidence-inventory
  cancel-in-progress: false

jobs:
  inventory:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/complete-paper-evidence-publishers'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/complete-paper-evidence-publishers
          fetch-depth: 0

      - name: Build repository evidence inventory
        run: python tools/inventory_paper_evidence_components.py

      - name: Remove temporary inventory tooling
        run: |
          rm tools/inventory_paper_evidence_components.py
          rm .github/workflows/materialize-paper-evidence-inventory.yml

      - name: Commit inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Inventory governed paper evidence components"
          git push origin HEAD:agent/complete-paper-evidence-publishers
