name: One Shot Reconcile Main 575

on:
  push:
    branches:
      - agent/all-asset-provider-redundancy-v2
    paths:
      - ".github/workflows/one-shot-reconcile-main-575.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out redundancy branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/all-asset-provider-redundancy-v2
          persist-credentials: true
          fetch-depth: 0

      - name: Reconcile PR 575 from current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- \
            providers/single_pass_massive_options.py \
            tests/test_single_pass_massive_options.py
          python - <<'PY'
          from pathlib import Path
          path = Path("providers/redundant_options.py")
          text = path.read_text(encoding="utf-8")
          anchor = "from providers.massive_options import (\n"
          replacement = "from providers.single_pass_massive_options import SinglePassMassiveOptionsProvider\n" + anchor
          if "from providers.single_pass_massive_options import SinglePassMassiveOptionsProvider" not in text:
              if anchor not in text:
                  raise SystemExit("Massive import anchor missing")
              text = text.replace(anchor, replacement, 1)
          old = "        self.fallback = fallback or MassiveOptionsProvider()\n"
          new = "        self.fallback = fallback or SinglePassMassiveOptionsProvider()\n"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("fallback constructor anchor missing")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Compile
        run: python -m py_compile providers/redundant_options.py providers/single_pass_massive_options.py

      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements.lock
          pip install pytest

      - name: Validate combined option behavior
        run: |
          pytest -q \
            tests/test_redundant_options_provider.py \
            tests/test_single_pass_massive_options.py \
            tests/test_all_asset_redundancy_v2.py \
            tests/test_all_asset_redundancy_integration.py

      - name: Commit and self-remove
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/one-shot-reconcile-main-575.yml
          git add -A
          git commit -m "Reconcile Massive option evidence reuse from main"
          git push origin HEAD:agent/all-asset-provider-redundancy-v2
