name: One-shot Treasury Provider Activation

on:
  push:
    branches:
      - agent/treasury-provider-activation

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/treasury-provider-activation
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install locked runtime dependencies
        run: pip install --require-hashes -r requirements.lock

      - name: Install test runner
        run: pip install pytest

      - name: Wire exact-CUSIP Treasury reference enrichment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("operations/comprehensive_market_discovery_legacy.py")
          source = path.read_text(encoding="utf-8")

          import_anchor = "from providers.eodhd import EODHDProvider, EODHDProviderError, build_eodhd_provider\n"
          import_replacement = import_anchor + "from providers.treasury_fiscal_data import (\n    TreasuryFiscalDataError,\n    build_treasury_fiscal_data_provider,\n    is_valid_cusip,\n)\n"
          if import_replacement not in source:
              if source.count(import_anchor) != 1:
                  raise SystemExit("unexpected EODHD import anchor count")
              source = source.replace(import_anchor, import_replacement, 1)

          helper_anchor = "\n\ndef _catalog_from_eodhd(\n"
          helper = '''\n\ndef _explicit_valid_cusip(item: Mapping[str, Any]) -> str | None:\n    value = _directory_text(item, "CUSIP", "cusip", "Cusip")\n    if value is None:\n        return None\n    normalized = value.strip().upper()\n    return normalized if is_valid_cusip(normalized) else None\n\n\ndef _catalog_from_eodhd(\n'''
          if "def _explicit_valid_cusip(" not in source:
              if source.count(helper_anchor) != 1:
                  raise SystemExit("unexpected catalog helper anchor count")
              source = source.replace(helper_anchor, helper, 1)

          setup_anchor = "    suffix_map = config.yahoo_suffix_map\n    exchange_lanes = {\n"
          setup_replacement = '''    suffix_map = config.yahoo_suffix_map\n    treasury_reference_by_cusip: dict[str, object] = {}\n    if CandidateAssetClass.FIXED_INCOME in requested:\n        try:\n            treasury_provider = build_treasury_fiscal_data_provider()\n            treasury_reference_by_cusip = {\n                item.cusip: item\n                for item in treasury_provider.fetch_active_securities(as_of=as_of)\n            }\n        except TreasuryFiscalDataError:\n            # Treasury Fiscal Data is an independent reference-enrichment source.\n            # Its outage must not erase otherwise valid EODHD bond discovery.\n            treasury_reference_by_cusip = {}\n    exchange_lanes = {\n'''
          if "treasury_reference_by_cusip" not in source:
              if source.count(setup_anchor) != 1:
                  raise SystemExit("unexpected fixed-income setup anchor count")
              source = source.replace(setup_anchor, setup_replacement, 1)

          append_anchor = '''            elif asset_class is CandidateAssetClass.CRYPTO:\n                compact = code.upper().replace("_", "-").replace("/", "-")\n                if "-" not in compact:\n                    continue\n                yahoo_symbol = compact\n            result[asset_class].append(\n'''
          append_replacement = '''            elif asset_class is CandidateAssetClass.CRYPTO:\n                compact = code.upper().replace("_", "-").replace("/", "-")\n                if "-" not in compact:\n                    continue\n                yahoo_symbol = compact\n            source_identifier = f"{snapshot.provider_record_id}:{code}"\n            instrument_identifier: str | None = None\n            if asset_class is CandidateAssetClass.FIXED_INCOME:\n                cusip = _explicit_valid_cusip(item)\n                treasury_reference = (\n                    None if cusip is None else treasury_reference_by_cusip.get(cusip)\n                )\n                if cusip is not None and treasury_reference is not None:\n                    instrument_identifier = f"cusip:{cusip}"\n                    source_identifier += f"|{treasury_reference.evidence_identifier}"\n            result[asset_class].append(\n'''
          if "source_identifier += f\"|{treasury_reference.evidence_identifier}\"" not in source:
              if source.count(append_anchor) != 1:
                  raise SystemExit("unexpected catalog append anchor count")
              source = source.replace(append_anchor, append_replacement, 1)

          record_anchor = '''                    provider_kind=selected_provider_kind,\n                    source_identifier=f"{snapshot.provider_record_id}:{code}",\n                    quote_spread_bps=(2.0 if asset_class is CandidateAssetClass.FX else 12.0 if asset_class is CandidateAssetClass.CRYPTO else 8.0),\n'''
          record_replacement = '''                    provider_kind=selected_provider_kind,\n                    source_identifier=source_identifier,\n                    instrument_identifier=instrument_identifier,\n                    quote_spread_bps=(2.0 if asset_class is CandidateAssetClass.FX else 12.0 if asset_class is CandidateAssetClass.CRYPTO else 8.0),\n'''
          if "instrument_identifier=instrument_identifier" not in source:
              if source.count(record_anchor) != 1:
                  raise SystemExit("unexpected catalog record anchor count")
              source = source.replace(record_anchor, record_replacement, 1)

          path.write_text(source, encoding="utf-8")
          PY

      - name: Compile provider plumbing
        run: |
          python -m py_compile \
            provider_environment.py \
            providers/__init__.py \
            providers/treasury_fiscal_data.py \
            providers/provider_activation_audit.py \
            operations/comprehensive_market_discovery_legacy.py

      - name: Run focused provider and Treasury regressions
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q \
            tests/test_treasury_fiscal_data.py \
            tests/test_treasury_discovery_enrichment.py \
            tests/test_provider_environment_activation.py \
            tests/test_provider_environment_aliases.py \
            tests/test_provider_credentials.py

      - name: Commit validated production integration and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-treasury-provider-activation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operations/comprehensive_market_discovery_legacy.py .github/workflows/one-shot-treasury-provider-activation.yml
          if git diff --cached --quiet; then
            echo "No validated integration changes to commit"
            exit 0
          fi
          git commit -m "Wire Treasury Fiscal Data into fixed-income discovery"
          git push origin HEAD:agent/treasury-provider-activation
