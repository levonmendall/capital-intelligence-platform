name: Apply signature UI contracts

on:
  push:
    branches:
      - pr-155-distinct-command-surfaces
    paths:
      - .github/workflows/apply-signature-ui-contracts.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr-155-distinct-command-surfaces
          fetch-depth: 0
      - name: Preserve signature system markers
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('premium_ui.py')
          source = path.read_text(encoding='utf-8')
          core_old = 'class="visual-core"'
          core_new = 'class="visual-core signal-core"'
          if source.count(core_old) != 3:
              raise SystemExit('expected three visual core markers')
          source = source.replace(core_old, core_new)
          kicker_old = '<div class="hero-kicker">{escape(profile.kicker)}</div>'
          kicker_new = '<div class="hero-kicker">Capital Intelligence Operating System // {escape(profile.kicker)}</div>'
          if source.count(kicker_old) != 1:
              raise SystemExit('expected hero kicker not found exactly once')
          path.write_text(source.replace(kicker_old, kicker_new), encoding='utf-8')
          PY
      - name: Commit focused correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-signature-ui-contracts.yml
          git add premium_ui.py
          git commit -m "Preserve signature operating-system markers"
          git push origin HEAD:pr-155-distinct-command-surfaces
