name: Export performance audit source

on:
  pull_request:
    paths:
      - ".github/workflows/export-performance-audit.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Package exact source
        run: |
          tar --exclude=.git --exclude=.pytest_cache --exclude=__pycache__ -czf /tmp/capital-intelligence-source.tgz .
      - name: Upload source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-audit-source
          path: /tmp/capital-intelligence-source.tgz
          if-no-files-found: error
          retention-days: 1
