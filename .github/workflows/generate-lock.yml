name: Generate Python Lock

on:
  pull_request:
    branches: [main]
    paths:
      - requirements.txt
      - requirements-dev.txt
      - .github/workflows/generate-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: Check out source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lock compiler
        run: python -m pip install --upgrade pip "pip-tools>=7.4,<8"

      - name: Compile runtime lock
        run: pip-compile --generate-hashes --resolver=backtracking --strip-extras --output-file requirements.lock requirements.txt

      - name: Commit generated lock
        run: |
          git add requirements.lock
          if git diff --cached --quiet; then
            echo "Runtime lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Lock runtime dependencies"
          git push origin "HEAD:${TARGET_BRANCH}"
