name: Generate Python Lock

on:
  pull_request:
    branches: [main]
    paths:
      - requirements.txt
      - requirements-dev.txt
      - .github/workflows/generate-lock.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lock compiler
        run: python -m pip install --upgrade pip "pip-tools>=7.4,<8"

      - name: Compile runtime lock
        run: pip-compile --generate-hashes --resolver=backtracking --strip-extras --output-file requirements.lock requirements.txt

      - name: Upload runtime lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: requirements-lock
          path: requirements.lock
          if-no-files-found: error
          retention-days: 1
