name: Materialize Committee CIO V2 Phase 1 PR

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: materialize-committee-cio-v2-phase1-pr
  cancel-in-progress: false

jobs:
  materialize:
    if: github.head_ref == 'feature/committee-cio-v2-phase1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out phase branch
        uses: actions/checkout@v4
        with:
          ref: feature/committee-cio-v2-phase1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize Phase 1 source
        run: python scripts/materialize_committee_cio_v2_phase1.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run focused Phase 1 validation
        run: |
          python -m py_compile cio/service.py cio/robustness.py opportunity/engine.py
          python -m pytest -q \
            tests/test_opportunity_engine.py \
            tests/test_adaptive_robust_growth_ensemble.py \
            tests/test_progressive_lane_economic_authority.py \
            tests/test_decision_process_upgrade.py

      - name: Publish reviewed source and remove temporary materializer
        run: |
          rm scripts/materialize_committee_cio_v2_phase1.py
          rm .github/workflows/materialize-committee-cio-v2-phase1-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enforce economic qualification for every positive allocation"
          git push origin HEAD:feature/committee-cio-v2-phase1
