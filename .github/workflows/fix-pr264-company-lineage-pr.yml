name: Fix PR264 Company Lineage From PR

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fix-pr264-company-lineage-pr.yml
      - tools/fix_pr264_company_lineage.py

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'agent/verify-pr264-live-and-ci'
    runs-on: ubuntu-latest
    steps:
      - name: Check out writable PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/verify-pr264-live-and-ci
          fetch-depth: 0
      - name: Apply and publish correction
        shell: bash
        run: |
          set -euo pipefail
          python tools/fix_pr264_company_lineage.py
          python -m py_compile production_paper_evidence.py
          git config user.name "capital-intelligence-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Correct PR264 company-equity evidence lineage"
          git push origin HEAD:agent/verify-pr264-live-and-ci
