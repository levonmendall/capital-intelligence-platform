name: Apply adaptive robust growth model

on:
  push:
    branches:
      - agent/adaptive-robust-growth-ensemble
    paths:
      - .github/workflows/apply-adaptive-growth-model.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/adaptive-robust-growth-ensemble
          fetch-depth: 0
      - name: Apply governed growth patches
        id: patch
        shell: bash
        run: |
          set +e
          : > /tmp/adaptive-growth.log
          for script in $(find .github/agent_payload -maxdepth 1 -name 'patch_*.py' | sort); do
            echo "Applying ${script}" | tee -a /tmp/adaptive-growth.log
            python "${script}" >> /tmp/adaptive-growth.log 2>&1
            status=$?
            if [ ${status} -ne 0 ]; then
              cat /tmp/adaptive-growth.log
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          python -m py_compile \
            cio/growth_ensemble.py \
            cio/historical_learning.py \
            cio/policy_matrix.py \
            cio/robustness.py \
            cio/service.py \
            opportunity/models.py \
            opportunity/engine.py \
            application/cio_cycle.py \
            production_context_publication_governed.py \
            tests/test_adaptive_robust_growth_ensemble.py \
            >> /tmp/adaptive-growth.log 2>&1
          status=$?
          if [ ${status} -ne 0 ]; then
            cat /tmp/adaptive-growth.log
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "status=success" >> "$GITHUB_OUTPUT"
      - name: Record patch failure
        if: steps.patch.outputs.status == 'failed'
        shell: bash
        run: |
          cp /tmp/adaptive-growth.log .github/agent_payload/adaptive-growth-error.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/agent_payload/adaptive-growth-error.txt
          git commit -m "Report adaptive growth patch failure"
          git push origin HEAD:agent/adaptive-robust-growth-ensemble
          exit 1
      - name: Commit implementation
        if: steps.patch.outputs.status == 'success'
        shell: bash
        run: |
          rm -f .github/agent_payload/patch_*.py
          rm -f .github/agent_payload/adaptive-growth-error.txt
          rm -f .github/workflows/export-adaptive-growth-source.yml
          rm -f .github/workflows/apply-adaptive-growth-model.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Implement adaptive robust growth ensemble"
          git push origin HEAD:agent/adaptive-robust-growth-ensemble
