name: Patch Forward Decision legacy predictive compatibility

on:
  push:
    branches:
      - agent/forward-decision-intelligence-v2
    paths:
      - .github/workflows/patch-forward-decision-legacy-compat.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/forward-decision-intelligence-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply compatibility patch
        run: python .github/patch_forward_decision_legacy_compat.py
      - name: Install locked runtime dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run focused regressions
        run: |
          python -m pytest -q \
            tests/test_predictive_market_intelligence.py \
            tests/test_predictive_forward_decision_context.py \
            tests/test_forward_decision_intelligence_v2.py \
            tests/test_optional_comprehensive_discovery_isolation.py \
            tests/test_production_context_publication_runtime.py \
            tests/test_canonical_cio_cycle.py
      - name: Commit fix and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-forward-decision-legacy-compat.yml .github/patch_forward_decision_legacy_compat.py
          git add intelligence/predictive_market.py tests/test_predictive_market_intelligence.py
          git diff --cached --check
          git commit -m "Preserve predictive helper compatibility"
          git push origin HEAD:agent/forward-decision-intelligence-v2
