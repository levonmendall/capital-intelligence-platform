name: Apply Alpaca provider clock alignment

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/expand-return-opportunity-discovery'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and apply provider-clock fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < tools/provider_clock_fix/payload)" -eq 3160
          echo '7156ac5b8cae094d0b9fac6c16471e302774da78347a8a842a6ffae2dc5f40f7  tools/provider_clock_fix/payload' | sha256sum -c -
          base64 --decode tools/provider_clock_fix/payload > /tmp/provider-clock.patch.xz
          echo 'b586719b3df0480f300930e15d8e5f162a18ce255bdaebbfd3388cb6c0d0f6dd  /tmp/provider-clock.patch.xz' | sha256sum -c -
          xz --decompress --stdout /tmp/provider-clock.patch.xz > /tmp/provider-clock.patch
          echo '55451f2de285fa09c99449284c5caf2865e977b52be1bb358337e8835d3392fd  /tmp/provider-clock.patch' | sha256sum -c -
          git apply --check -p3 /tmp/provider-clock.patch
          git apply -p3 /tmp/provider-clock.patch

      - name: Commit clean provider-clock correction
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/provider_clock_fix
          rm -f .github/workflows/apply-provider-clock-fix.yml
          git config user.name 'capital-intelligence-automation'
          git config user.email 'capital-intelligence-automation@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Align live quotes to Alpaca market clock'
          git push origin "HEAD:${{ github.head_ref }}"
