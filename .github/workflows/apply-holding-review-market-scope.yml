name: Apply holding-review market scope repair

on:
  push:
    branches:
      - fix/holding-review-market-scope

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/holding-review-market-scope
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply focused audit-scope repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          export_path = Path('cio_decision_export.py')
          text = export_path.read_text(encoding='utf-8')
          text = text.replace(
              '_SCHEMA_VERSION = "cio-decision-export.v2"',
              '_SCHEMA_VERSION = "cio-decision-export.v3"',
              1,
          )
          anchor = '\n\ndef build_cio_decision_export(\n'
          helper = '''\n\ndef _market_scope(\n    evidence: Mapping[str, Any] | None,\n) -> dict[str, Any]:\n    """Disclose whether opportunity cost is all-market certified.\n\n    Holding reviews remain mandatory even when acquisition discovery is incomplete.\n    They must not imply that the selected holding was compared with every supported\n    market unless the persisted evidence carries an exact all-market cycle identifier\n    and complete scheduled-lane certification. Missing lineage is therefore labeled\n    narrowly rather than inferred from the candidate's successful governance record.\n    """\n\n    if not isinstance(evidence, Mapping):\n        return {\n            "opportunity_cost_scope": "unavailable",\n            "all_market_cycle_identifier": None,\n            "scheduled_market_coverage_complete": False,\n            "global_best_alternative_certified": False,\n            "analysis_lane": None,\n            "market_lanes": [],\n            "missing_lane_reasons": ["decision_evidence_snapshot_missing"],\n        }\n\n    analysis_lane = _field(evidence, "analysis_lane") or None\n    all_market_cycle = _field(\n        evidence,\n        "all_market_cycle_identifier",\n        "comprehensive_discovery_cycle_identifier",\n    ) or None\n    coverage_complete = evidence.get("scheduled_market_coverage_complete") is True\n    raw_lanes = evidence.get("market_lanes")\n    if not isinstance(raw_lanes, list):\n        raw_lanes = evidence.get("comprehensive_discovery_lane_counts")\n    market_lanes: list[object]\n    if isinstance(raw_lanes, Mapping):\n        market_lanes = [\n            {"asset_class": str(asset_class), **dict(payload)}\n            for asset_class, payload in raw_lanes.items()\n            if isinstance(payload, Mapping)\n        ]\n    elif isinstance(raw_lanes, list):\n        market_lanes = [dict(item) for item in raw_lanes if isinstance(item, Mapping)]\n    else:\n        market_lanes = []\n\n    raw_missing = evidence.get("missing_market_lane_reasons")\n    missing_reasons = (\n        [str(item) for item in raw_missing if str(item).strip()]\n        if isinstance(raw_missing, (list, tuple))\n        else []\n    )\n    all_market_certified = bool(\n        coverage_complete and all_market_cycle and market_lanes\n    )\n    if all_market_certified:\n        scope = "all_market_certified"\n    elif analysis_lane == "holding_review":\n        scope = "holding_and_cash_only"\n        if not missing_reasons:\n            missing_reasons = ["all_market_coverage_not_certified_for_holding_review"]\n    else:\n        scope = "cross_market_unproven"\n        if not missing_reasons:\n            missing_reasons = ["all_market_coverage_lineage_missing_or_incomplete"]\n\n    return {\n        "opportunity_cost_scope": scope,\n        "all_market_cycle_identifier": all_market_cycle,\n        "scheduled_market_coverage_complete": coverage_complete,\n        "global_best_alternative_certified": all_market_certified,\n        "analysis_lane": analysis_lane,\n        "market_lanes": market_lanes,\n        "missing_lane_reasons": missing_reasons,\n    }\n'''
          if '_market_scope(' not in text:
              if anchor not in text:
                  raise SystemExit('build_cio_decision_export anchor not found')
              text = text.replace(anchor, helper + anchor, 1)

          assignment_anchor = '''    evidence = records["decision_evidence_snapshot"]\n    construction = records["portfolio_construction"]\n    evaluation = records["decision_evaluation"]\n'''
          assignment_replacement = assignment_anchor + '''    market_scope = _market_scope(evidence)\n'''
          if 'market_scope = _market_scope(evidence)' not in text:
              if assignment_anchor not in text:
                  raise SystemExit('record assignment anchor not found')
              text = text.replace(assignment_anchor, assignment_replacement, 1)

          bundle_anchor = '''        "decision_actions": actions,\n        "release_identity": {\n'''
          bundle_replacement = '''        "decision_actions": actions,\n        "market_scope": market_scope,\n        "release_identity": {\n'''
          if '"market_scope": market_scope' not in text:
              if bundle_anchor not in text:
                  raise SystemExit('bundle anchor not found')
              text = text.replace(bundle_anchor, bundle_replacement, 1)
          export_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_cio_decision_export.py')
          tests = test_path.read_text(encoding='utf-8').replace(
              '"cio-decision-export.v2"',
              '"cio-decision-export.v3"',
          )
          test_path.write_text(tests, encoding='utf-8')

          focused = Path('tests/test_cio_decision_export_market_scope.py')
          focused.write_text('''from __future__ import annotations\n\nfrom datetime import datetime, timezone\n\nfrom cio_decision_export import build_cio_decision_export\n\n\nNOW = datetime(2026, 8, 6, 16, 0, tzinfo=timezone.utc)\nDECISION = "cio-decision:candidate:mcd:test"\nCYCLE = "canonical-cycle:test"\n\n\ndef _export(evidence):\n    return build_cio_decision_export(\n        cio_decision={\n            "identifier": DECISION,\n            "cycle_identifier": CYCLE,\n            "as_of": NOW.isoformat(),\n            "action": "no_material_change",\n            "code_version": "test-sha",\n            "decision_horizon_days": 365,\n        },\n        daily_cio_briefing={\n            "decision_identifier": DECISION,\n            "cycle_identifier": CYCLE,\n            "as_of": NOW.isoformat(),\n        },\n        decision_evidence_snapshot={\n            "decision_identifier": DECISION,\n            "cycle_identifier": CYCLE,\n            "as_of": NOW.isoformat(),\n            **evidence,\n        },\n        portfolio_construction=None,\n        decision_evaluation=None,\n        generated_at=NOW,\n        release_identifier="test-sha",\n    )\n\n\ndef test_holding_review_without_all_market_lineage_is_narrowly_labeled() -> None:\n    bundle = _export(\n        {\n            "analysis_lane": "holding_review",\n            "alternatives": [\n                {"identifier": "cash"},\n                {"identifier": "holding:MCD"},\n            ],\n        }\n    )\n\n    scope = bundle["market_scope"]\n    assert scope["opportunity_cost_scope"] == "holding_and_cash_only"\n    assert scope["global_best_alternative_certified"] is False\n    assert scope["scheduled_market_coverage_complete"] is False\n    assert scope["all_market_cycle_identifier"] is None\n    assert scope["missing_lane_reasons"] == [\n        "all_market_coverage_not_certified_for_holding_review"\n    ]\n\n\ndef test_complete_lane_manifest_certifies_all_market_opportunity_cost_scope() -> None:\n    bundle = _export(\n        {\n            "analysis_lane": "holding_review",\n            "all_market_cycle_identifier": "all-market-cycle:20260806",\n            "scheduled_market_coverage_complete": True,\n            "market_lanes": [\n                {\n                    "asset_class": "international_equity",\n                    "scheduled": True,\n                    "represented": True,\n                },\n                {\n                    "asset_class": "crypto",\n                    "scheduled": True,\n                    "represented": True,\n                },\n            ],\n        }\n    )\n\n    scope = bundle["market_scope"]\n    assert scope["opportunity_cost_scope"] == "all_market_certified"\n    assert scope["global_best_alternative_certified"] is True\n    assert scope["scheduled_market_coverage_complete"] is True\n    assert scope["all_market_cycle_identifier"] == "all-market-cycle:20260806"\n    assert len(scope["market_lanes"]) == 2\n    assert scope["missing_lane_reasons"] == []\n\n\ndef test_complete_boolean_without_cycle_and_lane_lineage_stays_unproven() -> None:\n    bundle = _export(\n        {\n            "analysis_lane": "holding_review",\n            "scheduled_market_coverage_complete": True,\n        }\n    )\n\n    scope = bundle["market_scope"]\n    assert scope["opportunity_cost_scope"] == "holding_and_cash_only"\n    assert scope["global_best_alternative_certified"] is False\n''', encoding='utf-8')

          workflow = Path('.github/workflows/apply-holding-review-market-scope.yml')
          workflow.unlink()
          PY
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run focused regressions
        run: python -m pytest -q tests/test_cio_decision_export.py tests/test_cio_decision_export_market_scope.py
      - name: Compile changed Python
        run: python -m py_compile cio_decision_export.py tests/test_cio_decision_export.py tests/test_cio_decision_export_market_scope.py
      - name: Commit verified repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cio_decision_export.py tests/test_cio_decision_export.py tests/test_cio_decision_export_market_scope.py .github/workflows/apply-holding-review-market-scope.yml
          git commit -m "Label holding reviews with certified market scope"
          git push origin HEAD:fix/holding-review-market-scope
