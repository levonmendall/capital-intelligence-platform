name: Apply post-897 production repairs

on:
  push:
    branches: [repair/post-897-publication-validity-progress]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/post-897-publication-validity-progress
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply repairs
        run: python scripts/apply_post_897_repair.py
      - name: Compile repaired modules
        run: |
          python -m py_compile operations/comprehensive_discovery_structural_prewarm.py operations/epoch_scoped_provider_acquisition.py tests/test_post_897_provider_repairs.py
      - name: Run focused regressions
        run: |
          python -m pytest -q tests/test_post_897_provider_repairs.py tests/test_provider_prewarm_bounded_replay.py tests/test_post_889_production_handoff.py tests/test_evidence_preparation_progress.py tests/test_single_us_equity_prewarm_owner.py
      - name: Validate diff
        run: git diff --check
      - name: Commit repaired code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operations/comprehensive_discovery_structural_prewarm.py operations/epoch_scoped_provider_acquisition.py tests/test_post_897_provider_repairs.py
          git commit -m "Repair post-897 publication validity and provider progress"
          git push origin HEAD:repair/post-897-publication-validity-progress
