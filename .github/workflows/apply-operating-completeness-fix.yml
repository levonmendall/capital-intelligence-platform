name: Apply operating completeness fix

on:
  push:
    branches:
      - agent/complete-render-operating-surfaces

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/complete-render-operating-surfaces
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Apply exact source corrections
        run: python scripts/apply_operating_completeness_fix.py

      - name: Verify changed Python compiles
        run: |
          python -m py_compile \
            app_impl.py \
            cio_pending_transactions.py \
            cio_pending_transactions_ui.py \
            cio_report_history_ui.py \
            historical_replay_ui.py \
            premium_ui.py \
            tests/test_operating_completeness_fixes.py

      - name: Commit corrected product source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Render operating surfaces"
          git push origin HEAD:agent/complete-render-operating-surfaces
