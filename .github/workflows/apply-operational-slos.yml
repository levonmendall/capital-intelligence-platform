name: Apply production operational SLOs

on:
  pull_request:
    paths:
      - .github/workflows/apply-operational-slos.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out patch staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/export-slo-base
          persist-credentials: true

      - name: Reconstruct and verify validated patch
        run: |
          cat .github/patches/operational-slos-{00..02}.b64 \
            | base64 --decode \
            > /tmp/operational-slos.patch.gz
          echo '2ff5bd15fdda81374c53e11b02560f72890341ad93c49c9026128b55ce9400a0  /tmp/operational-slos.patch.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/operational-slos.patch.gz > /tmp/operational-slos.patch
          echo 'f7cbc6952370565f07a320f9278d5b34a034d4b28f93464198803942efb12d41  /tmp/operational-slos.patch' | sha256sum --check

      - name: Check out product branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/production-operational-slos
          persist-credentials: true

      - name: Apply exact operational SLO patch
        run: patch -p1 --forward --batch < /tmp/operational-slos.patch

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt
          python -m pip check
          python scripts/verify_requirements_lock.py

      - name: Validate exact updated branch
        run: |
          python -m compileall -q .
          python initialize.py
          python run_intelligence.py
          python run_regime.py
          pytest -q

      - name: Commit validated operational SLO authority
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            README.md \
            ROADMAP.md \
            api/app.py \
            api/routes/health.py \
            api/routes/operations.py \
            deploy/production.env.example \
            deploy/staging.env.example \
            docs/OPERATIONAL_SLOS.md \
            docs/OPERATIONS.md \
            operations/__init__.py \
            operations/config.py \
            operations/slo.py \
            run_slos.py \
            tests/test_api.py \
            tests/test_operational_slos.py \
            tests/test_operations.py \
            tests/test_run_slos.py
          git commit -m 'Enforce production operational SLOs'
          git push origin HEAD:agent/production-operational-slos