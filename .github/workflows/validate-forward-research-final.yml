name: Validate final forward research integration
on:
  push:
    branches:
      - agent/forward-opportunity-final-20260809
permissions:
  contents: write
jobs:
  test-cleanup:
    if: github.event.head_commit.message == 'Validate final forward research integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/forward-opportunity-final-20260809
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked runtime dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run final focused integration proof
        run: |
          python -m py_compile intelligence/forward_research.py intelligence/predictive_market.py data/provider_dataset.py
          pytest -q tests/test_forward_research.py tests/test_predictive_forward_decision_context.py tests/test_predictive_market_intelligence.py tests/test_forward_decision_intelligence_v2.py
      - name: Remove temporary validator
        run: |
          rm .github/workflows/validate-forward-research-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize forward research integration tests"
          git push origin HEAD:agent/forward-opportunity-final-20260809
