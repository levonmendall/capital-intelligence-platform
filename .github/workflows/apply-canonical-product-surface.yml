name: Apply canonical product surface migration

on:
  pull_request:
    paths:
      - .github/workflows/apply-canonical-product-surface.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out patch staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/export-canonical-cycle-source
          persist-credentials: true

      - name: Reconstruct validated patch
        run: |
          cat .github/patches/final-surface-00.b64 .github/patches/final-surface-01.b64 \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/final-surface.patch
          test -s /tmp/final-surface.patch

      - name: Check out product branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/canonical-product-surface-migration
          persist-credentials: true

      - name: Apply exact surface patch
        run: patch -p1 --forward --batch < /tmp/final-surface.patch

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt
          python -m pip check
          python scripts/verify_requirements_lock.py

      - name: Validate exact updated branch
        run: |
          python -m compileall -q .
          python initialize.py
          python run_intelligence.py
          python run_regime.py
          pytest -q

      - name: Commit validated product surface
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            ARCHITECTURE.md \
            README.md \
            ROADMAP.md \
            app.py \
            secure_app.py \
            docs/DAILY_INTELLIGENCE_EXPERIENCE.md \
            docs/LEGACY_AUTHORITY_ISOLATION.md \
            docs/PRODUCTION_API.md \
            tests/test_canonical_product_surfaces.py
          git commit -m 'Make canonical CIO the only active product surface'
          git push origin HEAD:agent/canonical-product-surface-migration