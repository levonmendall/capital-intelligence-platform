name: Implement portfolio integrity specialist

on:
  push:
    branches:
      - feature/portfolio-valuation-execution-integrity-specialist
    paths:
      - ".github/workflows/implement-portfolio-integrity-specialist.yml"

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/portfolio-valuation-execution-integrity-specialist
          fetch-depth: 0
      - name: Add operational specialist and integrate certification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          specialist = '''"""Non-voting portfolio valuation and execution-integrity specialist.

          This operational control function does not analyze investment attractiveness,
          vote in the investment committee, alter a CIO decision, or authorize real money.
          It independently certifies the accounting and valuation consequences of a paper
          implementation before a new canonical portfolio snapshot may be published.
          """

          from __future__ import annotations

          from dataclasses import dataclass
          from datetime import datetime
          from enum import Enum
          from math import isfinite
          from typing import Any, Sequence

          from portfolio.state import CanonicalPortfolioSnapshot


          PORTFOLIO_INTEGRITY_SPECIALIST_ROLE = (
              "portfolio_valuation_execution_integrity_specialist"
          )
          PORTFOLIO_INTEGRITY_SPECIALIST_NAME = (
              "Portfolio Valuation & Execution Integrity Specialist"
          )


          class PortfolioIntegrityDisposition(str, Enum):
              CERTIFIED = "certified"
              HELD = "held"
              REVIEW_REQUIRED = "review_required"


          @dataclass(frozen=True, slots=True)
          class PortfolioIntegrityCertification:
              identifier: str
              completed_at: datetime
              beginning_snapshot_identifier: str
              ending_snapshot_identifier: str
              disposition: PortfolioIntegrityDisposition
              checks: tuple[str, ...]
              blocks: tuple[str, ...]
              reconciliation_difference: float
              specialist_version: str = "portfolio-integrity-specialist.v1"
              schema_version: str = "portfolio-integrity-certification.v1"

              @property
              def certified(self) -> bool:
                  return self.disposition is PortfolioIntegrityDisposition.CERTIFIED

              def to_dict(self) -> dict[str, Any]:
                  return {
                      "identifier": self.identifier,
                      "role": PORTFOLIO_INTEGRITY_SPECIALIST_ROLE,
                      "role_name": PORTFOLIO_INTEGRITY_SPECIALIST_NAME,
                      "completed_at": self.completed_at.isoformat(),
                      "beginning_snapshot_identifier": self.beginning_snapshot_identifier,
                      "ending_snapshot_identifier": self.ending_snapshot_identifier,
                      "disposition": self.disposition.value,
                      "checks": list(self.checks),
                      "blocks": list(self.blocks),
                      "reconciliation_difference": self.reconciliation_difference,
                      "specialist_version": self.specialist_version,
                      "schema_version": self.schema_version,
                      "investment_decision_authorized": False,
                      "real_money_authorized": False,
                  }


          class PortfolioValuationExecutionIntegritySpecialist:
              """Certify cash, shares, cost basis, marks, NAV, and reconciliation."""

              def __init__(
                  self,
                  *,
                  version: str = "portfolio-integrity-specialist.v1",
                  cash_tolerance: float = 0.01,
                  quantity_tolerance: float = 0.00000001,
              ) -> None:
                  if not isinstance(version, str) or not version.strip():
                      raise ValueError("version must be a non-empty string")
                  if cash_tolerance < 0.0 or quantity_tolerance < 0.0:
                      raise ValueError("specialist tolerances cannot be negative")
                  self.version = version.strip()
                  self.cash_tolerance = float(cash_tolerance)
                  self.quantity_tolerance = float(quantity_tolerance)

              def review_execution(
                  self,
                  *,
                  beginning: CanonicalPortfolioSnapshot,
                  ending: CanonicalPortfolioSnapshot,
                  fills: Sequence[object],
                  reconciliation: object,
                  completed_at: datetime,
                  attempt: int,
              ) -> PortfolioIntegrityCertification:
                  if not isinstance(beginning, CanonicalPortfolioSnapshot):
                      raise TypeError("beginning must be a CanonicalPortfolioSnapshot")
                  if not isinstance(ending, CanonicalPortfolioSnapshot):
                      raise TypeError("ending must be a CanonicalPortfolioSnapshot")
                  if completed_at.tzinfo is None or completed_at.utcoffset() is None:
                      raise ValueError("completed_at must be timezone-aware")
                  if isinstance(attempt, bool) or not isinstance(attempt, int) or attempt < 1:
                      raise ValueError("attempt must be a positive integer")

                  checks: list[str] = []
                  blocks: list[str] = []

                  if beginning.portfolio_code != ending.portfolio_code:
                      blocks.append("portfolio identity changed during implementation")
                  else:
                      checks.append("portfolio identity preserved")
                  if beginning.base_currency != ending.base_currency:
                      blocks.append("portfolio base currency changed during implementation")
                  else:
                      checks.append("base currency preserved")
                  if abs(beginning.starting_capital - ending.starting_capital) > self.cash_tolerance:
                      blocks.append("starting capital changed during implementation")
                  else:
                      checks.append("starting capital preserved")
                  if ending.as_of > completed_at:
                      blocks.append("ending portfolio snapshot is future-dated")
                  else:
                      checks.append("portfolio timestamp is point-in-time valid")

                  reconciled = getattr(reconciliation, "reconciled", None)
                  difference = float(getattr(reconciliation, "difference", float("inf")))
                  if reconciled is not True or not isfinite(difference):
                      blocks.append("execution reconciliation is not certified")
                  elif abs(difference) > self.cash_tolerance:
                      blocks.append(
                          f"execution reconciliation difference {difference:.8f} exceeds tolerance"
                      )
                  else:
                      checks.append("execution NAV reconciliation passed")

                  begin_quantity = {item.symbol: item.quantity for item in beginning.positions}
                  end_quantity = {item.symbol: item.quantity for item in ending.positions}
                  expected_quantity = dict(begin_quantity)
                  expected_cash = beginning.cash_amount
                  fill_identifiers: set[str] = set()
                  touched_symbols: set[str] = set()
                  for fill in fills:
                      identifier = str(getattr(fill, "identifier", "")).strip()
                      symbol = str(getattr(fill, "symbol", "")).strip().upper()
                      side = getattr(getattr(fill, "side", None), "value", getattr(fill, "side", ""))
                      quantity = float(getattr(fill, "quantity", 0.0))
                      gross = float(getattr(fill, "gross_amount_base", 0.0))
                      commission = float(getattr(fill, "commission_base", 0.0))
                      if not identifier or not symbol or quantity <= 0.0:
                          blocks.append("execution contains an incomplete paper fill")
                          continue
                      if identifier in fill_identifiers:
                          blocks.append(f"duplicate fill identifier {identifier}")
                      fill_identifiers.add(identifier)
                      touched_symbols.add(symbol)
                      if side == "buy":
                          expected_quantity[symbol] = expected_quantity.get(symbol, 0.0) + quantity
                          expected_cash -= gross + commission
                      elif side == "sell":
                          expected_quantity[symbol] = expected_quantity.get(symbol, 0.0) - quantity
                          expected_cash += gross - commission
                      else:
                          blocks.append(f"fill {identifier} has an unsupported side")

                  for symbol in sorted(set(expected_quantity) | set(end_quantity)):
                      expected = max(0.0, expected_quantity.get(symbol, 0.0))
                      actual = end_quantity.get(symbol, 0.0)
                      if abs(expected - actual) > self.quantity_tolerance:
                          blocks.append(
                              f"{symbol} quantity does not reconcile: expected {expected:.12f}, "
                              f"observed {actual:.12f}"
                          )
                  if not any("quantity does not reconcile" in item for item in blocks):
                      checks.append("share quantities reconcile to paper fills")

                  if abs(expected_cash - ending.cash_amount) > self.cash_tolerance:
                      blocks.append(
                          "cash does not reconcile to gross fills and transaction costs"
                      )
                  else:
                      checks.append("cash reconciles to gross fills and transaction costs")

                  ending_event_ids = {item.identifier for item in ending.implementation_events}
                  missing_events = sorted(fill_identifiers - ending_event_ids)
                  if missing_events:
                      blocks.append(
                          "paper fills are missing from canonical implementation history: "
                          + ", ".join(missing_events)
                      )
                  else:
                      checks.append("paper fills are preserved in implementation history")

                  position_by_symbol = {item.symbol: item for item in ending.positions}
                  for symbol in sorted(touched_symbols):
                      position = position_by_symbol.get(symbol)
                      if position is None:
                          continue
                      values = (
                          position.quantity,
                          position.average_cost,
                          position.mark_price,
                          position.cost_basis,
                          position.market_value,
                          position.unrealized_gain,
                      )
                      if not all(isfinite(float(value)) for value in values):
                          blocks.append(f"{symbol} valuation contains a non-finite value")
                      if position.quantity <= 0.0 or position.average_cost < 0.0 or position.mark_price <= 0.0:
                          blocks.append(f"{symbol} position economics are invalid")
                      if position.updated_at > completed_at:
                          blocks.append(f"{symbol} mark is future-dated")
                  if not any(
                      "valuation" in item or "position economics" in item or "mark is future" in item
                      for item in blocks
                  ):
                      checks.append("cost basis, marks, market value, and unrealized gain/loss are valid")

                  if not fills and beginning.identifier != ending.identifier:
                      blocks.append("a no-fill execution changed canonical portfolio identity")

                  disposition = (
                      PortfolioIntegrityDisposition.CERTIFIED
                      if not blocks
                      else PortfolioIntegrityDisposition.HELD
                  )
                  identifier = (
                      f"portfolio-integrity:{ending.portfolio_code}:"
                      f"{ending.identifier}:attempt:{attempt}"
                  )
                  return PortfolioIntegrityCertification(
                      identifier=identifier,
                      completed_at=completed_at,
                      beginning_snapshot_identifier=beginning.identifier,
                      ending_snapshot_identifier=ending.identifier,
                      disposition=disposition,
                      checks=tuple(checks),
                      blocks=tuple(blocks),
                      reconciliation_difference=difference,
                      specialist_version=self.version,
                  )


          __all__ = [
              "PORTFOLIO_INTEGRITY_SPECIALIST_NAME",
              "PORTFOLIO_INTEGRITY_SPECIALIST_ROLE",
              "PortfolioIntegrityCertification",
              "PortfolioIntegrityDisposition",
              "PortfolioValuationExecutionIntegritySpecialist",
          ]
          '''
          Path('portfolio/integrity_specialist.py').write_text(specialist, encoding='utf-8')

          path = Path('portfolio/multi_asset_execution.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'from portfolio.execution_eligibility import (\n',
              'from portfolio.integrity_specialist import (\n'
              '    PortfolioValuationExecutionIntegritySpecialist,\n'
              ')\n'
              'from portfolio.execution_eligibility import (\n',
              1,
          )
          text = text.replace(
              '    BATCH_FAILED = "batch_failed"\n',
              '    BATCH_FAILED = "batch_failed"\n'
              '    INTEGRITY_REVIEWED = "integrity_reviewed"\n',
              1,
          )
          text = text.replace(
              '        universe_store: SQLiteCertifiedEligibleUniverseStore,\n'
              '        policy: MultiAssetExecutionPolicy | None = None,\n',
              '        universe_store: SQLiteCertifiedEligibleUniverseStore,\n'
              '        policy: MultiAssetExecutionPolicy | None = None,\n'
              '        integrity_specialist: PortfolioValuationExecutionIntegritySpecialist | None = None,\n',
              1,
          )
          text = text.replace(
              '        self.policy = policy or MultiAssetExecutionPolicy()\n',
              '        self.policy = policy or MultiAssetExecutionPolicy()\n'
              '        self.integrity_specialist = (\n'
              '            integrity_specialist\n'
              '            or PortfolioValuationExecutionIntegritySpecialist(\n'
              '                cash_tolerance=self.policy.reconciliation_tolerance\n'
              '            )\n'
              '        )\n'
              '        if not isinstance(\n'
              '            self.integrity_specialist,\n'
              '            PortfolioValuationExecutionIntegritySpecialist,\n'
              '        ):\n'
              '            raise TypeError(\n'
              '                "integrity_specialist must be a PortfolioValuationExecutionIntegritySpecialist"\n'
              '            )\n',
              1,
          )
          old_no_action = '''        if not construction.trades:
              reconciliation = self._unchanged_reconciliation(portfolio)
              batch = MultiAssetExecutionBatch(
          '''
          new_no_action = '''        if not construction.trades:
              reconciliation = self._unchanged_reconciliation(portfolio)
              integrity_review = self.integrity_specialist.review_execution(
                  beginning=portfolio,
                  ending=portfolio,
                  fills=(),
                  reconciliation=reconciliation,
                  completed_at=timestamp,
                  attempt=attempt,
              )
              self.store.append(
                  event_identifier=f"event:{batch_identifier}:attempt:{attempt}:integrity-reviewed",
                  batch_identifier=batch_identifier,
                  event_type=MultiAssetExecutionEventType.INTEGRITY_REVIEWED,
                  occurred_at=timestamp,
                  payload=integrity_review.to_dict(),
              )
              if not integrity_review.certified:
                  raise MultiAssetExecutionError(
                      "portfolio valuation and execution integrity specialist held publication: "
                      + "; ".join(integrity_review.blocks)
                  )
              batch = MultiAssetExecutionBatch(
          '''
          if old_no_action not in text:
              raise SystemExit('no-action integration anchor missing')
          text = text.replace(old_no_action, new_no_action, 1)
          text = text.replace(
              '                source_identifiers=(),\n'
              '                attempt=attempt,\n'
              '            )\n'
              '            self._record(batch)\n'
              '            return batch\n',
              '                source_identifiers=(integrity_review.identifier,),\n'
              '                attempt=attempt,\n'
              '            )\n'
              '            self._record(batch)\n'
              '            return batch\n',
              1,
          )
          normal_anchor = '''            raise MultiAssetExecutionError("multi-asset paper ledger did not reconcile")

              ordered_results = tuple(order_results[item.symbol] for item in construction.trades)
          '''
          normal_insert = '''            raise MultiAssetExecutionError("multi-asset paper ledger did not reconcile")

              integrity_review = self.integrity_specialist.review_execution(
                  beginning=portfolio,
                  ending=ending_snapshot,
                  fills=tuple(new_fills),
                  reconciliation=reconciliation,
                  completed_at=timestamp,
                  attempt=attempt,
              )
              self.store.append(
                  event_identifier=f"event:{batch_identifier}:attempt:{attempt}:integrity-reviewed",
                  batch_identifier=batch_identifier,
                  event_type=MultiAssetExecutionEventType.INTEGRITY_REVIEWED,
                  occurred_at=timestamp,
                  payload=integrity_review.to_dict(),
              )
              if not integrity_review.certified:
                  self.store.append(
                      event_identifier=f"event:{batch_identifier}:attempt:{attempt}:failed-integrity",
                      batch_identifier=batch_identifier,
                      event_type=MultiAssetExecutionEventType.BATCH_FAILED,
                      occurred_at=timestamp,
                      payload={
                          "classification": "portfolio_valuation_execution_integrity",
                          "certification_identifier": integrity_review.identifier,
                          "blocks": list(integrity_review.blocks),
                      },
                  )
                  raise MultiAssetExecutionError(
                      "portfolio valuation and execution integrity specialist held publication: "
                      + "; ".join(integrity_review.blocks)
                  )
              cumulative_sources.append(integrity_review.identifier)

              ordered_results = tuple(order_results[item.symbol] for item in construction.trades)
          '''
          if normal_anchor not in text:
              raise SystemExit('normal integration anchor missing')
          text = text.replace(normal_anchor, normal_insert, 1)
          path.write_text(text, encoding='utf-8')

          pinit = Path('portfolio/__init__.py')
          text = pinit.read_text(encoding='utf-8')
          text = text.replace(
              'from portfolio.fit import (\n',
              'from portfolio.integrity_specialist import (\n'
              '    PORTFOLIO_INTEGRITY_SPECIALIST_NAME,\n'
              '    PORTFOLIO_INTEGRITY_SPECIALIST_ROLE,\n'
              '    PortfolioIntegrityCertification,\n'
              '    PortfolioIntegrityDisposition,\n'
              '    PortfolioValuationExecutionIntegritySpecialist,\n'
              ')\n'
              'from portfolio.fit import (\n',
              1,
          )
          marker = '    "PortfolioFitDecision",\n'
          export = (
              '    "PORTFOLIO_INTEGRITY_SPECIALIST_NAME",\n'
              '    "PORTFOLIO_INTEGRITY_SPECIALIST_ROLE",\n'
              '    "PortfolioIntegrityCertification",\n'
              '    "PortfolioIntegrityDisposition",\n'
              '    "PortfolioValuationExecutionIntegritySpecialist",\n'
          )
          text = text.replace(marker, export + marker, 1)
          pinit.write_text(text, encoding='utf-8')

          spec = Path('GOVERNING_SPECIFICATION.md')
          text = spec.read_text(encoding='utf-8')
          text = text.replace(
              'Portfolio Construction and Implementation\n        │\n        ▼\nContinuous Thesis Monitoring',
              'Portfolio Construction and Implementation\n        │\n        ▼\nPortfolio Valuation & Execution\nIntegrity Certification\n        │\n        ▼\nContinuous Thesis Monitoring',
              1,
          )
          text = text.replace(
              'The first five perform independent analysis. The Chief Investment Officer chairs the process and issues the final decision. There is no separate investor-goals member. The platform applies one investment objective across all portfolios.',
              'The first five perform independent analysis. The Chief Investment Officer chairs the process and issues the final decision. A separate non-voting Portfolio Valuation & Execution Integrity Specialist operates after construction and implementation; it is not an Investment Committee participant and cannot influence candidate ranking, expected return, position sizing, or the CIO action. There is no separate investor-goals member. The platform applies one investment objective across all portfolios.',
              1,
          )
          cio_anchor = '''## Chief Investment Officer

          Mission: select the strongest available use of capital based on all specialist analyses.

          The CIO does not duplicate specialist research. It reviews independent assessments, reconciles dependency-discounted specialist impacts into one coherent outcome distribution, compares horizon-matched expected returns, evaluates downside and opportunity cost, resolves disagreements, preserves dissent, determines final confidence, approves or rejects candidates, selects the final action, approves the thesis, produces the user explanation, and determines whether no action is preferable. The final expected return, downside, and probability of success must reconcile mathematically to the same adjusted distribution.

          Primary question: **Given all available evidence and alternatives, what is the best use of capital?**
          '''
          specialist_section = cio_anchor + '''

          ## Portfolio Valuation & Execution Integrity Specialist

          Mission: independently certify that an approved implementation was recorded and valued correctly before canonical portfolio state is published.

          Validate executed quantities, fractional shares, cash movement, transaction costs, average cost, cost basis, market marks, realized and unrealized gain/loss inputs, NAV, portfolio return, partial fills, implementation history, corporate-action readiness, quote timestamps, and reconciliation between approvals, fills, holdings, and portfolio snapshots. The specialist may certify publication, hold an implementation or valuation when evidence is incomplete, or require integrity review when records disagree.

          This is a non-voting operational control. It cannot recommend an asset, change a CIO decision, alter a target weight, select a funding source, or authorize live brokerage or real-money activity.

          Primary question: **Was the approved portfolio action recorded, valued, and reconciled correctly?**
          '''
          if cio_anchor not in text:
              raise SystemExit('governing specification CIO anchor missing')
          text = text.replace(cio_anchor, specialist_section, 1)
          text = text.replace(
              'Specialists issue analyses, not user-facing recommendations. The Evidence Officer may veto inadequate evidence. The Portfolio Manager may reject implementations that violate constraints. Only the CIO may issue the final investment decision.',
              'Specialists issue analyses, not user-facing recommendations. The Evidence Officer may veto inadequate evidence. The Portfolio Manager may reject implementations that violate constraints. Only the CIO may issue the final investment decision. After approval and construction, the Portfolio Valuation & Execution Integrity Specialist must certify accounting and valuation integrity before a new canonical portfolio snapshot is published.',
              1,
          )
          text = text.replace(
              'Responsibilities include sizing, allocation optimization, funding, rebalancing, exposure and correlation management, concentration, liquidity planning, turnover, cost and slippage estimation, sequencing, and constraint enforcement.',
              'Responsibilities include sizing, allocation optimization, funding, rebalancing, exposure and correlation management, concentration, liquidity planning, turnover, cost and slippage estimation, sequencing, constraint enforcement, and independent post-implementation valuation and execution-integrity certification.',
              1,
          )
          spec.write_text(text, encoding='utf-8')

          docs = '''# Portfolio Valuation & Execution Integrity Specialist

          This specialist is a non-voting operational control positioned after CIO approval and portfolio construction.

          ## Authority

          The specialist may certify a canonical paper-portfolio update, hold publication when accounting or valuation evidence is incomplete, and require review when fills, shares, cash, cost basis, marks, NAV, or implementation history disagree.

          It cannot recommend investments, vote in the Investment Committee, change the CIO action, change target weights, choose funding, submit broker orders, or authorize real money.

          ## Required certification

          Before the paper executor appends a changed canonical portfolio snapshot, the specialist verifies:

          - portfolio identity, base currency, and starting capital remain unchanged;
          - execution reconciliation passed within the configured tolerance;
          - beginning shares plus buys minus sells equal ending shares;
          - beginning cash plus sell proceeds minus buy costs and commissions equals ending cash;
          - every paper fill appears in canonical implementation history;
          - touched positions have finite quantity, average cost, mark, cost basis, market value, and unrealized gain/loss;
          - timestamps are point-in-time valid; and
          - no-fill attempts do not mutate portfolio identity.

          The certification is appended to the tamper-evident paper-execution history as `integrity_reviewed`. A held certification prevents publication of the ending portfolio snapshot.
          '''
          Path('docs/PORTFOLIO_VALUATION_EXECUTION_INTEGRITY_SPECIALIST.md').write_text(docs, encoding='utf-8')

          tests = '''from __future__ import annotations

          from datetime import datetime, timezone
          from types import SimpleNamespace

          from portfolio.integrity_specialist import (
              PortfolioIntegrityDisposition,
              PortfolioValuationExecutionIntegritySpecialist,
          )
          from portfolio.state import (
              CanonicalImplementationEvent,
              CanonicalPortfolioPosition,
              CanonicalPortfolioSnapshot,
          )


          def _snapshot(*, identifier: str, cash: float, quantity: float, event=None):
              as_of = datetime(2026, 7, 28, 19, 0, tzinfo=timezone.utc)
              positions = () if quantity == 0 else (
                  CanonicalPortfolioPosition(
                      symbol="VTI",
                      instrument_identifier="instrument:us-etf:vti",
                      venue="ARCX",
                      asset_class="us_etf",
                      quantity=quantity,
                      average_cost=100.1,
                      mark_price=100.0,
                      updated_at=as_of,
                  ),
              )
              events = () if event is None else (event,)
              return CanonicalPortfolioSnapshot(
                  identifier=identifier,
                  portfolio_code="COMPOUNDING",
                  display_name="Capital Intelligence Compounding Portfolio",
                  constraint_profile="governed-compounding.v1",
                  as_of=as_of,
                  starting_capital=250000.0,
                  cash_amount=cash,
                  positions=positions,
                  implementation_events=events,
              )


          def test_specialist_certifies_reconciled_buy() -> None:
              as_of = datetime(2026, 7, 28, 19, 0, tzinfo=timezone.utc)
              fill = SimpleNamespace(
                  identifier="fill:test",
                  symbol="VTI",
                  side=SimpleNamespace(value="buy"),
                  quantity=10.0,
                  gross_amount_base=1000.0,
                  commission_base=1.0,
              )
              event = CanonicalImplementationEvent(
                  identifier="fill:test",
                  occurred_at=as_of,
                  action="buy",
                  symbol="VTI",
                  quantity=10.0,
                  price=100.0,
                  gross_amount=1000.0,
                  cost_amount=1.0,
              )
              beginning = _snapshot(identifier="before", cash=250000.0, quantity=0.0)
              ending = _snapshot(identifier="after", cash=248999.0, quantity=10.0, event=event)
              review = PortfolioValuationExecutionIntegritySpecialist().review_execution(
                  beginning=beginning,
                  ending=ending,
                  fills=(fill,),
                  reconciliation=SimpleNamespace(reconciled=True, difference=0.0),
                  completed_at=as_of,
                  attempt=1,
              )
              assert review.disposition is PortfolioIntegrityDisposition.CERTIFIED
              assert review.certified is True
              assert review.blocks == ()
              assert review.to_dict()["investment_decision_authorized"] is False
              assert review.to_dict()["real_money_authorized"] is False


          def test_specialist_holds_cash_mismatch() -> None:
              as_of = datetime(2026, 7, 28, 19, 0, tzinfo=timezone.utc)
              fill = SimpleNamespace(
                  identifier="fill:test",
                  symbol="VTI",
                  side=SimpleNamespace(value="buy"),
                  quantity=10.0,
                  gross_amount_base=1000.0,
                  commission_base=1.0,
              )
              event = CanonicalImplementationEvent(
                  identifier="fill:test",
                  occurred_at=as_of,
                  action="buy",
                  symbol="VTI",
                  quantity=10.0,
                  price=100.0,
                  gross_amount=1000.0,
                  cost_amount=1.0,
              )
              review = PortfolioValuationExecutionIntegritySpecialist().review_execution(
                  beginning=_snapshot(identifier="before", cash=250000.0, quantity=0.0),
                  ending=_snapshot(identifier="after", cash=249500.0, quantity=10.0, event=event),
                  fills=(fill,),
                  reconciliation=SimpleNamespace(reconciled=True, difference=0.0),
                  completed_at=as_of,
                  attempt=1,
              )
              assert review.disposition is PortfolioIntegrityDisposition.HELD
              assert any("cash does not reconcile" in item for item in review.blocks)


          def test_specialist_is_operational_not_a_sixth_investment_vote() -> None:
              from cio.models import SpecialistRole

              assert len(tuple(SpecialistRole)) == 5
              assert all("integrity" not in role.value for role in SpecialistRole)
          '''
          Path('tests/test_portfolio_integrity_specialist.py').write_text(tests, encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add portfolio/integrity_specialist.py portfolio/multi_asset_execution.py portfolio/__init__.py GOVERNING_SPECIFICATION.md docs/PORTFOLIO_VALUATION_EXECUTION_INTEGRITY_SPECIALIST.md tests/test_portfolio_integrity_specialist.py
          git commit -m "Add portfolio valuation and execution integrity specialist"
          git push origin HEAD:feature/portfolio-valuation-execution-integrity-specialist
