name: Temporary structural cache validation

on:
  push:
    branches: [codex/structural-discovery-cache-fresh-epoch]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt
          pip check
      - name: Compile repair surface
        run: |
          python -m py_compile \
            operations/comprehensive_discovery_structural_cache.py \
            operations/cached_transactional_comprehensive_discovery_lane.py \
            run_dag_native_continuous_evidence_plane.py \
            tests/test_comprehensive_discovery_structural_cache.py
      - name: Focused regression tests
        run: |
          pytest -q \
            tests/test_comprehensive_discovery_structural_cache.py \
            tests/test_transactional_comprehensive_discovery_lanes.py \
            tests/test_spawn_safe_authoritative_acquisition.py
      - name: Full suite
        run: pytest -q --maxfail=1
